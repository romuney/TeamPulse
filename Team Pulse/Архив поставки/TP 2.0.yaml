              "transfer_internal_flg",
          ],
          "metrics": {
              "transfer_candidate_amt": """
                  COUNT(DISTINCT mdm_employee_rk)
                  FILTER (
                      WHERE COALESCE(transfer_candidate_flg::NUMERIC, 0) = 1
                  )
              """,

              "transfer_internal_amt": """
                  COUNT(DISTINCT mdm_employee_rk)
                  FILTER (
                      WHERE COALESCE(transfer_internal_flg::NUMERIC, 0) = 1
                  )
              """,

              "hire_amt": """
                  COUNT(DISTINCT mdm_employee_rk)
                  FILTER (
                      WHERE COALESCE(hire_flg::NUMERIC, 0) = 1
                        AND active_type_nm = 'Активная'
                  )
              """,

              "hire_to_active_amt": """
                  COUNT(DISTINCT mdm_employee_rk)
                  FILTER (
                      WHERE COALESCE(hire_flg::NUMERIC, 0) = 1
                        AND active_type_nm IN ('Активная', 'Подрядчики')
                  )
              """,
          },
      }


      # =============================================================================
      # Пакет метрик: отток
      # =============================================================================

      OUTFLOW_PARAMS = {
          "cols": [
              "fire_flg",
              "regrettable_fire_flg"
          ],
          "metrics": {
              "fire_amt": """
                  COUNT(DISTINCT mdm_employee_rk)
                  FILTER (
                      WHERE COALESCE(fire_flg::NUMERIC, 0) = 1
                  )
              """,
              "regret_fire_amt": """
                  COUNT(DISTINCT mdm_employee_rk)
                  FILTER (
                      WHERE fire_flg = 1 AND regrettable_fire_flg = 1
                  )
              """,
          },
      }

      # =============================================================================
      # Пакет метрик: переводы (для get_hr_structure)
      # =============================================================================

      TRANSFER_PARAMS = {
          # Флаги типа перевода (входящие)
          "type_in_flags": [
              "transfer_to_active_type_flg",
              "transfer_to_hq_flg",
              "transfer_to_it_flg",
              "transfer_to_specialization_flg",
              "transfer_to_stream_flg",
              "transfer_to_employment_relation_type_flg",
          ],
          # Флаги типа перевода (исходящие)
          "type_out_flags": [
              "transfer_out_active_type_flg",
              "transfer_out_hq_flg",
              "transfer_out_it_flg",
              "transfer_out_specialization_flg",
              "transfer_out_stream_flg",
              "transfer_out_employment_relation_type_flg",
          ],
          # Фильтры (исключают из переводов)
          "exclude_candidate": True,      # transfer_candidate_flg = 0
          "exclude_internal": True,       # transfer_internal_flg = 0
          "exclude_hire": True,           # hire_flg = 0 (для incoming)
          "exclude_fire": True,           # fire_flg = 0 (для outgoing)
          # Логика: lvl флаг ИЛИ type флаг
          "use_lvl_flag": True,           # Проверять lvl{i}_mngt_unit_in/out_trsf_flg
          "use_type_flag": True,          # Проверять transfer_to_*_flg
          "logic": "OR",                  # "OR" = хотя бы один, "AND" = оба должны быть
      }

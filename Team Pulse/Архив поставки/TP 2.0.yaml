    shebang: python
    code: "\nfields = [\n        {\n            'name': 'active_type_nm',\n            'alias': 'active_type_gr_nm',\n            'match': ['Активная', 'Подрядчики'],\n            'match_label': 'Активная',\n            'other_label': 'Прочие',\n        },\n        'emp_specialization_oper_code',\n        {\n            'name': 'emp_specialization_it_code',\n            'alias': 'emp_specialization_it_code',\n            'match': 'IT',\n            'match_label': 'IT',\n            'other_label': 'nonIT',\n        },\n        {\n            'name': 'employment_relation_type_desc',\n            'alias': 'employment_relation_type',\n            'match': 'Штатный сотрудник',\n            'match_label': 'штат',\n            'other_label': 'не штат',\n        },\n        # 'gender',\n        # 'grade',\n        # 'type_age',\n        'type_age',\n        'experience_group_nm',\n        'grade',\n        'seniority',\n        'employment_relation_type',\n        'employee_contract_type', \n        'legal_organization',\n        'employee_stream',\n    ]\n\n# get_hr_structure(\n#     res_table_name='hr_structure_all_metrics',\n#     add_fields=fields,\n#     hire=True,\n#     outflow=True,\n#     transfers=True,\n#     parent=True,\n#     snapshot_mode='last_available',\n\n#     #start_lvl=2,  #test\n#     # end_lvl=6,   #test\n# )\n\n\n# get_hr_structure(\n#     res_table_name='hr_structure_no_metrics',\n#     add_fields = ['mdm_employee_rk'],\n#     parent=False,\n#     snapshot_mode='last_available',\n# )"

  - sid: 01a12f3d-6f51-7368-a487-e3b92bb76128
    title: with_TRost
    shebang: gp
    code: "drop table if exists all_metrics_with_performance_and_office_traffic_and_grt ;\ncreate table all_metrics_with_performance_and_office_traffic_and_grt as\n\n\nwith grt_application as (\n    SELECT \n        ap.mdm_employee_application_rk as mdm_employee_rk,\n        date_trunc('month', ap.create_dttm) as month,\n        ap.create_dttm,\n        ap.current_grade_num,\n        ap.required_grade_num,\n        ap.head_approve_flg,\n        ap.mdm_employee_appl_status_cd,\n        mdm_employee_appl_status_desc,\n        case when ap.mdm_employee_appl_status_cd in ('FNS') then 1 else 0 end as is_approved,\n        case when ap.mdm_employee_appl_status_cd in ('DCL') then 1 else 0 end as is_declined,\n        case when ap.mdm_employee_appl_status_cd in ('CNL') then 1 else 0 end as is_cancelled,\n        case when ap.mdm_employee_appl_status_cd not in ('DCL', 'FNS', 'CNL') then 1 else 0 end as is_inprogress,\n        ap.deleted_flg,\n        ap.valid_to_dttm\n    from prod_v_dds.mdm_employee_application_grt ap\n    join prod_v_dds_dic.mdm_employee_appl_status s \n        on ap.mdm_employee_appl_status_cd= s.mdm_employee_appl_status_cd\n    where valid_to_dttm = '5999-01-01'\n        --and mdm_employee_appl_status_cd in ('FNS', 'CNL', 'DCL')\n        and ap.mdm_employee_appl_status_cd not in ('DRT') -- draft\n        and ap.deleted_flg = 0 \n)\nselect m.* \n    , coalesce(o.is_approved, 0) as grt_approve_cnt\n    , coalesce(o.is_declined, 0) as grt_decline_cnt\n    , coalesce(o.is_cancelled, 0) as grt_cancel_cnt\n    , coalesce(o.is_inprogress, 0) as grt_inprogress_cnt\nfrom all_metrics_with_performance_and_office_traffic m\nleft join grt_application o \n    on o.month = m.report_month \n    and o.mdm_employee_rk = m.mdm_employee_rk\n    \ndistributed by (mdm_employee_rk, report_month)\n;\n\nselect * from all_metrics_with_performance_and_office_traffic_and_grt\nlimit 100;"

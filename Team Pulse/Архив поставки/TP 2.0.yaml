  - sid: 01a0d7ed-892b-7ca8-8434-d668261ef044
    title: get_hr_structure
    shebang: python
    code: |-
      from dal_client import query as dal

      SRC_TABLE = 'usr_cross_data.hr_executive_proteus'
      LVLS_CNT = 12

      RESERVED_COLS = {
          'mdm_employee_rk', 'calendar_dt', 'month',
          'mngt_unit_rk', 'mngt_unit_nm', 'lvl', 'snapshot_flg',
          'parent_mngt_unit_rk', 'parent_mngt_unit_nm', 'parent_lvl',
          'child_mngt_unit_rk', 'sub_units_amt',
          'employee_amt', 'hire_amt', 'fire_amt',
          'transfer_in_amt', 'transfer_out_amt',
      }

      CAST_OVERRIDES = {'mdm_employee_rk': 'INT'}

      EXCLUDE_FLAGS = {
          'transfer_candidate_flg': 'exclude_candidate',
          'transfer_internal_flg':  'exclude_internal',
          'hire_flg':               'exclude_hire',
          'fire_flg':               'exclude_fire',
      }

      _SRC_COLS = None


      def source_columns(refresh=False):
          global _SRC_COLS
          if _SRC_COLS is None or refresh:
              schema, table = SRC_TABLE.split('.')
              df = dal.get_df(datasource='gp', query=f"""
                  select column_name
                  from information_schema.columns
                  where table_schema = '{schema}' and table_name = '{table}'
              """)
              _SRC_COLS = {c.lower() for c in df['column_name']}
              print(f'[SCHEMA] {SRC_TABLE}: {len(_SRC_COLS)} колонок')
          return _SRC_COLS


      def _lit(s):
          return "'" + str(s).replace("'", "''") + "'"


      def _build_field_expr(f):
          if isinstance(f, str):
              f = {'name': f}
          if not isinstance(f, dict):
              raise TypeError(f'add_fields: str or dict expected, got {f!r}')
          if 'expr' in f:
              orig = f['alias']
              alias = f'{orig}_1' if orig in RESERVED_COLS else orig
              return f"{f['expr']} AS {alias}", alias, list(f.get('cols', []))
          if 'name' in f:
              name = f['name']
              orig = f.get('alias') or name
              alias = f'{orig}_1' if orig in RESERVED_COLS else orig
              if 'match' in f:
                  vals = f['match'] if isinstance(f['match'], (list, tuple, set)) else [f['match']]
                  in_list = ', '.join(_lit(v) for v in vals)
                  expr = (f'CASE WHEN {name} IN ({in_list}) '
                          f"THEN {_lit(f['match_label'])} ELSE {_lit(f['other_label'])} END")
              else:
                  cast = f.get('cast') or CAST_OVERRIDES.get(name)
                  expr = f'{name}::{cast}' if cast else f"COALESCE({name}::TEXT,'n/a')"
              return f'{expr} AS {alias}', alias, [name]
          raise TypeError(f'add_fields: dict needs "name" or "expr", got {f!r}')


      def get_hr_structure(
          res_table_name,
          add_fields=None,
          hire=False,
          outflow=False,
          transfers=False,
          transfer_params=None,
          extra_metric_packs=None,
          where='',
          parent=False,
          include_sub_units=False,
          snapshot_mode='last_available',
          date_from=None,
          start_lvl=1,
          end_lvl=LVLS_CNT,
          base_metric='employee_amt',
          distributed_by=None,          # None -> distributed randomly
          only_levels=None,             # [1] чтобы прогнать один уровень
          debug=False,
      ):
          if snapshot_mode not in ('last_available', 'last_day'):
              raise ValueError("snapshot_mode: 'last_available' | 'last_day'")

          add_fields = add_fields or []
          extra_metric_packs = extra_metric_packs or []
          transfer_config = {**TRANSFER_PARAMS, **(transfer_params or {})}
          date_from = date_from or \
              "DATE_TRUNC('year', CURRENT_DATE::DATE - INTERVAL '1 year')::DATE"

          src = source_columns()

          def has(col):
              return bool(col) and col.lower() in src

          levels = [i for i in range(start_lvl, end_lvl)
                    if has(f'lvl{i}_mapped_management_unit_rk')]
          if only_levels:
              levels = [i for i in levels if i in set(only_levels)]
          if not levels:
              raise ValueError(f'нет уровней {start_lvl}..{end_lvl - 1} в {SRC_TABLE}')
          skipped = [i for i in range(start_lvl, end_lvl)
                     if i not in levels and not only_levels]
          if skipped:
              print(f'[WARN] пропущены уровни без mapped_management_unit_rk: {skipped}')

          metric_packs = []
          if hire:
              metric_packs.append(HIRE_PARAMS)
          if outflow:
              metric_packs.append(OUTFLOW_PARAMS)
          metric_packs.extend(extra_metric_packs)

          add_exprs, src_cols, rename = [], set(), {}
          for f in add_fields:
              expr, alias, cols = _build_field_expr(f)
              absent = [c for c in cols if not has(c)]
              if absent:
                  raise ValueError(f'add_fields: нет в {SRC_TABLE}: {absent}')
              orig = f if isinstance(f, str) else (f.get('alias') or f.get('name'))
              if alias != orig:
                  rename[alias] = orig
                  print(f'[INFO] {orig} -> {alias}, в результате вернётся как {orig}')
              add_exprs.append(expr)
              src_cols.update(c for c in cols if c not in RESERVED_COLS)

          for p in metric_packs:
              for c in p.get('cols', []):
                  if has(c):
                      src_cols.add(c)
                  else:
                      print(f'[WARN] нет колонки пакета метрик: {c}')

          if snapshot_mode == 'last_day':
              if not has('last_day_of_month_flg'):
                  raise ValueError("snapshot_mode='last_day': нет last_day_of_month_flg")
              src_cols.add('last_day_of_month_flg')

          metrics_sql = {
              base_metric: 'COUNT(DISTINCT mdm_employee_rk) FILTER (WHERE snapshot_flg = 1)'
          }
          for p in metric_packs:
              metrics_sql.update(p.get('metrics', {}))

          common_transfer_cols = set()
          if transfers:
              if transfer_config.get('use_type_flag', True):
                  for c in (transfer_config.get('type_in_flags', []) +
                            transfer_config.get('type_out_flags', [])):
                      if has(c):
                          common_transfer_cols.add(c)
                      else:
                          print(f'[WARN] нет type-флага: {c}')
              for col, key in EXCLUDE_FLAGS.items():
                  if transfer_config.get(key, True):
                      if has(col):
                          common_transfer_cols.add(col)
                      else:
                          print(f'[WARN] нет exclude-флага: {col}')

          where_sql = f'AND ({where})' if where else ''
          selects = []

          for i in levels:
              unit_rk = f'lvl{i}_mapped_management_unit_rk'
              unit_nm = f'lvl{i}_mapped_management_unit_nm'

              if snapshot_mode == 'last_available':
                  snapshot_sql = (
                      'CASE WHEN calendar_dt::DATE = MAX(calendar_dt::DATE) OVER '
                      "(PARTITION BY DATE_TRUNC('month', calendar_dt::DATE)::DATE, "
                      f'{unit_rk}) THEN 1 ELSE 0 END AS snapshot_flg'
                  )
              else:
                  snapshot_sql = (
                      "CASE WHEN COALESCE(NULLIF(last_day_of_month_flg::TEXT,'-')::NUMERIC, 0) = 1 "
                      'THEN 1 ELSE 0 END AS snapshot_flg'
                  )

              parent_inner, parent_outer = [], []
              if parent:
                  parent_outer = ['parent_mngt_unit_rk', 'parent_mngt_unit_nm', 'parent_lvl']
                  p_rk = f'lvl{i-1}_mapped_management_unit_rk'
                  p_nm = f'lvl{i-1}_mapped_management_unit_nm'
                  if i > 1 and has(p_rk) and has(p_nm):
                      parent_inner = [
                          f'{p_rk}::TEXT AS parent_mngt_unit_rk',
                          f'{p_nm}::TEXT AS parent_mngt_unit_nm',
                          f'{i-1}::INT  AS parent_lvl',
                      ]
                  else:
                      parent_inner = [
                          'NULL::TEXT AS parent_mngt_unit_rk',
                          'NULL::TEXT AS parent_mngt_unit_nm',
                          'NULL::INT  AS parent_lvl',
                      ]

              child_inner, sub_units_expr = [], []
              if include_sub_units:
                  c_rk = f'lvl{i+1}_mapped_management_unit_rk'
                  if has(c_rk):
                      child_inner = [f'{c_rk}::TEXT AS child_mngt_unit_rk']
                      sub_units_expr = [
                          'COUNT(DISTINCT child_mngt_unit_rk) FILTER ('
                          "WHERE snapshot_flg = 1 AND child_mngt_unit_rk IS NOT NULL "
                          "AND child_mngt_unit_rk <> '-')::NUMERIC AS sub_units_amt"
                      ]
                  else:
                      sub_units_expr = ['0::NUMERIC AS sub_units_amt']

              lvl_transfer_cols = set()
              transfer_metrics = {}
              if transfers:
                  fin = f'lvl{i}_mngt_unit_in_trsf_flg'
                  fout = f'lvl{i}_mngt_unit_out_trsf_flg'
                  use_lvl = (transfer_config.get('use_lvl_flag', True)
                             and has(fin) and has(fout))
                  if use_lvl:
                      lvl_transfer_cols.update((fin, fout))
                  elif transfer_config.get('use_lvl_flag', True):
                      print(f'[WARN] lvl{i}: нет {fin} / {fout}, только type-флаги')

                  lvl_in = (f"COALESCE(NULLIF({fin}::TEXT,'-')::NUMERIC, 0) = 1"
                            if use_lvl else 'FALSE')
                  lvl_out = (f"COALESCE(NULLIF({fout}::TEXT,'-')::NUMERIC, 0) = 1"
                             if use_lvl else 'FALSE')

                  in_flags = [c for c in transfer_config.get('type_in_flags', [])
                              if c in common_transfer_cols]
                  out_flags = [c for c in transfer_config.get('type_out_flags', [])
                               if c in common_transfer_cols]
                  type_in = ('(' + ' + '.join(f'COALESCE({c}::NUMERIC, 0)' for c in in_flags)
                             + ') > 0' if in_flags else 'FALSE')
                  type_out = ('(' + ' + '.join(f'COALESCE({c}::NUMERIC, 0)' for c in out_flags)
                              + ') > 0' if out_flags else 'FALSE')

                  logic = 'AND' if transfer_config.get('logic') == 'AND' else 'OR'
                  in_cond = f'({lvl_in} {logic} {type_in})'
                  out_cond = f'({lvl_out} {logic} {type_out})'

                  excl_in = [f'COALESCE({c}::NUMERIC, 0) = 0'
                             for c in ('transfer_candidate_flg', 'transfer_internal_flg', 'hire_flg')
                             if c in common_transfer_cols]
                  excl_out = [f'COALESCE({c}::NUMERIC, 0) = 0'
                              for c in ('fire_flg',) if c in common_transfer_cols]
                  excl_in_sql = ' AND '.join(excl_in) or 'TRUE'
                  excl_out_sql = ' AND '.join(excl_out) or 'TRUE'

                  same_month = "DATE_TRUNC('month', calendar_dt::DATE)::DATE = month"
                  no_cond = (lvl_in == 'FALSE' and type_in == 'FALSE')
                  transfer_metrics = {
                      'transfer_in_amt': '0::BIGINT' if no_cond else
                          f'COUNT(DISTINCT mdm_employee_rk) FILTER (WHERE {in_cond} '
                          f'AND {excl_in_sql} AND {same_month})',
                      'transfer_out_amt': '0::BIGINT' if no_cond else
                          f'COUNT(DISTINCT mdm_employee_rk) FILTER (WHERE {out_cond} '
                          f'AND {excl_out_sql} AND {same_month})',
                  }

              all_metrics = {**metrics_sql, **transfer_metrics}

              inner = ',\n                '.join([
                  "DATE_TRUNC('month', calendar_dt::DATE)::DATE AS month",
                  'calendar_dt::DATE AS calendar_dt',
                  snapshot_sql,
                  'mdm_employee_rk',
                  f'{unit_rk}::TEXT AS mngt_unit_rk',
                  f'{unit_nm}::TEXT AS mngt_unit_nm',
                  f'{i}::INT AS lvl',
                  *parent_inner,
                  *child_inner,
                  *sorted(src_cols | common_transfer_cols | lvl_transfer_cols),
              ])

              dims = ['month', 'mngt_unit_rk', 'mngt_unit_nm', 'lvl', *parent_outer]
              outer = ',\n            '.join([
                  *dims,
                  *add_exprs,
                  *sub_units_expr,
                  *(f'{expr} AS {alias}' for alias, expr in all_metrics.items()),
              ])
              group_by = ', '.join(str(n) for n in range(1, len(dims) + len(add_exprs) + 1))

              selects.append((i, f"""
              SELECT
                  {outer}
              FROM (
                  SELECT
                      {inner}
                  FROM {SRC_TABLE}
                  WHERE calendar_dt::DATE >= {date_from}
                    AND {unit_rk} IS NOT NULL
                    AND {unit_rk} <> '-'
                    {where_sql}
              ) t
              GROUP BY {group_by}"""))

          if debug:
              for i, sel in selects:
                  print(f'-- lvl {i}\n{sel}\n')
              return selects

          dist = (f"distributed by ({', '.join(distributed_by)})"
                  if distributed_by else 'distributed randomly')

          dal.get_df(datasource='gp', query=f'drop table if exists {res_table_name}')
          for n, (i, sel) in enumerate(selects):
              print(f'[RUN] lvl{i} ...', flush=True)
              if n == 0:
                  q = f'create table {res_table_name} as\n{sel}\n{dist}'
              else:
                  q = f'insert into {res_table_name}\n{sel}'
              dal.get_df(datasource='gp', query=q)
              c = dal.get_df(datasource='gp', query=f"""
                  select count(*) as cnt from {res_table_name} where lvl = {i}
              """)['cnt'].iloc[0]
              print(f'[RUN] lvl{i}: {c} строк', flush=True)

          for alias, orig in rename.items():
              dal.get_df(datasource='gp',
                         query=f'alter table {res_table_name} rename column {alias} to {orig}')
          dal.get_df(datasource='gp', query=f'analyze {res_table_name}')

          cnt = dal.get_df(datasource='gp',
                           query=f'select count(*) as cnt from {res_table_name}')['cnt'].iloc[0]
          print(f'[OK] {res_table_name}: {cnt} строк, уровни {levels}')

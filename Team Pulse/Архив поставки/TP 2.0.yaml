  - sid: 01a0d388-8101-70b1-b14b-4d0cb0a52d9b
    title: Схема
    shebang: md
    code: |-
      # Схема выполнения ноутбука Team Pulse (TP 2.0)

      ```
      [Подготовка]  →  [Структура]  →  [Динамика численности]  →  [Отток накопительно]
              ↘  [инициатива-причины] → [стаж+причины] → [Атрибуты оттока]
              ↘  [Изменения по подразделениям] → [По специализации] → [Выгрузка в ClickHouse]
      ```

      ## 1. Подготовка `[0–7]`
      - `tables_wait` — ожидание готовности источников (`tactuality`)
      - `Проверка готовности таблиц` (dal)
      - **`get_hr_structure`** — определение функций:
        `get_hr_structure` · `get_hr_transfers` · `get_type_flg`
      - **`last_day`** — контейнер «базовая структура» (11 вызовов):
        `last_day`, `last_day_flg`, `ottok_em`, `naym_em`, `plus_deet`, `minus_deet`,
        `izmen_last_day_flg1`, `izmen_ottok_em`, `izmen_naym_em`, `izmen_plus_deet`, `izmen_minus_deet`
      - `ys_all_last_day_ottok_naym` → **ClickHouse**

      ## 2. Динамика численности `[8–38]`
      - **`last_day_of_month`** — контейнер «type_flg» (9 вызовов):
        `last_day_of_month`, `ottok_employee`, `naym_employee` (осн.), izmen-варианты, спец-варианты
      - `skeleton` → `last_day_ottok_naym_all`
      - `pre_perevody_plus` → `perevody_plus`
      - `pre_perevody_minus` → `perevody_minus`
      - `dinamika_aktivnoy_chislennosti` → `ys_all_dinamika_aktivnoy_chislennosti` → **CH**
      - `ys_all_waterfall_chislennosti` → **CH**
      - Переводы по типам: `shtat/gpd/all_employees(_perevody_plus)` → `union_perevody_plus`
        `shtat_pl/gpd_pl/all(_perevody_minus)` → `union_perevody_minus`
      - `ys_all_waterfall_perevody` → **CH**

      ## 3. Отток накопительно `[39–45]`
      - `dett` (детализация по сотрудникам)
      - `fire_initiative` → `ys_all_fire_initiative` → **CH**
      - `ML` (userlabs_tools — тестовая модель текучести)

      ## 4. инициатива-причины оттока `[46–59]`
      - `sl_gpd_ottok_count_reason_group` + `sl_gpd_employee_count_reason_group` → `sl_gpd_fire_reason_a_reason_group`
      - `initiative_reason`
      - `ottok_initiative` → `initiative`
      - `fire_initiative`
      - `ottok_unit` → `unit_t` → `unit_tekuchest_ottok_all`
      - `initiative_reason_unit_tekuchest` → **CH**

      ## 5. стаж+причины `[60–71]`
      - `experience_sl_gpd_ottok/employee_count_reason_group` → `experience_sl_gpd_fire_reason_a_reason_group`
      - `experience_initiative_reason`
      - `experience_ottok_initiative` → `experience_initiative`
      - `experience_fire_initiative`
      - `experience_initiative_reason_unit_tekuchest` → **CH**

      ## 6. Атрибуты оттока `[72–79]`
      - `atribyti_ottoka_det`
      - `type_atributy_ottoka1` → `type_atributy_ottoka` → **CH**
      - `type_atributy_ottoka12` → `type_atributy_ottoka_year` → **CH**

      ## 7. Изменения по подразделениям `[80–94]`
      - `izmen_skeleton` → `izmen_last_day_ottok_naym_all`
      - `izmen_pre_perevody_plus` → `izmen_perevody_plus`
      - `izmen_pre_perevody_minus` → `izmen_perevody_minus`
      - `izmen_scelet`
      - `ys_all_dinamika_aktivnoy_chislennosti`
      - `izmeneniye_po_podrazdeleniyam1` → `type_flg_izmeneniye_po_podrazdeleniyam` → **CH**

      ## 8. По специализации `[95–99]`
      - `skeleton`
      - `last_day_ottok_naym_all`
      - `type_flg_stream_ottoka_year` → **CH**

      ## 9. Финал `[100–101]`
      - `owners` (`get_table_owners`) — проставление владельцев
      - `Untitled 3` — отладочный `select type_hire`

      ---

      ## Граф зависимостей (упрощённо)

      ```
                       ┌─────────────── get_hr_structure (функции) ───────────────┐
                       ▼                                                        ▼
         last_day (структура: 11 таблиц)                        last_day_of_month (type_flg: 9 таблиц)
                       │                                                        │
         ┌─────────────┼──────────────┬───────────────┐                         ▼
         ▼              ▼               skeleton → last_day_ottok_naym_all
       dett      pre_perevody   initiat-reason   experience-*                ▼
         │                ys_all_waterfall_* / dinamika → CH
         ▼             ▼              ▼               ▼
       ys_all_* → CH  perevody_*   unit_tekuchest   experience_..._unit_tekuchest
                       ▼              │               │
                   waterfall → CH     ▼               ▼
                                   → CH            → CH
      ```

      > **Обозначения:** `→ CH` — выгрузка в ClickHouse; `[a–b]` — номера параграфов; отключённые блоки (`isEnabled=false`) не выполняются.
    isEnabled: true

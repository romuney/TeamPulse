  - sid: 01a13522-79ca-7172-b5ea-9d78864f952b
    title: join_structure_combos
    shebang: python
    code: |-
      from dal_client import query as dal

      JOIN_KEYS = [
          'month',
          'mngt_unit_rk',
          'lvl',
          'active_type_gr_nm',
          'emp_specialization_oper_code',
          'emp_specialization_it_code',
          'employment_relation_type',
      ]

      COMBO_GROUPS = {
          'gender_exp_age':  ['gender', 'experience_group_nm', 'type_age'],
          'grade_seniority': ['grade', 'seniority'],
          # 'employment_legal': ['work_format', 'lvl2_legal_unit_nm'],
      }


      def _cols(table):
          t = table.split('.')[-1]
          df = dal.get_df(datasource='gp', query=f"""
              select column_name from information_schema.columns
              where table_name = '{t}'
          """)
          if df.empty:
              raise ValueError(f'таблица не найдена: {table}')
          return {c.lower() for c in df['column_name']}


      def join_structure_combos(
          res_table_name='hr_structure_with_combos',
          metrics_table='hr_structure_all_metrics',
          structure_table='hr_structure_amt_structure',
          combo_groups=None,
          join_keys=None,
          amt_col='employee_amt',
          include_zeros=True,
          distributed_by=('mngt_unit_rk',),
          debug=False,
      ):
          groups = combo_groups or COMBO_GROUPS
          keys = join_keys or JOIN_KEYS

          m_cols, s_cols = _cols(metrics_table), _cols(structure_table)
          bad = [k for k in keys if k not in m_cols or k not in s_cols]
          if bad:
              raise ValueError(f'ключей нет в одной из таблиц: {bad}')
          for g, attrs in groups.items():
              absent = [a for a in attrs if a not in s_cols]
              if absent:
                  raise ValueError(f'группа {g}: нет в {structure_table}: {absent}')

          key_sql = ', '.join(keys)
          key_nums = ', '.join(str(n) for n in range(1, len(keys) + 1))
          nl = chr(10)

          ctes, selects, joins = [], [], []

          for g, attrs in groups.items():
              norm = ', '.join(f"coalesce({a}::text, 'n/a') as {a}" for a in attrs)
              attr_sql = ', '.join(attrs)
              all_nums = ', '.join(str(n) for n in range(1, len(keys) + len(attrs) + 1))

              # json с именованными ключами: {"gender": "...", ..., "cnt": N}
              obj_pairs = ', '.join(f"'{a}', {a}" for a in attrs)
              obj = f"json_build_object({obj_pairs}, 'cnt', cnt)"

              ctes.append(f"""{g}_cnt as (
          select {key_sql}, {norm}, sum({amt_col})::bigint as cnt
          from {structure_table}
          group by {all_nums}
      )""")

              if include_zeros:
                  # домены атрибутов
                  for a in attrs:
                      ctes.append(f"""{g}_dom_{a} as (
          select distinct coalesce({a}::text, 'n/a') as {a}
          from {structure_table}
      )""")
                  # существующие ячейки
                  ctes.append(f"""{g}_keys as (
          select {key_sql} from {structure_table} group by {key_nums}
      )""")
                  # полная сетка: ячейки x домены
                  cross = nl + nl.join(f'    cross join {g}_dom_{a}' for a in attrs)
                  ctes.append(f"""{g}_grid as (
          select k.*, {attr_sql}
          from {g}_keys k{cross}
      )""")
                  on_full = ' and '.join(
                      [f'coalesce(gr.{k}::text, chr(1)) = coalesce(c.{k}::text, chr(1))'
                       for k in keys] +
                      [f'gr.{a} = c.{a}' for a in attrs]
                  )
                  gr_keys = ', '.join(f'gr.{k}' for k in keys)
                  gr_attrs = ', '.join(f'gr.{a}' for a in attrs)
                  ctes.append(f"""{g}_full as (
          select {gr_keys}, {gr_attrs}, coalesce(c.cnt, 0)::bigint as cnt
          from {g}_grid gr
          left join {g}_cnt c on {on_full}
      )""")
                  src = f'{g}_full'
              else:
                  src = f'{g}_cnt'

              ctes.append(f"""{g}_agg as (
          select {key_sql},
                 json_agg({obj} order by cnt desc, {attr_sql}) as combo_{g},
                 sum(cnt)::bigint as amt_{g},
                 count(*)::int    as combos_{g}
          from {src}
          group by {key_nums}
      )""")

              selects += [f'{g}_agg.combo_{g}', f'{g}_agg.amt_{g}', f'{g}_agg.combos_{g}']
              on = ' and '.join(
                  f'coalesce(m.{k}::text, chr(1)) = coalesce({g}_agg.{k}::text, chr(1))'
                  for k in keys
              )
              joins.append(f'left join {g}_agg on {on}')

          sel_sql = (',' + nl + '       ').join(selects)
          sql = f"""
      create table {res_table_name} as
      with
      {(',' + nl).join(ctes)}
      select m.*,
             {sel_sql}
      from {metrics_table} m
      {nl.join(joins)}
      distributed by ({', '.join(distributed_by)})
      """

          if debug:
              print(sql)
              return sql

          dal.get_df(datasource='gp', query=f'drop table if exists {res_table_name}')
          dal.get_df(datasource='gp', query=sql)
          dal.get_df(datasource='gp', query=f'analyze {res_table_name}')

          checks = ', '.join(
              f'count(*) filter (where combo_{g} is not null and amt_{g} <> {amt_col}) as bad_{g}, '
              f'max(combos_{g}) as max_combos_{g}'
              for g in groups
          )
          r = dal.get_df(datasource='gp', query=f"""
              select count(*) as rows_total, {checks} from {res_table_name}
          """).iloc[0]
          print(f'[OK] {res_table_name}: {r.rows_total} строк, zeros={include_zeros}')
          for g in groups:
              n = int(r[f'bad_{g}'])
              print(f'  {g}: макс кортежей в ячейке {int(r["max_combos_" + g])}, '
                    f'расхождений с {amt_col} — {n}' + ('  <-- разобрать' if n else ''))
    isEnabled: false
    color: "#F4BDB9"

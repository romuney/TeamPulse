paragraphs:
- sid: 633e0d88-f8f7-53b4-b871-7a8ef482f693
  title: Выгрузка руководителей — что делает ноутбук
  shebang: md
  code: "# TeamPulse Hub — выгрузка руководителей в Excel\n\n1. В параграфе **«Выгрузка руководителей · логины»** впишите логины руководителей.\n2. «Запустить все». Сначала идёт сборка таблиц TeamPulse Hub — тот же код, что у ноутбука отчёта, без изменений и без\n   выгрузки в ClickHouse (отчёт этот ноутбук не трогает).\n3. Последний параграф **«Выгрузка руководителей · метрики и Excel»** даёт ссылку «Скачать Excel».\n\nВ Excel: строка на каждый юнит руководителя из списка (логин жирным, юнит под ним серым), под ней — его прямые\nподразделения обычным шрифтом; группы схлопываются и раскрываются (кнопки «+ / −» слева). Метрики — как в отчёте\nTeamPulse Hub у выбранного юнита при настройках по умолчанию; формулы — на листе «Как считается».\n"
  isEnabled: 'True'
- sid: a4acaeac-eefb-5d0a-96e7-0adcb0099fbb
  title: Выгрузка руководителей · логины
  shebang: python
  code: "# =============================================================================\n# Выгрузка руководителей · логины (вписать перед запуском)\n# Логины руководителей, по которым собирается Excel. Регистр и пробелы не важны. Логин находится по руководителю\n# юнита на дату данных (teampulse_hub_unit.head_login — тот же, что в окне выбора отчёта); у кого несколько юнитов —\n# строка на каждый.\n# =============================================================================\nHEADS_LOGINS = [\n    # 'ivanov',\n    # 'petrova',\n]\n# True — под каждым юнитом руководителя ещё уровень ниже (его прямые подразделения), обычным шрифтом\nHEADS_KIDS = True\n# имя файла Excel\nHEADS_FILE = 'TeamPulse — руководители.xlsx'\n"
  isEnabled: 'True'
- sid: ea74f6b5-2f66-5aef-867a-bc30fa6a5f5b
  title: Структура численности
  shebang: md
  code: '| Поле | Что означает | Значения |

    | --- | --- | --- |

    | `emp_specialization_oper_code` | Операционная специализация (покраска) | HQ / Line / Support |

    | `emp_specialization_it_code` | IT-специализация | IT / Digital / NonIT — три разные, не сводятся |

    | `active_type_nm` | Тип численности; «Активная» — тип «Активная», без подрядчиков; целиком — `act_type_nm`, по нему фильтр отчёта | Активная / Прочие |

    | `employee_stream_desc` | Стрим направления | Back-end, Front-end, Analytics, и т.д. |

    | `experience_group_nm` | Группа стажа | Например: 0-1 год, 1-3 года, 3+ лет |

    | `employment_relation_type_desc` |  | Штат / ГПД |


    hr_digest_office - посещаемость офиса'
  isEnabled: true
- sid: 449e291b-5ff7-568f-b1de-14377079bde6
  title: Схема
  shebang: md
  code: "# Схема\n\n```\nhr_executive_proteus (по дням)\n  └─ build_all_metrics ──────────────── all_metrics: человек × месяц × юнит\n       ├─ with_performance / with_office_traffic / with_TRost  → …_and_grt (одна строка человека — last_row_flg)\n       │    └─ hub · 0 … hub · 6 (gp) → teampulse_hub_meta / _unit / _series / _mix / _trf / _vacancy / _aiw ┐\n       │                                hub checks (gp)                                                      │\n       ├─ office_traffic → office_traffic_calendar (посещения по дням) → hub · 4                             │\n       └─ org_structure ← unit_head_structure (руководитель юнита) → hub · 2 (имя руководителя)              │\noffice_traffic_attendance → with_office_traffic (бронирования, города), office_traffic                       │\nvacancy_daily → structure_x_vacancy (gp) → hub · 6                                                           │\n                                         to click (gp_to_click) ←────────────────────────────────────────────┘\n\
    \                                           teampulse_hub_*\n```\n\nВиртуальный датасет отчёта (файл 2а поставки) читает только `teampulse_hub_*`. `hr_structure_overall` выгружает\nноутбук TP 2.0 (`group_and_sum_metrics` и `calc_ssch` — там)."
  isEnabled: true
- sid: c2f62df7-d8ac-572e-9020-5f56f25183ec
  title: 'step1: tables_wait'
  shebang: python_condition
  code: "from tactuality import tables_wait\n\ntables_wait(\n    tables=[\"usr_cross_data.hr_executive_proteus\"],\n    gp_service=\"cross\"\n)"
  isEnabled: true
- sid: 3e9f1d98-aff4-5dc4-a20e-b30ae9b89cd0
  title: 'step2: Проверка готовности таблиц через DAL'
  shebang: python_condition
  code: "from dal_client import query as dal\n\ntables = [\n    'usr_cross_data.hr_executive_proteus'\n\n]\n\n# Проверка готовности таблиц через DAL\nfor table in tables:\n    try:\n        df = dal.get_df(\n            datasource='gp',\n            query=f'SELECT 1 FROM {table} LIMIT 1',\n        )\n        if df.empty:\n            raise Exception(f'Table {table} is empty or not ready')\n    except Exception as e:\n        raise Exception(f'Table {table} is not ready: {str(e)}')\n\nprint('All tables are ready')"
  isEnabled: true
- sid: 392c1d5e-6820-5de5-a56a-0b1c11ce0365
  title: _PARAMS_
  shebang: python
  code: "# =============================================================================\n# Блок 1 — конфигурация\n# =============================================================================\n\nUNIT_NA = '-'          # заглушка отсутствующего юнита\nDIM_SRC = 'eom'        # 'eom' — измерения на конец месяца, 'day' — по дням\n\n# ── измерения с фиксированной трансформацией ────────────────────────────────\nFIXED_DIMS = [\n    # «Активная» — тип численности «Активная», подрядчики в неё не входят (22.10, поставка 61; в TP 2.0 —\n    # Активная + Подрядчики). Тип численности целиком — колонка act_type_nm (HUB_FIELDS): по ней фильтр отчёта,\n    # «Активная» — выбор по умолчанию, подрядчиков и другие типы добавляют в фильтре\n    {'alias': 'active_type_gr_nm',\n     'cols': ['active_type_nm'],\n     'expr': \"CASE WHEN active_type_nm = 'Активная' \"\n             \"THEN 'Активная' ELSE 'Прочие' END\"},\n    # IT-код — как в источнике: IT, Digital, NonIT — три разные покраски, не сводятся\n\
    \    {'alias': 'emp_specialization_it_code',\n     'cols': ['emp_specialization_it_code'],\n     'expr': \"coalesce(emp_specialization_it_code::text, '-')\"},\n    {'alias': 'employment_relation_type_gr_nm',\n     'cols': ['employment_relation_type_desc'],\n     'expr': \"CASE WHEN employment_relation_type_desc = 'Штатный сотрудник' \"\n             \"THEN 'штат' ELSE 'не штат' END\"},\n]\n\n# ── найм ────────────────────────────────────────────────────────────────────\nHIRE_PARAMS = {\n    'cols': ['hire_flg', 'transfer_candidate_flg', 'transfer_internal_flg'],\n    'active_dim': 'active_type_gr_nm',   # ссылка на FIXED_DIMS, не на сырую колонку\n    'active_value': 'Активная',          # значение после трансформации\n}\n\n# ── отток ───────────────────────────────────────────────────────────────────\nOUTFLOW_PARAMS = {\n    'cols': ['fire_flg', 'regrettable_fire_flg'],\n}\n\n# ── переводы ────────────────────────────────────────────────────────────────\nTRANSFER_PARAMS = {\n    # детектор\
    \ события: флаги источника\n    'use_lvl_flag':  True,          # lvlN_mngt_unit_in/out_trsf_flg\n    'use_type_flag': True,          # transfer_to_* / transfer_out_*\n    'type_in_flags': [\n        'transfer_to_active_type_flg', 'transfer_to_hq_flg',\n        'transfer_to_it_flg', 'transfer_to_specialization_flg',\n        'transfer_to_stream_flg', 'transfer_to_employment_relation_type_flg',\n    ],\n    'type_out_flags': [\n        'transfer_out_active_type_flg', 'transfer_out_hq_flg',\n        'transfer_out_it_flg', 'transfer_out_specialization_flg',\n        'transfer_out_stream_flg', 'transfer_out_employment_relation_type_flg',\n    ],\n    # уровень перевода: сравнение путей юнитов\n    'use_unit_path': True,          # out только если старый юнит реальный и сменился\n    'type_flag_lvl': 1,             # неюнитовый перевод виден на всех уровнях\n    'unit_only': False,             # True — игнорировать type-флаги без смены юнита\n    # исключения\n    'exclude_candidate': True,\n\
    \    'exclude_internal':  True,\n    'exclude_hire':      True,\n    'exclude_fire':      True,\n    # имена колонок результата\n    'in_metric':  'transfer_in_amt',\n    'out_metric': 'transfer_out_amt',\n    'in_lvl_col':  'transfer_in_lvl',\n    'out_lvl_col': 'transfer_out_lvl',\n}"
  isEnabled: true
- sid: 1fd86f0d-7e76-5e03-8a2f-6d4694f395a1
  title: build_all_metrics
  shebang: python
  code: "# =============================================================================\n# Блок 2 — build_all_metrics\n#   юнит          — по дням (разрывает строки: уход и приход видны раздельно)\n#   измерения     — на конец месяца (не дробят строки при смене стажа/грейда)\n#   события       — по дням, max() за месяц\n#   hc            — только последний день месяца\n#   уровень перевода — сравнение пути юнитов с соседним снимком\n#   результат     — один mng_unit_rk (лист) + полная цепочка lvl1_nm..lvlN_nm\n# =============================================================================\nfrom dal_client import query as dal\nimport re as _re\n_IDENT_RE = _re.compile(r'^[A-Za-z_][A-Za-z0-9_$]*$')\n_W_EOM = (\"PARTITION BY date_trunc('month', calendar_dt), mdm_employee_rk \"\n          \"ORDER BY calendar_dt::date DESC\")\n_W_HIST = \"PARTITION BY mdm_employee_rk ORDER BY calendar_dt\"\n\ndef _ident(n: str) -> str:\n    if not _IDENT_RE.match(n):\n        raise ValueError(f'bad ident: {n!r}')\n\
    \    return n\n\ndef _qualified(t: str) -> str:\n    return '.'.join(_ident(p) for p in t.split('.'))\n\ndef _lit(v) -> str:\n    return \"'\" + str(v).replace(\"'\", \"''\") + \"'\"\n\ndef _in_list(vals) -> str:\n    return ', '.join(_lit(v) for v in vals)\n\ndef _source_cols(table: str) -> set:\n    parts = table.split('.')\n    tbl = _ident(parts[-1])\n    sch = (f\"table_schema = '{_ident(parts[0])}'\" if len(parts) == 2\n           else \"table_schema not in ('pg_catalog','information_schema','pg_toast')\")\n    df = dal.get_df(datasource='gp', query=f\"\"\"\n        select column_name from information_schema.columns\n        where {sch} and table_name = '{tbl}'\"\"\")\n    if df.empty:\n        raise ValueError(f'table {table!r} not found')\n    return {c.lower() for c in df['column_name']}\n\ndef _flg(col: str) -> str:\n    \"\"\"'0'/'1'/'-'/NULL → int 0/1 без каста в numeric.\"\"\"\n    return f\"(coalesce({col}::text,'0') = '1')::int\"\n\ndef _unit(i: int) -> str:\n    return\
    \ f\"coalesce(lvl{i}_mapped_management_unit_rk::text,{_lit(UNIT_NA)})\"\n\ndef _lvl_ladder(levels, cur: str, other: str) -> str:\n    \"\"\"Самый верхний уровень, где cur — реальный юнит и отличается от other.\"\"\"\n    whens = ' '.join(\n        f\"WHEN {cur}[{pos}] <> {_lit(UNIT_NA)} AND {other}[{pos}] IS NOT NULL \"\n        f\"AND {cur}[{pos}] <> {other}[{pos}] THEN {n}\"\n        for pos, n in enumerate(levels, start=1))\n    return f'CASE {whens} END'\n\n# ─────────────────────────────────────────────────────────────────────────────\ndef build_all_metrics(\n    res_table_name: str,\n    source_table: str = 'usr_cross_data.hr_executive_proteus',\n    fields=None,\n    date_from: str | None = None,\n    n_levels: int = 11,\n    hire: bool = True,\n    outflow: bool = True,\n    transfers: bool = True,\n    transfer_params: dict | None = None,\n    where: str = '',\n    distributed_by=None,\n    debug: bool = False,\n):\n    source_table = _qualified(source_table)\n    res_table_name\
    \ = _qualified(res_table_name)\n    src = _source_cols(source_table)\n    has = lambda c: bool(c) and c.lower() in src\n    date_from = date_from or \\\n        \"date_trunc('year', (current_date - interval '1 year')::date)\"\n    tp = {**TRANSFER_PARAMS, **(transfer_params or {})}\n    hp, op = HIRE_PARAMS, OUTFLOW_PARAMS\n    levels = [i for i in range(1, n_levels + 1)\n              if has(f'lvl{i}_mapped_management_unit_rk')]\n    if not levels:\n        raise ValueError('no lvlN_mapped_management_unit_rk columns')\n\n    snap, nm_agg, events = [], [], []\n    id_keys  = ['report_month', 'mdm_employee_rk']   # идентификация\n    unit_keys = ['mng_unit_rk', 'leaf_lvl']          # цепочка (ключевая часть)\n    dim_keys  = []                                   # разрезы\n\n    snap.append(\"date_trunc('month', calendar_dt)::date AS report_month\")\n    snap.append('mdm_employee_rk')\n\n    # ── юниты: по дням (rk нужны только для вычисления листа и имён) ────────\n    for i in levels:\n\
    \        snap.append(f'{_unit(i)} AS lvl{i}_rk')\n        if has(f'lvl{i}_mapped_management_unit_nm'):\n            snap.append(f\"coalesce(lvl{i}_mapped_management_unit_nm::text,\"\n                        f\"{_lit(UNIT_NA)}) AS lvl{i}_nm\")\n            nm_agg.append(f'max(lvl{i}_nm) AS lvl{i}_nm')\n            nm_agg.append(f'max(lvl{i}_rk) AS lvl{i}_rk')\n\n    # ── измерения: на конец месяца ──────────────────────────────────────────\n    def add_dim(expr: str, alias: str):\n        snap.append(f'first_value({expr}) OVER w_eom AS {alias}'\n                    if DIM_SRC == 'eom' else f'{expr} AS {alias}')\n        dim_keys.append(alias)\n\n    for d_ in FIXED_DIMS:\n        if d_['alias'] in dim_keys:\n            continue                       # первый подходящий вариант уже взят\n        if all(has(c) for c in d_['cols']):\n            add_dim(d_['expr'], _ident(d_['alias']))\n            print(f\"[INFO] {d_['alias']}: по {d_['cols']}\")\n        else:\n            print(f\"[INFO]\
    \ {d_['alias']}: нет колонок {d_['cols']} — следующий вариант\")\n\n    for f in (fields or []):\n        if isinstance(f, str):\n            f = {'name': f}\n        name, alias = f['name'], _ident(f.get('alias') or f['name'])\n        if not has(name):\n            print(f'[WARN] {name} нет в источнике, пропущен'); continue\n        if alias in id_keys + unit_keys + dim_keys:\n            print(f'[SKIP] {alias} уже в ключах'); continue\n        if 'match' in f:\n            vals = f['match'] if isinstance(f['match'], (list, tuple, set)) else [f['match']]\n            expr = (f'CASE WHEN {name} IN ({_in_list(vals)}) '\n                    f\"THEN {_lit(f['match_label'])} ELSE {_lit(f['other_label'])} END\")\n        else:\n            expr = f'coalesce({name}::text,{_lit(UNIT_NA)})'\n        ev = [c for c in ('hire_flg', 'transfer_candidate_flg', 'transfer_internal_flg') if has(c)]\n        if f.get('at_hire') and ev and DIM_SRC == 'eom':\n            evt = ' OR '.join(f'{_flg(c)} =\
    \ 1' for c in ev)\n            snap.append(f'coalesce(first_value(CASE WHEN {evt} THEN {expr} END) OVER ('\n                        f\"PARTITION BY date_trunc('month', calendar_dt), mdm_employee_rk \"\n                        f'ORDER BY ({evt})::int DESC, calendar_dt::date DESC), '\n                        f'first_value({expr}) OVER w_eom) AS {alias}')\n            dim_keys.append(alias)\n            print(f'[INFO] {alias}: на день найма')\n            continue\n        add_dim(expr, alias)\n\n    # ── флаги событий: по дням ──────────────────────────────────────────────\n    if hire:\n        for c in ('hire_flg', 'transfer_candidate_flg', 'transfer_internal_flg'):\n            if has(c):\n                snap.append(f'{_flg(c)} AS {c}')\n                events.append(c)\n    if outflow:\n        for c in ('fire_flg', 'regrettable_fire_flg', 'non_regrettable_fire_flg'):\n            if has(c):\n                snap.append(f'{_flg(c)} AS {c}')\n        if has('fire_flg'):\n         \
    \   events.append('fire_flg')\n\n    # ── переводы: детектор события + путь юнитов ────────────────────────────\n    if transfers:\n        for kind, flag_key in (('in', 'type_in_flags'), ('out', 'type_out_flags')):\n            lvl_parts, type_parts = [], []\n            if tp.get('use_lvl_flag', True):\n                lvl_parts = [f\"coalesce(lvl{i}_mngt_unit_{kind}_trsf_flg::text,'0')='1'\"\n                             for i in levels\n                             if has(f'lvl{i}_mngt_unit_{kind}_trsf_flg')]\n            if tp.get('use_type_flag', True):\n                type_parts = [f\"coalesce({c}::text,'0')='1'\"\n                              for c in tp.get(flag_key, []) if has(c)]\n            if lvl_parts:\n                snap.append(f\"({' OR '.join(lvl_parts)})::int AS {kind}_unit_evt\")\n            if type_parts:\n                snap.append(f\"({' OR '.join(type_parts)})::int AS {kind}_type_evt\")\n        arr = 'ARRAY[' + ', '.join(_unit(i) for i in levels) + ']'\n\
    \        snap.append(f'{arr} AS path_cur')\n        snap.append(f'lag({arr}) OVER w_hist  AS path_prev')\n        snap.append(f'lead({arr}) OVER w_hist AS path_next')\n    snap.append('row_number() OVER w_eom AS rn')\n    snap.append(\"(calendar_dt::date = least((date_trunc('month', calendar_dt) + interval '1 month' - interval '1 day')::date, \"\n                f\"(SELECT max(calendar_dt)::date FROM {source_table}))\"\n                + (\" AND coalesce(fire_flg::text,'0') <> '1'\" if has('fire_flg') else '') + ')::int AS eom_flg')\n\n    # ── CTE d: leaf_lvl, mng_unit_rk, уровни переводов, исключения ──────────\n    leaf = ' '.join(f\"WHEN lvl{i}_rk <> {_lit(UNIT_NA)} THEN {i}\"\n                    for i in reversed(levels))\n    pick = ' '.join(f\"WHEN lvl{i}_rk <> {_lit(UNIT_NA)} THEN lvl{i}_rk\"\n                    for i in reversed(levels))\n    d = [f'CASE {pick} ELSE lvl{levels[0]}_rk END AS mng_unit_rk',\n         f'CASE {leaf} ELSE {levels[0]} END AS leaf_lvl']\n    if transfers:\n\
    \        excl = {\n            'in': [f'{c} = 0' for c, k in (\n                ('transfer_candidate_flg', 'exclude_candidate'),\n                ('transfer_internal_flg', 'exclude_internal'),\n                ('hire_flg', 'exclude_hire')) if tp.get(k, True) and has(c)],\n            'out': [f'{c} = 0' for c, k in (('fire_flg', 'exclude_fire'),)\n                    if tp.get(k, True) and has(c)],\n        }\n        for kind in ('in', 'out'):\n            other = 'path_prev' if kind == 'in' else 'path_next'\n            unit_lvl = (_lvl_ladder(levels, 'path_cur', other)\n                        if tp.get('use_unit_path', True) else 'NULL::int')\n            src_parts = [f'CASE WHEN {kind}_unit_evt = 1 THEN {unit_lvl} END']\n            if not tp.get('unit_only', False):\n                src_parts.append(\n                    f\"CASE WHEN {kind}_type_evt = 1 THEN {tp.get('type_flag_lvl', 1)} END\")\n            lvl_expr = f\"least({', '.join(src_parts)})\" if len(src_parts) > 1 \\\n\
    \                else src_parts[0]\n            guard = ' AND '.join(excl[kind]) if excl[kind] else None\n            if guard:\n                lvl_expr = f'CASE WHEN {guard} THEN {lvl_expr} END'\n            d.append(f'({lvl_expr}) AS {kind}_lvl')\n            events.append(f'({kind}_lvl IS NOT NULL)::int')\n\n    # ── метрики ─────────────────────────────────────────────────────────────\n    m = ['max((rn = 1 AND eom_flg = 1)::int) AS hc_total_cnt', 'max((rn = 1)::int) AS last_row_flg']\n    if 'active_type_gr_nm' in dim_keys:\n        m.append(\"max((rn = 1 AND eom_flg = 1 AND active_type_gr_nm = 'Активная')::int) \"\n                 'AS hc_active_cnt')\n    if hire:\n        adim = hp.get('active_dim')\n        aval = hp.get('active_value')\n        if has('hire_flg'):\n            if adim and adim in dim_keys and aval:\n                m.append(f\"max((hire_flg = 1 AND {adim} = {_lit(aval)})::int) \"\n                         f\"AS hire_amt\")\n            else:\n            \
    \    m.append('max(hire_flg) AS hire_amt')\n            # TeamPulse Hub (20.10): найм в компанию с любым типом активности — найм «всей\n            # численности» (hire_amt — только активные на конец месяца)\n            m.append('max(hire_flg) AS hire_cnt')\n        if has('transfer_candidate_flg'):\n            m.append('max(transfer_candidate_flg) AS transfer_candidate_amt')\n        if has('transfer_internal_flg'):\n            m.append('max(transfer_internal_flg) AS transfer_internal_amt')\n    if outflow and has('fire_flg'):\n        m.append('max(fire_flg) AS fire_amt')\n        if has('regrettable_fire_flg'):\n            m.append('max((fire_flg = 1 AND regrettable_fire_flg = 1)::int) '\n                     'AS regret_fire_amt')\n        if has('non_regrettable_fire_flg'):\n            m.append('max((fire_flg = 1 AND non_regrettable_fire_flg = 1)::int) '\n                     'AS non_regret_fire_amt')\n    if transfers:\n        for kind, mk, lk, ek in (('in',  'in_metric',\
    \  'in_lvl_col',  'emit_in_lvl'),\n                                 ('out', 'out_metric', 'out_lvl_col', 'emit_out_lvl')):\n            m.append(f'max(({kind}_lvl IS NOT NULL)::int) AS {tp[mk]}')\n            if tp.get(ek, True):\n                m.append(f'coalesce(min({kind}_lvl), 0) AS {tp[lk]}')\n\n    having = f'HAVING max({\" + \".join([\"(rn = 1)::int\"] + events)}) > 0'\n\n    # ── порядок вывода: id → цепочка → разрезы → метрики ────────────────────\n    group_keys  = id_keys + unit_keys + dim_keys\n    select_cols = id_keys + unit_keys + nm_agg + dim_keys + m\n\n    sql = f\"\"\"\nWITH snap AS (\n    SELECT\n        {(',' + chr(10) + '        ').join(snap)}\n    FROM {source_table}\n    WHERE calendar_dt::date >= {date_from}\n      {f'AND ({where})' if where else ''}\n    WINDOW w_eom  AS ({_W_EOM}),\n           w_hist AS ({_W_HIST})\n),\nd AS (\n    SELECT\n        {(',' + chr(10) + '        ').join(['s.*'] + d)}\n    FROM snap s\n)\nSELECT\n    {(',' + chr(10) + '    ').join(select_cols)}\n\
    FROM d\nGROUP BY {', '.join(group_keys)}\n{having}\"\"\"\n    print(f'[INFO] levels={len(levels)} group_keys={len(group_keys)} '\n          f'dims={len(dim_keys)} metrics={len(m)} nm={len(nm_agg)}')\n    if debug:\n        print(sql)\n        return sql\n    dist = (f\"distributed by ({', '.join(_ident(c) for c in distributed_by)})\"\n            if distributed_by else 'distributed randomly')\n    dal.get_df(datasource='gp', query=f'drop table if exists {res_table_name}')\n    dal.get_df(datasource='gp',\n               query=f'create table {res_table_name} as\\n{sql}\\n{dist}')\n    dal.get_df(datasource='gp', query=f'analyze {res_table_name}')\n    cnt = dal.get_df(datasource='gp',\n                     query=f'select count(*) as cnt from {res_table_name}')['cnt'].iloc[0]\n    print(f'[OK] {res_table_name}: {cnt} rows')"
  isEnabled: true
- sid: cd583ae5-72da-5f88-babb-bebfa0633348
  title: EXEC build_all_metrics
  shebang: python
  code: "# тут больше не считаем переводы, все разрезы вынесены в fields\nfields = [\n    # простая строка — coalesce(col::text, '-')\n    'gender',\n    'type_age',\n    'age',                 # 29.10, поставка 73 : возраст в годах — средний возраст\n    'experience_group_nm',\n    'grade',\n    'seniority',\n    'fire_reason_group',\n    'fire_initiative',\n    'type_company',\n    # 03.11, поставка 103 (файл 9, п. 12): источник найма — на день найма, а не последнее значение месяца\n    {'name': 'source_type_nm', 'at_hire': True},\n    # 09.11 (владелец: в специализациях только найм, переводы в / из, отток): специализация найма — на день найма; смену\n    # специализации после найма показывают флаги переводов\n    {'name': 'employee_specialization_desc', 'alias': 'hire_specialization', 'at_hire': True},\n    # 26.10, поставка 66 : признак руководителя — сегмент «Руководители / Сотрудники» посещаемости\n    'management_head_flg',\n    # dict без match — то же самое, но с явным alias\n \
    \   {'name': 'active_type_nm',                  'alias': 'act_type_nm'},\n    {'name': 'employment_relation_type_desc',   'alias': 'employment_relation_type'},\n    {'name': 'employee_contract_type_desc',     'alias': 'employee_contract_type'},\n    {'name': 'lvl1_legal_unit_nm',              'alias': 'legal_organization'},\n    {'name': 'employee_stream_desc',            'alias': 'employee_stream'},\n    {'name': 'type_of_work',                    'alias': 'work_format'},\n    {'name': 'employee_specialization_desc',    'alias': 'specialization'},\n    {'name': 'residential_state_nm',            'alias': 'region'},\n    {'name': 'emp_specialization_oper_code',    'alias': 'paint_cd'},\n    # dict с match — CASE WHEN ... IN (...) THEN ... ELSE ...\n    # новый разрез добавляется сюда, код функции не трогаем\n    #  'match': 'Офис', 'match_label': 'офис', 'other_label': 'не офис'},\n]\n\n# срез отчёта TeamPulse Hub — покраска (HQ, Line, Support). В hr_structure_overall не идёт:\n# group_and_sum_metrics\
    \ берёт ключами только fields. IT-код — в FIXED_DIMS, как в источнике\nHUB_FIELDS = [\n]\n\nbuild_all_metrics(\n    res_table_name='all_metrics',\n    source_table='usr_cross_data.hr_executive_proteus',\n    fields=fields + HUB_FIELDS,\n\n    hire=True,\n    outflow=True,\n    transfers=False,\n    # debug = True\n)"
  isEnabled: true
- sid: c23c4c7a-db1f-59d7-9c82-7f637bc9cf84
  title: unit_head_structure
  shebang: gp
  code: "-- =============================================================================\n-- TeamPulse Hub · руководитель юнита по месяцам: имя и логин (23.10; поставка 66)\n-- Руководитель — сотрудник с management_head_flg = 1, юнит — его management_unit_rk, на последний день\n-- месяца (у текущего — на последний день данных). Имя — «Имя Фамилия»: его ищут в фильтре юнита отчёта.\n-- Поставка 66: одна строка на юнит и месяц. У юнита бывает несколько строк с флагом (две должности,\n-- соруководители, две даты в месяце) — org_structure, который присоединяет таблицу, размножал строки юнита.\n-- Берётся последняя дата месяца, при равенстве — меньший mdm_employee_rk. Нет фамилии — только имя.\n-- =============================================================================\nDROP TABLE IF EXISTS unit_head_structure;\ncreate table unit_head_structure as\n\nwith unit_heads as (\nselect\n    business_dt::DATE AS business_dt,\n    management_unit_rk,\n    management_unit_nm,\n    mdm_employee_rk,\n\
    \    last_nm,first_nm,\n    nullif(trim(coalesce(first_nm, '') || ' ' || coalesce(last_nm, '')), '') as full_nm,\n    ad_login\n\nfrom prod_v_emart.mdm_employee_structure_d\nwhere\n    (last_day_flg = 1 or last_day_of_month_flg = 1)\n    and management_head_flg=1\n)\n    --AND company_fire_flg = 0\n\n\nselect distinct on (uh.management_unit_rk, date_trunc('month', uh.business_dt)::DATE)\n    uh.management_unit_rk\n    , date_trunc('month', uh.business_dt)::DATE as report_month\n    , uh.mdm_employee_rk as leader_mdm_employee_rk\n    , uh.first_nm as leader_first_nm\n    , uh.full_nm as leader_full_nm\n    , uh.ad_login as leader_login\n\nfrom unit_heads uh\norder by uh.management_unit_rk, date_trunc('month', uh.business_dt)::DATE, uh.business_dt desc, uh.mdm_employee_rk\n\ndistributed by (management_unit_rk);"
  isEnabled: true
- sid: 2fc3de6b-396a-5b20-b986-ac93ab96c6dc
  title: org_structure
  shebang: gp
  code: "-- 23.10 : + руководитель юнита на месяц — логин и имя (unit_head_structure; с поставки 66 там одна строка\n-- на юнит и месяц, строки юнита не размножаются)\nDROP TABLE IF EXISTS org_structure;\nCREATE TABLE org_structure AS\n\nwith prep as(\nSELECT\n    report_month,\n    mng_unit_rk,\n    leaf_lvl,\n    lvl1_nm,\n    lvl2_nm,\n    lvl3_nm,\n    lvl4_nm,\n    lvl5_nm,\n    lvl6_nm,\n    lvl7_nm,\n    lvl8_nm,\n    lvl9_nm,\n    lvl10_nm,\n    lvl11_nm\n    -- ── метрики: сумма по всем разрезам внутри юнита ──\nFROM all_metrics\nGROUP BY\n    report_month,\n    mng_unit_rk,\n    leaf_lvl,\n    lvl1_nm, lvl2_nm, lvl3_nm, lvl4_nm, lvl5_nm,\n    lvl6_nm, lvl7_nm, lvl8_nm, lvl9_nm, lvl10_nm, lvl11_nm\n)\n\nSELECT prep.*\n    , uhs.leader_login -- логин руководителя\n    , uhs.leader_full_nm -- имя руководителя\nFROM prep\nLEFT JOIN unit_head_structure uhs\n    ON prep.mng_unit_rk = uhs.management_unit_rk AND prep.report_month = uhs.report_month\n\n\nDISTRIBUTED BY (mng_unit_rk);\n\n\
    ANALYZE org_structure;"
  isEnabled: true
- sid: 0e6e4ca5-7fa4-581d-82b3-597f5e3d80eb
  title: with_performance
  shebang: gp
  code: "-- =============================================================================\n-- TeamPulse Hub\n-- перформанс (категории за месяц) и мониторинг по дням (27.10): средняя длительность рабочего дня, прогулы,\n-- работа в выходной, звонки и доля разговоров, сегменты. Поставка 71 — исправлено: деление на число плановых рабочих\n-- дней через nullif (у человека, который в месяце работал только в выходные, оно 0 — параграф падал); мониторинг по\n-- дням — к одной строке человека в месяце (last_row_flg = 1), как перформанс: у перешедшего строк две, и прогулы с\n-- часами считались в обоих юнитах; день отбора — с 1 января прошлого года включительно (было «>»)\n-- 03.11, поставка 103 (файл 9, п. 1): категории мониторинга — только у людей численности на конец месяца\n-- (hc_total_cnt = 1), как численность отчёта: ушедшие в течение месяца в мониторинг не попадают (было 341 против 339).\n-- Человек численности без записи перформанса — «не размечено» (perf_gray), а не пропуск: сумма категорий\
    \ = численность\n-- той же выборки, покраска HQ / Support / Line — на конец месяца, как у численности\n-- 11.11 (владелец, параграф «ПРАВКИ» боевого ноутбука — логика мастер-дашборда мониторинга): плановый рабочий день — из\n-- календаря посещаемости (mdm_employee_attendance, «Работа»); часы дня — reduced_duration_hour, если он больше 7, иначе\n-- duration_hour; прогулы и работа в выходные для сегментов — скользящие 16 недель на последнюю неделю месяца; доля\n-- звонков — недельная (среднее звонков / среднее часов), последняя неделя месяца; категория недели и срок в ней —\n-- из performance_metric_w\n-- =============================================================================\ndrop table if exists all_metrics_with_performance_added ;\ncreate table all_metrics_with_performance_added as\n\nwith performance_category (val, mapped_val) as(\n    select * from (values\n        ('normal',      'normal'),\n        ('super_low',   'low'),\n        ('low',         'low'),\n        ('high',\
    \        'high'),\n        ('super_high',  'high')\n    )t (val, mapped_val)\n)\n, performance_base as(\n    select\n        mdm_employee_rk\n        , calendar_dt\n        , coalesce(pc.mapped_val, 'gray') as performance_category_mapped\n    from prod_v_sse_crossdata.performance_metric_m pmm\n    left join performance_category pc on pmm.performance_category = pc.val\n    where pmm.calendar_dt >= DATE_TRUNC('year', current_date) - interval '1 year'\n)\n, performance as(\n    select mdm_employee_rk::int\n        , calendar_dt,\n        count(*) filter (where performance_category_mapped = 'normal') as perf_normal,\n        count(*) filter (where performance_category_mapped = 'low')    as perf_low,\n        count(*) filter (where performance_category_mapped = 'high')   as perf_high,\n        count(*) filter (where performance_category_mapped = 'gray')   as perf_gray\n    from performance_base\n    group by 1,2\n)\n, cat_week as(\n    select\n        mdm_employee_rk\n        , date_trunc('week',\
    \ calendar_dt)::date as report_week\n        , performance_category as cat_week\n    from prod_v_sse_crossdata.performance_metric_w\n    where calendar_dt >= (date_trunc('week', current_date) - interval '15 week')::date\n)\n, cat_week_location as(\n    with base_data as(\n        select\n            mdm_employee_rk\n            , date_trunc('week', calendar_dt)::date as report_week\n            , performance_category\n        from prod_v_sse_crossdata.performance_metric_w\n        where calendar_dt >= (date_trunc('week', current_date) - interval '15 week')::date\n    )\n    , islands as(\n        select mdm_employee_rk, report_week, performance_category,\n            row_number() over (partition by mdm_employee_rk order by report_week)\n            - row_number() over (partition by mdm_employee_rk, performance_category order by report_week) as grp\n        from base_data\n    )\n    select\n        mdm_employee_rk\n        , report_week\n        , performance_category as cat_week\n \
    \       , row_number() over (partition by mdm_employee_rk, performance_category, grp order by report_week) as weeks_in_current_category\n    from islands\n)\n, performance_metric_d as (\n    select\n        pmd.mdm_employee_rk\n        , pmd.calendar_dt\n        , date_trunc('month', pmd.calendar_dt)::date as report_month\n        , date_trunc('week', pmd.calendar_dt)::date as report_week\n        , pmd.duration_hour\n        , pmd.reduced_duration_hour\n        , extract(dow from pmd.calendar_dt) as weekday -- PG dow: вс=0..сб=6; будни = 1..5\n        , case when pmd.reduced_duration_hour > 7 then pmd.reduced_duration_hour else pmd.duration_hour end as duration_hour_correct\n        , decode(ec.attendance_group_nm, 'Работа', 1, 0) as plan_working_day_flg -- из календаря (mdm_employee_attendance), как в мастер-дашборде мониторинга\n        , case when pmd.working_balance = -1 then 1 else 0 end as absence -- прогул\n        , case when pmd.working_balance = 1 then 1 else 0 end as work_dayoff\
    \ -- Работа в выходной\n        , pmd.talk_call_duration_h\n    from prod_v_sse_crossdata.performance_metric_d pmd\n    left join prod_v_hrmart.mdm_employee_attendance ec\n        on ec.mdm_employee_rk = pmd.mdm_employee_rk and ec.attendance_dt = pmd.calendar_dt\n    where 1=1\n    and pmd.calendar_dt >= date_trunc('year', current_date - interval '1 year')\n)\n, performance_month as (\n    select\n        report_month\n        , mdm_employee_rk\n        , sum(duration_hour_correct) filter (where plan_working_day_flg = 1) as duration_plan_sum\n        , sum(plan_working_day_flg) as plan_day_cnt\n        , sum(absence) as absence\n        , sum(work_dayoff) as work_dayoff\n        , sum(talk_call_duration_h) filter (where plan_working_day_flg = 1) as talk_plan_sum\n        , sum(duration_hour_correct) as dur_all_sum\n        , count(duration_hour_correct) as dur_all_cnt\n        , sum(talk_call_duration_h) filter (where (weekday in (1,2,3,4,5) and plan_working_day_flg is null and duration_hour\
    \ > 0) or plan_working_day_flg = 1) as talk_h_sum\n        , sum(duration_hour_correct) filter (where (weekday in (1,2,3,4,5) and plan_working_day_flg is null and duration_hour > 0) or plan_working_day_flg = 1) as work_h_sum\n    from performance_metric_d\n    group by report_month, mdm_employee_rk\n)\n, performance_week as(\n    select\n        report_week\n        , mdm_employee_rk\n        , date_trunc('month', report_week)::date as report_month\n        , sum(absence) as absence_w\n        , sum(work_dayoff) as work_dayoff_w\n    from performance_metric_d\n    group by report_week, mdm_employee_rk\n)\n, performance_rolling as(\n    select\n        report_week\n        , mdm_employee_rk\n        , report_month\n        , sum(absence_w)     over (partition by mdm_employee_rk order by report_week rows between 15 preceding and current row) as absence_16w\n        , sum(work_dayoff_w) over (partition by mdm_employee_rk order by report_week rows between 15 preceding and current row) as\
    \ work_dayoff_16w\n    from performance_week\n)\n, performance_rolling_month as(\n    select distinct on (mdm_employee_rk, report_month)\n        report_month\n        , mdm_employee_rk\n        , absence_16w\n        , work_dayoff_16w\n    from performance_rolling\n    order by mdm_employee_rk, report_month, report_week desc\n)\n, performance_share_week as(\n    select\n        mdm_employee_rk\n        , report_week\n        , round(\n            avg(talk_call_duration_h) filter (where (weekday in (1,2,3,4,5) and plan_working_day_flg is null and duration_hour > 0) or plan_working_day_flg = 1)\n            / nullif(avg(duration_hour_correct) filter (where (weekday in (1,2,3,4,5) and plan_working_day_flg is null and duration_hour > 0) or plan_working_day_flg = 1), 0)\n            * 100, 1) as share_talk\n    from performance_metric_d\n    group by mdm_employee_rk, report_week\n)\n, performance_share_month as(\n    select distinct on (mdm_employee_rk, report_month)\n        report_month\n\
    \        , mdm_employee_rk\n        , share_talk\n    from (select mdm_employee_rk, report_week, date_trunc('month', report_week)::date as report_month, share_talk from performance_share_week) s\n    order by mdm_employee_rk, report_month, report_week desc\n)\n, cat_week_month as(\n    select distinct on (c.mdm_employee_rk, date_trunc('month', c.report_week)::date)\n        date_trunc('month', c.report_week)::date as report_month\n        , c.mdm_employee_rk\n        , c.cat_week\n        , cl.weeks_in_current_category\n    from cat_week c\n    left join cat_week_location cl\n        on cl.mdm_employee_rk = c.mdm_employee_rk and cl.report_week = c.report_week\n    order by c.mdm_employee_rk, date_trunc('month', c.report_week)::date, c.report_week desc\n)\n\n\n\n\nselect nm.*\n    , case when coalesce(nm.hc_total_cnt, 0) = 1 then coalesce(perf.perf_normal, 0) else 0 end as perf_normal\n    , case when coalesce(nm.hc_total_cnt, 0) = 1 then coalesce(perf.perf_low, 0) else 0 end    as perf_low\n\
    \    , case when coalesce(nm.hc_total_cnt, 0) = 1 then coalesce(perf.perf_high, 0) else 0 end   as perf_high\n    , case when coalesce(nm.hc_total_cnt, 0) = 1\n           then case when perf.mdm_employee_rk is null then 1 else coalesce(perf.perf_gray, 0) end else 0 end as perf_gray\n    , coalesce(pm.duration_plan_sum,0)/nullif(coalesce(pm.plan_day_cnt,0),0) as duration_hour -- Длительность рабочего дня в часах средняя\n    , coalesce(pm.talk_plan_sum,0)/nullif(coalesce(pm.plan_day_cnt,0),0) as talk_call_duration_h -- Длительность звонков в часах средняя\n    , coalesce(pm.absence, 0)          as absence -- прогул\n    , coalesce(pm.work_dayoff, 0)      as work_dayoff -- Работа в выходной\n    , coalesce(pm.talk_h_sum, 0)       as talk_h_sum\n    , coalesce(pm.work_h_sum, 0)       as work_h_sum\n    , coalesce(psm.share_talk, 0)      as share_talk -- доля времени на разговоры, % (недельно avg/avg, как в мастер-дашборде мониторинга)\n    , coalesce(pm.duration_plan_sum, 0) as duration_plan_sum\
    \ -- часы плановых дней месяца (поставка 104)\n    , coalesce(pm.plan_day_cnt, 0)     as plan_day_cnt -- плановые дни месяца\n    , coalesce(pm.talk_plan_sum, 0)    as talk_plan_sum -- часы звонков плановых дней месяца\n    , coalesce(cwm.cat_week, 'grey')   as cat_week -- категория недели (performance_metric_w)\n    , coalesce(cwm.weeks_in_current_category, 0) as weeks_in_current_category\n    , coalesce(prm.absence_16w, 0)     as flg_absent_total -- прогулы за 16 недель\n    , coalesce(prm.work_dayoff_16w, 0) as flg_work_in_rest_total -- работа в выходные за 16 недель\n    , case\n        when coalesce(psm.share_talk, 0) <= 0 then 'нет данных'\n        when coalesce(psm.share_talk, 0) < 20 then 'до 20%'\n        when coalesce(psm.share_talk, 0) <= 30 then '20-30%'\n        when coalesce(psm.share_talk, 0) <= 50 then '30-50%'\n        else '50%+'\n    end as talk_segment_cd\n    , case\n        when coalesce(prm.absence_16w, 0) <= 1 then '0-1'\n        when coalesce(prm.absence_16w,\
    \ 0) <= 5 then '2-5'\n        else '5+'\n    end as absence_segment_cd\n    , case\n        when coalesce(prm.work_dayoff_16w, 0) <= 1 then '0-1'\n        when coalesce(prm.work_dayoff_16w, 0) <= 5 then '2-5'\n        else '5+'\n    end as weekend_segment_cd\nfrom all_metrics nm\nleft join performance perf\n    on nm.mdm_employee_rk = perf.mdm_employee_rk and perf.calendar_dt = nm.report_month--::date\n    and nm.last_row_flg = 1\nleft join performance_month pm\n    on nm.mdm_employee_rk = pm.mdm_employee_rk and pm.report_month = nm.report_month\n    and nm.last_row_flg = 1\nleft join performance_rolling_month prm\n    on nm.mdm_employee_rk = prm.mdm_employee_rk and prm.report_month = nm.report_month\n    and nm.last_row_flg = 1\nleft join performance_share_month psm\n    on nm.mdm_employee_rk = psm.mdm_employee_rk and psm.report_month = nm.report_month\n    and nm.last_row_flg = 1\nleft join cat_week_month cwm\n    on nm.mdm_employee_rk = cwm.mdm_employee_rk and cwm.report_month = nm.report_month\n\
    \    and nm.last_row_flg = 1\n\ndistributed by (mdm_employee_rk, report_month);"
  isEnabled: true
- sid: 05b0b09c-e6d2-5bac-92d1-5be47303bff2
  title: with_office_traffic
  shebang: gp
  code: "-- =============================================================================\n-- TeamPulse Hub\n-- добавлены города посещений для статистики посещений (23.10): бронирования, нарушения\n-- бронирования и посещения по городам. С поставки 66 — в отчёте: «hub · 3» (ряды бронирований),\n-- «hub · 4» (города последнего месяца)\n-- ======================================================================\ndrop table if exists all_metrics_with_performance_and_office_traffic ;\ncreate table all_metrics_with_performance_and_office_traffic as\n\nwith base as (\n    select date_trunc('month', calendar_dt) as month\n        , mdm_employee_rk\n        , calendar_dt\n        , work_day_flg\n        -- 06.11, как в мастере: rn офиса дня (0 — без визита, 1 — главный офис), закреплён ли офис, фикс\n        , coalesce(main_office_visit_rn, 0) as main_office_visit_rn\n        , case when active_office_emp_flg = 'Да' then 1 else 0 end as office_emp_flg\n        , case when fix_flex_cat = 'фикс' then\
    \ 1 else 0 end as fix_flg\n        , coalesce(office_visit_flg, 0)    as office_visit_flg\n        , coalesce(booking_flg, 0)         as booking_flg\n        , booking_violation_flg  -- бронь без посещения; null — бронь вне учёта нарушений (не coalesce: различаем)\n        , visit_violation_flg    -- посещение без брони; null — вне учёта\n        , coalesce(nullif(trim(office_city_nm::text), ''), '-') as office_city_nm\n    from usr_cross_data.office_traffic_attendance\n    where work_day_flg = 1\n      and active_type_nm = 'Активная'   -- 06.11: мастер — активная численность\n)\n-- общие метрики за месяц; 06.11 — в базовой логике мастера (борд «Посещаемость и бронирование офисов»,\n-- выгрузки мастера 06.11; сверено: посещаемость HQ 12/12 месяцев ±0.4 п.п.):\n--   посещаемость и посещения — на активных с закреплённым офисом (office_emp_flg = 1), визит —\n--   главный офис дня (rn = 1), знаменатель — строки rn <= 1; fix_* — то же у владельцев фиксов;\n--   брони — только строки с определённым\
    \ нарушением (booking_violation_flg is not null)\n, office_traffic as (\n    select month\n        , mdm_employee_rk\n        , sum(case when office_emp_flg = 1 and main_office_visit_rn <= 1 then 1 else 0 end) as work_day_amt\n        , sum(case when office_emp_flg = 1 and main_office_visit_rn = 1 then office_visit_flg else 0 end) as office_visit_amt\n        -- 11.11 (исследование посещаемости): база посещаемости людьми — 1, если у человека в месяце был рабочий день с\n        -- закреплённым офисом (знаменатель посещаемости); в отчёте — «по N сотрудникам с закреплённым офисом из M»\n        , max(case when office_emp_flg = 1 and main_office_visit_rn <= 1 then 1 else 0 end) as office_emp_cnt\n        , sum(case when fix_flg = 1 and main_office_visit_rn <= 1 then 1 else 0 end) as fix_work_day_amt\n        , sum(case when fix_flg = 1 and main_office_visit_rn = 1 then office_visit_flg else 0 end) as fix_office_visit_amt\n        , sum(case when booking_violation_flg is not null then booking_flg\
    \ else 0 end) as booking_amt\n        , sum(booking_violation_flg) as booking_viol_amt\n        , sum(case when office_emp_flg = 1 and main_office_visit_rn = 1 then visit_violation_flg else 0 end) as visit_viol_amt\n        , sum(case when office_emp_flg = 1 and main_office_visit_rn = 1 and visit_violation_flg = 0\n                   then office_visit_flg else 0 end) as visit_with_booking_amt\n    from base\n    group by month, mdm_employee_rk\n)\n-- посещения в разрезе городов (06.11 — база мастера: активные с закреплённым офисом, визит — главный офис\n-- дня; брони — с определённым нарушением); 27.10-в: и брони с нарушениями (дни с бронью, бронь без\n-- посещения, посещение без брони) — для «Нарушений брони по городам»; город с одной бронью без прихода тоже попадает\n, city_visits as (\n    select month\n        , mdm_employee_rk\n        , office_city_nm\n        , sum(case when office_emp_flg = 1 and main_office_visit_rn = 1 then office_visit_flg else 0 end) as visit_count\n    \
    \    , sum(case when office_emp_flg = 1 and main_office_visit_rn <= 1 then 1 else 0 end) as work_day_count\n        , sum(case when booking_violation_flg is not null then booking_flg else 0 end) as booking_count\n        , sum(booking_violation_flg) as booking_viol_count\n        , sum(case when office_emp_flg = 1 and main_office_visit_rn = 1 then visit_violation_flg else 0 end) as visit_viol_count\n    from base\n    -- 09.11 (hub checks № 33: посещения по городам = посещения): посещение без города — строкой «-» (в отчёте «Не\n    -- указано»); было — отбрасывалось, и сумма по городам была меньше посещений\n    group by month, mdm_employee_rk, office_city_nm\n    -- 09.11 (бой: посещения по городам меньше посещений): visit_violation_flg бывает NULL — сумма с NULL давала NULL, и\n    -- строка города выпадала вместе с посещениями. Каждое слагаемое — через coalesce\n    having coalesce(sum(case when office_emp_flg = 1 and main_office_visit_rn <= 1 then 1 else 0 end), 0)\n         + coalesce(sum(case\
    \ when office_emp_flg = 1 and main_office_visit_rn = 1 then office_visit_flg else 0 end), 0)\n         + coalesce(sum(case when booking_violation_flg is not null then booking_flg else 0 end), 0)\n         + coalesce(sum(case when office_emp_flg = 1 and main_office_visit_rn = 1 then visit_violation_flg else 0 end), 0) > 0\n)\n-- сворачиваем в json\n, city_json as (\n    select month\n        , mdm_employee_rk\n        , json_agg(\n              json_build_object(\n                  'office_city_nm',     office_city_nm,\n                  'visit_count',        visit_count,\n                  'work_day_count',     work_day_count,\n                  'booking_count',      booking_count,\n                  'booking_viol_count', booking_viol_count,\n                  'visit_viol_count',   visit_viol_count\n              )\n              order by visit_count desc, office_city_nm\n          ) as office_city_visits_json\n    from city_visits\n    group by month, mdm_employee_rk\n)\n\nselect m.*\n\
    \    , o.work_day_amt\n    , o.office_visit_amt\n    , o.office_emp_cnt\n    , o.fix_work_day_amt\n    , o.fix_office_visit_amt\n    , o.booking_amt\n    , o.booking_viol_amt\n    , o.visit_viol_amt\n    , o.visit_with_booking_amt\n    , c.office_city_visits_json\nfrom all_metrics_with_performance_added m\nleft join office_traffic o\n    on o.month = m.report_month\n    and o.mdm_employee_rk = m.mdm_employee_rk\n    and m.last_row_flg = 1\nleft join city_json c\n    on  c.month           = m.report_month\n    and c.mdm_employee_rk = m.mdm_employee_rk\n    and m.last_row_flg    = 1\n\ndistributed by (mdm_employee_rk, report_month)\n;"
  isEnabled: true
- sid: 4cec2a54-cc1a-54dc-80f1-05f8e3e1cd29
  title: office_traffic
  shebang: gp
  code: "-- =============================================================================\n-- TeamPulse Hub\n-- календарь посещений на последние 3 месяца (23.10; поставка 66 — исправлен и дополнен; поставка 90 — 3 месяца)\n-- юнит × день × срез отчёта: людей с рабочим днём (cnt_work_day) и из них в офисе (cnt_office_visit);\n-- посещаемость дня = cnt_office_visit / cnt_work_day. За месяц сумма — те же рабочие дни и посещения, что\n-- у with_office_traffic (проверка в «hub checks»). В отчёт календарь раскладывает по узлам «hub · 4».\n-- Поставка 66, к версии 23.10:\n--   - date_trunck → date_trunc, запятая после cnt_work_day;\n--   - без условия office_visit_flg = 1: с ним в таблице только дни в офисе, и cnt_work_day = cnt_office_visit —\n--     посещаемость дня всегда 100%;\n--   - человек — одной строкой месяца (last_row_flg = 1, как у посещений в with_office_traffic): у перешедшего\n--     в месяце строк несколько, и его дни считались в каждой;\n--   - срезы отчёта (покраска, IT-код, тип\
    \ оформления, тип численности) и ключи уровней — по ним отчёт\n--     фильтрует календарь и раскладывает его по узлам;\n--   - два месяца — последний месяц all_metrics и прошлый (первое условие — отсечение партиций по дате);\n--   - поставка 90: три месяца — последний и два перед ним: при неполном последнем месяце отчёту нужны два закрытых\n--     (с месяца перед последним закрытым) и дни неполного; «hub · 4» берёт нужные.\n--   06.11: база мастера (борд «Посещаемость и бронирование офисов», выгрузки мастера) — активная численность\n--     с закреплённым офисом (active_office_emp_flg = 'Да'), визит — главный офис дня (rn = 1), день — строка\n--     rn <= 1: сумма календаря за месяц = wday/ovis серии (проверка №13), день — как месяц мастера.\n-- ======================================================================\ndrop table if exists office_traffic_calendar ;\ncreate table office_traffic_calendar as\n\nwith calendar as (\nselect calendar_dt::date as calendar_dt\n        , date_trunc('month',\
    \ calendar_dt)::date as report_month\n        , mdm_employee_rk\n        --, office_city_nm\n        , coalesce(region_visit_flg, 0) as region_visit_flg\n        , coalesce(office_visit_flg, 0) as office_visit_flg\n        -- 06.11, как в мастере: rn офиса дня (0 — без визита, 1 — главный офис) для дедупа мульти-офисных дней\n        , coalesce(main_office_visit_rn, 0) as main_office_visit_rn\n        , day_short_nm\n        , day_sort\n    from usr_cross_data.office_traffic_attendance\n    where calendar_dt >= date_trunc('month', current_date - interval '3 month')\n    and calendar_dt >= (select max(report_month)::date - interval '2 month' from all_metrics)\n    and work_day_flg = 1\n    -- 06.11: база мастера — активная численность с закреплённым офисом (active_office_emp_flg = 'Да'),\n    -- сумма календаря за месяц = wday/ovis серии (проверка №13), посещаемость дня = как в мастере\n    and active_type_nm = 'Активная'\n    and active_office_emp_flg = 'Да'\n)\n\nselect c.report_month,\n\
    \    c.calendar_dt,\n    am.mng_unit_rk,\n    am.leaf_lvl\n    , am.lvl1_rk\n    , am.lvl2_rk\n    , am.lvl3_rk\n    , am.lvl4_rk\n    , am.lvl5_rk\n    , am.lvl6_rk\n    , am.lvl7_rk\n    , am.lvl8_rk\n    , am.lvl9_rk\n    , am.lvl10_rk\n    , am.lvl11_rk\n    , am.lvl1_nm\n    , am.lvl2_nm\n    , am.lvl3_nm\n    , am.lvl4_nm\n    , am.lvl5_nm\n    , am.lvl6_nm\n    , am.lvl7_nm\n    , am.lvl8_nm\n    , am.lvl9_nm\n    , am.lvl10_nm\n    , am.lvl11_nm\n    , am.paint_cd\n    , am.emp_specialization_it_code\n    , am.employment_relation_type\n    , am.act_type_nm\n    , sum(case when c.main_office_visit_rn <= 1 then 1 else 0 end) as cnt_work_day\n    , sum(case when c.main_office_visit_rn = 1 then c.office_visit_flg else 0 end) as cnt_office_visit\n    , sum(c.region_visit_flg) as cnt_region_visit\n    , max(c.day_sort) as day_sort\n    , max(c.day_short_nm) as day_short_nm\n\nfrom all_metrics am\njoin calendar c on am.mdm_employee_rk = c.mdm_employee_rk and am.report_month = c.report_month\n\
    where am.last_row_flg = 1\ngroup by c.report_month,\n    c.calendar_dt,\n    am.mng_unit_rk,\n    am.leaf_lvl,\n    am.lvl1_rk, am.lvl2_rk, am.lvl3_rk, am.lvl4_rk, am.lvl5_rk, am.lvl6_rk, am.lvl7_rk, am.lvl8_rk, am.lvl9_rk, am.lvl10_rk, am.lvl11_rk,\n    am.lvl1_nm, am.lvl2_nm, am.lvl3_nm, am.lvl4_nm, am.lvl5_nm, am.lvl6_nm, am.lvl7_nm, am.lvl8_nm, am.lvl9_nm, am.lvl10_nm, am.lvl11_nm,\n    am.paint_cd, am.emp_specialization_it_code, am.employment_relation_type, am.act_type_nm\n\ndistributed by (mng_unit_rk);\n\nanalyze office_traffic_calendar;"
  isEnabled: true
- sid: ce3b8b98-31cf-5b1d-aba1-71931cc4e885
  title: rost_info
  shebang: gp
  code: "-- =============================================================================\n-- TeamPulse Hub\n-- заявки T-роста (поставка 73 — по эталону отчёта «Рост» дашборда HQ и ноутбуку Адели 28.10): по заявке — сотрудник\n-- месяц начала (дата старта согласования, иначе\n-- создания — по нему юнит заявки), месяц итога (valid_from_dttm — последняя смена статуса: для одобренной и\n-- отклонённой — месяц решения), грейд и специализация сейчас и желаемые, статус, тип (смена специализации — по\n-- specialization_change_flg, иначе повышение грейда), поток T@T (у заявки есть уровень T@T). Как в эталоне: только\n-- HQ-специализации, без стажёров, без черновиков, актуальная версия заявки\n-- 03.11, поставка 103 (ноутбук «TeamPulse Hub_2_11»): distinct — одна строка на заявку, без заявок без id, только\n-- своя компания (юнит 1-го уровня заявки — из структуры all_metrics; в 2_11 — литералом rk)\n-- =============================================================================\ndrop table if exists\
    \ rost_info ;\ncreate table rost_info as\n\nselect distinct\n        ap.mdm_employee_application_id as application_id,\n        ap.creator_mdm_employee_rk as mdm_employee_rk,\n        ap.company_hire_dt::date as company_hire_dt,\n        date_trunc('month', coalesce(ap.hd1_init_dt::date, ap.create_dt::date))::date as month,\n        date_trunc('month', ap.valid_from_dttm)::date as finish_month,\n        ap.create_dt,\n        ap.current_grade_num,\n        ap.required_grade_num,\n        ap.current_specialization_desc as current_specialization,\n        ap.required_specialization_desc as required_specialization,\n        ap.mdm_employee_appl_status_cd,\n        s.mdm_employee_appl_status_desc,\n        case when ap.mdm_employee_appl_status_cd = 'FNS' then 1 else 0 end as is_approved,     -- завершена: рост состоялся\n        case when ap.mdm_employee_appl_status_cd = 'DCL' then 1 else 0 end as is_declined,     -- отклонена\n        case when ap.mdm_employee_appl_status_cd = 'CNL' then\
    \ 1 else 0 end as is_cancelled,    -- отменена\n        case when ap.mdm_employee_appl_status_cd not in ('DRT', 'FNS', 'DCL', 'CNL') then 1 else 0 end as is_inprogress,\n        case when coalesce(ap.specialization_change_flg, 0) = 1 then 0 else 1 end as grade_change_application_flg,\n        case when coalesce(ap.specialization_change_flg, 0) = 1 then 1 else 0 end as specialization_change_application_flg,\n        case when ap.current_tat_num is not null or ap.required_tat_num is not null then 1 else 0 end as tat_flg\nfrom usr_cross_data.mdm_employee_application_grt ap\nleft join prod_v_dds_dic.mdm_employee_appl_status s\n    on ap.mdm_employee_appl_status_cd = s.mdm_employee_appl_status_cd\nwhere ap.valid_to_dttm = '5999-01-01 00:00:00'\n    and ap.mdm_employee_appl_status_cd <> 'DRT'\n    and ap.current_specialization_oper_code = 'Hq'   -- 31.10: фильтр HQ вернули (вкладка «Рост HQ»; у Адели 29.10 был снят)\n    and coalesce(ap.current_specialization_desc, '') not in ('Стажеры IT',\
    \ 'Стажеры Digital', 'Стажеры non-IT')\n    and ap.mdm_employee_application_id is not null\n    and ap.lvl1_management_unit_rk::text in (select distinct lvl1_rk::text from all_metrics)\n\ndistributed by (mdm_employee_rk, month);"
  isEnabled: true
- sid: 2b1994c7-40ee-57dd-bd51-5c8b189295c8
  title: with_TRost
  shebang: gp
  code: "-- =============================================================================\n-- TeamPulse Hub\n-- заявки T-роста к людям (27.10): за месяц — одобрено, отклонено, отменено, в работе, из них T@T (к одной\n-- строке человека в месяце; поставка 73 — по месяцу итога заявки);\n-- за всё время — сколько заявок подавал, признаки «ни разу», «впервые», «повторно»\n-- =============================================================================\ndrop table if exists all_metrics_with_performance_and_office_traffic_and_grt ;\ncreate table all_metrics_with_performance_and_office_traffic_and_grt as\n\n\nwith  grt_employee as (\n    -- всё за всё время по сотруднику: сколько заявок, сколько одобрено, дата последнего прохождения\n    select mdm_employee_rk,\n            count(*) as grt_app_cnt,\n            sum(is_approved) as grt_approve_total,\n            max(create_dt) filter (where is_approved = 1) as grt_last_approve_dttm\n    from rost_info\n    group by mdm_employee_rk\n)\n, grt_month\
    \ as (\n    -- поставка 73: решения — в месяц итога (как эталон «Роста»: месяц смены статуса), а не подачи\n    select mdm_employee_rk\n            , finish_month as month\n            , sum(is_approved) as is_approved\n            , sum(is_declined) as is_declined\n            , sum(is_cancelled) as is_cancelled\n            , sum(is_inprogress) as is_inprogress\n            , sum(tat_flg) as tat\n    from rost_info group by mdm_employee_rk, finish_month\n)\nselect m.*\n    , coalesce(o.is_approved, 0) as grt_approve_cnt\n    , coalesce(o.is_declined, 0) as grt_decline_cnt\n    , coalesce(o.is_cancelled, 0) as grt_cancel_cnt\n    , coalesce(o.is_inprogress, 0) as grt_inprogress_cnt\n\n    , coalesce(e.grt_app_cnt, 0) as grt_app_cnt\n    , coalesce(o.tat, 0) as grt_tat_cnt --из них ТаТ\n    , case when e.mdm_employee_rk is null then 1 else 0 end as grt_no_app_flg   -- ни разу не подавал заявку в Т-Росте\n    , case when coalesce(e.grt_app_cnt, 0) >= 2 then 1 else 0 end as grt_repeat_flg\
    \ -- участвует повторно (подавал больше 1 заявки)\n    , case when coalesce(e.grt_app_cnt, 0) = 1 then 1 else 0 end as grt_first_flg   -- первый раз\n    -- , case\n    --         when e.grt_last_approve_dttm is null then 'не проходил рост'\n    --         when age(m.report_month, e.grt_last_approve_dttm::date) < interval '6 months'  then 'менее 6 мес'\n    --         when age(m.report_month, e.grt_last_approve_dttm::date) < interval '1 year'    then '6-12 мес'\n    --         when age(m.report_month, e.grt_last_approve_dttm::date) < interval '2 years'   then '1-2 года'\n    --         when age(m.report_month, e.grt_last_approve_dttm::date) < interval '3 years'   then '2-3 года'\n    --         when age(m.report_month, e.grt_last_approve_dttm::date) < interval '4 years'   then '3-4 года'\n    --         else '4+ лет'\n    --     end as grt_recency_cd\n\nfrom all_metrics_with_performance_and_office_traffic m\nleft join grt_month o\n    on o.month = m.report_month\n    and o.mdm_employee_rk\
    \ = m.mdm_employee_rk\n    and m.last_row_flg = 1\nleft join grt_employee e\n    on e.mdm_employee_rk = m.mdm_employee_rk\n\ndistributed by (mdm_employee_rk, report_month)\n;"
  isEnabled: true
- sid: eff4111f-90f2-5872-afe7-15751c92ce3e
  title: structure_x_rost
  shebang: gp
  code: "-- =============================================================================\n-- TeamPulse Hub\n-- заявки T-роста к структуре (27.10): заявка — юнит и срезы человека в месяце начала (поставка 73: как эталон «Роста» — старт согласования, иначе создание). Поставка 71: к одной\n-- строке человека в месяце (last_row_flg = 1) — у перешедшего в месяце строк две, и заявка считалась дважды. Из неё\n-- «hub · 4» собирает разрезы T-роста: заявки по месяцам и успешность по желаемому грейду и специализации\n-- =============================================================================\ndrop table if exists structure_x_rost;\ncreate table structure_x_rost as\n\nselect\n    am.mng_unit_rk\n    , am.leaf_lvl\n    , am.lvl1_rk\n    , am.lvl2_rk\n    , am.lvl3_rk\n    , am.lvl4_rk\n    , am.lvl5_rk\n    , am.lvl6_rk\n    , am.lvl7_rk\n    , am.lvl8_rk\n    , am.lvl9_rk\n    , am.lvl10_rk\n    , am.lvl11_rk\n    , am.lvl1_nm\n    , am.lvl2_nm\n    , am.lvl3_nm\n    , am.lvl4_nm\n    , am.lvl5_nm\n\
    \    , am.lvl6_nm\n    , am.lvl7_nm\n    , am.lvl8_nm\n    , am.lvl9_nm\n    , am.lvl10_nm\n    , am.lvl11_nm\n    , am.paint_cd\n    , am.emp_specialization_it_code\n    , am.employment_relation_type\n    , am.act_type_nm\n    , ri.*\nfrom rost_info ri\njoin all_metrics am\non ri.mdm_employee_rk = am.mdm_employee_rk and ri.month = am.report_month\n    and am.last_row_flg = 1\ndistributed by (mdm_employee_rk);"
  isEnabled: true

- sid: 6199336c-8568-5105-941b-e92471bbffc2
  title: TeamPulse Hub — что собирает ноутбук
  shebang: md
  code: |-
    # TeamPulse Hub — ноутбук сборки (копия TP 2.0 под отчёт)

    Тот же конвейер, что TP 2.0: источник по дням → человек × месяц × юнит → перформанс, посещаемость,
    T-рост → `hr_structure_overall` для других отчётов. Плюс таблицы **`teampulse_hub_*`**: в них
    посчитано всё, что нужно отчёту TeamPulse Hub. Виртуальный датасет отчёта не кешируется, поэтому
    на каждый запрос он только выбирает узлы ответа (выбранный юнит, базу и три уровня под ним) и
    склеивает строки — без дерева, без склейки копий, без истории в нынешней структуре.

    **Что изменено против TP 2.0** (подробно — «Предложения — физическая таблица под датасет.md»):

    1. `build_all_metrics` — численность на последний календарный день месяца: ушедшие в месяце в
       численность его конца больше не входят. Признак `last_row_flg` — одна строка человека в месяце.
       Ключи уровней `lvl1_rk … lvl11_rk` выводятся рядом с именами.
    2. `with_TRost` — заявки сначала суммируются по человеку и месяцу: строки больше не двоятся.
    3. Перформанс, посещаемость, T-рост — к одной строке человека в месяце (`last_row_flg = 1`).
    4. `_PARAMS_` — «Активная» по флагу источника (`active_count_flg`, иначе `active_type_flg`,
       `active_flg`; флага нет — только тип «Активная»): подрядчики в активную не входят. IT-код —
       как в источнике: IT, Digital, NonIT, без сведения в nonIT. Это меняет и `hr_structure_overall`:
       активная без подрядчиков, у IT-кода три значения.
    5. `EXEC build_all_metrics` — покраска (`paint_cd`: HQ, Line, Support) для срезов отчёта. В
       `hr_structure_overall` она не идёт.
    6. Новые параграфы: `build_hub`, `EXEC build_hub`, `hub checks` и выгрузка четырёх таблиц.
    7. Убраны выключенные и отладочные параграфы (`get_hr_structure`, `join_structure_combos`,
       `Untitled …`, `select …`, `tst`).

    **Таблицы для отчёта** (выгрузка — параграф `to click`, база `prod_proteus`):

    | Таблица | Строка | Что в ней |
    |---|---|---|
    | `teampulse_hub_meta` | одна | последний месяц (и текущий незакрытый), дата данных `data_dt`, начало сетки, корень, юнит по умолчанию |
    | `teampulse_hub_unit` | узел нынешней структуры | родитель, уровень, имя, число подразделений, путь ключами, логин руководителя (`head_login`: окно настройки отчёта показывает его под именем юнита и ищет по нему) |
    | `teampulse_hub_series` | узел × месяц × срез | численность, активная, ССЧ, найм (в компанию + из учебной группы в боевую + стажёры в штат — методология DD), увольнения, regret, переводы через границу узла, мониторинг, посещаемость, T-рост — по всему поддереву |
    | `teampulse_hub_mix` | узел × срез × разрез × значение | численность по атрибутам, увольнения с начала года по причинам, инициативе, стажу, грейду, стриму |
    | `teampulse_hub_trf` | узел × месяц × вид × срез до × срез после | переходы людей по дням (с 21.10): вошёл в узел, вышел, остался со сменой среза (покраска, IT, штат, тип численности). Датасет считает из них переводы в выбор и из выбора под любые фильтры |

    Срез — покраска × IT × штат: фильтры отчёта. История — в нынешней структуре: юнит переехал — его
    прошлое едет с ним. ССЧ = (активная месяца + прошлого) / 2 по узлу и срезу.

    **Порядок:** параграфы сверху вниз. `hub checks` до выгрузки: не сошлось — исключение, выгрузки нет.
  isEnabled: true

- sid: 418e9eec-2565-5b30-99d9-8164506f6f96
  title: calc_ssch
  shebang: python
  code: |-
    # ── константы ────────────────────────────────────────────────────────────────
    # колонки, которые точно метрики (не ключи партиционирования)
    DEFAULT_METRICS = {
        'hc_total_cnt', 'hc_active_cnt', 'hire_cnt', 'hire_amt',
        'hire_to_active_amt', 'transfer_candidate_amt', 'transfer_internal_amt',
        'fire_amt', 'regret_fire_amt',
        'transfer_in_amt', 'transfer_in_lvl', 'transfer_out_amt', 'transfer_out_lvl',
        'perf_normal', 'perf_low', 'perf_high', 'perf_gray',
        'work_day_amt', 'office_visit_amt',
        'grt_approve_cnt', 'grt_decline_cnt', 'grt_cancel_cnt', 'grt_inprogress_cnt',
    }

    # колонки-наименования: нужны в выводе, но НЕ в PARTITION BY
    _NM_RE = _re.compile(r'^lvl\d+_nm$')


    def _resolve_col(all_cols, name, alternatives=()):
        """Возвращает реальное имя колонки с автофолбэком month/report_month."""
        if name in all_cols:
            return name
        for alt in alternatives:
            if alt in all_cols:
                print(f'[INFO] {name} нет в таблице, использую {alt}')
                return alt
        raise ValueError(f'{name} нет в таблице. Есть: {all_cols}')


    def partition_cols_from_table(table, order_col='month', fields=None):
        """
        Ключи партиционирования = идентификационные ключи (юниты) + разрезы,
        БЕЗ наименований (lvlN_nm) и БЕЗ order_col.
        """
        all_cols = table_columns(table)
        all_set = set(all_cols)
        schema = _detect_schema(all_cols)
        order_col = _resolve_col(all_cols, order_col, ('report_month', 'month'))

        path_keys = _build_path_keys(all_cols, schema, target_lvl=None)
        path_set = set(path_keys)

        # ── отсеиваем наименования: они не стабильны между месяцами ──
        cols = [c for c in path_keys
                if c != order_col and not _NM_RE.match(c)]

        if fields:
            for f in fields:
                k = _key_of(f)
                if k not in all_set:
                    print(f'[SKIP] {k} нет в {table} — не партиционируем')
                    continue
                if k not in path_set and k not in cols and not _NM_RE.match(k):
                    cols.append(k)
        else:
            metric_set = DEFAULT_METRICS
            for c in all_cols:
                if (c not in cols and c not in metric_set
                        and c != order_col and not _NM_RE.match(c)):
                    cols.append(c)

        cols = [c for c in cols if c != order_col]
        if not cols:
            raise ValueError(f'Не удалось определить partition_cols для {table}')

        nm_cols = [c for c in path_keys if _NM_RE.match(c)]
        if nm_cols:
            print(f'[INFO] lvlN_nm исключены из PARTITION BY: {nm_cols}')
        print(f'[INFO] схема: {schema}, order: {order_col}, partition_cols: {cols}')
        return cols, order_col


    def calc_ssch(
        source_table,
        res_table_name,
        metric_col='hc_total_cnt',
        ssch_col_name=None,
        lag_col_name=None,
        partition_cols=None,
        order_col='month',
        fill_first=True,
        additional_metrics=None,
        where_clause='',
        fields=None,
        distributed_by=None,
        return_df=False,
    ):
        """
        SSCH = (lag + текущ) / 2, для первого месяца = текущ (fill_first=True).
        PARTITION BY = идентификационные ключи (юниты rk + разрезы), ORDER BY = месяц.
        lvlN_nm выносятся в SELECT, но НЕ в PARTITION BY.
        """
        source_table = _qualified(source_table)
        res_table_name = _qualified(res_table_name)

        # ── кэш сбрасываем, чтобы читать актуальную схему ──
        _TABLE_CACHE.pop(source_table, None)
        all_cols = table_columns(source_table)
        all_set = set(all_cols)

        order_col = _resolve_col(all_cols, order_col, ('report_month', 'month'))

        if metric_col not in all_set:
            cands = [c for c in DEFAULT_METRICS if c in all_set]
            raise ValueError(
                f'{metric_col} нет в {source_table}. '
                f'Кандидаты: {cands[:5]}'
            )

        if ssch_col_name is None:
            ssch_col_name = f'ssch_{metric_col}'
        if lag_col_name is None:
            lag_col_name = f'lag_{metric_col}'
        _ident(ssch_col_name)
        _ident(lag_col_name)

        # ── partition_cols ──
        if partition_cols is None:
            partition_cols, order_col = partition_cols_from_table(
                source_table, order_col=order_col, fields=fields,
            )
        else:
            missing = [c for c in partition_cols if c not in all_set]
            if missing:
                raise ValueError(f'partition_cols: нет в {source_table}: {missing}')

        partition_sql = ', '.join(_ident(c) for c in partition_cols)
        over = f'PARTITION BY {partition_sql} ORDER BY {_ident(order_col)}'

        # ── исключаем из SELECT * колонки, которые будут пересозданы ──
        # (защита от дублей при повторном прогоне)
        new_cols = {lag_col_name, ssch_col_name}
        if additional_metrics:
            new_cols |= set(additional_metrics.keys())
        base_cols = [c for c in all_cols if c not in new_cols]
        base_sql = ', '.join(_ident(c) for c in base_cols)

        # ── LAG / SSCH ──
        lag_expr = f'LAG({_ident(metric_col)}) OVER ({over})'

        if fill_first:
            ssch_formula = (
                f'CASE WHEN {lag_expr} IS NULL '
                f'THEN {_ident(metric_col)}::NUMERIC '
                f'ELSE ({lag_expr} + {_ident(metric_col)}) / 2.0 END'
            )
        else:
            ssch_formula = f'({lag_expr} + {_ident(metric_col)}) / 2.0'

        # ── additional_metrics ──
        additional_sql = ''
        if additional_metrics:
            parts = [
                f"{formula.replace('{ssch}', f'({ssch_formula})')} AS {_ident(name)}"
                for name, formula in additional_metrics.items()
            ]
            additional_sql = ',\n       ' + ',\n       '.join(parts)

        where_sql = f'WHERE 1=1 {where_clause}' if where_clause else ''

        select_sql = f"""
    SELECT {base_sql},
           {lag_expr} AS {_ident(lag_col_name)},
           {ssch_formula} AS {_ident(ssch_col_name)}{additional_sql}
    FROM {source_table}
    {where_sql}"""

        print(select_sql)

        dist = (f'distributed by ({", ".join(_ident(c) for c in distributed_by)})'
                if distributed_by else 'distributed randomly')

        dal.get_df(datasource='gp', query=f'drop table if exists {res_table_name}')
        dal.get_df(datasource='gp',
                   query=f'create table {res_table_name} as\n{select_sql}\n{dist}')
        dal.get_df(datasource='gp', query=f'analyze {res_table_name}')

        cnt = dal.get_df(datasource='gp',
                         query=f'select count(*) as cnt from {res_table_name}')['cnt'].iloc[0]
        print(f'[OK] SSCH сохранено в {res_table_name}: {cnt} строк')

        return dal.get_df(datasource='gp', query=select_sql) if return_df else None

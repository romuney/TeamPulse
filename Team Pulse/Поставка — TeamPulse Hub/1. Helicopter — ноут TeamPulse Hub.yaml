  shebang: python
  code: |-
    import time
    import proteus_py.database.clickhouse as pp
    #from proteus_py.database.clickhouse import get_table_owners, set_table_owners, delete_table_owners


    tables_dict = {
        'hr_structure_with_ssch': 'prod_proteus.hr_structure_overall',   # как в TP 2.0 — для других отчётов
        # TeamPulse Hub: датасет отчёта читает только их
        'teampulse_hub_meta':   'prod_proteus.teampulse_hub_meta',
        'teampulse_hub_unit':   'prod_proteus.teampulse_hub_unit',
        'teampulse_hub_series': 'prod_proteus.teampulse_hub_series',
        'teampulse_hub_mix':    'prod_proteus.teampulse_hub_mix',
        'teampulse_hub_trf':    'prod_proteus.teampulse_hub_trf',     # переходы — переводы под фильтры
    }

    OWNERS = ['d.i.dyachenko', 'a.a.varnavskiy', 'r.kazantsev', 'a.khisamova']
    MAX_RETRIES = 3
    DEFAULT_DELAY = 5

    for source, target in tables_dict.items():
        print(f"{source} -> {target}")
        for attempt in range(1, MAX_RETRIES + 1):
            try:
                pp.gp_to_click(
                    gp_table=source,
                    clickhouse_table=target)
                print(f"[OK] {target}")
                break
            except Exception as e:
                print(f"[{attempt}/{MAX_RETRIES}] {e}")
                if attempt == MAX_RETRIES:
                    raise
                time.sleep(DEFAULT_DELAY * 2 ** (attempt - 1))

        database, _, table = target.rpartition('.')
        pp.set_table_owners(database=database, table=table, usernames=OWNERS)
        print(f"[OWNERS] {target}: {', '.join(OWNERS)}")

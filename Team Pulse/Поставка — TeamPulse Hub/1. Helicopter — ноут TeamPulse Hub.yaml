- sid: 5a37a6ea-4940-5119-8efb-247c24fc4158
  title: unit_head_structure
  shebang: gp
  code: |-
    -- =============================================================================
    -- TeamPulse Hub · руководитель юнита по месяцам: имя и логин (Адель, 23.10; поставка 66)
    -- Руководитель — сотрудник с management_head_flg = 1, юнит — его management_unit_rk, на последний день
    -- месяца (у текущего — на последний день данных). Имя — «Имя Фамилия»: его ищут в фильтре юнита отчёта.
    -- Поставка 66: одна строка на юнит и месяц. У юнита бывает несколько строк с флагом (две должности,
    -- соруководители, две даты в месяце) — org_structure, который присоединяет таблицу, размножал строки юнита.
    -- Берётся последняя дата месяца, при равенстве — меньший mdm_employee_rk. Нет фамилии — только имя.
    -- =============================================================================
    DROP TABLE IF EXISTS unit_head_structure;
    create table unit_head_structure as

    with unit_heads as (
    select
        business_dt::DATE AS business_dt,
        management_unit_rk,
        management_unit_nm,
        mdm_employee_rk,
        last_nm,first_nm,
        nullif(trim(coalesce(first_nm, '') || ' ' || coalesce(last_nm, '')), '') as full_nm,
        ad_login

    from prod_v_emart.mdm_employee_structure_d
    where
        (last_day_flg = 1 or last_day_of_month_flg = 1)
        and management_head_flg=1
    )
        --AND company_fire_flg = 0


    select distinct on (uh.management_unit_rk, date_trunc('month', uh.business_dt)::DATE)
        uh.management_unit_rk
        , date_trunc('month', uh.business_dt)::DATE as report_month
        , uh.mdm_employee_rk as leader_mdm_employee_rk
        , uh.first_nm as leader_first_nm
        , uh.full_nm as leader_full_nm
        , uh.ad_login as leader_login

    from unit_heads uh
    order by uh.management_unit_rk, date_trunc('month', uh.business_dt)::DATE, uh.business_dt desc, uh.mdm_employee_rk

    distributed by (management_unit_rk);
  isEnabled: true
- sid: 957e1dfb-0b94-55a0-a3d9-b073d4ae22ef
  title: org_structure
  shebang: gp
  code: |-
    -- 23.10 (Адель): + руководитель юнита на месяц — логин и имя (unit_head_structure; с поставки 66 там одна строка
    -- на юнит и месяц, строки юнита не размножаются)
    DROP TABLE IF EXISTS org_structure;
    CREATE TABLE org_structure AS

    with prep as(
    SELECT
        report_month,
        mng_unit_rk,
        leaf_lvl,
        lvl1_nm,
        lvl2_nm,
        lvl3_nm,
        lvl4_nm,
        lvl5_nm,
        lvl6_nm,
        lvl7_nm,
        lvl8_nm,
        lvl9_nm,
        lvl10_nm,
        lvl11_nm
        -- ── метрики: сумма по всем разрезам внутри юнита ──
    FROM all_metrics
    GROUP BY
        report_month,
        mng_unit_rk,
        leaf_lvl,
        lvl1_nm, lvl2_nm, lvl3_nm, lvl4_nm, lvl5_nm,
        lvl6_nm, lvl7_nm, lvl8_nm, lvl9_nm, lvl10_nm, lvl11_nm
    )

    SELECT prep.*
        , uhs.leader_login -- логин руководителя
        , uhs.leader_full_nm -- имя руководителя
    FROM prep
    LEFT JOIN unit_head_structure uhs
        ON prep.mng_unit_rk = uhs.management_unit_rk AND prep.report_month = uhs.report_month


    DISTRIBUTED BY (mng_unit_rk);

    ANALYZE org_structure;
  isEnabled: true
- sid: 779d3cab-5a6b-530a-8df8-b3aa837e3481
  title: with_performance
  shebang: gp
  code: |-
    drop table if exists all_metrics_with_performance_added ;
    create table all_metrics_with_performance_added as

    with performance_category (val, mapped_val) as(
        select * from (values
            ('normal',      'normal'),
            ('super_low',   'low'),
            ('low',         'low'),
            ('high',        'high'),
            ('super_high',  'high')
        )t (val, mapped_val)
    )
    , performance_base as(
        select
            mdm_employee_rk
            , calendar_dt
            , coalesce(pc.mapped_val, 'gray') as performance_category_mapped
        from prod_v_sse_crossdata.performance_metric_m pmm
        left join performance_category pc on pmm.performance_category = pc.val
        where pmm.calendar_dt >= DATE_TRUNC('year', current_date) - interval '1 year'
        --and mdm_employee_rk = 614029
    )
    , performance as(
        select mdm_employee_rk::int
            , calendar_dt,
            count(*) filter (where performance_category_mapped = 'normal') as perf_normal,
            count(*) filter (where performance_category_mapped = 'low')    as perf_low,
            count(*) filter (where performance_category_mapped = 'high')   as perf_high,
            count(*) filter (where performance_category_mapped = 'gray')   as perf_gray
        from performance_base
        group by 1,2
    )




    select nm.*
        , coalesce(perf.perf_normal, 0)     as perf_normal
        , coalesce(perf.perf_low, 0)        as perf_low
        , coalesce(perf.perf_high, 0)       as perf_high
        , coalesce(perf.perf_gray, 0)       as perf_gray
    from all_metrics nm
    left join performance perf
        on nm.mdm_employee_rk = perf.mdm_employee_rk and perf.calendar_dt = nm.report_month--::date
        and nm.last_row_flg = 1

    distributed by (mdm_employee_rk, report_month);


    select * from all_metrics_with_performance_added limit 100;
  isEnabled: true
- sid: 3cdadcff-7864-5ac7-b0d8-72a3bdf84509
  title: with_office_traffic
  shebang: gp
  code: |-
    -- =============================================================================
    -- TeamPulse Hub
    -- добавлены города посещений для статистики посещений (Адель, 23.10): бронирования, нарушения
    -- бронирования и посещения по городам. С поставки 66 — в отчёте: «hub · 3» (ряды бронирований),
    -- «hub · 4» (города последнего месяца)
    -- ======================================================================
    drop table if exists all_metrics_with_performance_and_office_traffic ;
    create table all_metrics_with_performance_and_office_traffic as

    with base as (
        select date_trunc('month', calendar_dt) as month
            , mdm_employee_rk
            , calendar_dt
            , work_day_flg
            , coalesce(office_visit_flg, 0)      as office_visit_flg
            , coalesce(booking_flg, 0)           as booking_flg
            , coalesce(booking_violation_flg, 0) as booking_violation_flg --бронь без посещения
            , coalesce(visit_violation_flg, 0)   as visit_violation_flg   --посещение без брони
            , office_city_nm
        from usr_cross_data.office_traffic_attendance
        where work_day_flg = 1
    )
    -- общие метрики за месяц
    , office_traffic as (
        select month
            , mdm_employee_rk
            , count(work_day_flg)        as work_day_amt
            , sum(office_visit_flg)      as office_visit_amt
            , sum(booking_flg)           as booking_amt
            , sum(booking_violation_flg) as booking_viol_amt
            , sum(visit_violation_flg)   as visit_viol_amt
        from base
        group by month, mdm_employee_rk
    )
    -- посещения в разрезе городов
    , city_visits as (
        select month
            , mdm_employee_rk
            , office_city_nm
            , sum(office_visit_flg) as visit_count
        from base
        where office_city_nm is not null
        group by month, mdm_employee_rk, office_city_nm
        having sum(office_visit_flg) > 0
    )
    -- сворачиваем в json
    , city_json as (
        select month
            , mdm_employee_rk
            , json_agg(
                  json_build_object(
                      'office_city_nm', office_city_nm,
                      'visit_count',    visit_count
                  )
                  order by visit_count desc, office_city_nm
              ) as office_city_visits_json
        from city_visits
        group by month, mdm_employee_rk
    )

    select m.*
        , o.work_day_amt
        , o.office_visit_amt
        , o.booking_amt
        , o.booking_viol_amt
        , o.visit_viol_amt
        , c.office_city_visits_json
    from all_metrics_with_performance_added m
    left join office_traffic o
        on o.month = m.report_month
        and o.mdm_employee_rk = m.mdm_employee_rk
        and m.last_row_flg = 1
    left join city_json c
        on  c.month           = m.report_month
        and c.mdm_employee_rk = m.mdm_employee_rk
        and m.last_row_flg    = 1

    distributed by (mdm_employee_rk, report_month)
    ;
  isEnabled: true
- sid: 62af96fd-c837-5418-b407-9a9f8e22d9af
  title: office_traffic
  shebang: gp
  code: |-
    -- =============================================================================
    -- TeamPulse Hub
    -- календарь посещений на последние 2 месяца (Адель, 23.10; поставка 66 — исправлен и дополнен)
    -- юнит × день × срез отчёта: людей с рабочим днём (cnt_work_day) и из них в офисе (cnt_office_visit);
    -- посещаемость дня = cnt_office_visit / cnt_work_day. За месяц сумма — те же рабочие дни и посещения, что
    -- у with_office_traffic (проверка в «hub checks»). В отчёт календарь раскладывает по узлам «hub · 4».
    -- Поставка 66, к версии 23.10:
    --   - date_trunck → date_trunc, запятая после cnt_work_day;
    --   - без условия office_visit_flg = 1: с ним в таблице только дни в офисе, и cnt_work_day = cnt_office_visit —
    --     посещаемость дня всегда 100%;
    --   - человек — одной строкой месяца (last_row_flg = 1, как у посещений в with_office_traffic): у перешедшего
    --     в месяце строк несколько, и его дни считались в каждой;
    --   - срезы отчёта (покраска, IT-код, тип оформления, тип численности) и ключи уровней — по ним отчёт
    --     фильтрует календарь и раскладывает его по узлам;
    --   - два месяца — последний месяц all_metrics и прошлый (первое условие — отсечение партиций по дате).
    -- ======================================================================
    drop table if exists office_traffic_calendar ;
    create table office_traffic_calendar as

    with calendar as (
    select calendar_dt::date as calendar_dt
            , date_trunc('month', calendar_dt)::date as report_month
            , mdm_employee_rk
            --, office_city_nm
            , coalesce(region_visit_flg, 0) as region_visit_flg
            , coalesce(office_visit_flg, 0) as office_visit_flg
            , day_short_nm
            , day_sort
        from usr_cross_data.office_traffic_attendance
        where calendar_dt >= date_trunc('month', current_date - interval '3 month')
        and calendar_dt >= (select max(report_month)::date - interval '1 month' from all_metrics)
        and work_day_flg = 1
    )

    select c.report_month,
        c.calendar_dt,
        am.mng_unit_rk,
        am.leaf_lvl
        , am.lvl1_rk
        , am.lvl2_rk
        , am.lvl3_rk
        , am.lvl4_rk
        , am.lvl5_rk
        , am.lvl6_rk
        , am.lvl7_rk
        , am.lvl8_rk
        , am.lvl9_rk
        , am.lvl10_rk
        , am.lvl11_rk
        , am.lvl1_nm
        , am.lvl2_nm
        , am.lvl3_nm
        , am.lvl4_nm
        , am.lvl5_nm
        , am.lvl6_nm
        , am.lvl7_nm
        , am.lvl8_nm
        , am.lvl9_nm
        , am.lvl10_nm
        , am.lvl11_nm
        , am.paint_cd
        , am.emp_specialization_it_code
        , am.employment_relation_type
        , am.act_type_nm
        , count(*) as cnt_work_day
        , sum(c.office_visit_flg) as cnt_office_visit
        , sum(c.region_visit_flg) as cnt_region_visit
        , max(c.day_sort) as day_sort
        , max(c.day_short_nm) as day_short_nm

    from all_metrics am
    join calendar c on am.mdm_employee_rk = c.mdm_employee_rk and am.report_month = c.report_month
    where am.last_row_flg = 1
    group by c.report_month,
        c.calendar_dt,
        am.mng_unit_rk,
        am.leaf_lvl,
        am.lvl1_rk, am.lvl2_rk, am.lvl3_rk, am.lvl4_rk, am.lvl5_rk, am.lvl6_rk, am.lvl7_rk, am.lvl8_rk, am.lvl9_rk, am.lvl10_rk, am.lvl11_rk,
        am.lvl1_nm, am.lvl2_nm, am.lvl3_nm, am.lvl4_nm, am.lvl5_nm, am.lvl6_nm, am.lvl7_nm, am.lvl8_nm, am.lvl9_nm, am.lvl10_nm, am.lvl11_nm,
        am.paint_cd, am.emp_specialization_it_code, am.employment_relation_type, am.act_type_nm

    distributed by (mng_unit_rk);

    analyze office_traffic_calendar;
  isEnabled: true
- sid: 03cfb5b5-e6dc-5721-81b5-100b00ebe352
  title: with_TRost
  shebang: gp
  code: |-
    drop table if exists all_metrics_with_performance_and_office_traffic_and_grt ;
    create table all_metrics_with_performance_and_office_traffic_and_grt as


    with grt_application as (
        SELECT
            ap.mdm_employee_application_rk as mdm_employee_rk,
            date_trunc('month', ap.create_dttm) as month,
            ap.create_dttm,
            ap.current_grade_num,
            ap.required_grade_num,
            ap.head_approve_flg,
            ap.mdm_employee_appl_status_cd,
            mdm_employee_appl_status_desc,
            case when ap.mdm_employee_appl_status_cd in ('FNS') then 1 else 0 end as is_approved,
            case when ap.mdm_employee_appl_status_cd in ('DCL') then 1 else 0 end as is_declined,
            case when ap.mdm_employee_appl_status_cd in ('CNL') then 1 else 0 end as is_cancelled,
            case when ap.mdm_employee_appl_status_cd not in ('DCL', 'FNS', 'CNL') then 1 else 0 end as is_inprogress,
            ap.deleted_flg,
            ap.valid_to_dttm
        from prod_v_dds.mdm_employee_application_grt ap
        join prod_v_dds_dic.mdm_employee_appl_status s
            on ap.mdm_employee_appl_status_cd= s.mdm_employee_appl_status_cd
        where valid_to_dttm = '5999-01-01'
            --and mdm_employee_appl_status_cd in ('FNS', 'CNL', 'DCL')
            and ap.mdm_employee_appl_status_cd not in ('DRT') -- draft
            and ap.deleted_flg = 0
    )
    , grt_month as (
        select mdm_employee_rk, month, sum(is_approved) as is_approved, sum(is_declined) as is_declined,
               sum(is_cancelled) as is_cancelled, sum(is_inprogress) as is_inprogress
        from grt_application group by mdm_employee_rk, month
    )
    select m.*
        , coalesce(o.is_approved, 0) as grt_approve_cnt
        , coalesce(o.is_declined, 0) as grt_decline_cnt
        , coalesce(o.is_cancelled, 0) as grt_cancel_cnt
        , coalesce(o.is_inprogress, 0) as grt_inprogress_cnt
    from all_metrics_with_performance_and_office_traffic m
    left join grt_month o
        on o.month = m.report_month
        and o.mdm_employee_rk = m.mdm_employee_rk
        and m.last_row_flg = 1

    distributed by (mdm_employee_rk, report_month)
    ;

    select * from all_metrics_with_performance_and_office_traffic_and_grt
    limit 100;

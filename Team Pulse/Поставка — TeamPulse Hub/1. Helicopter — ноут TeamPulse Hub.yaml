- sid: 5e2217cd-b6d6-523b-8121-3620b5197f66
  title: _PARAMS_
  shebang: python
  code: |-
    # =============================================================================
    # Блок 1 — конфигурация
    # =============================================================================

    UNIT_NA = '-'          # заглушка отсутствующего юнита
    DIM_SRC = 'eom'        # 'eom' — измерения на конец месяца, 'day' — по дням

    # ── измерения с фиксированной трансформацией ────────────────────────────────
    FIXED_DIMS = [
        # «Активная» — тип численности «Активная», подрядчики в неё не входят (22.10, поставка 61; в TP 2.0 —
        # Активная + Подрядчики). Тип численности целиком — колонка act_type_nm (HUB_FIELDS): по ней фильтр отчёта,
        # «Активная» — выбор по умолчанию, подрядчиков и другие типы добавляют в фильтре
        {'alias': 'active_type_gr_nm',
         'cols': ['active_type_nm'],
         'expr': "CASE WHEN active_type_nm = 'Активная' "
                 "THEN 'Активная' ELSE 'Прочие' END"},
        # IT-код — как в источнике: IT, Digital, NonIT — три разные покраски, не сводятся
        {'alias': 'emp_specialization_it_code',
         'cols': ['emp_specialization_it_code'],
         'expr': "coalesce(emp_specialization_it_code::text, '-')"},
        {'alias': 'employment_relation_type_gr_nm',
         'cols': ['employment_relation_type_desc'],
         'expr': "CASE WHEN employment_relation_type_desc = 'Штатный сотрудник' "
                 "THEN 'штат' ELSE 'не штат' END"},
    ]

    # ── найм ────────────────────────────────────────────────────────────────────
    HIRE_PARAMS = {
        'cols': ['hire_flg', 'transfer_candidate_flg', 'transfer_internal_flg'],
        'active_dim': 'active_type_gr_nm',   # ссылка на FIXED_DIMS, не на сырую колонку
        'active_value': 'Активная',          # значение после трансформации
    }

    # ── отток ───────────────────────────────────────────────────────────────────
    OUTFLOW_PARAMS = {
        'cols': ['fire_flg', 'regrettable_fire_flg'],
    }

    # ── переводы ────────────────────────────────────────────────────────────────
    TRANSFER_PARAMS = {
        # детектор события: флаги источника
        'use_lvl_flag':  True,          # lvlN_mngt_unit_in/out_trsf_flg
        'use_type_flag': True,          # transfer_to_* / transfer_out_*
        'type_in_flags': [
            'transfer_to_active_type_flg', 'transfer_to_hq_flg',
            'transfer_to_it_flg', 'transfer_to_specialization_flg',
            'transfer_to_stream_flg', 'transfer_to_employment_relation_type_flg',
        ],
        'type_out_flags': [
            'transfer_out_active_type_flg', 'transfer_out_hq_flg',
            'transfer_out_it_flg', 'transfer_out_specialization_flg',
            'transfer_out_stream_flg', 'transfer_out_employment_relation_type_flg',
        ],
        # уровень перевода: сравнение путей юнитов
        'use_unit_path': True,          # out только если старый юнит реальный и сменился
        'type_flag_lvl': 1,             # неюнитовый перевод виден на всех уровнях
        'unit_only': False,             # True — игнорировать type-флаги без смены юнита
        # исключения
        'exclude_candidate': True,
        'exclude_internal':  True,
        'exclude_hire':      True,
        'exclude_fire':      True,
        # имена колонок результата
        'in_metric':  'transfer_in_amt',
        'out_metric': 'transfer_out_amt',
        'in_lvl_col':  'transfer_in_lvl',
        'out_lvl_col': 'transfer_out_lvl',
    }
  isEnabled: true
- sid: 2cad4933-7279-569b-ae47-d90d35a90a1b
  title: build_all_metrics
  shebang: python
  code: |-
    # =============================================================================
    # Блок 2 — build_all_metrics
    #   юнит          — по дням (разрывает строки: уход и приход видны раздельно)
    #   измерения     — на конец месяца (не дробят строки при смене стажа/грейда)
    #   события       — по дням, max() за месяц
    #   hc            — только последний день месяца
    #   уровень перевода — сравнение пути юнитов с соседним снимком
    #   результат     — один mng_unit_rk (лист) + полная цепочка lvl1_nm..lvlN_nm
    # =============================================================================
    from dal_client import query as dal
    import re as _re
    _IDENT_RE = _re.compile(r'^[A-Za-z_][A-Za-z0-9_$]*$')
    _W_EOM = ("PARTITION BY date_trunc('month', calendar_dt), mdm_employee_rk "
              "ORDER BY calendar_dt::date DESC")
    _W_HIST = "PARTITION BY mdm_employee_rk ORDER BY calendar_dt"

    def _ident(n: str) -> str:
        if not _IDENT_RE.match(n):
            raise ValueError(f'bad ident: {n!r}')
        return n

    def _qualified(t: str) -> str:
        return '.'.join(_ident(p) for p in t.split('.'))

    def _lit(v) -> str:
        return "'" + str(v).replace("'", "''") + "'"

    def _in_list(vals) -> str:
        return ', '.join(_lit(v) for v in vals)

    def _source_cols(table: str) -> set:
        parts = table.split('.')
        tbl = _ident(parts[-1])
        sch = (f"table_schema = '{_ident(parts[0])}'" if len(parts) == 2
               else "table_schema not in ('pg_catalog','information_schema','pg_toast')")
        df = dal.get_df(datasource='gp', query=f"""
            select column_name from information_schema.columns
            where {sch} and table_name = '{tbl}'""")
        if df.empty:
            raise ValueError(f'table {table!r} not found')
        return {c.lower() for c in df['column_name']}

    def _flg(col: str) -> str:
        """'0'/'1'/'-'/NULL → int 0/1 без каста в numeric."""
        return f"(coalesce({col}::text,'0') = '1')::int"

    def _unit(i: int) -> str:
        return f"coalesce(lvl{i}_mapped_management_unit_rk::text,{_lit(UNIT_NA)})"

    def _lvl_ladder(levels, cur: str, other: str) -> str:
        """Самый верхний уровень, где cur — реальный юнит и отличается от other."""
        whens = ' '.join(
            f"WHEN {cur}[{pos}] <> {_lit(UNIT_NA)} AND {other}[{pos}] IS NOT NULL "
            f"AND {cur}[{pos}] <> {other}[{pos}] THEN {n}"
            for pos, n in enumerate(levels, start=1))
        return f'CASE {whens} END'

    # ─────────────────────────────────────────────────────────────────────────────
    def build_all_metrics(
        res_table_name: str,
        source_table: str = 'usr_cross_data.hr_executive_proteus',
        fields=None,
        date_from: str | None = None,
        n_levels: int = 11,
        hire: bool = True,
        outflow: bool = True,
        transfers: bool = True,
        transfer_params: dict | None = None,
        where: str = '',
        distributed_by=None,
        debug: bool = False,
    ):
        source_table = _qualified(source_table)
        res_table_name = _qualified(res_table_name)
        src = _source_cols(source_table)
        has = lambda c: bool(c) and c.lower() in src
        date_from = date_from or \
            "date_trunc('year', (current_date - interval '1 year')::date)"
        tp = {**TRANSFER_PARAMS, **(transfer_params or {})}
        hp, op = HIRE_PARAMS, OUTFLOW_PARAMS
        levels = [i for i in range(1, n_levels + 1)
                  if has(f'lvl{i}_mapped_management_unit_rk')]
        if not levels:
            raise ValueError('no lvlN_mapped_management_unit_rk columns')

        snap, nm_agg, events = [], [], []
        id_keys  = ['report_month', 'mdm_employee_rk']   # идентификация
        unit_keys = ['mng_unit_rk', 'leaf_lvl']          # цепочка (ключевая часть)
        dim_keys  = []                                   # разрезы

        snap.append("date_trunc('month', calendar_dt)::date AS report_month")
        snap.append('mdm_employee_rk')

        # ── юниты: по дням (rk нужны только для вычисления листа и имён) ────────
        for i in levels:
            snap.append(f'{_unit(i)} AS lvl{i}_rk')
            if has(f'lvl{i}_mapped_management_unit_nm'):
                snap.append(f"coalesce(lvl{i}_mapped_management_unit_nm::text,"
                            f"{_lit(UNIT_NA)}) AS lvl{i}_nm")
                nm_agg.append(f'max(lvl{i}_nm) AS lvl{i}_nm')
                nm_agg.append(f'max(lvl{i}_rk) AS lvl{i}_rk')

        # ── измерения: на конец месяца ──────────────────────────────────────────
        def add_dim(expr: str, alias: str):
            snap.append(f'first_value({expr}) OVER w_eom AS {alias}'
                        if DIM_SRC == 'eom' else f'{expr} AS {alias}')
            dim_keys.append(alias)

        for d_ in FIXED_DIMS:
            if d_['alias'] in dim_keys:
                continue                       # первый подходящий вариант уже взят
            if all(has(c) for c in d_['cols']):
                add_dim(d_['expr'], _ident(d_['alias']))
                print(f"[INFO] {d_['alias']}: по {d_['cols']}")
            else:
                print(f"[INFO] {d_['alias']}: нет колонок {d_['cols']} — следующий вариант")

        for f in (fields or []):
            if isinstance(f, str):
                f = {'name': f}
            name, alias = f['name'], _ident(f.get('alias') or f['name'])
            if not has(name):
                print(f'[WARN] {name} нет в источнике, пропущен'); continue
            if alias in id_keys + unit_keys + dim_keys:
                print(f'[SKIP] {alias} уже в ключах'); continue
            if 'match' in f:
                vals = f['match'] if isinstance(f['match'], (list, tuple, set)) else [f['match']]
                expr = (f'CASE WHEN {name} IN ({_in_list(vals)}) '
                        f"THEN {_lit(f['match_label'])} ELSE {_lit(f['other_label'])} END")
            else:
                expr = f'coalesce({name}::text,{_lit(UNIT_NA)})'
            add_dim(expr, alias)

        # ── флаги событий: по дням ──────────────────────────────────────────────
        if hire:
            for c in ('hire_flg', 'transfer_candidate_flg', 'transfer_internal_flg'):
                if has(c):
                    snap.append(f'{_flg(c)} AS {c}')
                    events.append(c)
        if outflow:
            for c in ('fire_flg', 'regrettable_fire_flg', 'non_regrettable_fire_flg'):
                if has(c):
                    snap.append(f'{_flg(c)} AS {c}')
            if has('fire_flg'):
                events.append('fire_flg')

        # ── переводы: детектор события + путь юнитов ────────────────────────────
        if transfers:
            for kind, flag_key in (('in', 'type_in_flags'), ('out', 'type_out_flags')):
                lvl_parts, type_parts = [], []
                if tp.get('use_lvl_flag', True):
                    lvl_parts = [f"coalesce(lvl{i}_mngt_unit_{kind}_trsf_flg::text,'0')='1'"
                                 for i in levels
                                 if has(f'lvl{i}_mngt_unit_{kind}_trsf_flg')]
                if tp.get('use_type_flag', True):
                    type_parts = [f"coalesce({c}::text,'0')='1'"
                                  for c in tp.get(flag_key, []) if has(c)]
                if lvl_parts:
                    snap.append(f"({' OR '.join(lvl_parts)})::int AS {kind}_unit_evt")
                if type_parts:
                    snap.append(f"({' OR '.join(type_parts)})::int AS {kind}_type_evt")
            arr = 'ARRAY[' + ', '.join(_unit(i) for i in levels) + ']'
            snap.append(f'{arr} AS path_cur')
            snap.append(f'lag({arr}) OVER w_hist  AS path_prev')
            snap.append(f'lead({arr}) OVER w_hist AS path_next')
        snap.append('row_number() OVER w_eom AS rn')
        snap.append("(calendar_dt::date = least((date_trunc('month', calendar_dt) + interval '1 month' - interval '1 day')::date, "
                    f"(SELECT max(calendar_dt)::date FROM {source_table}))"
                    + (" AND coalesce(fire_flg::text,'0') <> '1'" if has('fire_flg') else '') + ')::int AS eom_flg')

        # ── CTE d: leaf_lvl, mng_unit_rk, уровни переводов, исключения ──────────
        leaf = ' '.join(f"WHEN lvl{i}_rk <> {_lit(UNIT_NA)} THEN {i}"
                        for i in reversed(levels))
        pick = ' '.join(f"WHEN lvl{i}_rk <> {_lit(UNIT_NA)} THEN lvl{i}_rk"
                        for i in reversed(levels))
        d = [f'CASE {pick} ELSE lvl{levels[0]}_rk END AS mng_unit_rk',
             f'CASE {leaf} ELSE {levels[0]} END AS leaf_lvl']
        if transfers:
            excl = {
                'in': [f'{c} = 0' for c, k in (
                    ('transfer_candidate_flg', 'exclude_candidate'),
                    ('transfer_internal_flg', 'exclude_internal'),
                    ('hire_flg', 'exclude_hire')) if tp.get(k, True) and has(c)],
                'out': [f'{c} = 0' for c, k in (('fire_flg', 'exclude_fire'),)
                        if tp.get(k, True) and has(c)],
            }
            for kind in ('in', 'out'):
                other = 'path_prev' if kind == 'in' else 'path_next'
                unit_lvl = (_lvl_ladder(levels, 'path_cur', other)
                            if tp.get('use_unit_path', True) else 'NULL::int')
                src_parts = [f'CASE WHEN {kind}_unit_evt = 1 THEN {unit_lvl} END']
                if not tp.get('unit_only', False):
                    src_parts.append(
                        f"CASE WHEN {kind}_type_evt = 1 THEN {tp.get('type_flag_lvl', 1)} END")
                lvl_expr = f"least({', '.join(src_parts)})" if len(src_parts) > 1 \
                    else src_parts[0]
                guard = ' AND '.join(excl[kind]) if excl[kind] else None
                if guard:
                    lvl_expr = f'CASE WHEN {guard} THEN {lvl_expr} END'
                d.append(f'({lvl_expr}) AS {kind}_lvl')
                events.append(f'({kind}_lvl IS NOT NULL)::int')

        # ── метрики ─────────────────────────────────────────────────────────────
        m = ['max((rn = 1 AND eom_flg = 1)::int) AS hc_total_cnt', 'max((rn = 1)::int) AS last_row_flg']
        if 'active_type_gr_nm' in dim_keys:
            m.append("max((rn = 1 AND eom_flg = 1 AND active_type_gr_nm = 'Активная')::int) "
                     'AS hc_active_cnt')
        if hire:
            adim = hp.get('active_dim')
            aval = hp.get('active_value')
            if has('hire_flg'):
                if adim and adim in dim_keys and aval:
                    m.append(f"max((hire_flg = 1 AND {adim} = {_lit(aval)})::int) "
                             f"AS hire_amt")
                else:
                    m.append('max(hire_flg) AS hire_amt')
                # TeamPulse Hub (20.10): найм в компанию с любым типом активности — найм «всей
                # численности» (hire_amt — только активные на конец месяца)
                m.append('max(hire_flg) AS hire_cnt')
            if has('transfer_candidate_flg'):
                m.append('max(transfer_candidate_flg) AS transfer_candidate_amt')
            if has('transfer_internal_flg'):
                m.append('max(transfer_internal_flg) AS transfer_internal_amt')
        if outflow and has('fire_flg'):
            m.append('max(fire_flg) AS fire_amt')
            if has('regrettable_fire_flg'):
                m.append('max((fire_flg = 1 AND regrettable_fire_flg = 1)::int) '
                         'AS regret_fire_amt')
            if has('non_regrettable_fire_flg'):
                m.append('max((fire_flg = 1 AND non_regrettable_fire_flg = 1)::int) '
                         'AS non_regret_fire_amt')
        if transfers:
            for kind, mk, lk, ek in (('in',  'in_metric',  'in_lvl_col',  'emit_in_lvl'),
                                     ('out', 'out_metric', 'out_lvl_col', 'emit_out_lvl')):
                m.append(f'max(({kind}_lvl IS NOT NULL)::int) AS {tp[mk]}')
                if tp.get(ek, True):
                    m.append(f'coalesce(min({kind}_lvl), 0) AS {tp[lk]}')

        having = f'HAVING max({" + ".join(["(rn = 1)::int"] + events)}) > 0'

        # ── порядок вывода: id → цепочка → разрезы → метрики ────────────────────
        group_keys  = id_keys + unit_keys + dim_keys
        select_cols = id_keys + unit_keys + nm_agg + dim_keys + m

        sql = f"""
    WITH snap AS (
        SELECT
            {(',' + chr(10) + '        ').join(snap)}
        FROM {source_table}
        WHERE calendar_dt::date >= {date_from}
          {f'AND ({where})' if where else ''}
        WINDOW w_eom  AS ({_W_EOM}),
               w_hist AS ({_W_HIST})
    ),
    d AS (
        SELECT
            {(',' + chr(10) + '        ').join(['s.*'] + d)}
        FROM snap s
    )
    SELECT
        {(',' + chr(10) + '    ').join(select_cols)}
    FROM d
    GROUP BY {', '.join(group_keys)}
    {having}"""
        print(f'[INFO] levels={len(levels)} group_keys={len(group_keys)} '
              f'dims={len(dim_keys)} metrics={len(m)} nm={len(nm_agg)}')
        if debug:
            print(sql)
            return sql
        dist = (f"distributed by ({', '.join(_ident(c) for c in distributed_by)})"
                if distributed_by else 'distributed randomly')
        dal.get_df(datasource='gp', query=f'drop table if exists {res_table_name}')
        dal.get_df(datasource='gp',
                   query=f'create table {res_table_name} as\n{sql}\n{dist}')
        dal.get_df(datasource='gp', query=f'analyze {res_table_name}')
        cnt = dal.get_df(datasource='gp',
                         query=f'select count(*) as cnt from {res_table_name}')['cnt'].iloc[0]
        print(f'[OK] {res_table_name}: {cnt} rows')
  isEnabled: true

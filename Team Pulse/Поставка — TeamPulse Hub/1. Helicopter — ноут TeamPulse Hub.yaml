- sid: 73fc1edc-5832-5f4c-9699-2c32a24d75af
  title: hub · 3 справочник и ряды
  shebang: gp
  code: |-
    -- =============================================================================
    -- TeamPulse Hub · 3. Справочник узлов и ряды (поставка 58: SQL вместо build_hub)
    -- teampulse_hub_unit — узлы: родитель, уровень, имя, число подразделений, путь, логин руководителя;
    -- teampulse_hub_series — узел × месяц × срез: численность, ССЧ, найм, увольнения, переводы и др.
    -- =============================================================================

    -- 5. справочник узлов: + число подразделений и логин руководителя (teampulse_hub_head — параграф «hub · 2»)
    drop table if exists teampulse_hub_unit;
    create table teampulse_hub_unit as
    select n.rk as unit_rk, n.prk as parent_rk, n.lv as unit_lvl, n.nm as unit_nm,
           coalesce(k.kids, 0)::int as kids_cnt, n.pth as path_rk, coalesce(h.head_login, '') as head_login
    from teampulse_hub_node n
    left join (select prk, count(*) as kids from teampulse_hub_node where prk <> '' group by prk) k on k.prk = n.rk
    left join teampulse_hub_head h on h.unit_rk = n.rk
    distributed by (unit_rk);

    -- 6. строки источника → узлы нынешней структуры, все месяцы одним запросом. Перевод входит в узел
    --    глубины d, если сменился уровень ≤ d (через границу узла). Тип численности: «Активная» — по флагу
    --    источника на конец месяца, остальные — «Прочие»
    drop table if exists teampulse_hub_sx;
    create table teampulse_hub_sx as
    select node_rk, report_month::date as report_month, paint_c, it_c, staff_c, act_c,
           sum(coalesce(e.hc_total_cnt, 0)) as hc, sum(coalesce(e.hc_active_cnt, 0)) as act,
           -- найм по методологии DD: найм в компанию + перевод из учебной группы в боевую + стажёров в
           -- штат; одно событие на человека в строке
           sum(greatest(coalesce(e.hire_amt, 0), coalesce(e.transfer_candidate_amt, 0), coalesce(e.transfer_internal_amt, 0))) as hire,
           -- найм в компанию с любым типом активности — найм «всей численности»
           sum(coalesce(e.hire_cnt, 0)) as hco,
           sum(coalesce(e.fire_amt, 0)) as fire, sum(coalesce(e.regret_fire_amt, 0)) as reg,
           sum(coalesce(e.non_regret_fire_amt, 0)) as nreg,
           sum(case when coalesce(e.transfer_in_lvl, 0) between 1 and d then coalesce(e.transfer_in_amt, 0) else 0 end) as tin,
           sum(case when coalesce(e.transfer_out_lvl, 0) between 1 and d then coalesce(e.transfer_out_amt, 0) else 0 end) as tout,
           sum(coalesce(e.perf_normal, 0)) as pnor, sum(coalesce(e.perf_low, 0)) as plow,
           sum(coalesce(e.perf_high, 0)) as phig, sum(coalesce(e.perf_gray, 0)) as pgry,
           sum(coalesce(e.work_day_amt, 0)) as wday, sum(coalesce(e.office_visit_amt, 0)) as ovis,
           sum(coalesce(e.grt_approve_cnt, 0)) as gapr, sum(coalesce(e.grt_decline_cnt, 0)) as gdec
    from (
        select x.*, unnest(string_to_array(x.cp, '|')) as node_rk,
               generate_subscripts(string_to_array(x.cp, '|'), 1) - (select mo from teampulse_hub_cal) as d
        from (
            select s.report_month, s.hc_total_cnt, s.hc_active_cnt, s.hire_amt, s.transfer_candidate_amt,
                   s.transfer_internal_amt, s.hire_cnt, s.fire_amt, s.regret_fire_amt, s.non_regret_fire_amt,
                   s.transfer_in_lvl, s.transfer_in_amt, s.transfer_out_lvl, s.transfer_out_amt, s.perf_normal,
                   s.perf_low, s.perf_high, s.perf_gray, s.work_day_amt, s.office_visit_amt, s.grt_approve_cnt,
                   s.grt_decline_cnt,
                   (select pre from teampulse_hub_cal) || coalesce(u.cp,
                       array_to_string((ARRAY[s.lvl1_rk::text, s.lvl2_rk::text, s.lvl3_rk::text, s.lvl4_rk::text,
                                          s.lvl5_rk::text, s.lvl6_rk::text, s.lvl7_rk::text, s.lvl8_rk::text,
                                          s.lvl9_rk::text, s.lvl10_rk::text, s.lvl11_rk::text])[1:s.leaf_lvl], '|')) as cp,
                   coalesce(nullif(s.paint_cd::text, ''), '-') AS paint_c, coalesce(nullif(s.emp_specialization_it_code::text, ''), '-') AS it_c,
                   case when s.employment_relation_type = 'Штатный сотрудник' then 'Штат' else 'Не штат' end as staff_c,
                   case when s.active_type_gr_nm = 'Активная' then 'Активная' else 'Прочие' end as act_c
            from all_metrics_with_performance_and_office_traffic_and_grt s
            left join teampulse_hub_upath u on u.unit_rk = s.mng_unit_rk::text
            where s.leaf_lvl > 0
        ) x
    ) e
    group by 1, 2, 3, 4, 5, 6
    distributed by (node_rk);

    -- 7. ССЧ = (численность месяца + прошлого) / 2 по узлу и срезу: строка и там, где людей среза в узле
    --    в этом месяце уже нет, а в прошлом были. Первый месяц — без лага
    drop table if exists teampulse_hub_series;
    create table teampulse_hub_series as
    with k as (
        select node_rk, report_month, paint_c, it_c, staff_c, act_c from teampulse_hub_sx
        union
        select node_rk, (report_month + interval '1 month')::date, paint_c, it_c, staff_c, act_c from teampulse_hub_sx
        where report_month < (select max(report_month) from teampulse_hub_sx)
    )
    select k.node_rk, k.report_month, k.paint_c as paint_cd, k.it_c as it_cd, k.staff_c as staff_cd,
           k.act_c as act_cd,
           coalesce(c.hc, 0) as hc_cnt, coalesce(c.act, 0) as act_cnt,
           (coalesce(c.hc, 0) + case when k.report_month = (select min(report_month) from teampulse_hub_sx)
                                     then coalesce(c.hc, 0) else coalesce(pv.hc, 0) end) / 2.0 as avg_cnt,
           coalesce(c.hire, 0) as hire_cnt, coalesce(c.hco, 0) as hco_cnt,
           coalesce(c.fire, 0) as fire_cnt, coalesce(c.reg, 0) as reg_cnt, coalesce(c.nreg, 0) as nreg_cnt,
           coalesce(c.tin, 0) as tin_cnt, coalesce(c.tout, 0) as tout_cnt,
           coalesce(c.pnor, 0) as pnor_cnt, coalesce(c.plow, 0) as plow_cnt,
           coalesce(c.phig, 0) as phig_cnt, coalesce(c.pgry, 0) as pgry_cnt,
           coalesce(c.wday, 0) as wday_amt, coalesce(c.ovis, 0) as ovis_amt,
           coalesce(c.gapr, 0) as gapr_cnt, coalesce(c.gdec, 0) as gdec_cnt
    from k
    left join teampulse_hub_sx c
           on c.node_rk = k.node_rk and c.paint_c = k.paint_c and c.it_c = k.it_c and c.staff_c = k.staff_c and
           c.act_c = k.act_c
          and c.report_month = k.report_month
    left join teampulse_hub_sx pv
           on pv.node_rk = k.node_rk and pv.paint_c = k.paint_c and pv.it_c = k.it_c and
           pv.staff_c = k.staff_c and pv.act_c = k.act_c
          and pv.report_month = (k.report_month - interval '1 month')::date
    distributed by (node_rk);
    drop table if exists teampulse_hub_sx;

    select (select count(*) from teampulse_hub_unit) as unit_rows, (select count(*) from teampulse_hub_series) as series_rows;
  isEnabled: true
- sid: cd26aa42-d99b-5813-8635-a541e08b2c45
  title: hub · 4 разрезы
  shebang: gp
  code: |-
    -- =============================================================================
    -- TeamPulse Hub · 4. Разрезы (поставка 58: SQL вместо build_hub)
    -- teampulse_hub_mix — узел × срез × разрез × значение: численность последнего месяца по атрибутам
    -- (g a t gr s c o w r sp tc), увольнения с начала его года (xr причина, xq regret по причине, xi
    -- инициатива, xp причина|инициатива, xt стаж, xg грейд, xs стрим, xsp специализация, xtc тип компании),
    -- найм с начала года (hk источник, hch канал, hg грейд, hsp специализация). Пустое значение — ''.
    -- =============================================================================

    -- численность последнего месяца
    drop table if exists teampulse_hub_mixr;
    create table teampulse_hub_mixr as
    select e.node_rk, e.paint_c, e.it_c, e.staff_c, e.act_c,
           unnest(ARRAY['g', 'a', 't', 'gr', 's', 'c', 'o', 'w', 'r', 'sp', 'tc']) as mx_key,
           unnest(ARRAY[coalesce(nullif(translate(e.gender::text, E'\t\n|', '  /'), '-'), ''),
                        coalesce(nullif(translate(e.type_age::text, E'\t\n|', '  /'), '-'), ''),
                        coalesce(nullif(translate(e.experience_group_nm::text, E'\t\n|', '  /'), '-'), ''),
                        coalesce(nullif(translate(e.grade::text, E'\t\n|', '  /'), '-'), ''),
                        coalesce(nullif(translate(e.seniority::text, E'\t\n|', '  /'), '-'), ''),
                        coalesce(nullif(translate(e.employee_contract_type::text, E'\t\n|', '  /'), '-'), ''),
                        coalesce(nullif(translate(e.legal_organization::text, E'\t\n|', '  /'), '-'), ''),
                        coalesce(nullif(translate(e.employee_stream::text, E'\t\n|', '  /'), '-'), ''),
                        coalesce(nullif(translate(e.employment_relation_type::text, E'\t\n|', '  /'), '-'), ''),
                        coalesce(nullif(translate(e.specialization::text, E'\t\n|', '  /'), '-'), ''),
                        coalesce(nullif(translate(e.type_company::text, E'\t\n|', '  /'), '-'), '')]) as mx_val,
           coalesce(e.hc_total_cnt, 0) as mx_n
    from (
        select x.*, unnest(string_to_array(x.cp, '|')) as node_rk,
               generate_subscripts(string_to_array(x.cp, '|'), 1) - (select mo from teampulse_hub_cal) as d
        from (
            select s.hc_total_cnt, s.gender, s.type_age, s.experience_group_nm, s.grade, s.seniority,
                   s.employee_contract_type, s.legal_organization, s.employee_stream, s.employment_relation_type,
                   s.specialization, s.type_company,
                   (select pre from teampulse_hub_cal) || coalesce(u.cp,
                       array_to_string((ARRAY[s.lvl1_rk::text, s.lvl2_rk::text, s.lvl3_rk::text, s.lvl4_rk::text,
                                          s.lvl5_rk::text, s.lvl6_rk::text, s.lvl7_rk::text, s.lvl8_rk::text,
                                          s.lvl9_rk::text, s.lvl10_rk::text, s.lvl11_rk::text])[1:s.leaf_lvl], '|')) as cp,
                   coalesce(nullif(s.paint_cd::text, ''), '-') AS paint_c, coalesce(nullif(s.emp_specialization_it_code::text, ''), '-') AS it_c,
                   case when s.employment_relation_type = 'Штатный сотрудник' then 'Штат' else 'Не штат' end as staff_c,
                   case when s.active_type_gr_nm = 'Активная' then 'Активная' else 'Прочие' end as act_c
            from all_metrics_with_performance_and_office_traffic_and_grt s
            left join teampulse_hub_upath u on u.unit_rk = s.mng_unit_rk::text
            where s.leaf_lvl > 0 and s.report_month = (select lm from teampulse_hub_cal)
        ) x
    ) e
    where coalesce(e.hc_total_cnt, 0) > 0
    distributed by (node_rk);

    -- увольнения с начала года
    insert into teampulse_hub_mixr
    select e.node_rk, e.paint_c, e.it_c, e.staff_c, e.act_c,
           unnest(ARRAY['xr', 'xq', 'xi', 'xp', 'xt', 'xg', 'xs', 'xsp', 'xtc']) as mx_key,
           unnest(ARRAY[coalesce(nullif(translate(e.fire_reason_group::text, E'\t\n|', '  /'), '-'), ''),
                        coalesce(nullif(translate(e.fire_reason_group::text, E'\t\n|', '  /'), '-'), ''),
                        coalesce(nullif(translate(e.fire_initiative::text, E'\t\n|', '  /'), '-'), ''),
                        coalesce(nullif(translate(e.fire_reason_group::text, E'\t\n|', '  /'), '-'), '')
                        || '|' || coalesce(nullif(translate(e.fire_initiative::text, E'\t\n|', '  /'), '-'), ''),
                        coalesce(nullif(translate(e.experience_group_nm::text, E'\t\n|', '  /'), '-'), ''),
                        coalesce(nullif(translate(e.grade::text, E'\t\n|', '  /'), '-'), ''),
                        coalesce(nullif(translate(e.employee_stream::text, E'\t\n|', '  /'), '-'), ''),
                        coalesce(nullif(translate(e.specialization::text, E'\t\n|', '  /'), '-'), ''),
                        coalesce(nullif(translate(e.type_company::text, E'\t\n|', '  /'), '-'), '')]) as mx_val,
           unnest(ARRAY[coalesce(e.fire_amt, 0), coalesce(e.regret_fire_amt, 0), coalesce(e.fire_amt, 0),
                        coalesce(e.fire_amt, 0), coalesce(e.fire_amt, 0), coalesce(e.fire_amt, 0),
                        coalesce(e.fire_amt, 0), coalesce(e.fire_amt, 0), coalesce(e.fire_amt, 0)]) as mx_n
    from (
        select x.*, unnest(string_to_array(x.cp, '|')) as node_rk,
               generate_subscripts(string_to_array(x.cp, '|'), 1) - (select mo from teampulse_hub_cal) as d
        from (
            select s.fire_amt, s.regret_fire_amt, s.fire_reason_group, s.fire_initiative, s.experience_group_nm,
                   s.grade, s.employee_stream, s.specialization, s.type_company,
                   (select pre from teampulse_hub_cal) || coalesce(u.cp,
                       array_to_string((ARRAY[s.lvl1_rk::text, s.lvl2_rk::text, s.lvl3_rk::text, s.lvl4_rk::text,
                                          s.lvl5_rk::text, s.lvl6_rk::text, s.lvl7_rk::text, s.lvl8_rk::text,
                                          s.lvl9_rk::text, s.lvl10_rk::text, s.lvl11_rk::text])[1:s.leaf_lvl], '|')) as cp,
                   coalesce(nullif(s.paint_cd::text, ''), '-') AS paint_c, coalesce(nullif(s.emp_specialization_it_code::text, ''), '-') AS it_c,
                   case when s.employment_relation_type = 'Штатный сотрудник' then 'Штат' else 'Не штат' end as staff_c,
                   case when s.active_type_gr_nm = 'Активная' then 'Активная' else 'Прочие' end as act_c
            from all_metrics_with_performance_and_office_traffic_and_grt s
            left join teampulse_hub_upath u on u.unit_rk = s.mng_unit_rk::text
            where s.leaf_lvl > 0 and s.report_month between date_trunc('year', (select lm from teampulse_hub_cal))::date and (select lm from teampulse_hub_cal)
        ) x
    ) e
    where coalesce(e.fire_amt, 0) > 0;

    -- найм с начала года: источник, канал (найм в компанию / из учебной группы в боевую / стажёр в штат),
    -- грейд, специализация
    insert into teampulse_hub_mixr
    select e.node_rk, e.paint_c, e.it_c, e.staff_c, e.act_c,
           unnest(ARRAY['hk', 'hch', 'hg', 'hsp']) as mx_key,
           unnest(ARRAY[coalesce(nullif(translate(e.source_type_nm::text, E'\t\n|', '  /'), '-'), ''),
                        case when coalesce(e.hire_amt, 0) > 0 then 'Найм в компанию'
                                  when coalesce(e.transfer_candidate_amt, 0) > 0 then 'Из учебной группы в боевую' else 'Стажёр в штат' end,
                        coalesce(nullif(translate(e.grade::text, E'\t\n|', '  /'), '-'), ''),
                        coalesce(nullif(translate(e.specialization::text, E'\t\n|', '  /'), '-'), '')]) as mx_val,
           greatest(coalesce(e.hire_amt, 0), coalesce(e.transfer_candidate_amt, 0), coalesce(e.transfer_internal_amt, 0)) as mx_n
    from (
        select x.*, unnest(string_to_array(x.cp, '|')) as node_rk,
               generate_subscripts(string_to_array(x.cp, '|'), 1) - (select mo from teampulse_hub_cal) as d
        from (
            select s.hire_amt, s.transfer_candidate_amt, s.transfer_internal_amt, s.source_type_nm, s.grade,
                   s.specialization,
                   (select pre from teampulse_hub_cal) || coalesce(u.cp,
                       array_to_string((ARRAY[s.lvl1_rk::text, s.lvl2_rk::text, s.lvl3_rk::text, s.lvl4_rk::text,
                                          s.lvl5_rk::text, s.lvl6_rk::text, s.lvl7_rk::text, s.lvl8_rk::text,
                                          s.lvl9_rk::text, s.lvl10_rk::text, s.lvl11_rk::text])[1:s.leaf_lvl], '|')) as cp,
                   coalesce(nullif(s.paint_cd::text, ''), '-') AS paint_c, coalesce(nullif(s.emp_specialization_it_code::text, ''), '-') AS it_c,
                   case when s.employment_relation_type = 'Штатный сотрудник' then 'Штат' else 'Не штат' end as staff_c,
                   case when s.active_type_gr_nm = 'Активная' then 'Активная' else 'Прочие' end as act_c
            from all_metrics_with_performance_and_office_traffic_and_grt s
            left join teampulse_hub_upath u on u.unit_rk = s.mng_unit_rk::text
            where s.leaf_lvl > 0 and s.report_month between date_trunc('year', (select lm from teampulse_hub_cal))::date and (select lm from teampulse_hub_cal)
        ) x
    ) e
    where greatest(coalesce(e.hire_amt, 0), coalesce(e.transfer_candidate_amt, 0), coalesce(e.transfer_internal_amt, 0)) > 0;

    drop table if exists teampulse_hub_mix;
    create table teampulse_hub_mix as
    select node_rk, paint_c as paint_cd, it_c as it_cd, staff_c as staff_cd, act_c as act_cd,
           mx_key, mx_val, sum(mx_n) as mx_n
    from teampulse_hub_mixr
    group by 1, 2, 3, 4, 5, 6, 7
    having sum(mx_n) > 0
    distributed by (node_rk);
    drop table if exists teampulse_hub_mixr;

    select count(*) as mix_rows from teampulse_hub_mix;

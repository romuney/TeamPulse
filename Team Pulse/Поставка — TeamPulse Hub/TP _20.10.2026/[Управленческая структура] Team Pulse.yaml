    code: "\r\ndrop table if exists perevody_plus;\r\ncreate table perevody_plus as\r\n\r\nselect  date_trunc('month',calendar_dt::date )::date as month \r\n,type_flg\r\n,mngt_unit_rk\r\n,mngt_unit_nm \r\n,lvl\r\n, sum (perevody_plus) as perevody_plus\r\n   from pre_perevody_plus \r\nwhere     calendar_dt::date >=  date_trunc('month', $form_multiselect_1::date - interval '25 months')::date\r\n\r\ngroup by 1,2,3,4,5\r\n;\r\n\r\n\r\nselect * from perevody_plus where mngt_unit_nm = 'Сервис линии' ;"

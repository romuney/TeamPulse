    code: "DROP TABLE IF EXISTS izmen_pre_perevody_plus;\r\nCREATE TABLE izmen_pre_perevody_plus AS\r\n\r\n-- Все сотрудники\r\nSELECT \r\n    calendar_dt,\r\n    mdm_employee_rk,\r\n    mngt_unit_rk,\r\n    mngt_unit_nm,\r\n    lvl,\r\n    parent_mngt_unit_rk,\r\n    parent_mngt_unit_nm,\r\n    parent_lvl,\r\n    active_type_nm,\r\n    employment_relation_type_desc,\r\n    'Все сотрудники' AS type_flg,\r\n    lvl_mngt_unit_in_trsf_flg,\r\n    transfer_to_active_type_flg,\r\n    transfer_to_employment_relation_type_flg,\r\n    SUM(LEAST(lvl_mngt_unit_in_trsf_flg + transfer_to_active_type_flg, 1)) AS perevody_plus\r\nFROM izmen_plus_deet\r\nWHERE active_type_nm IN ('Активная', 'Подрядчики')\r\nGROUP BY \r\n    calendar_dt,\r\n    mdm_employee_rk,\r\n    mngt_unit_rk,\r\n    mngt_unit_nm,\r\n    lvl,\r\n    parent_mngt_unit_rk,\r\n    parent_mngt_unit_nm,\r\n    parent_lvl,\r\n    active_type_nm,\r\n    employment_relation_type_desc,\r\n    type_flg,\r\n    lvl_mngt_unit_in_trsf_flg,\r\n    transfer_to_active_type_flg,\r\n    transfer_to_employment_relation_type_flg\r\nHAVING SUM(LEAST(lvl_mngt_unit_in_trsf_flg + transfer_to_active_type_flg, 1)) = 1\r\n\r\nUNION ALL\r\n\r\n-- Штатные сотрудники\r\nSELECT \r\n    calendar_dt,\r\n    mdm_employee_rk,\r\n    mngt_unit_rk,\r\n    mngt_unit_nm,\r\n    lvl,\r\n    parent_mngt_unit_rk,\r\n    parent_mngt_unit_nm,\r\n    parent_lvl,\r\n    active_type_nm,\r\n    employment_relation_type_desc,\r\n    'Штатные сотрудники' AS type_flg,\r\n    lvl_mngt_unit_in_trsf_flg,\r\n    transfer_to_active_type_flg,\r\n    transfer_to_employment_relation_type_flg,\r\n    SUM(LEAST(lvl_mngt_unit_in_trsf_flg + transfer_to_active_type_flg + transfer_to_employment_relation_type_flg, 1)) AS perevody_plus\r\nFROM izmen_plus_deet\r\nWHERE active_type_nm IN ('Активная', 'Подрядчики')\r\n  AND employment_relation_type_desc = 'Штатный сотрудник'\r\nGROUP BY \r\n    calendar_dt,\r\n    mdm_employee_rk,\r\n    mngt_unit_rk,\r\n    mngt_unit_nm,\r\n    lvl,\r\n    parent_mngt_unit_rk,\r\n    parent_mngt_unit_nm,\r\n    parent_lvl,\r\n    active_type_nm,\r\n    employment_relation_type_desc,\r\n    type_flg,\r\n    lvl_mngt_unit_in_trsf_flg,\r\n    transfer_to_active_type_flg,\r\n    transfer_to_employment_relation_type_flg\r\nHAVING SUM(LEAST(lvl_mngt_unit_in_trsf_flg + transfer_to_active_type_flg + transfer_to_employment_relation_type_flg, 1)) = 1\r\n\r\nUNION ALL\r\n\r\n-- ГПД сотрудники\r\nSELECT \r\n    calendar_dt,\r\n    mdm_employee_rk,\r\n    mngt_unit_rk,\r\n    mngt_unit_nm,\r\n    lvl,\r\n    parent_mngt_unit_rk,\r\n    parent_mngt_unit_nm,\r\n    parent_lvl,\r\n    active_type_nm,\r\n    employment_relation_type_desc,\r\n    'ГПД сотрудники' AS type_flg,\r\n    lvl_mngt_unit_in_trsf_flg,\r\n    transfer_to_active_type_flg,\r\n    transfer_to_employment_relation_type_flg,\r\n    SUM(LEAST(lvl_mngt_unit_in_trsf_flg + transfer_to_active_type_flg + transfer_to_employment_relation_type_flg, 1)) AS perevody_plus\r\nFROM izmen_plus_deet\r\nWHERE active_type_nm IN ('Активная', 'Подрядчики')\r\n  AND employment_relation_type_desc <> 'Штатный сотрудник'\r\nGROUP BY \r\n    calendar_dt,\r\n    mdm_employee_rk,\r\n    mngt_unit_rk,\r\n    mngt_unit_nm,\r\n    lvl,\r\n    parent_mngt_unit_rk,\r\n    parent_mngt_unit_nm,\r\n    parent_lvl,\r\n    active_type_nm,\r\n    employment_relation_type_desc,\r\n    type_flg,\r\n    lvl_mngt_unit_in_trsf_flg,\r\n    transfer_to_active_type_flg,\r\n    transfer_to_employment_relation_type_flg\r\nHAVING SUM(LEAST(lvl_mngt_unit_in_trsf_flg + transfer_to_active_type_flg + transfer_to_employment_relation_type_flg, 1)) = 1;\r\n\r\n-- Проверка\r\nSELECT * \r\nFROM izmen_pre_perevody_plus \r\nWHERE mngt_unit_nm = 'Сервис линии'\r\nORDER BY calendar_dt DESC\r\nLIMIT 10;"

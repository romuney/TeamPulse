  - sid: 019ef4f4-1e2f-7d20-89a0-2943c8787f8a
    title: ottok_employee
    shebang: gp
    code: "\r\ndrop table if exists ottok_employee ;\r\ncreate table ottok_employee as\r\n\r\nselect \r\nmonth\r\n,'Все сотрудники' as type_flg\r\n,mngt_unit_rk\r\n,mngt_unit_nm\r\n,lvl\r\n,sum(employee_amt) AS employee_amt\r\n\r\nfrom ottok_em\r\nwhere active_type_nm  in ( 'Активная','Подрядчики')\r\ngroup by 1,2,3,4,5\r\n\r\nunion all\r\n\r\nselect \r\nmonth\r\n,'Штатные сотрудники' as type_flg\r\n,mngt_unit_rk\r\n,mngt_unit_nm\r\n,lvl\r\n,sum(employee_amt) AS employee_amt\r\n\r\nfrom ottok_em\r\nwhere active_type_nm  in ( 'Активная','Подрядчики')\r\nand employment_relation_type_desc = 'Штатный сотрудник' \r\n\r\ngroup by 1,2,3,4,5\r\n\r\nunion all\r\n\r\nselect \r\nmonth\r\n,'ГПД сотрудники' as type_flg\r\n,mngt_unit_rk\r\n,mngt_unit_nm\r\n,lvl\r\n,sum(employee_amt) AS employee_amt\r\n\r\nfrom ottok_em\r\nwhere active_type_nm  in ( 'Активная','Подрядчики')\r\nand employment_relation_type_desc <> 'Штатный сотрудник'  \r\ngroup by 1,2,3,4,5\r\n"
    isEnabled: true
    color: "#1BA6CE"

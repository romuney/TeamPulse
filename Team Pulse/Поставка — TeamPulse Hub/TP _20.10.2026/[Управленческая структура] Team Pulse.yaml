  - sid: 019f13c5-461a-72fa-8410-baac6f0b23b0
    title: employee_specialization_desc
    shebang: gp
    code: "drop table if exists last_day_of_month ;\r\ncreate table last_day_of_month as\r\n\r\nselect \r\nmonth\r\n,'Все сотрудники' as type_flg\r\n,mngt_unit_rk\r\n,mngt_unit_nm\r\n,lvl\r\n,employee_specialization_desc\r\n,sum(employee_amt) AS employee_amt\r\n\r\nfrom izmen_last_day_flg1\r\nwhere active_type_nm  in ( 'Активная','Подрядчики')\r\ngroup by 1,2,3,4,5,6\r\n\r\nunion all\r\n\r\nselect \r\nmonth\r\n,'Штатные сотрудники' as type_flg\r\n,mngt_unit_rk\r\n,mngt_unit_nm\r\n,lvl\r\n,employee_specialization_desc\r\n,sum(employee_amt) AS employee_amt\r\n\r\nfrom izmen_last_day_flg1\r\nwhere active_type_nm  in ( 'Активная','Подрядчики')\r\nand employment_relation_type_desc = 'Штатный сотрудник' \r\n\r\ngroup by 1,2,3,4,5,6\r\n\r\nunion all\r\n\r\nselect \r\nmonth\r\n,'ГПД сотрудники' as type_flg\r\n,mngt_unit_rk\r\n,mngt_unit_nm\r\n,lvl\r\n,employee_specialization_desc\r\n,sum(employee_amt) AS employee_amt\r\n\r\nfrom izmen_last_day_flg1\r\nwhere active_type_nm  in ( 'Активная','Подрядчики')\r\nand employment_relation_type_desc <> 'Штатный сотрудник'  \r\ngroup by 1,2,3,4,5,6\r\n"
    isEnabled: true
  - sid: 019f13c5-5679-7aeb-8545-5aae3db7139c
    title: ottok_employee
    shebang: gp
    code: "DROP TABLE IF EXISTS ottok_employee;\r\nCREATE TABLE ottok_employee AS\r\n\r\n-- Все сотрудники\r\nSELECT \r\n    month,\r\n    'Все сотрудники' AS type_flg,\r\n    mngt_unit_rk,\r\n    mngt_unit_nm,\r\n    lvl,\r\n    employee_specialization_desc,\r\n    SUM(employee_amt) AS employee_amt\r\nFROM izmen_ottok_em\r\nWHERE active_type_nm IN ('Активная', 'Подрядчики')\r\nGROUP BY \r\n1,2,3,4,5,6\r\n\r\nUNION ALL\r\n\r\n-- Штатные сотрудники\r\nSELECT \r\n    month,\r\n    'Штатные сотрудники' AS type_flg,\r\n    mngt_unit_rk,\r\n    mngt_unit_nm,\r\n    lvl,\r\n    employee_specialization_desc,\r\n    SUM(employee_amt) AS employee_amt\r\nFROM izmen_ottok_em\r\nWHERE active_type_nm IN ('Активная', 'Подрядчики')\r\n  AND employment_relation_type_desc = 'Штатный сотрудник'\r\nGROUP BY \r\n1,2,3,4,5,6\r\n\r\nUNION ALL\r\n\r\n-- ГПД сотрудники\r\nSELECT \r\n    month,\r\n    'ГПД сотрудники' AS type_flg,\r\n    mngt_unit_rk,\r\n    mngt_unit_nm,\r\n    lvl,\r\n    employee_specialization_desc,\r\n    SUM(employee_amt) AS employee_amt\r\nFROM izmen_ottok_em\r\nWHERE active_type_nm IN ('Активная', 'Подрядчики')\r\n  AND employment_relation_type_desc <> 'Штатный сотрудник'\r\nGROUP BY \r\n1,2,3,4,5,6"
    isEnabled: true
  - sid: 019f13c5-74be-74b6-94e8-c47ac24e263a
    title: naym_employee
    shebang: gp
    code: "DROP TABLE IF EXISTS naym_employee;\r\nCREATE TABLE naym_employee AS\r\n\r\n-- Все сотрудники\r\nSELECT \r\n    month,\r\n    'Все сотрудники' AS type_flg,\r\n    mngt_unit_rk,\r\n    mngt_unit_nm,\r\n    lvl,\r\n    employee_specialization_desc,\r\n    SUM(employee_amt) AS employee_amt,\r\n    SUM(perevod_v_bg) AS perevod_v_bg,\r\n    SUM(perevod_stazhera_v_shtat_amt) AS perevod_stazhera_v_shtat_amt,\r\n    SUM(naym_amt) AS naym_amt,\r\n    SUM(ap_naym_amt) AS ap_naym_amt\r\nFROM izmen_naym_em\r\nWHERE active_type_nm IN ('Активная', 'Подрядчики')\r\nGROUP BY \r\n1,2,3,4,5,6\r\n\r\nUNION ALL\r\n\r\n-- Штатные сотрудники\r\nSELECT \r\n    month,\r\n    'Штатные сотрудники' AS type_flg,\r\n    mngt_unit_rk,\r\n    mngt_unit_nm,\r\n    lvl,\r\n    employee_specialization_desc,\r\n    SUM(employee_amt) AS employee_amt,\r\n    SUM(perevod_v_bg) AS perevod_v_bg,\r\n    SUM(perevod_stazhera_v_shtat_amt) AS perevod_stazhera_v_shtat_amt,\r\n    SUM(naym_amt) AS naym_amt,\r\n    SUM(ap_naym_amt) AS ap_naym_amt\r\nFROM izmen_naym_em\r\nWHERE active_type_nm IN ('Активная', 'Подрядчики')\r\n  AND employment_relation_type_desc = 'Штатный сотрудник'\r\nGROUP BY \r\n1,2,3,4,5,6\r\n\r\nUNION ALL\r\n\r\n-- ГПД сотрудники\r\nSELECT \r\n    month,\r\n    'ГПД сотрудники' AS type_flg,\r\n    mngt_unit_rk,\r\n    mngt_unit_nm,\r\n    lvl,\r\n    employee_specialization_desc,\r\n    SUM(employee_amt) AS employee_amt,\r\n    SUM(perevod_v_bg) AS perevod_v_bg,\r\n    SUM(perevod_stazhera_v_shtat_amt) AS perevod_stazhera_v_shtat_amt,\r\n    SUM(naym_amt) AS naym_amt,\r\n    SUM(ap_naym_amt) AS ap_naym_amt\r\nFROM izmen_naym_em\r\nWHERE active_type_nm IN ('Активная', 'Подрядчики')\r\n  AND employment_relation_type_desc <> 'Штатный сотрудник'\r\nGROUP BY \r\n1,2,3,4,5,6 \r\n;\r\n\r\n-- Проверка\r\nSELECT * \r\nFROM izmen_naym_employee\r\nWHERE mngt_unit_nm = 'Сервис линии'\r\nORDER BY month DESC, naym_amt DESC;"
    isEnabled: true
  - sid: 019f13c5-63a7-7d60-95ec-aedf62d2d73c
    title: Untitled 78
    shebang: gp
    code: "DROP TABLE IF EXISTS skeleton;\r\nCREATE TABLE skeleton AS\r\n\r\nSELECT DISTINCT\r\n    month,\r\n    type_flg,\r\n    mngt_unit_rk,\r\n    mngt_unit_nm,\r\n    lvl,\r\nemployee_specialization_desc\r\nFROM last_day_of_month\r\n\r\nUNION\r\n\r\nSELECT DISTINCT\r\n    month,\r\n    type_flg,\r\n    mngt_unit_rk,\r\n    mngt_unit_nm,\r\n    lvl,\r\nemployee_specialization_desc\r\nFROM ottok_employee\r\n\r\nUNION\r\n\r\nSELECT DISTINCT\r\n    month,\r\n    type_flg,\r\n    mngt_unit_rk,\r\n    mngt_unit_nm,\r\n    lvl,\r\nemployee_specialization_desc\r\nFROM naym_employee;\r\n\r\n-- Проверка\r\nSELECT * \r\nFROM skeleton\r\nWHERE mngt_unit_nm = 'Сервис линии'\r\nORDER BY month DESC, lvl;"
    isEnabled: true
  - sid: 019f125c-24a8-7e6c-9510-2b76523ad061
    title: Untitled 66
    shebang: gp
    code: "DROP TABLE IF EXISTS last_day_ottok_naym_all;\r\nCREATE TABLE last_day_ottok_naym_all AS\r\n\r\nSELECT \r\n    s.month::DATE AS month,\r\n    s.type_flg,\r\n    s.mngt_unit_rk,\r\n    s.mngt_unit_nm,\r\n    s.lvl,\r\n    -- Родительские атрибуты\r\n    s.employee_specialization_desc,\r\n    -- Метрики\r\n    COALESCE(ld.employee_amt, 0) AS employee_amt,           -- численность на конец месяца\r\n    COALESCE(ot.employee_amt, 0) AS ottok_amt,              -- увольнения\r\n    COALESCE(ny.employee_amt, 0) AS hire_naym_amt,          -- всего учтённых при найме (включая переводы)\r\n    COALESCE(ny.perevod_v_bg, 0) AS perevod_v_bg,           -- переводы в БГ\r\n    COALESCE(ny.perevod_stazhera_v_shtat_amt, 0) AS perevod_stazhera_v_shtat_amt, -- переводы стажёров в штат\r\n    COALESCE(ny.naym_amt, 0) AS naym_amt,                   -- найм (только \"Активная\")\r\n    COALESCE(ny.ap_naym_amt, 0) AS ap_naym_amt,             -- найм (Активная + Подрядчики)\r\n    COALESCE(ny.employee_amt, 0) AS employee_naym          -- дублирует hire_naym_amt, можно убрать, если не нужен\r\nFROM skeleton s\r\n\r\n-- Численность на конец месяца\r\nLEFT JOIN last_day_of_month ld\r\n    ON ld.month = s.month\r\n    AND ld.type_flg = s.type_flg\r\n    AND ld.mngt_unit_rk = s.mngt_unit_rk\r\n    AND ld.mngt_unit_nm = s.mngt_unit_nm\r\n    AND ld.lvl = s.lvl\r\n    AND ld.employee_specialization_desc = s.employee_specialization_desc\r\n\r\n\r\n-- Увольнения\r\nLEFT JOIN ottok_employee ot\r\n    ON ot.month = s.month\r\n    AND ot.type_flg = s.type_flg\r\n    AND ot.mngt_unit_rk = s.mngt_unit_rk\r\n    AND ot.mngt_unit_nm = s.mngt_unit_nm\r\n    AND ot.lvl = s.lvl\r\n    AND ot.employee_specialization_desc = s.employee_specialization_desc\r\n\r\n\r\n-- Найм и переводы\r\nLEFT JOIN naym_employee ny\r\n    ON ny.month = s.month\r\n    AND ny.type_flg = s.type_flg\r\n    AND ny.mngt_unit_rk = s.mngt_unit_rk\r\n    AND ny.mngt_unit_nm = s.mngt_unit_nm\r\n    AND ny.lvl = s.lvl\r\n    AND ny.employee_specialization_desc = s.employee_specialization_desc\r\n\r\n    \r\n    distributed by (mngt_unit_rk,month,type_flg)\r\n    ;\r\n\r\n-- Проверка\r\nSELECT * \r\nFROM last_day_ottok_naym_all\r\n where mngt_unit_nm= 'Сервис линии'"
    isEnabled: true
  - sid: 019f125c-16c1-748a-9a68-e822390f7f37
    title: Untitled 65
    shebang: gp
    code: "drop table if exists type_flg_stream_ottoka_year ;\r\ncreate table type_flg_stream_ottoka_year  as\r\n\r\nwith  pre_stream_ottok as (\r\nselect month,mngt_unit_rk,mngt_unit_nm,lvl,employee_specialization_desc,type_flg\r\n,sum(ottok_amt) as ottok_amt\r\n,sum(employee_amt) as employee_amt\r\n\r\nfrom last_day_ottok_naym_all \r\nwhere 1=1 \r\n\r\nand  month::date <= date_trunc('month', $form_multiselect_1::date)::date\r\ngroup by 1,2,3,4,5,6\r\n)\r\n, pre_lag_stream_ottok as (\r\nselect \r\nmonth,mngt_unit_rk,mngt_unit_nm,lvl,employee_specialization_desc,type_flg,ottok_amt\r\n,employee_amt\r\n,lag(employee_amt) OVER (PARTITION BY mngt_unit_rk,mngt_unit_nm,lvl,employee_specialization_desc,type_flg  ORDER BY month ) as lag_employee_amt\r\n\r\nfrom pre_stream_ottok \r\n)\r\n, pre_spch_stream_ottok as (\r\nselect \r\nmonth\r\n,mngt_unit_rk\r\n,mngt_unit_nm\r\n,lvl\r\n,type_flg\r\n,employee_specialization_desc\r\n,ottok_amt\r\n,employee_amt\r\n,lag_employee_amt\r\n, case when lag_employee_amt is null then employee_amt  else (lag_employee_amt+employee_amt) / 2 end as spch\r\n ,case when (case when lag_employee_amt is null then employee_amt  else (lag_employee_amt+employee_amt) / 2 end)=0 then 0\r\n else (ottok_amt /  ((case when lag_employee_amt is null then employee_amt  else (lag_employee_amt+employee_amt) / 2 end)*1.0))\r\n end  as tekuchest\r\n\r\n\r\n from pre_lag_stream_ottok \r\n)\r\n, dd as (\r\nselect *  from\r\npre_spch_stream_ottok\r\n    where 1=1\r\nand \r\n(\r\n (month >= MAKE_DATE(EXTRACT(YEAR FROM $form_multiselect_1::date)::INT - 1, 1, 1)\r\n  AND month < MAKE_DATE(EXTRACT(YEAR FROM $form_multiselect_1::date)::INT, 1, 1)\r\n  AND month + INTERVAL '1 year' <= $form_multiselect_1::date) \r\n or \r\n ( month>=   date_trunc('year',$form_multiselect_1::date) )\r\n)\r\n)\r\n\r\nselect \r\nmngt_unit_rk\r\n,mngt_unit_nm\r\n,lvl\r\n,type_flg\r\n,employee_specialization_desc\r\n,usr_cross_pub.cross_management_unit.new_management_unit_nm\r\n,date_trunc('year',$form_multiselect_1::date )::date  as cur_year\r\n,(date_trunc('year',$form_multiselect_1::date)  - interval '1 year')::date as prev_year\r\n,coalesce( sum(ottok_amt) filter (where date_trunc('year',$form_multiselect_1::date ) = date_trunc('year',month )) ,0) as ottok_cur_year_amt\r\n,coalesce( sum(ottok_amt) filter (where (date_trunc('year',$form_multiselect_1::date)  - interval '1 year')::date= date_trunc('year',month )) ,0) as ottok_prev_year_amt\r\n,coalesce( sum(tekuchest) filter (where date_trunc('year',$form_multiselect_1::date ) = date_trunc('year',month )) ,0) as tekuchest_cur_year_amt\r\n,coalesce( sum(tekuchest) filter (where (date_trunc('year',$form_multiselect_1::date)  - interval '1 year')::date= date_trunc('year',month )) ,0) as tekuchest_prev_year_amt\r\n\r\nfrom  dd \r\n\r\nleft join usr_cross_pub.cross_management_unit\r\non dd.mngt_unit_rk = usr_cross_pub.cross_management_unit.management_unit_rk\r\n\r\ngroup by 1,2,3,4,5,6,7,8\r\n\r\n\r\n;\r\n\r\nselect * from type_flg_stream_ottoka_year\r\nwhere mngt_unit_nm = 'Сервис линии'"
    isEnabled: true

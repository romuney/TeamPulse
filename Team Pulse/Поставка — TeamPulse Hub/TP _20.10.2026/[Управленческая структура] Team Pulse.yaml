    code: "drop table if exists initiative_reason_unit_tekuchest  ;\r\ncreate table  initiative_reason_unit_tekuchest   as\r\n\r\n\r\nselect \r\ninitiative_reason.*\r\n,fire_initiative.ottok_cur_year_amt  as initiative_ottok_cur_year_amt\r\n,fire_initiative.ottok_prev_year_amt as initiative_ottok_prev_year_amt\r\n,fire_initiative.tekuchest_cur_year_amt as initiative_tekuchest_cur_year_amt\r\n,fire_initiative.tekuchest_prev_year_amt as initiative_tekuchest_prev_year_amt\r\n,unit_tekuchest_ottok_all.ottok_cur_year_amt  as unit_ottok_cur_year_amt\r\n,unit_tekuchest_ottok_all.ottok_prev_year_amt as unit_ottok_prev_year_amt\r\n,unit_tekuchest_ottok_all.tekuchest_cur_year_amt as unit_tekuchest_cur_year_amt\r\n,unit_tekuchest_ottok_all.tekuchest_prev_year_amt as unit_tekuchest_prev_year_amt\r\n\r\nfrom initiative_reason \r\nleft join fire_initiative \r\n    on initiative_reason.mngt_unit_rk = fire_initiative.mngt_unit_rk\r\n    and initiative_reason.type_flg = fire_initiative.type_flg\r\n    and initiative_reason.fire_initiative = fire_initiative.fire_initiative\r\n\r\nleft join unit_tekuchest_ottok_all \r\n\r\non initiative_reason.mngt_unit_rk = unit_tekuchest_ottok_all.mngt_unit_rk\r\nand initiative_reason.type_flg = unit_tekuchest_ottok_all.type_flg\r\n\r\n--where initiative_reason.mngt_unit_nm = 'Сервис линии'\r\n;\r\n\r\nselect * from initiative_reason_unit_tekuchest\r\n\r\n where mngt_unit_nm = '1C HR Data' and type_flg = 'Все сотрудники'\r\n\r\n"

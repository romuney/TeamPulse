  - sid: 019efe5a-e73a-732e-9d58-00a45cf1706e
    title: ys_all_waterfall_perevody
    shebang: gp
    code: " drop table if exists ys_all_waterfall_perevody;\r\n create table ys_all_waterfall_perevody   as\r\n\r\nwith ruba as (\r\nselect distinct  mngt_unit_rk, mngt_unit_nm ,lvl, transfer_type, type_flg\r\nfrom union_perevody_plus \r\nunion \r\nselect distinct  mngt_unit_rk, mngt_unit_nm ,lvl, transfer_type, type_flg\r\nfrom union_perevody_minus \r\n)\r\n\r\nselect  ruba.mngt_unit_rk, ruba.mngt_unit_nm , ruba.lvl, ruba.transfer_type,  ruba.type_flg\r\n, coalesce ( union_perevody_plus.plus) as fire --plus\r\n, coalesce ( union_perevody_minus.minus) as hire -- minus\r\n,usr_cross_pub.cross_management_unit.new_management_unit_nm\r\nfrom ruba\r\n\r\nleft join union_perevody_plus \r\non ruba.mngt_unit_rk = union_perevody_plus.mngt_unit_rk\r\nand ruba.mngt_unit_nm = union_perevody_plus.mngt_unit_nm\r\nand ruba.lvl = union_perevody_plus.lvl\r\nand ruba.transfer_type = union_perevody_plus.transfer_type\r\nand ruba.type_flg = union_perevody_plus.type_flg\r\n\r\nleft join union_perevody_minus\r\non ruba.mngt_unit_rk = union_perevody_minus.mngt_unit_rk\r\nand ruba.mngt_unit_nm = union_perevody_minus.mngt_unit_nm\r\nand ruba.lvl = union_perevody_minus.lvl\r\nand ruba.transfer_type = union_perevody_minus.transfer_type\r\nand ruba.type_flg = union_perevody_minus.type_flg\r\n\r\n\r\nleft join usr_cross_pub.cross_management_unit\r\non ruba.mngt_unit_rk = usr_cross_pub.cross_management_unit.management_unit_rk\r\n\r\n --limit 10\r\n;\r\nselect * from  ys_all_waterfall_perevody where 1=1\r\nand  mngt_unit_nm = 'Сервис линии' \r\n\r\n\r\n"
    isEnabled: true
    color: "#FDC454"

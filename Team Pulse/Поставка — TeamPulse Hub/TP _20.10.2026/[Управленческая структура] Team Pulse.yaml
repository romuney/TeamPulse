  - sid: 019ef4da-b010-7f69-8847-1f904d49ca1e
    title: last_day_of_month 
    shebang: gp
    code: "drop table if exists last_day_of_month ;\r\ncreate table last_day_of_month as\r\n\r\nselect \r\nmonth\r\n,'Все сотрудники' as type_flg\r\n,mngt_unit_rk\r\n,mngt_unit_nm\r\n,lvl\r\n,sum(employee_amt) AS employee_amt\r\n\r\nfrom last_day_flg\r\nwhere active_type_nm  in ( 'Активная','Подрядчики')\r\ngroup by 1,2,3,4,5\r\n\r\nunion all\r\n\r\nselect \r\nmonth\r\n,'Штатные сотрудники' as type_flg\r\n,mngt_unit_rk\r\n,mngt_unit_nm\r\n,lvl\r\n,sum(employee_amt) AS employee_amt\r\n\r\nfrom last_day_flg\r\nwhere active_type_nm  in ( 'Активная','Подрядчики')\r\nand employment_relation_type_desc = 'Штатный сотрудник' \r\n\r\ngroup by 1,2,3,4,5\r\n\r\nunion all\r\n\r\nselect \r\nmonth\r\n,'ГПД сотрудники' as type_flg\r\n,mngt_unit_rk\r\n,mngt_unit_nm\r\n,lvl\r\n,sum(employee_amt) AS employee_amt\r\n\r\nfrom last_day_flg\r\nwhere active_type_nm  in ( 'Активная','Подрядчики')\r\nand employment_relation_type_desc <> 'Штатный сотрудник'  \r\ngroup by 1,2,3,4,5\r\n"
    isEnabled: true
    color: "#1BA6CE"
  - sid: 019ef4da-b922-71f5-a532-82a7287edc6a
    title: ottok_em

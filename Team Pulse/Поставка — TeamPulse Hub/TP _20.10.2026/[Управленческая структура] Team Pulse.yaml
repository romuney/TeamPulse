    title: ys_all_fire_initiative
    shebang: gp
    code: "drop table if exists ys_all_fire_initiative  ;\r\ncreate table ys_all_fire_initiative    as\r\n\r\nWITH lag_fire_initiative  AS (\r\n    select \r\n        month\r\n        ,(date_trunc('year',month))::date as year\r\n        ,mngt_unit_rk\r\n        ,mngt_unit_nm\r\n        ,lvl\r\n        ,type_flg\r\n        ,ottok as ottok_amt\r\n        ,procheye_ottok as procheye_ottok_amt\r\n        ,initsiativa_rabotnika_ottok as initsiativa_rabotnika_ottok_amt\r\n        ,initsiativa_rabotodatelya_ottok as initsiativa_rabotodatelya_ottok_amt\r\n        ,employee_amt\r\n        ,lag(employee_amt) OVER (PARTITION BY mngt_unit_rk,mngt_unit_nm,lvl,type_flg ORDER BY month ) as lag_employee_amt\r\n    from fire_initiative  \r\n    where 1=1\r\n\r\n)\r\n,  pre_fire_initiative_spch as(\r\n    select\r\n        month\r\n        , year\r\n        , mngt_unit_rk\r\n        , mngt_unit_nm\r\n        , lvl\r\n        , type_flg\r\n        , ottok_amt\r\n        , procheye_ottok_amt\r\n        , initsiativa_rabotnika_ottok_amt\r\n        , initsiativa_rabotodatelya_ottok_amt\r\n        , employee_amt\r\n        , case when lag_employee_amt is null then employee_amt  else (lag_employee_amt+employee_amt) / (2*1.0) end as spch\r\n        \r\n        , case when (case when lag_employee_amt is null then employee_amt  else (lag_employee_amt+employee_amt) / (2*1.0) end)=0 then 0\r\n            else (ottok_amt /  ((case when lag_employee_amt is null then employee_amt  else (lag_employee_amt+employee_amt) / (2*1.0) end)*1.0))\r\n        end  as tekuchest_all\r\n\r\n        ,case when (case when lag_employee_amt is null then employee_amt  else (lag_employee_amt+employee_amt) / (2*1.0) end)=0 then 0\r\n            else (initsiativa_rabotnika_ottok_amt /  ((case when lag_employee_amt is null then employee_amt  else (lag_employee_amt+employee_amt) / (2*1.0) end)*1.0))\r\n        end  as tekuchest_initsiativa_rabotnika\r\n\r\n        , case when (case when lag_employee_amt is null then employee_amt  else (lag_employee_amt+employee_amt) / (2*1.0) end)=0 then 0\r\n            else (initsiativa_rabotodatelya_ottok_amt /  ((case when lag_employee_amt is null then employee_amt  else (lag_employee_amt+employee_amt) / (2*1.0) end)*1.0))\r\n        end  as tekuchest_initsiativa_rabotodatelya\r\n\r\n        , row_number() OVER (PARTITION BY year,mngt_unit_rk,mngt_unit_nm,lvl,type_flg ORDER BY month ) as rn\r\n        , dense_rank()  OVER ( ORDER BY year ) as rn_year\r\n    from lag_fire_initiative\r\n    where month::date <= date_trunc('month', $form_multiselect_1::date)::date and month::date >=(date_trunc('year',$form_multiselect_1::date)  - interval '1 year')::date\r\n)\r\n\r\nselect \r\n    pre_fire_initiative_spch.month\r\n    , pre_fire_initiative_spch.year\r\n    , usr_cross_pub.cross_management_unit.new_management_unit_nm\r\n    , pre_fire_initiative_spch.mngt_unit_rk\r\n    , pre_fire_initiative_spch.mngt_unit_nm\r\n    , pre_fire_initiative_spch.lvl\r\n    , pre_fire_initiative_spch.type_flg\r\n    , rn\r\n    , rn_year\r\n    , case \r\n    when rn_year=2 and rn=max( rn) filter (where rn_year = 2) over (PARTITION by mngt_unit_rk,type_flg) then 1\r\n    when rn_year=1 and rn=max( rn) filter (where rn_year = 2) over (PARTITION by mngt_unit_rk,type_flg)  then 1\r\n    else 0 end as last_month_this_year\r\n\r\n    , tekuchest_all\r\n    , tekuchest_initsiativa_rabotnika\r\n    , tekuchest_initsiativa_rabotodatelya\r\n    , sum(tekuchest_all) OVER (PARTITION BY mngt_unit_rk, mngt_unit_rk, year,type_flg ORDER BY month) as nakop_tekuchest_all\r\n    , sum(tekuchest_initsiativa_rabotnika) OVER (PARTITION BY mngt_unit_rk, mngt_unit_rk, year,type_flg ORDER BY month) as nakop_tekuchest_initsiativa_rabotnika\r\n    , sum(tekuchest_initsiativa_rabotodatelya) OVER (PARTITION BY mngt_unit_rk, mngt_unit_rk, year,type_flg ORDER BY month) as nakop_tekuchest_initsiativa_rabotodatelya\r\nfrom pre_fire_initiative_spch\r\nleft join usr_cross_pub.cross_management_unit\r\n    on   pre_fire_initiative_spch.mngt_unit_rk = usr_cross_pub.cross_management_unit.management_unit_rk\r\n\r\n;\r\n\r\n select * \r\n-- , LAG((nakop_tekuchest_all) * 100)   OVER (PARTITION BY mngt_unit_rk,new_management_unit_nm, last_month_this_year ORDER BY month) as anton\r\n\r\n from ys_all_fire_initiative \r\n where new_management_unit_nm = '1C HR Data'  --and  type_flg = 'Все сотрудники'\r\n"
    isEnabled: true
    color: "#FDC454"

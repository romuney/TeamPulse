  - sid: 019ef4cb-d407-704b-88d2-29fd6b7874d5
    title: last_day_flg
    shebang: gp
    code: "DROP TABLE IF EXISTS last_day_flg;\r\nCREATE TABLE last_day_flg AS\r\n\r\n-- LVL 2\r\nSELECT  \r\n    DATE_TRUNC('month', calendar_dt::DATE)::DATE AS month,\r\n    lvl2_mapped_management_unit_rk::TEXT AS mngt_unit_rk,\r\n    lvl2_mapped_management_unit_nm::TEXT AS mngt_unit_nm,\r\n    2::TEXT AS lvl,\r\n    -- Атрибуты сотрудника\r\n    COALESCE(active_type_nm::TEXT, 'n/a') AS active_type_nm,\r\n    COALESCE(employment_relation_type_desc::TEXT, 'n/a') AS employment_relation_type_desc,\r\n    -- Метрика\r\n    COUNT(mdm_employee_rk) AS employee_amt\r\n\r\nFROM usr_cross_data.hr_executive_proteus \r\nWHERE \r\n    last_day_of_month_flg = 1  \r\n    AND lvl2_mapped_management_unit_rk IS NOT NULL\r\n    AND lvl2_mapped_management_unit_rk <> '-'\r\n    AND fire_flg = 0\r\n    AND calendar_dt::DATE >= date_trunc('month', $form_multiselect_1::date - interval '25 months')::date\r\nGROUP BY \r\n    1, 2, 3, 4, 5, 6\r\n\r\nunion all\r\n\r\n    -- LVL 3\r\nSELECT  \r\n    DATE_TRUNC('month', calendar_dt::DATE)::DATE AS month,\r\n    lvl3_mapped_management_unit_rk::TEXT AS mngt_unit_rk,\r\n    lvl3_mapped_management_unit_nm::TEXT AS mngt_unit_nm,\r\n    3::TEXT AS lvl,\r\n    -- Атрибуты сотрудника\r\n    COALESCE(active_type_nm::TEXT, 'n/a') AS active_type_nm,\r\n    COALESCE(employment_relation_type_desc::TEXT, 'n/a') AS employment_relation_type_desc,\r\n    -- Метрика\r\n    COUNT(mdm_employee_rk) AS employee_amt\r\n\r\nFROM usr_cross_data.hr_executive_proteus \r\nWHERE \r\n    last_day_of_month_flg = 1  \r\n    AND lvl3_mapped_management_unit_rk IS NOT NULL\r\n    AND lvl3_mapped_management_unit_rk <> '-'\r\n    AND fire_flg = 0\r\n    AND calendar_dt::DATE >= date_trunc('month', $form_multiselect_1::date - interval '25 months')::date\r\nGROUP BY \r\n    1, 2, 3, 4, 5, 6\r\n\r\nunion all\r\n-- LVL 4\r\nSELECT  \r\n    DATE_TRUNC('month', calendar_dt::DATE)::DATE AS month,\r\n    lvl4_mapped_management_unit_rk::TEXT AS mngt_unit_rk,\r\n    lvl4_mapped_management_unit_nm::TEXT AS mngt_unit_nm,\r\n    4::TEXT AS lvl,\r\n    -- Атрибуты сотрудника\r\n    COALESCE(active_type_nm::TEXT, 'n/a') AS active_type_nm,\r\n    COALESCE(employment_relation_type_desc::TEXT, 'n/a') AS employment_relation_type_desc,\r\n    -- Метрика\r\n    COUNT(mdm_employee_rk) AS employee_amt\r\nFROM usr_cross_data.hr_executive_proteus \r\nWHERE \r\n    last_day_of_month_flg = 1  \r\n    AND lvl4_mapped_management_unit_rk IS NOT NULL\r\n    AND lvl4_mapped_management_unit_rk <> '-'\r\n    AND fire_flg = 0\r\n    AND calendar_dt::DATE>=date_trunc('month', $form_multiselect_1::date - interval '25 months')::date\r\nGROUP BY \r\n    1, 2, 3, 4, 5, 6\r\n\r\nunion all\r\n-- LVL 5\r\nSELECT  \r\n    DATE_TRUNC('month', calendar_dt::DATE)::DATE AS month,\r\n    lvl5_mapped_management_unit_rk::TEXT AS mngt_unit_rk,\r\n    lvl5_mapped_management_unit_nm::TEXT AS mngt_unit_nm,\r\n    5::TEXT AS lvl,\r\n    -- Атрибуты сотрудника\r\n    COALESCE(active_type_nm::TEXT, 'n/a') AS active_type_nm,\r\n    COALESCE(employment_relation_type_desc::TEXT, 'n/a') AS employment_relation_type_desc,\r\n    -- Метрика\r\n    COUNT(mdm_employee_rk) AS employee_amt\r\nFROM usr_cross_data.hr_executive_proteus \r\nWHERE \r\n    last_day_of_month_flg = 1  \r\n    AND lvl5_mapped_management_unit_rk IS NOT NULL\r\n    AND lvl5_mapped_management_unit_rk <> '-'\r\n    AND fire_flg = 0\r\n    AND calendar_dt::DATE>=date_trunc('month', $form_multiselect_1::date - interval '25 months')::date\r\nGROUP BY \r\n    1, 2, 3, 4, 5, 6\r\n\r\nunion all\r\n-- LVL 6\r\nSELECT  \r\n    DATE_TRUNC('month', calendar_dt::DATE)::DATE AS month,\r\n    lvl6_mapped_management_unit_rk::TEXT AS mngt_unit_rk,\r\n    lvl6_mapped_management_unit_nm::TEXT AS mngt_unit_nm,\r\n    6::TEXT AS lvl,\r\n    -- Атрибуты сотрудника\r\n    COALESCE(active_type_nm::TEXT, 'n/a') AS active_type_nm,\r\n    COALESCE(employment_relation_type_desc::TEXT, 'n/a') AS employment_relation_type_desc,\r\n    -- Метрика\r\n    COUNT(mdm_employee_rk) AS employee_amt\r\nFROM usr_cross_data.hr_executive_proteus \r\nWHERE \r\n    last_day_of_month_flg = 1  \r\n    AND lvl6_mapped_management_unit_rk IS NOT NULL\r\n    AND lvl6_mapped_management_unit_rk <> '-'\r\n    AND fire_flg = 0\r\n    AND calendar_dt::DATE>=date_trunc('month', $form_multiselect_1::date - interval '25 months')::date\r\nGROUP BY \r\n    1, 2, 3, 4, 5, 6\r\n\r\nunion all\r\n-- LVL 7\r\nSELECT  \r\n    DATE_TRUNC('month', calendar_dt::DATE)::DATE AS month,\r\n    lvl7_mapped_management_unit_rk::TEXT AS mngt_unit_rk,\r\n    lvl7_mapped_management_unit_nm::TEXT AS mngt_unit_nm,\r\n    7::TEXT AS lvl,\r\n    -- Атрибуты сотрудника\r\n    COALESCE(active_type_nm::TEXT, 'n/a') AS active_type_nm,\r\n    COALESCE(employment_relation_type_desc::TEXT, 'n/a') AS employment_relation_type_desc,\r\n    -- Метрика\r\n    COUNT(mdm_employee_rk) AS employee_amt\r\nFROM usr_cross_data.hr_executive_proteus \r\nWHERE \r\n    last_day_of_month_flg = 1  \r\n    AND lvl7_mapped_management_unit_rk IS NOT NULL\r\n    AND lvl7_mapped_management_unit_rk <> '-'\r\n    AND fire_flg = 0\r\n    AND calendar_dt::DATE>=date_trunc('month', $form_multiselect_1::date - interval '25 months')::date\r\nGROUP BY \r\n    1, 2, 3, 4, 5, 6\r\n\r\nunion all\r\n-- LVL 8\r\nSELECT  \r\n    DATE_TRUNC('month', calendar_dt::DATE)::DATE AS month,\r\n    lvl8_mapped_management_unit_rk::TEXT AS mngt_unit_rk,\r\n    lvl8_mapped_management_unit_nm::TEXT AS mngt_unit_nm,\r\n    8::TEXT AS lvl,\r\n    -- Атрибуты сотрудника\r\n    COALESCE(active_type_nm::TEXT, 'n/a') AS active_type_nm,\r\n    COALESCE(employment_relation_type_desc::TEXT, 'n/a') AS employment_relation_type_desc,\r\n    -- Метрика\r\n    COUNT(mdm_employee_rk) AS employee_amt\r\nFROM usr_cross_data.hr_executive_proteus \r\nWHERE \r\n    last_day_of_month_flg = 1  \r\n    AND lvl8_mapped_management_unit_rk IS NOT NULL\r\n    AND lvl8_mapped_management_unit_rk <> '-'\r\n    AND fire_flg = 0\r\n    AND calendar_dt::DATE>=date_trunc('month', $form_multiselect_1::date - interval '25 months')::date\r\nGROUP BY \r\n    1, 2, 3, 4, 5, 6\r\n\r\nunion all\r\n-- LVL 9\r\nSELECT  \r\n    DATE_TRUNC('month', calendar_dt::DATE)::DATE AS month,\r\n    lvl9_mapped_management_unit_rk::TEXT AS mngt_unit_rk,\r\n    lvl9_mapped_management_unit_nm::TEXT AS mngt_unit_nm,\r\n    9::TEXT AS lvl,\r\n    -- Атрибуты сотрудника\r\n    COALESCE(active_type_nm::TEXT, 'n/a') AS active_type_nm,\r\n    COALESCE(employment_relation_type_desc::TEXT, 'n/a') AS employment_relation_type_desc,\r\n    -- Метрика\r\n    COUNT(mdm_employee_rk) AS employee_amt\r\nFROM usr_cross_data.hr_executive_proteus \r\nWHERE \r\n    last_day_of_month_flg = 1  \r\n    AND lvl9_mapped_management_unit_rk IS NOT NULL\r\n    AND lvl9_mapped_management_unit_rk <> '-'\r\n    AND fire_flg = 0\r\n    AND calendar_dt::DATE>=date_trunc('month', $form_multiselect_1::date - interval '25 months')::date\r\nGROUP BY \r\n    1, 2, 3, 4, 5, 6\r\n\r\nunion all\r\n-- LVL 10\r\nSELECT  \r\n    DATE_TRUNC('month', calendar_dt::DATE)::DATE AS month,\r\n    lvl10_mapped_management_unit_rk::TEXT AS mngt_unit_rk,\r\n    lvl10_mapped_management_unit_nm::TEXT AS mngt_unit_nm,\r\n    10::TEXT AS lvl,\r\n    -- Атрибуты сотрудника\r\n    COALESCE(active_type_nm::TEXT, 'n/a') AS active_type_nm,\r\n    COALESCE(employment_relation_type_desc::TEXT, 'n/a') AS employment_relation_type_desc,\r\n    \r\n    -- Метрика\r\n    COUNT(mdm_employee_rk) AS employee_amt\r\nFROM usr_cross_data.hr_executive_proteus \r\nWHERE \r\n    last_day_of_month_flg = 1  \r\n    AND lvl10_mapped_management_unit_rk IS NOT NULL\r\n    AND lvl10_mapped_management_unit_rk <> '-'\r\n    AND fire_flg = 0\r\n    AND calendar_dt::DATE>=date_trunc('month', $form_multiselect_1::date - interval '25 months')::date\r\nGROUP BY \r\n    1, 2, 3, 4, 5, 6\r\n\r\nunion all\r\n-- LVL 11\r\nSELECT  \r\n    DATE_TRUNC('month', calendar_dt::DATE)::DATE AS month,\r\n    lvl11_mapped_management_unit_rk::TEXT AS mngt_unit_rk,\r\n    lvl11_mapped_management_unit_nm::TEXT AS mngt_unit_nm,\r\n    11::TEXT AS lvl,\r\n    -- Атрибуты сотрудника\r\n    COALESCE(active_type_nm::TEXT, 'n/a') AS active_type_nm,\r\n    COALESCE(employment_relation_type_desc::TEXT, 'n/a') AS employment_relation_type_desc,\r\n    -- Метрика\r\n    COUNT(mdm_employee_rk) AS employee_amt\r\nFROM usr_cross_data.hr_executive_proteus \r\nWHERE \r\n    last_day_of_month_flg = 1  \r\n    AND lvl11_mapped_management_unit_rk IS NOT NULL\r\n    AND lvl11_mapped_management_unit_rk <> '-'\r\n    AND fire_flg = 0\r\n    AND calendar_dt::DATE>=date_trunc('month', $form_multiselect_1::date - interval '25 months')::date\r\nGROUP BY \r\n    1, 2, 3, 4, 5, 6\r\n\r\n\r\n"

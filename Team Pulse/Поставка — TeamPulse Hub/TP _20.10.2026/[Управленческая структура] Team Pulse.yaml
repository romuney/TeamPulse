    code: "\r\ndrop table if exists  unit_tekuchest_ottok_all ;\r\ncreate table  unit_tekuchest_ottok_all   as\r\n\r\nWITH lag_ottok_count_reason_group  AS (\r\nselect \r\nmonth\r\n,mngt_unit_rk\r\n,mngt_unit_nm\r\n,lvl\r\n,type_flg\r\n,ottok as ottok_amt\r\n,employee_amt\r\n,lag(employee_amt) OVER (PARTITION BY \r\nmngt_unit_rk\r\n,mngt_unit_nm\r\n,lvl\r\n,type_flg\r\n ORDER BY month ) as lag_employee_amt\r\nfrom unit_t\r\n)\r\n, tekuchest_ottok_count_reason_group  AS (\r\nselect\r\nmonth \r\n,mngt_unit_rk\r\n,mngt_unit_nm\r\n,lvl\r\n,type_flg\r\n,ottok_amt\r\n,employee_amt\r\n, case when lag_employee_amt is null then employee_amt  else (lag_employee_amt+employee_amt) / (2*1.0) end as spch\r\n ,case when (case when lag_employee_amt is null then employee_amt  else (lag_employee_amt+employee_amt) / (2*1.0) end)=0 then 0\r\n else (ottok_amt /  ((case when lag_employee_amt is null then employee_amt  else (lag_employee_amt+employee_amt) / (2*1.0) end)*1.0))\r\n end  as tekuchest\r\n\r\n from lag_ottok_count_reason_group \r\n)\r\n, ff as (\r\n\r\n    select * from tekuchest_ottok_count_reason_group \r\n    where 1=1\r\nand \r\n(\r\n (month >= MAKE_DATE(EXTRACT(YEAR FROM $form_multiselect_1::date)::INT - 1, 1, 1)\r\n  AND month < MAKE_DATE(EXTRACT(YEAR FROM $form_multiselect_1::date)::INT, 1, 1)\r\n  AND month + INTERVAL '1 year' <= $form_multiselect_1::date) \r\n or \r\n ( month>=   date_trunc('year',$form_multiselect_1::date) )\r\n)\r\n)\r\n\r\n, tekuchest_ottok_count_year_reason_group  AS (\r\n select \r\nmngt_unit_rk\r\n,mngt_unit_nm\r\n,lvl\r\n,type_flg\r\n,date_trunc('year',$form_multiselect_1::date )::date  as cur_year\r\n,(date_trunc('year',$form_multiselect_1::date)  - interval '1 year')::date as prev_year\r\n,coalesce( sum(ottok_amt) filter (where date_trunc('year',$form_multiselect_1::date ) = date_trunc('year',month )) ,0) as ottok_cur_year_amt\r\n,coalesce( sum(ottok_amt) filter (where (date_trunc('year',$form_multiselect_1::date)  - interval '1 year')::date= date_trunc('year',month )) ,0) as ottok_prev_year_amt\r\n,coalesce( sum(tekuchest) filter (where date_trunc('year',$form_multiselect_1::date ) = date_trunc('year',month )) ,0) as tekuchest_cur_year_amt\r\n,coalesce( sum(tekuchest) filter (where (date_trunc('year',$form_multiselect_1::date)  - interval '1 year')::date= date_trunc('year',month )) ,0) as tekuchest_prev_year_amt\r\n\r\nfrom ff\r\n\r\nwhere 1=1\r\ngroup by 1,2,3,4,5,6\r\n)\r\n \r\n\r\nselect tekuchest_ottok_count_year_reason_group.* \r\n\r\n,row_number() OVER (PARTITION BY mngt_unit_rk,type_flg ORDER BY ottok_cur_year_amt DESC) as rn\r\n\r\nfrom tekuchest_ottok_count_year_reason_group \r\n\r\n\r\n;\r\n\r\nselect * from  unit_tekuchest_ottok_all where mngt_unit_nm = '1C HR Data'\r\n"

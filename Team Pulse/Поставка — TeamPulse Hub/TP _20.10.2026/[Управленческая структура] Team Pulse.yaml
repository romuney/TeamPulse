  - sid: 019ef993-c95b-70cc-94bd-90e9ba4ab403
    title: ys_all_waterfall_chislennosti
    shebang: gp
    code: "drop table if exists ys_all_waterfall_chislennosti ;\r\ncreate table ys_all_waterfall_chislennosti   as\r\n--Handlebars Движение персонала\r\nWITH pre_date AS (\r\n    SELECT\r\n        mngt_unit_rk,\r\n        lvl,\r\n        mngt_unit_nm,\r\n        new_management_unit_nm,\r\n        type_flg,\r\n        MAX(month) AS end_date,\r\n        MIN(month) AS start_date\r\n    FROM ys_all_dinamika_aktivnoy_chislennosti\r\n    --WHERE mngt_unit_rk IN ('2784d8075fc826066be43b2de6aafc29', '6693daa41585dcdd9b2712c2a72d6653')\r\n    where 1=1\r\n        and month::date >=  date_trunc('month', $form_multiselect_1::date - interval '11 months')::date\r\n        and month::date <= date_trunc('month', $form_multiselect_1::date)::date\r\n    GROUP BY mngt_unit_rk, lvl, mngt_unit_nm,type_flg,new_management_unit_nm\r\n)\r\n\r\nSELECT\r\n    pd.mngt_unit_rk\r\n    ,pd.lvl\r\n    ,pd.mngt_unit_nm\r\n    ,pd.new_management_unit_nm\r\n    ,pd.type_flg\r\n    ,pd.start_date\r\n    ,pd.end_date\r\n    ,SUM(CASE WHEN d.month = pd.start_date THEN d.cnt_employee ELSE 0 END) AS cnt_start_employee\r\n    ,SUM(CASE WHEN d.month = pd.end_date THEN d.cnt_employee ELSE 0 END) AS cnt_end_employee\r\n    ,sum (d.fire) filter (where d.month::date >=  GREATEST ((date_trunc('month', $form_multiselect_1::date - interval '10 months')), (pd.start_date + interval '1 months'))  and d.month::date <= date_trunc('month', $form_multiselect_1::date)::date) as fire\r\n    ,sum (d.hire_all) filter (where d.month::date >=  GREATEST ((date_trunc('month', $form_multiselect_1::date - interval '10 months')), (pd.start_date + interval '1 months'))  and d.month::date <= date_trunc('month', $form_multiselect_1::date)::date)  as hire\r\n    ,sum (d.transfer_out) filter (where d.month::date >=  GREATEST ((date_trunc('month', $form_multiselect_1::date - interval '10 months')), (pd.start_date + interval '1 months'))  and d.month::date <= date_trunc('month', $form_multiselect_1::date)::date)  as transfer_out\r\n    ,sum (d.transfer_in) filter (where d.month::date >=  GREATEST ((date_trunc('month', $form_multiselect_1::date - interval '10 months')), (pd.start_date + interval '1 months'))  and d.month::date <= date_trunc('month', $form_multiselect_1::date)::date)   as transfer_in\r\n    ,SUM(CASE WHEN d.month = pd.start_date THEN d.cnt_employee ELSE 0 END)  + \r\n    sum (d.hire_all) filter (where d.month::date >=  GREATEST ((date_trunc('month', $form_multiselect_1::date - interval '10 months')), (pd.start_date + interval '1 months'))  and d.month::date <= date_trunc('month', $form_multiselect_1::date)::date) +\r\n    sum (d.transfer_in) filter (where d.month::date >=  GREATEST ((date_trunc('month', $form_multiselect_1::date - interval '10 months')), (pd.start_date + interval '1 months'))  and d.month::date <= date_trunc('month', $form_multiselect_1::date)::date)\r\n    as max_size\r\n\r\nFROM pre_date pd\r\nLEFT JOIN ys_all_dinamika_aktivnoy_chislennosti d \r\n     ON pd.mngt_unit_rk = d.mngt_unit_rk\r\n    AND pd.lvl = d.lvl\r\n    AND pd.mngt_unit_nm = d.mngt_unit_nm\r\n    AND pd.type_flg = d.type_flg\r\n    AND pd.new_management_unit_nm = d.new_management_unit_nm\r\n   \r\n\r\nGROUP BY pd.mngt_unit_rk, pd.lvl, pd.mngt_unit_nm, pd.start_date, pd.end_date, pd.new_management_unit_nm ,pd.type_flg\r\n-- limit 10\r\n\r\n;\r\n\r\nselect * from ys_all_waterfall_chislennosti\r\n\r\n\r\n\r\n\r\n\r\n"
    isEnabled: true
    color: "#FDC454"

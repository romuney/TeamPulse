    code: "drop table if exists experience_sl_gpd_fire_reason_a_reason_group ;\r\ncreate table experience_sl_gpd_fire_reason_a_reason_group   as\r\n\r\n\r\nSELECT \r\n    o.month,\r\n    o.mngt_unit_rk,\r\n    o.mngt_unit_nm,\r\n    o.lvl,\r\n    o.type_flg,\r\n    o.experience_group_nm,\r\n    o.fire_reason,\r\n    o.ottok,\r\n    coalesce (e.employee_amt,0) as employee_amt\r\nFROM \r\n    experience_sl_gpd_ottok_count_reason_group o\r\nLEFT JOIN \r\n    experience_sl_gpd_employee_count_reason_group e ON \r\n\r\n    o.month = e.month AND \r\n    o.mngt_unit_rk = e.mngt_unit_rk AND\r\n    o.mngt_unit_nm = e.mngt_unit_nm AND \r\n    o.lvl = e.lvl  AND\r\n    o.type_flg = e.type_flg and \r\n     o.experience_group_nm = e.experience_group_nm\r\n\r\n    \r\n\r\n    where  o.month::date <= date_trunc('month', $form_multiselect_1::date)::date\r\n    ;\r\n\r\n    select * from experience_sl_gpd_fire_reason_a_reason_group  where   mngt_unit_nm = 'BOSS' and type_flg= 'Все сотрудники'\r\n"
    isEnabled: true
  - sid: 019f034f-f438-767a-a919-115edae583f9
    title: experience_initiative_reason 
    shebang: gp
    code: "DROP TABLE IF EXISTS experience_initiative_reason;\r\nCREATE TABLE experience_initiative_reason AS\r\n\r\nWITH lag_ottok_count_reason_group AS (\r\n    SELECT \r\n        month,\r\n        mngt_unit_rk,\r\n        mngt_unit_nm,\r\n        lvl,\r\n        type_flg,\r\n        experience_group_nm,  -- ✅ Заменено: было fire_initiative → теперь experience_group_nm\r\n        fire_reason,\r\n        ottok AS ottok_amt,\r\n        employee_amt,\r\n        LAG(employee_amt) OVER (\r\n            PARTITION BY \r\n                mngt_unit_rk,\r\n                mngt_unit_nm,\r\n                lvl,\r\n                type_flg,\r\n                experience_group_nm,  -- ✅\r\n                fire_reason \r\n            ORDER BY month \r\n        ) AS lag_employee_amt\r\n    FROM experience_sl_gpd_fire_reason_a_reason_group\r\n    --where   mngt_unit_nm = 'BOSS' and type_flg= 'Все сотрудники' and experience_group_nm ='Стаж менее 3 мес'\r\n),\r\n\r\ntekuchest_ottok_count_reason_group AS (\r\n    SELECT\r\n        month,\r\n        mngt_unit_rk,\r\n        mngt_unit_nm,\r\n        lvl,\r\n        type_flg,\r\n        experience_group_nm,  -- ✅\r\n        fire_reason,\r\n        ottok_amt,\r\n        employee_amt,\r\n        lag_employee_amt,\r\n        CASE \r\n            WHEN lag_employee_amt IS NULL THEN employee_amt  \r\n            ELSE (lag_employee_amt + employee_amt) / (2*1.0) \r\n        END AS spch,\r\n        CASE \r\n            WHEN (CASE \r\n                    WHEN lag_employee_amt IS NULL THEN employee_amt  \r\n                    ELSE (lag_employee_amt + employee_amt) / (2*1.0)\r\n                  END) = 0 THEN 0\r\n            ELSE ottok_amt / ((CASE \r\n                                 WHEN lag_employee_amt IS NULL THEN employee_amt  \r\n                                 ELSE (lag_employee_amt + employee_amt) / (2*1.0) \r\n                               END) * 1.0)\r\n        END AS tekuchest\r\n    FROM lag_ottok_count_reason_group \r\n),\r\n\r\nff AS (\r\n    SELECT * FROM tekuchest_ottok_count_reason_group \r\n    WHERE 1=1\r\n      AND (\r\n        -- Предыдущий год (неполный, если анализ не за весь год)\r\n        (month >= MAKE_DATE(EXTRACT(YEAR FROM $form_multiselect_1::date)::INT - 1, 1, 1)\r\n         AND month < MAKE_DATE(EXTRACT(YEAR FROM $form_multiselect_1::date)::INT, 1, 1)\r\n         AND month + INTERVAL '1 year' <= $form_multiselect_1::date)\r\n        OR \r\n        -- Текущий год (с начала года до выбранной даты)\r\n        (month >= DATE_TRUNC('year', $form_multiselect_1::date))\r\n      )\r\n)\r\n\r\n, tekuchest_ottok_count_year_reason_group AS (\r\n    SELECT \r\n        mngt_unit_rk,\r\n        mngt_unit_nm,\r\n        lvl,\r\n        type_flg,\r\n        experience_group_nm,  -- ✅\r\n        fire_reason,\r\n        DATE_TRUNC('year', $form_multiselect_1::date)::DATE AS cur_year,\r\n        (DATE_TRUNC('year', $form_multiselect_1::date) - INTERVAL '1 year')::DATE AS prev_year,\r\n        COALESCE(SUM(ottok_amt) FILTER (\r\n            WHERE DATE_TRUNC('year', $form_multiselect_1::date) = DATE_TRUNC('year', month)\r\n        ), 0) AS ottok_cur_year_amt,\r\n        COALESCE(SUM(ottok_amt) FILTER (\r\n            WHERE (DATE_TRUNC('year', $form_multiselect_1::date) - INTERVAL '1 year') = DATE_TRUNC('year', month)\r\n        ), 0) AS ottok_prev_year_amt,\r\n        COALESCE(SUM(tekuchest) FILTER (\r\n            WHERE DATE_TRUNC('year', $form_multiselect_1::date) = DATE_TRUNC('year', month)\r\n        ), 0) AS tekuchest_cur_year_amt,\r\n        COALESCE(SUM(tekuchest) FILTER (\r\n            WHERE (DATE_TRUNC('year', $form_multiselect_1::date) - INTERVAL '1 year') = DATE_TRUNC('year', month)\r\n        ), 0) AS tekuchest_prev_year_amt\r\n    FROM ff\r\n    GROUP BY \r\n        1, 2, 3, 4, 5, 6, 7, 8  -- ✅ Включены: mngt_unit_rk, mngt_unit_nm, lvl, type_flg, experience_group_nm, fire_reason, cur_year, prev_year\r\n)\r\n\r\n-- Финальный SELECT с ранжированием\r\nSELECT \r\n    tekuchest_ottok_count_year_reason_group.*,\r\n    usr_cross_pub.cross_management_unit.new_management_unit_nm,\r\n    CASE\r\n        WHEN tekuchest_ottok_count_year_reason_group.experience_group_nm = 'до 1 года' THEN 1 \r\n        WHEN tekuchest_ottok_count_year_reason_group.experience_group_nm = 'от 1 до 3 лет' THEN 2\r\n        WHEN tekuchest_ottok_count_year_reason_group.experience_group_nm = 'от 3 до 5 лет' THEN 3\r\n        WHEN tekuchest_ottok_count_year_reason_group.experience_group_nm = 'от 5 до 10 лет' THEN 4\r\n        WHEN tekuchest_ottok_count_year_reason_group.experience_group_nm = 'свыше 10 лет' THEN 5\r\n        ELSE 6\r\n    END AS num_experience,  -- ✅ Ранжирование по стажу\r\n    ROW_NUMBER() OVER (\r\n        PARTITION BY experience_group_nm, mngt_unit_rk, type_flg \r\n        ORDER BY ottok_cur_year_amt DESC\r\n    ) AS rn  -- ✅ Ранжирование внутри группы опыта\r\nFROM tekuchest_ottok_count_year_reason_group \r\nLEFT JOIN usr_cross_pub.cross_management_unit\r\n    ON tekuchest_ottok_count_year_reason_group.mngt_unit_rk = usr_cross_pub.cross_management_unit.management_unit_rk;\r\n\r\n-- Проверка\r\nSELECT * FROM experience_initiative_reason \r\nWHERE mngt_unit_nm = 'BOSS' and type_flg = 'Все сотрудники' --and experience_group_nm = 'Стаж менее 3 мес'\r\n;"
    isEnabled: true
    color: "#BD978C"
  - sid: 019f034f-ffe5-7909-8aad-770661b15862
    title: experience_ottok_initiative
    shebang: gp
    code: "DROP TABLE IF EXISTS experience_ottok_initiative;\r\nCREATE TABLE experience_ottok_initiative AS\r\n\r\n-- Штатные сотрудники\r\nSELECT \r\n    month,\r\n    mngt_unit_rk,\r\n    mngt_unit_nm,\r\n    lvl,\r\n    'Штатные сотрудники' AS type_flg,\r\n    COALESCE(experience_group_nm, 'n/a')::TEXT AS experience_group_nm,\r\n    COUNT(mdm_employee_rk) FILTER (WHERE fire_flg = 1) AS ottok\r\nFROM dett\r\nWHERE 1=1\r\n    AND active_type_nm IN ('Активная', 'Подрядчики')\r\n    AND employment_relation_type_desc = 'Штатный сотрудник'\r\nGROUP BY 1, 2, 3, 4, 5, 6\r\n\r\nUNION ALL\r\n\r\n-- ГПД сотрудники\r\nSELECT \r\n    month,\r\n    mngt_unit_rk,\r\n    mngt_unit_nm,\r\n    lvl,\r\n    'ГПД сотрудники' AS type_flg,\r\n    COALESCE(experience_group_nm, 'n/a')::TEXT AS experience_group_nm,\r\n    COUNT(mdm_employee_rk) FILTER (WHERE fire_flg = 1) AS ottok\r\nFROM dett\r\nWHERE 1=1\r\n    AND active_type_nm IN ('Активная', 'Подрядчики')\r\n    AND employment_relation_type_desc <> 'Штатный сотрудник'\r\nGROUP BY 1, 2, 3, 4, 5, 6\r\n\r\nUNION ALL\r\n\r\n-- Все сотрудники\r\nSELECT \r\n    month,\r\n    mngt_unit_rk,\r\n    mngt_unit_nm,\r\n    lvl,\r\n    'Все сотрудники' AS type_flg,\r\n    COALESCE(experience_group_nm, 'n/a')::TEXT AS experience_group_nm,\r\n    COUNT(mdm_employee_rk) FILTER (WHERE fire_flg = 1) AS ottok\r\nFROM dett\r\nWHERE 1=1\r\n    AND active_type_nm IN ('Активная', 'Подрядчики')\r\nGROUP BY 1, 2, 3, 4, 5, 6;\r\n\r\n\r\nSELECT * FROM experience_ottok_initiative WHERE mngt_unit_nm = '1C HR Data'"
    isEnabled: true
  - sid: 019f0350-0ac3-7cb2-b345-b9a5ec602f62
    title: experience_initiative
    shebang: gp
    code: "DROP TABLE IF EXISTS experience_initiative;\r\nCREATE TABLE experience_initiative AS\r\n\r\nSELECT \r\n    o.month,\r\n    o.mngt_unit_rk,\r\n    o.mngt_unit_nm,\r\n    o.lvl,\r\n    o.type_flg,\r\n    o.experience_group_nm,  -- ✅ Заменено: было fire_initiative\r\n    o.ottok ,\r\n    COALESCE(e.employee_amt, 0) AS employee_amt  -- ✅ Добавлен COALESCE на случай отсутствия данных\r\nFROM \r\n    experience_ottok_initiative o\r\nLEFT JOIN \r\n    experience_sl_gpd_employee_count_reason_group e \r\n    ON o.month = e.month\r\n    AND o.mngt_unit_rk = e.mngt_unit_rk \r\n    AND o.mngt_unit_nm = e.mngt_unit_nm \r\n    AND o.lvl = e.lvl  \r\n    AND o.type_flg = e.type_flg\r\n    AND o.experience_group_nm = e.experience_group_nm  -- ✅ Джойн по experience_group_nm\r\nWHERE \r\n    o.month::DATE <= DATE_TRUNC('month', $form_multiselect_1::DATE)::DATE;\r\n\r\n-- Проверка\r\nSELECT * \r\nFROM experience_initiative  \r\nWHERE mngt_unit_nm = '1C HR Data';"
    isEnabled: true
  - sid: 019f0350-154a-7c90-a79b-5747259d1e8b
    title: experience_fire_initiative
    shebang: gp
    code: "DROP TABLE IF EXISTS experience_fire_initiative;\r\nCREATE TABLE experience_fire_initiative AS\r\n\r\nWITH lag_ottok_count_reason_group AS (\r\n    SELECT \r\n        month,\r\n        mngt_unit_rk,\r\n        mngt_unit_nm,\r\n        lvl,\r\n        type_flg,\r\n        experience_group_nm,  -- ✅ Заменено\r\n        ottok as ottok_amt,\r\n        employee_amt,\r\n        LAG(employee_amt) OVER (\r\n            PARTITION BY \r\n                mngt_unit_rk,\r\n                mngt_unit_nm,\r\n                lvl,\r\n                type_flg,\r\n                experience_group_nm  -- ✅ Заменено\r\n            ORDER BY month \r\n        ) AS lag_employee_amt\r\n    FROM experience_initiative  -- Убедитесь, что в `initiative` есть `experience_group_nm`\r\n),\r\n\r\ntekuchest_ottok_count_reason_group AS (\r\n    SELECT\r\n        month,\r\n        mngt_unit_rk,\r\n        mngt_unit_nm,\r\n        lvl,\r\n        type_flg,\r\n        experience_group_nm,  -- ✅\r\n        ottok_amt,\r\n        employee_amt,\r\n        CASE \r\n            WHEN lag_employee_amt IS NULL THEN employee_amt  \r\n            ELSE (lag_employee_amt + employee_amt) / (2*1.0) \r\n        END AS spch,\r\n        CASE \r\n            WHEN (CASE \r\n                    WHEN lag_employee_amt IS NULL THEN employee_amt  \r\n                    ELSE (lag_employee_amt + employee_amt) / (2*1.0) \r\n                  END) = 0 THEN 0\r\n            ELSE ottok_amt / ((CASE \r\n                                 WHEN lag_employee_amt IS NULL THEN employee_amt  \r\n                                 ELSE (lag_employee_amt + employee_amt) / (2*1.0)\r\n                               END) * 1.0)\r\n        END AS tekuchest\r\n    FROM lag_ottok_count_reason_group \r\n),\r\n\r\nff AS (\r\n    SELECT * FROM tekuchest_ottok_count_reason_group \r\n    WHERE 1=1\r\n      AND (\r\n        -- Предыдущий год (частично)\r\n        (month >= MAKE_DATE(EXTRACT(YEAR FROM $form_multiselect_1::date)::INT - 1, 1, 1)\r\n         AND month < MAKE_DATE(EXTRACT(YEAR FROM $form_multiselect_1::date)::INT, 1, 1)\r\n         AND month + INTERVAL '1 year' <= $form_multiselect_1::date)\r\n        OR \r\n        -- Текущий год\r\n        (month >= DATE_TRUNC('year', $form_multiselect_1::date))\r\n      )\r\n)\r\n\r\n, tekuchest_ottok_count_year_reason_group AS (\r\n    SELECT \r\n        mngt_unit_rk,\r\n        mngt_unit_nm,\r\n        lvl,\r\n        type_flg,\r\n        experience_group_nm,  -- ✅\r\n        DATE_TRUNC('year', $form_multiselect_1::date)::DATE AS cur_year,\r\n        (DATE_TRUNC('year', $form_multiselect_1::date) - INTERVAL '1 year')::DATE AS prev_year,\r\n        COALESCE(SUM(ottok_amt) FILTER (\r\n            WHERE DATE_TRUNC('year', $form_multiselect_1::date) = DATE_TRUNC('year', month)\r\n        ), 0) AS ottok_cur_year_amt,\r\n        COALESCE(SUM(ottok_amt) FILTER (\r\n            WHERE (DATE_TRUNC('year', $form_multiselect_1::date) - INTERVAL '1 year') = DATE_TRUNC('year', month)\r\n        ), 0) AS ottok_prev_year_amt,\r\n        COALESCE(SUM(tekuchest) FILTER (\r\n            WHERE DATE_TRUNC('year', $form_multiselect_1::date) = DATE_TRUNC('year', month)\r\n        ), 0) AS tekuchest_cur_year_amt,\r\n        COALESCE(SUM(tekuchest) FILTER (\r\n            WHERE (DATE_TRUNC('year', $form_multiselect_1::date) - INTERVAL '1 year') = DATE_TRUNC('year', month)\r\n        ), 0) AS tekuchest_prev_year_amt\r\n    FROM ff\r\n    GROUP BY \r\n        1, 2, 3, 4, 5, 6, 7  -- ✅ Включая experience_group_nm (5), cur_year (6), prev_year (7)\r\n)\r\n\r\n-- Финальный SELECT\r\nSELECT \r\n    tekuchest_ottok_count_year_reason_group.*,\r\n    CASE\r\n        WHEN tekuchest_ottok_count_year_reason_group.experience_group_nm = 'до 1 года' THEN 1 \r\n        WHEN tekuchest_ottok_count_year_reason_group.experience_group_nm = 'от 1 до 3 лет' THEN 2\r\n        WHEN tekuchest_ottok_count_year_reason_group.experience_group_nm = 'от 3 до 5 лет' THEN 3\r\n        WHEN tekuchest_ottok_count_year_reason_group.experience_group_nm = 'от 5 до 10 лет' THEN 4\r\n        WHEN tekuchest_ottok_count_year_reason_group.experience_group_nm = 'свыше 10 лет' THEN 5\r\n        ELSE 6\r\n    END AS num_experience,  -- ✅ Ранжирование по стажу\r\n    ROW_NUMBER() OVER (\r\n        PARTITION BY experience_group_nm, mngt_unit_rk, type_flg \r\n        ORDER BY ottok_cur_year_amt DESC\r\n    ) AS rn  -- ✅ Ранжирование внутри группы опыта\r\nFROM tekuchest_ottok_count_year_reason_group;\r\n\r\n-- Проверка\r\nSELECT * FROM experience_fire_initiative WHERE mngt_unit_nm = '1C HR Data';"
    isEnabled: true
    color: "#BD978C"
  - sid: 019eff3b-7a50-7333-b5a9-a208d4c140d5
    title: experience_initiative_reason_unit_tekuchest
    shebang: gp
    code: "drop table if exists experience_initiative_reason_unit_tekuchest  ;\r\ncreate table  experience_initiative_reason_unit_tekuchest   as\r\n\r\n\r\nselect \r\nexperience_initiative_reason.*\r\n,experience_fire_initiative.ottok_cur_year_amt  as initiative_ottok_cur_year_amt\r\n,experience_fire_initiative.ottok_prev_year_amt as initiative_ottok_prev_year_amt\r\n,experience_fire_initiative.tekuchest_cur_year_amt as initiative_tekuchest_cur_year_amt\r\n,experience_fire_initiative.tekuchest_prev_year_amt as initiative_tekuchest_prev_year_amt\r\n,unit_tekuchest_ottok_all.ottok_cur_year_amt  as unit_ottok_cur_year_amt\r\n,unit_tekuchest_ottok_all.ottok_prev_year_amt as unit_ottok_prev_year_amt\r\n,unit_tekuchest_ottok_all.tekuchest_cur_year_amt as unit_tekuchest_cur_year_amt\r\n,unit_tekuchest_ottok_all.tekuchest_prev_year_amt as unit_tekuchest_prev_year_amt\r\n\r\nfrom experience_initiative_reason \r\nleft join experience_fire_initiative \r\n    on experience_initiative_reason.mngt_unit_rk = experience_fire_initiative.mngt_unit_rk\r\n    and experience_initiative_reason.type_flg = experience_fire_initiative.type_flg\r\n    and experience_initiative_reason.experience_group_nm = experience_fire_initiative.experience_group_nm\r\nleft join unit_tekuchest_ottok_all \r\n    on experience_initiative_reason.mngt_unit_rk = unit_tekuchest_ottok_all.mngt_unit_rk\r\n    and experience_initiative_reason.type_flg = unit_tekuchest_ottok_all.type_flg\r\n\r\n--where experience_initiative_reason.mngt_unit_nm = 'Сервис линии'\r\n\r\n;\r\ndrop table if exists usr_cross_data.experience_initiative_reason_unit_tekuchest  ;\r\ncreate table  usr_cross_data.experience_initiative_reason_unit_tekuchest   as\r\n\r\nselect \r\nmngt_unit_rk\r\n,mngt_unit_nm\r\n,new_management_unit_nm\r\n,lvl\r\n,type_flg\r\n,experience_group_nm\r\n,fire_reason\r\n,cur_year\r\n,prev_year\r\n-- ,ottok_cur_year_amt\r\n-- ,ottok_prev_year_amt\r\n,round (tekuchest_cur_year_amt, 6) as tekuchest_cur_year_amt\r\n,round (tekuchest_prev_year_amt, 6) as tekuchest_prev_year_amt\r\n,rn\r\n-- ,initiative_ottok_cur_year_amt\r\n-- ,initiative_ottok_prev_year_amt\r\n,round (initiative_tekuchest_cur_year_amt, 6) as initiative_tekuchest_cur_year_amt\r\n,round (initiative_tekuchest_prev_year_amt, 6) as initiative_tekuchest_prev_year_amt\r\n\r\n from experience_initiative_reason_unit_tekuchest\r\n\r\n where --mngt_unit_nm = 'Сервис линии' and \r\n rn in (1,2,3) --and type_flg = 'Все сотрудники'\r\n"
    isEnabled: true
    color: "#EC4040"

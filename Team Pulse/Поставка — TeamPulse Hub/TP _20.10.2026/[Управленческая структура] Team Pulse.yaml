    code: "DROP TABLE IF EXISTS izmen_perevody_plus;\r\nCREATE TABLE izmen_perevody_plus AS\r\n\r\nSELECT \r\n    DATE_TRUNC('month', calendar_dt::DATE)::DATE AS month,\r\n    type_flg,\r\n    mngt_unit_rk,\r\n    mngt_unit_nm,\r\n    lvl,\r\n    parent_mngt_unit_rk,\r\n    parent_mngt_unit_nm,\r\n    parent_lvl,\r\n    SUM(perevody_plus) AS perevody_plus\r\nFROM izmen_pre_perevody_plus\r\nWHERE calendar_dt::DATE >= DATE_TRUNC('month', $form_multiselect_1::DATE - INTERVAL '25 months')::DATE\r\nGROUP BY \r\n    1, 2, 3, 4, 5, 6, 7, 8\r\n     distributed by (mngt_unit_rk,month,type_flg)\r\n    \r\n    ;\r\n\r\n-- Проверка\r\nSELECT * \r\nFROM izmen_perevody_plus \r\nWHERE mngt_unit_nm = 'Сервис линии'\r\nORDER BY month DESC;\r\n\r\n\r\nselect * from izmen_pre_perevody_plus\r\nwhere (parent_mngt_unit_nm = 'Executive отчеты для команд и руководителей' or mngt_unit_nm = 'Executive отчеты для команд и руководителей') \r\nand calendar_dt='2026-04-13';\r\n\r\nselect * from izmen_pre_perevody_plus\r\nwhere mdm_employee_rk = 676965;"

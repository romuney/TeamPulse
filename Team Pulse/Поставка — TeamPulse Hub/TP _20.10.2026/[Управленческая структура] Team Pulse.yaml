    code: "drop table if exists sl_gpd_fire_reason_a_reason_group ;\r\ncreate table sl_gpd_fire_reason_a_reason_group   as\r\n\r\n\r\nSELECT \r\n    o.month,\r\n    o.mngt_unit_rk,\r\n    o.mngt_unit_nm,\r\n    o.lvl,\r\n    o.type_flg,\r\n    o.fire_initiative,\r\n    o.fire_reason,\r\n    o.ottok,\r\n    e.employee_amt\r\nFROM \r\n    sl_gpd_ottok_count_reason_group o\r\nLEFT JOIN \r\n    sl_gpd_employee_count_reason_group e ON \r\n\r\n    o.month = e.month AND \r\n    o.mngt_unit_rk = e.mngt_unit_rk AND\r\n    o.mngt_unit_nm = e.mngt_unit_nm AND \r\n    o.lvl = e.lvl  AND\r\n    --o.fire_initiative = e.fire_initiative AND\r\n    o.type_flg = e.type_flg\r\n    \r\n\r\n    where  o.month::date <= date_trunc('month', $form_multiselect_1::date)::date\r\n    ;\r\n\r\n    select * from sl_gpd_fire_reason_a_reason_group  where   mngt_unit_nm = '1C HR Data'\r\n"
    isEnabled: true
  - sid: 019eff3b-3b9e-740f-9177-af58bd05127a
    title: initiative_reason
    shebang: gp
    code: "\r\ndrop table if exists  initiative_reason ;\r\ncreate table  initiative_reason   as\r\n\r\nWITH lag_ottok_count_reason_group  AS (\r\nselect \r\nmonth\r\n,mngt_unit_rk\r\n,mngt_unit_nm\r\n,lvl\r\n,type_flg\r\n,fire_initiative\r\n,fire_reason\r\n,ottok as ottok_amt\r\n,employee_amt\r\n,lag(employee_amt) OVER (PARTITION BY \r\nmngt_unit_rk\r\n,mngt_unit_nm\r\n,lvl\r\n,type_flg\r\n,fire_initiative\r\n,fire_reason ORDER BY month ) as lag_employee_amt\r\nfrom sl_gpd_fire_reason_a_reason_group\r\n)\r\n, tekuchest_ottok_count_reason_group  AS (\r\nselect\r\nmonth \r\n,mngt_unit_rk\r\n,mngt_unit_nm\r\n,lvl\r\n,type_flg\r\n,fire_initiative\r\n,fire_reason\r\n,ottok_amt\r\n,employee_amt\r\n, case when lag_employee_amt is null then employee_amt  else (lag_employee_amt+employee_amt) / (2*1.0) end as spch\r\n ,case when (case when lag_employee_amt is null then employee_amt  else (lag_employee_amt+employee_amt) / (2*1.0) end)=0 then 0\r\n else (ottok_amt /  ((case when lag_employee_amt is null then employee_amt  else (lag_employee_amt+employee_amt) / (2*1.0) end)*1.0))\r\n end  as tekuchest\r\n\r\n from lag_ottok_count_reason_group \r\n)\r\n, ff as (\r\n\r\n    select * from tekuchest_ottok_count_reason_group \r\n    where 1=1\r\nand \r\n(\r\n (month >= MAKE_DATE(EXTRACT(YEAR FROM $form_multiselect_1::date)::INT - 1, 1, 1)\r\n  AND month < MAKE_DATE(EXTRACT(YEAR FROM $form_multiselect_1::date)::INT, 1, 1)\r\n  AND month + INTERVAL '1 year' <= $form_multiselect_1::date) \r\n or \r\n ( month>=   date_trunc('year',$form_multiselect_1::date) )\r\n)\r\n)\r\n\r\n, tekuchest_ottok_count_year_reason_group  AS (\r\n select \r\nmngt_unit_rk\r\n,mngt_unit_nm\r\n,lvl\r\n,type_flg\r\n,fire_initiative\r\n,fire_reason\r\n,date_trunc('year',$form_multiselect_1::date )::date  as cur_year\r\n,(date_trunc('year',$form_multiselect_1::date)  - interval '1 year')::date as prev_year\r\n,coalesce( sum(ottok_amt) filter (where date_trunc('year',$form_multiselect_1::date ) = date_trunc('year',month )) ,0) as ottok_cur_year_amt\r\n,coalesce( sum(ottok_amt) filter (where (date_trunc('year',$form_multiselect_1::date)  - interval '1 year')::date= date_trunc('year',month )) ,0) as ottok_prev_year_amt\r\n,coalesce( sum(tekuchest) filter (where date_trunc('year',$form_multiselect_1::date ) = date_trunc('year',month )) ,0) as tekuchest_cur_year_amt\r\n,coalesce( sum(tekuchest) filter (where (date_trunc('year',$form_multiselect_1::date)  - interval '1 year')::date= date_trunc('year',month )) ,0) as tekuchest_prev_year_amt\r\n\r\nfrom ff\r\n\r\nwhere 1=1\r\ngroup by 1,2,3,4,5,6,7,8\r\n)\r\n \r\n\r\nselect tekuchest_ottok_count_year_reason_group.* ,usr_cross_pub.cross_management_unit.new_management_unit_nm\r\n,case\r\nwhen tekuchest_ottok_count_year_reason_group.fire_initiative='Инициатива работодателя' then 1 \r\nwhen tekuchest_ottok_count_year_reason_group.fire_initiative='Инициатива работника' then 2\r\nwhen tekuchest_ottok_count_year_reason_group.fire_initiative='Прочее' then 3\r\nend as num_experience\r\n,row_number() OVER (PARTITION BY fire_initiative,mngt_unit_rk,type_flg ORDER BY ottok_cur_year_amt DESC) as rn\r\n\r\nfrom tekuchest_ottok_count_year_reason_group \r\n\r\nleft join usr_cross_pub.cross_management_unit\r\non tekuchest_ottok_count_year_reason_group.mngt_unit_rk = usr_cross_pub.cross_management_unit.management_unit_rk\r\n;\r\n\r\nselect * from  initiative_reason where mngt_unit_nm = '1C HR Data'\r\n"
    isEnabled: true
    color: "#BD978C"
  - sid: 019f02f5-80bf-7989-bb20-d52c2e896e74

    code: "drop table if exists experience_sl_gpd_ottok_count_reason_group ;\r\ncreate table experience_sl_gpd_ottok_count_reason_group  as\r\n\r\nSELECT \r\n    month,\r\n    mngt_unit_rk,\r\n    mngt_unit_nm,\r\n    lvl,\r\n    'Штатные сотрудники' AS type_flg,\r\n    COALESCE(fire_reason, 'n/a')::TEXT AS fire_reason,\r\n    COALESCE(experience_group_nm, 'n/a')::TEXT AS experience_group_nm,\r\n    COUNT(mdm_employee_rk) FILTER (WHERE fire_flg = 1) AS ottok\r\nFROM dett\r\nWHERE 1=1\r\n    AND active_type_nm IN ('Активная', 'Подрядчики')\r\n    AND employment_relation_type_desc = 'Штатный сотрудник'\r\nGROUP BY 1, 2, 3, 4, 5, 6, 7\r\n\r\nUNION ALL\r\n\r\nSELECT \r\n    month,\r\n    mngt_unit_rk,\r\n    mngt_unit_nm,\r\n    lvl,\r\n    'ГПД сотрудники' AS type_flg,\r\n    COALESCE(fire_reason, 'n/a')::TEXT AS fire_reason,\r\n    COALESCE(experience_group_nm, 'n/a')::TEXT AS experience_group_nm,\r\n    COUNT(mdm_employee_rk) FILTER (WHERE fire_flg = 1) AS ottok\r\nFROM dett\r\nWHERE 1=1\r\n    AND active_type_nm IN ('Активная', 'Подрядчики')\r\n    AND employment_relation_type_desc <> 'Штатный сотрудник'\r\nGROUP BY 1, 2, 3, 4, 5, 6, 7\r\n\r\nUNION ALL\r\n\r\nSELECT \r\n    month,\r\n    mngt_unit_rk,\r\n    mngt_unit_nm,\r\n    lvl,\r\n    'Все сотрудники' AS type_flg,\r\n    COALESCE(fire_reason, 'n/a')::TEXT AS fire_reason,\r\n    COALESCE(experience_group_nm, 'n/a')::TEXT AS experience_group_nm,  -- ✅ Заменено: было fire_initiative → теперь experience_group_nm\r\n    COUNT(mdm_employee_rk) FILTER (WHERE fire_flg = 1) AS ottok\r\nFROM dett\r\nWHERE 1=1\r\n    AND active_type_nm IN ('Активная', 'Подрядчики')\r\nGROUP BY 1, 2, 3, 4, 5, 6, 7;\r\n\r\nselect * from experience_sl_gpd_ottok_count_reason_group where mngt_unit_nm = 'BOSS'  -- where  new_management_unit_nm = 'BOSS'"

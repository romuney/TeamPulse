    code: "DROP TABLE IF EXISTS izmen_ottok_employee;\r\nCREATE TABLE izmen_ottok_employee AS\r\n\r\n-- Все сотрудники\r\nSELECT \r\n    month,\r\n    'Все сотрудники' AS type_flg,\r\n    mngt_unit_rk,\r\n    mngt_unit_nm,\r\n    lvl,\r\n    parent_mngt_unit_rk,\r\n    parent_mngt_unit_nm,\r\n    parent_lvl,\r\n    SUM(employee_amt) AS employee_amt\r\nFROM izmen_ottok_em\r\nWHERE active_type_nm IN ('Активная', 'Подрядчики')\r\nGROUP BY \r\n    month,\r\n    type_flg,\r\n    mngt_unit_rk,\r\n    mngt_unit_nm,\r\n    lvl,\r\n    parent_mngt_unit_rk,\r\n    parent_mngt_unit_nm,\r\n    parent_lvl\r\n\r\nUNION ALL\r\n\r\n-- Штатные сотрудники\r\nSELECT \r\n    month,\r\n    'Штатные сотрудники' AS type_flg,\r\n    mngt_unit_rk,\r\n    mngt_unit_nm,\r\n    lvl,\r\n    parent_mngt_unit_rk,\r\n    parent_mngt_unit_nm,\r\n    parent_lvl,\r\n    SUM(employee_amt) AS employee_amt\r\nFROM izmen_ottok_em\r\nWHERE active_type_nm IN ('Активная', 'Подрядчики')\r\n  AND employment_relation_type_desc = 'Штатный сотрудник'\r\nGROUP BY \r\n    month,\r\n    type_flg,\r\n    mngt_unit_rk,\r\n    mngt_unit_nm,\r\n    lvl,\r\n    parent_mngt_unit_rk,\r\n    parent_mngt_unit_nm,\r\n    parent_lvl\r\n\r\nUNION ALL\r\n\r\n-- ГПД сотрудники\r\nSELECT \r\n    month,\r\n    'ГПД сотрудники' AS type_flg,\r\n    mngt_unit_rk,\r\n    mngt_unit_nm,\r\n    lvl,\r\n    parent_mngt_unit_rk,\r\n    parent_mngt_unit_nm,\r\n    parent_lvl,\r\n    SUM(employee_amt) AS employee_amt\r\nFROM izmen_ottok_em\r\nWHERE active_type_nm IN ('Активная', 'Подрядчики')\r\n  AND employment_relation_type_desc <> 'Штатный сотрудник'\r\nGROUP BY \r\n    month,\r\n    type_flg,\r\n    mngt_unit_rk,\r\n    mngt_unit_nm,\r\n    lvl,\r\n    parent_mngt_unit_rk,\r\n    parent_mngt_unit_nm,\r\n    parent_lvl;"

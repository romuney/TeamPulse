 AS perevod_v_bg,\r\n      COUNT(mdm_employee_rk) FILTER (WHERE transfer_internal_flg = 1) AS perevod_stazhera_v_shtat_amt,\r\n      COUNT(mdm_employee_rk) FILTER (WHERE hire_flg = 1 AND active_type_nm = 'Активная') AS naym_amt,\r\n      COUNT(mdm_employee_rk) FILTER (WHERE hire_flg = 1 AND active_type_nm IN ('Активная', 'Подрядчики')) AS ap_naym_amt,\r\n      COUNT(mdm_employee_rk) AS employee_amt\r\n\r\nFROM usr_cross_data.hr_executive_proteus \r\nWHERE 1=1\r\n    AND lvl10_mapped_management_unit_rk IS NOT NULL\r\n    AND lvl10_mapped_management_unit_rk <> '-'\r\n      AND (\r\n        transfer_candidate_flg = 1 \r\n        OR transfer_internal_flg = 1 \r\n        OR (hire_flg = 1 AND active_type_nm IN ('Активная', 'Подрядчики'))\r\n      )\r\n    AND calendar_dt::DATE>=date_trunc('month', $form_multiselect_1::date - interval '25 months')::date\r\nGROUP BY \r\n    1, 2, 3, 4, 5, 6\r\n\r\nunion all\r\n-- LVL 11\r\nSELECT  \r\n    DATE_TRUNC('month', calendar_dt::DATE)::DATE AS month,\r\n    lvl11_mapped_management_unit_rk::TEXT AS mngt_unit_rk,\r\n    lvl11_mapped_management_unit_nm::TEXT AS mngt_unit_nm,\r\n    11::TEXT AS lvl,\r\n    -- Атрибуты сотрудника\r\n    COALESCE(active_type_nm::TEXT, 'n/a') AS active_type_nm,\r\n    COALESCE(employment_relation_type_desc::TEXT, 'n/a') AS employment_relation_type_desc,\r\n    -- Метрика\r\n          COUNT(mdm_employee_rk) FILTER (WHERE transfer_candidate_flg = 1) AS perevod_v_bg,\r\n      COUNT(mdm_employee_rk) FILTER (WHERE transfer_internal_flg = 1) AS perevod_stazhera_v_shtat_amt,\r\n      COUNT(mdm_employee_rk) FILTER (WHERE hire_flg = 1 AND active_type_nm = 'Активная') AS naym_amt,\r\n      COUNT(mdm_employee_rk) FILTER (WHERE hire_flg = 1 AND active_type_nm IN ('Активная', 'Подрядчики')) AS ap_naym_amt,\r\n      COUNT(mdm_employee_rk) AS employee_amt\r\n      \r\nFROM usr_cross_data.hr_executive_proteus \r\nWHERE 1=1\r\n    AND lvl11_mapped_management_unit_rk IS NOT NULL\r\n    AND lvl11_mapped_management_unit_rk <
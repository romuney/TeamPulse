  - sid: 019efe5a-d2ed-727d-9a1e-df8b01382e84
    title: Untitled 20
    shebang: gp
    code: "drop table if exists fire_initiative ;\r\ncreate table fire_initiative   as\r\n\r\nSELECT \r\n        month,\r\n        mngt_unit_rk,\r\n        mngt_unit_nm,\r\n        lvl,\r\n        'Штатные сотрудники' as type_flg,\r\n        COUNT(mdm_employee_rk) FILTER (WHERE fire_flg = 1) AS ottok,\r\n        COUNT(mdm_employee_rk) FILTER (WHERE fire_flg = 1 AND fire_initiative = 'Прочее') AS procheye_ottok,\r\n        COUNT(mdm_employee_rk) FILTER (WHERE fire_flg = 1 AND fire_initiative = 'Инициатива работника') AS initsiativa_rabotnika_ottok,\r\n        COUNT(mdm_employee_rk) FILTER (WHERE fire_flg = 1 AND fire_initiative = 'Инициатива работодателя') AS initsiativa_rabotodatelya_ottok,\r\n        COUNT(mdm_employee_rk) FILTER (\r\n            WHERE last_day_of_month_flg = 1 \r\n              AND fire_flg = 0\r\n        ) AS employee_amt\r\n    FROM \r\n        dett\r\n    WHERE 1=1\r\n        AND active_type_nm IN ('Активная', 'Подрядчики')\r\n        AND employment_relation_type_desc = 'Штатный сотрудник'\r\n\r\n    GROUP BY \r\n        1,2,3,4,5\r\n\r\n        union all \r\n\r\nSELECT \r\n        month,\r\n        mngt_unit_rk,\r\n        mngt_unit_nm,\r\n        lvl,\r\n        'ГПД сотрудники' as type_flg,\r\n        COUNT(mdm_employee_rk) FILTER (WHERE fire_flg = 1) AS ottok,\r\n        COUNT(mdm_employee_rk) FILTER (WHERE fire_flg = 1 AND fire_initiative = 'Прочее') AS procheye_ottok,\r\n        COUNT(mdm_employee_rk) FILTER (WHERE fire_flg = 1 AND fire_initiative = 'Инициатива работника') AS initsiativa_rabotnika_ottok,\r\n        COUNT(mdm_employee_rk) FILTER (WHERE fire_flg = 1 AND fire_initiative = 'Инициатива работодателя') AS initsiativa_rabotodatelya_ottok,\r\n        COUNT(mdm_employee_rk) FILTER (\r\n            WHERE last_day_of_month_flg = 1 \r\n              AND fire_flg = 0\r\n        ) AS employee_amt\r\n    FROM \r\n        dett\r\n    WHERE 1=1\r\n        AND active_type_nm IN ('Активная', 'Подрядчики')\r\n        AND employment_relation_type_desc <> 'Штатный сотрудник'\r\n\r\n    GROUP BY \r\n        1,2,3,4,5     \r\n\r\nunion all \r\n\r\n        SELECT \r\n        month,\r\n        mngt_unit_rk,\r\n        mngt_unit_nm,\r\n        lvl,\r\n        'Все сотрудники' as type_flg,\r\n        COUNT(mdm_employee_rk) FILTER (WHERE fire_flg = 1) AS ottok,\r\n        COUNT(mdm_employee_rk) FILTER (WHERE fire_flg = 1 AND fire_initiative = 'Прочее') AS procheye_ottok,\r\n        COUNT(mdm_employee_rk) FILTER (WHERE fire_flg = 1 AND fire_initiative = 'Инициатива работника') AS initsiativa_rabotnika_ottok,\r\n        COUNT(mdm_employee_rk) FILTER (WHERE fire_flg = 1 AND fire_initiative = 'Инициатива работодателя') AS initsiativa_rabotodatelya_ottok,\r\n        COUNT(mdm_employee_rk) FILTER (\r\n            WHERE last_day_of_month_flg = 1 \r\n              AND fire_flg = 0\r\n        ) AS employee_amt\r\n    FROM \r\n        dett\r\n    WHERE 1=1\r\n        AND active_type_nm IN ('Активная', 'Подрядчики')\r\n    GROUP BY \r\n        1,2,3,4,5     \r\n\r\n;\r\n\r\nselect * from fire_initiative where mngt_unit_nm = 'Сервис линии' ;"
    isEnabled: true

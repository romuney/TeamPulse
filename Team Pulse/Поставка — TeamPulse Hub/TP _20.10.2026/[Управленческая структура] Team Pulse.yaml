    code: "drop table if exists perevody_minus;\r\ncreate table perevody_minus as\r\n\r\n\r\nselect  date_trunc('month',calendar_dt::date )::date as month \r\n, type_flg\r\n, mngt_unit_rk\r\n, mngt_unit_nm \r\n,lvl\r\n,sum( perevody_minus) as perevody_minus\r\n   from pre_perevody_minus\r\nwhere   calendar_dt::date >=  date_trunc('month', $form_multiselect_1::date - interval '25 months')::date\r\n\r\ngroup by 1,2,3,4,5\r\n;\r\n\r\nselect * from perevody_minus where mngt_unit_nm = 'Сервис линии' ;"
    isEnabled: true
    color: "#1BA6CE"
  - sid: 019ef993-d4ad-723d-92aa-8babc02a8eb8
    title: dinamika_aktivnoy_chislennosti
    shebang: gp
    code: "drop table if exists ys_all_dinamika_aktivnoy_chislennosti1 ;\r\ncreate table ys_all_dinamika_aktivnoy_chislennosti1    as\r\n\r\nwith scelet as (\r\n    select distinct   month, mngt_unit_rk, lvl, mngt_unit_nm,type_flg\r\n    from last_day_ottok_naym_all\r\n    union \r\n    select distinct    month, mngt_unit_rk, lvl, mngt_unit_nm,type_flg\r\n    from perevody_plus\r\n    union \r\n    select  distinct    month, mngt_unit_rk, lvl, mngt_unit_nm,type_flg\r\n    from perevody_minus\r\n)  \r\n\r\nselect scelet.*\r\n    ,usr_cross_pub.cross_management_unit.new_management_unit_nm\r\n    ,coalesce(table_lvl.employee_amt,0) as cnt_employee\r\n    ,coalesce(table_lvl.ottok_amt,0) as fire\r\n\r\n    ,coalesce(table_lvl.perevod_v_bg,0) AS hire_bg --  перевод в БГ (тултип)\r\n    ,coalesce(table_lvl.perevod_stazhera_v_shtat_amt,0) AS hire_inter -- стажеров в штат (тултип)\r\n    ,coalesce(table_lvl.employee_naym,0) AS hire_all -- то что в бары всего на верху\r\n    ,coalesce(table_lvl.ap_naym_amt,0) AS hire_only  --   найм  (тултип)\r\n\r\n\r\n    ,coalesce( perevody_plus.perevody_plus,0) as transfer_in\r\n    ,coalesce( perevody_minus.perevody_minus,0) as transfer_out\r\nfrom scelet \r\nleft join last_day_ottok_naym_all table_lvl\r\n    on scelet.month = table_lvl.month\r\n    and scelet.mngt_unit_rk = table_lvl.mngt_unit_rk\r\n    and scelet.type_flg = table_lvl.type_flg\r\nleft join perevody_plus\r\n    on scelet.month = perevody_plus.month\r\n    and scelet.mngt_unit_rk = perevody_plus.mngt_unit_rk\r\n    and scelet.type_flg  = perevody_plus.type_flg\r\nleft join perevody_minus\r\n    on scelet.month = perevody_minus.month\r\n    and scelet.mngt_unit_rk = perevody_minus.mngt_unit_rk\r\n    and scelet.type_flg  = perevody_minus.type_flg\r\nleft join usr_cross_pub.cross_management_unit\r\n    on scelet.mngt_unit_rk = usr_cross_pub.cross_management_unit.management_unit_rk\r\n\r\ndistributed by (mngt_unit_rk,month)\r\n;\r\n\r\nselect * from  ys_all_dinamika_aktivnoy_chislennosti1   where mngt_unit_nm = 'Сервис линии'\r\n"
    isEnabled: true
  - sid: 019f1e5e-f8f0-7cad-9971-2ba1e52a1506
    title: ys_all_dinamika_aktivnoy_chislennosti
    shebang: gp
    code: "drop table if exists ys_all_dinamika_aktivnoy_chislennosti ;\r\ncreate table ys_all_dinamika_aktivnoy_chislennosti    as\r\n\r\n\r\nselect * \r\n    , row_number() over ( partition by mngt_unit_rk, type_flg  order by month) as row_nm\r\n    , count(month) over(partition by mngt_unit_rk, type_flg) as size_array\r\n    , max(cnt_employee) over(partition by mngt_unit_rk, type_flg) as max_width_cnt\r\n    , max(fire) over(partition by mngt_unit_rk, type_flg) as max_width_fire\r\n    , max(hire_all) over(partition by mngt_unit_rk, type_flg) as max_width_hire\r\n    , lag(cnt_employee) over (partition by mngt_unit_rk, type_flg order by month) as prev_cnt\r\n    , max(transfer_in) over(partition by mngt_unit_rk, type_flg) AS max_width_transfer_in\r\n    , max(transfer_out) over(partition by mngt_unit_rk, type_flg)  AS max_width_transfer_out\r\n\r\nfrom ys_all_dinamika_aktivnoy_chislennosti1 \r\n\r\nwhere 1=1\r\n-- and new_management_unit_nm = 'Сервис линии'\r\n    and month::date >=  date_trunc('month', $form_multiselect_1::date - interval '11 months')::date\r\n    and month::date <= date_trunc('month', $form_multiselect_1::date)::date\r\n --limit 100;"
    isEnabled: true
    color: "#FDC454"

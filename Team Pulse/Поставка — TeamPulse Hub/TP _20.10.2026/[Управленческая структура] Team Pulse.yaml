    code: "drop table if exists sl_gpd_ottok_count_reason_group ;\r\ncreate table sl_gpd_ottok_count_reason_group  as\r\n\r\nSELECT \r\n        month,\r\n        mngt_unit_rk,\r\n        mngt_unit_nm,\r\n        lvl,\r\n        'Штатные сотрудники' as type_flg,\r\n        COALESCE(fire_reason, 'n/a')::TEXT AS fire_reason,\r\n        COALESCE(fire_initiative, 'n/a')::TEXT AS fire_initiative,\r\n        COUNT(mdm_employee_rk) FILTER (WHERE fire_flg = 1) AS ottok\r\n    FROM dett\r\n    where 1=1\r\n        AND active_type_nm IN ('Активная', 'Подрядчики')\r\n        AND employment_relation_type_desc = 'Штатный сотрудник'\r\n        group by 1,2,3,4,5,6,7\r\n\r\n        union all \r\n\r\nSELECT \r\n        month,\r\n        mngt_unit_rk,\r\n        mngt_unit_nm,\r\n        lvl,\r\n        'ГПД сотрудники' as type_flg,\r\n        COALESCE(fire_reason, 'n/a')::TEXT AS fire_reason,\r\n        COALESCE(fire_initiative, 'n/a')::TEXT AS fire_initiative,\r\n        COUNT(mdm_employee_rk) FILTER (WHERE fire_flg = 1) AS ottok\r\n    FROM dett\r\n    where 1=1\r\n        AND active_type_nm IN ('Активная', 'Подрядчики')\r\n        AND employment_relation_type_desc <> 'Штатный сотрудник'\r\n        group by 1,2,3,4,5,6,7\r\nunion all\r\nSELECT \r\n        month,\r\n        mngt_unit_rk,\r\n        mngt_unit_nm,\r\n        lvl,\r\n        'Все сотрудники' as type_flg,\r\n        COALESCE(fire_reason, 'n/a')::TEXT AS fire_reason,\r\n        COALESCE(fire_initiative, 'n/a')::TEXT AS fire_initiative,\r\n        COUNT(mdm_employee_rk) FILTER (WHERE fire_flg = 1) AS ottok\r\n    FROM dett\r\n    where 1=1\r\n        AND active_type_nm IN ('Активная', 'Подрядчики')\r\n\r\n        group by 1,2,3,4,5,6,7                \r\n;\r\nselect * from sl_gpd_ottok_count_reason_group\r\nwhere mngt_unit_nm = '1C HR Data' "
    isEnabled: true

    code: " drop table if exists dett;\r\n create table dett   as\r\n\r\nSELECT \r\n        DATE_TRUNC('month', calendar_dt)::DATE AS month\r\n        ,lvl2_mapped_management_unit_rk::TEXT AS mngt_unit_rk\r\n        ,lvl2_mapped_management_unit_nm::TEXT AS mngt_unit_nm\r\n        ,2::INT AS lvl\r\n        ,COALESCE(experience_group_nm, 'n/a')::TEXT AS experience_group_nm\r\n        ,COALESCE(fire_reason, 'n/a')::TEXT AS fire_reason\r\n\t\t,COALESCE(fire_initiative, 'n/a')::TEXT AS fire_initiative\r\n        ,fire_flg\r\n   --     ,fire_initiative\r\n        ,last_day_of_month_flg\r\n        ,active_type_nm\r\n        ,employment_relation_type_desc\r\n        ,mdm_employee_rk\r\n\r\n    FROM \r\n        usr_cross_data.hr_executive_proteus\r\n    WHERE \r\n        lvl2_mapped_management_unit_rk IS NOT NULL\r\n        AND lvl2_mapped_management_unit_rk <> '-'\r\n        AND calendar_dt::DATE >= DATE_TRUNC('month', $form_multiselect_1::date - INTERVAL '25 months')::DATE\r\n\r\n        union all\r\n\r\nSELECT \r\n        DATE_TRUNC('month', calendar_dt)::DATE AS month\r\n        ,lvl3_mapped_management_unit_rk::TEXT AS mngt_unit_rk\r\n        ,lvl3_mapped_management_unit_nm::TEXT AS mngt_unit_nm\r\n        ,3::INT AS lvl\r\n                ,COALESCE(experience_group_nm, 'n/a')::TEXT AS experience_group_nm\r\n        ,COALESCE(fire_reason, 'n/a')::TEXT AS fire_reason\r\n\t\t,COALESCE(fire_initiative, 'n/a')::TEXT AS fire_initiative\r\n        ,fire_flg\r\n --       ,fire_initiative\r\n        ,last_day_of_month_flg\r\n        ,active_type_nm\r\n        ,employment_relation_type_desc\r\n        ,mdm_employee_rk\r\n\r\n    FROM \r\n        usr_cross_data.hr_executive_proteus\r\n    WHERE \r\n        lvl3_mapped_management_unit_rk IS NOT NULL\r\n        AND lvl3_mapped_management_unit_rk <> '-'\r\n        AND calendar_dt::DATE >= DATE_TRUNC('month', $form_multiselect_1::date - INTERVAL '25 months')::DATE \r\n        and lvl3_mapped_management_unit_rk <> '6f3c9f7ec085231c2bc341e528431a88'       \r\n\r\nUNION ALL\r\n-- LVL 4\r\nSELECT \r\n    DATE_TRUNC('month', calendar_dt)::DATE AS month,\r\n    lvl4_mapped_management_unit_rk::TEXT AS mngt_unit_rk,\r\n    lvl4_mapped_management_unit_nm::TEXT AS mngt_unit_nm,\r\n    4::INT AS lvl,\r\n            COALESCE(experience_group_nm, 'n/a')::TEXT AS experience_group_nm,\r\n        COALESCE(fire_reason, 'n/a')::TEXT AS fire_reason,\r\n\t\tCOALESCE(fire_initiative, 'n/a')::TEXT AS fire_initiative,\r\n    fire_flg,\r\n  --  fire_initiative,\r\n    last_day_of_month_flg,\r\n    active_type_nm,\r\n    employment_relation_type_desc,\r\n    mdm_employee_rk\r\nFROM \r\n    usr_cross_data.hr_executive_proteus\r\nWHERE \r\n    lvl4_mapped_management_unit_rk IS NOT NULL\r\n    AND lvl4_mapped_management_unit_rk <> '-'\r\n    AND calendar_dt::DATE >= DATE_TRUNC('month', $form_multiselect_1::date - INTERVAL '25 months')::DATE\r\n\r\nUNION ALL\r\n-- LVL 5\r\nSELECT \r\n    DATE_TRUNC('month', calendar_dt)::DATE AS month,\r\n    lvl5_mapped_management_unit_rk::TEXT AS mngt_unit_rk,\r\n    lvl5_mapped_management_unit_nm::TEXT AS mngt_unit_nm,\r\n    5::INT AS lvl,\r\n            COALESCE(experience_group_nm, 'n/a')::TEXT AS experience_group_nm,\r\n        COALESCE(fire_reason, 'n/a')::TEXT AS fire_reason,\r\n\t\tCOALESCE(fire_initiative, 'n/a')::TEXT AS fire_initiative,\r\n    fire_flg,\r\n--    fire_initiative,\r\n    last_day_of_month_flg,\r\n    active_type_nm,\r\n    employment_relation_type_desc,\r\n    mdm_employee_rk\r\nFROM \r\n    usr_cross_data.hr_executive_proteus\r\nWHERE \r\n    lvl5_mapped_management_unit_rk IS NOT NULL\r\n    AND lvl5_mapped_management_unit_rk <> '-'\r\n    AND calendar_dt::DATE >= DATE_TRUNC('month', $form_multiselect_1::date - INTERVAL '25 months')::DATE\r\n\r\nUNION ALL\r\n-- LVL 6\r\nSELECT \r\n    DATE_TRUNC('month', calendar_dt)::DATE AS month,\r\n    lvl6_mapped_management_unit_rk::TEXT AS mngt_unit_rk,\r\n    lvl6_mapped_management_unit_nm::TEXT AS mngt_unit_nm,\r\n    6::INT AS lvl,\r\n            COALESCE(experience_group_nm, 'n/a')::TEXT AS experience_group_nm,\r\n        COALESCE(fire_reason, 'n/a')::TEXT AS fire_reason,\r\n\t\tCOALESCE(fire_initiative, 'n/a')::TEXT AS fire_initiative,\r\n    fire_flg,\r\n --   fire_initiative,\r\n    last_day_of_month_flg,\r\n    active_type_nm,\r\n    employment_relation_type_desc,\r\n    mdm_employee_rk\r\nFROM \r\n    usr_cross_data.hr_executive_proteus\r\nWHERE \r\n    lvl6_mapped_management_unit_rk IS NOT NULL\r\n    AND lvl6_mapped_management_unit_rk <> '-'\r\n    AND calendar_dt::DATE >= DATE_TRUNC('month', $form_multiselect_1::date - INTERVAL '25 months')::DATE\r\n\r\nUNION ALL\r\n-- LVL 7\r\nSELECT \r\n    DATE_TRUNC('month', calendar_dt)::DATE AS month,\r\n    lvl7_mapped_management_unit_rk::TEXT AS mngt_unit_rk,\r\n    lvl7_mapped_management_unit_nm::TEXT AS mngt_unit_nm,\r\n    7::INT AS lvl,\r\n            COALESCE(experience_group_nm, 'n/a')::TEXT AS experience_group_nm,\r\n        COALESCE(fire_reason, 'n/a')::TEXT AS fire_reason,\r\n\t\tCOALESCE(fire_initiative, 'n/a')::TEXT AS fire_initiative,\r\n    fire_flg,\r\n--    fire_initiative,\r\n    last_day_of_month_flg,\r\n    active_type_nm,\r\n    employment_relation_type_desc,\r\n    mdm_employee_rk\r\nFROM \r\n    usr_cross_data.hr_executive_proteus\r\nWHERE \r\n    lvl7_mapped_management_unit_rk IS NOT NULL\r\n    AND lvl7_mapped_management_unit_rk <> '-'\r\n    AND calendar_dt::DATE >= DATE_TRUNC('month', $form_multiselect_1::date - INTERVAL '25 months')::DATE\r\n\r\nUNION ALL\r\n-- LVL 8\r\nSELECT \r\n    DATE_TRUNC('month', calendar_dt)::DATE AS month,\r\n    lvl8_mapped_management_unit_rk::TEXT AS mngt_unit_rk,\r\n    lvl8_mapped_management_unit_nm::TEXT AS mngt_unit_nm,\r\n    8::INT AS lvl,\r\n            COALESCE(experience_group_nm, 'n/a')::TEXT AS experience_group_nm,\r\n        COALESCE(fire_reason, 'n/a')::TEXT AS fire_reason,\r\n\t\tCOALESCE(fire_initiative, 'n/a')::TEXT AS fire_initiative,\r\n    fire_flg,\r\n--    fire_initiative,\r\n    last_day_of_month_flg,\r\n    active_type_nm,\r\n    employment_relation_type_desc,\r\n    mdm_employee_rk\r\nFROM \r\n    usr_cross_data.hr_executive_proteus\r\nWHERE \r\n    lvl8_mapped_management_unit_rk IS NOT NULL\r\n    AND lvl8_mapped_management_unit_rk <> '-'\r\n    AND calendar_dt::DATE >= DATE_TRUNC('month', $form_multiselect_1::date - INTERVAL '25 months')::DATE\r\n\r\nUNION ALL\r\n-- LVL 9\r\nSELECT \r\n    DATE_TRUNC('month', calendar_dt)::DATE AS month,\r\n    lvl9_mapped_management_unit_rk::TEXT AS mngt_unit_rk,\r\n    lvl9_mapped_management_unit_nm::TEXT AS mngt_unit_nm,\r\n    9::INT AS lvl,\r\n            COALESCE(experience_group_nm, 'n/a')::TEXT AS experience_group_nm,\r\n        COALESCE(fire_reason, 'n/a')::TEXT AS fire_reason,\r\n\t\tCOALESCE(fire_initiative, 'n/a')::TEXT AS fire_initiative,\r\n    fire_flg,\r\n --   fire_initiative,\r\n    last_day_of_month_flg,\r\n    active_type_nm,\r\n    employment_relation_type_desc,\r\n    mdm_employee_rk\r\nFROM \r\n    usr_cross_data.hr_executive_proteus\r\nWHERE \r\n    lvl9_mapped_management_unit_rk IS NOT NULL\r\n    AND lvl9_mapped_management_unit_rk <> '-'\r\n    AND calendar_dt::DATE >= DATE_TRUNC('month', $form_multiselect_1::date - INTERVAL '25 months')::DATE\r\n\r\nUNION ALL\r\n-- LVL 10\r\nSELECT \r\n    DATE_TRUNC('month', calendar_dt)::DATE AS month,\r\n    lvl10_mapped_management_unit_rk::TEXT AS mngt_unit_rk,\r\n    lvl10_mapped_management_unit_nm::TEXT AS mngt_unit_nm,\r\n    10::INT AS lvl,\r\n            COALESCE(experience_group_nm, 'n/a')::TEXT AS experience_group_nm,\r\n        COALESCE(fire_reason, 'n/a')::TEXT AS fire_reason,\r\n\t\tCOALESCE(fire_initiative, 'n/a')::TEXT AS fire_initiative,\r\n    fire_flg,\r\n --   fire_initiative,\r\n    last_day_of_month_flg,\r\n    active_type_nm,\r\n    employment_relation_type_desc,\r\n    mdm_employee_rk\r\nFROM \r\n    usr_cross_data.hr_executive_proteus\r\nWHERE \r\n    lvl10_mapped_management_unit_rk IS NOT NULL\r\n    AND lvl10_mapped_management_unit_rk <> '-'\r\n    AND calendar_dt::DATE >= DATE_TRUNC('month', $form_multiselect_1::date - INTERVAL '25 months')::DATE\r\n\r\nUNION ALL\r\n-- LVL 11\r\nSELECT \r\n    DATE_TRUNC('month', calendar_dt)::DATE AS month,\r\n    lvl11_mapped_management_unit_rk::TEXT AS mngt_unit_rk,\r\n    lvl11_mapped_management_unit_nm::TEXT AS mngt_unit_nm,\r\n    11::INT AS lvl,\r\n            COALESCE(experience_group_nm, 'n/a')::TEXT AS experience_group_nm,\r\n        COALESCE(fire_reason, 'n/a')::TEXT AS fire_reason,\r\n\t\tCOALESCE(fire_initiative, 'n/a')::TEXT AS fire_initiative,\r\n    fire_flg,\r\n--    fire_initiative,\r\n    last_day_of_month_flg,\r\n    active_type_nm,\r\n    employment_relation_type_desc,\r\n    mdm_employee_rk\r\nFROM \r\n    usr_cross_data.hr_executive_proteus\r\nWHERE \r\n    lvl11_mapped_management_unit_rk IS NOT NULL\r\n    AND lvl11_mapped_management_unit_rk <> '-'\r\n    AND calendar_dt::DATE >= DATE_TRUNC('month', $form_multiselect_1::date - INTERVAL '25 months')::DATE;        \r\n"

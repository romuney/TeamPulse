    code: "DROP TABLE IF EXISTS experience_sl_gpd_employee_count_reason_group;\r\nCREATE TABLE experience_sl_gpd_employee_count_reason_group AS\r\n\r\n-- Штатные сотрудники\r\nSELECT \r\n    month,\r\n    mngt_unit_rk,\r\n    mngt_unit_nm,\r\n    lvl,\r\n    'Штатные сотрудники' AS type_flg,\r\n    COALESCE(experience_group_nm, 'n/a')::TEXT AS experience_group_nm,\r\n    COUNT(mdm_employee_rk)  AS employee_amt\r\nFROM dett\r\nWHERE 1=1\r\n    AND active_type_nm IN ('Активная', 'Подрядчики')\r\n    AND employment_relation_type_desc = 'Штатный сотрудник'\r\n    and last_day_of_month_flg = 1 \r\n    AND fire_flg = 0\r\nGROUP BY 1, 2, 3, 4, 5, 6\r\n\r\nUNION ALL\r\n\r\n-- ГПД сотрудники\r\nSELECT \r\n    month,\r\n    mngt_unit_rk,\r\n    mngt_unit_nm,\r\n    lvl,\r\n    'ГПД сотрудники' AS type_flg,\r\n    COALESCE(experience_group_nm, 'n/a')::TEXT AS experience_group_nm,\r\n    COUNT(mdm_employee_rk) AS employee_amt\r\nFROM dett\r\nWHERE 1=1\r\n    AND active_type_nm IN ('Активная', 'Подрядчики')\r\n    AND employment_relation_type_desc <> 'Штатный сотрудник'\r\n        and last_day_of_month_flg = 1 \r\n    AND fire_flg = 0\r\nGROUP BY 1, 2, 3, 4, 5, 6\r\n\r\nUNION ALL\r\n\r\n-- Все сотрудники\r\nSELECT \r\n    month,\r\n    mngt_unit_rk,\r\n    mngt_unit_nm,\r\n    lvl,\r\n    'Все сотрудники' AS type_flg,\r\n    COALESCE(experience_group_nm, 'n/a')::TEXT AS experience_group_nm,\r\n    COUNT(mdm_employee_rk) AS employee_amt\r\nFROM dett\r\nWHERE 1=1\r\n    AND active_type_nm IN ('Активная', 'Подрядчики')\r\n        and last_day_of_month_flg = 1 \r\n    AND fire_flg = 0\r\nGROUP BY 1, 2, 3, 4, 5, 6;\r\n\r\nselect * from experience_sl_gpd_employee_count_reason_group where mngt_unit_nm = 'BOSS' and experience_group_nm ='Стаж менее 3 мес'"

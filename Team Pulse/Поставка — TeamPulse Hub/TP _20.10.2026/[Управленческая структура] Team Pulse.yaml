  - sid: 019f0496-cc1f-7f92-9b03-b563e9a74d8b
    title: Untitled 59
    shebang: gp
    code: "DROP TABLE IF EXISTS izmen_pre_perevody_minus;\r\nCREATE TABLE izmen_pre_perevody_minus AS\r\n\r\n-- Все сотрудники\r\nSELECT \r\n    calendar_dt,\r\n    mdm_employee_rk,\r\n    mngt_unit_rk,\r\n    mngt_unit_nm,\r\n    lvl,\r\n    parent_mngt_unit_rk,\r\n    parent_mngt_unit_nm,\r\n    parent_lvl,\r\n    active_type_nm,\r\n    employment_relation_type_desc,\r\n    'Все сотрудники' AS type_flg,\r\n    lvl_mngt_unit_out_trsf_flg,\r\n    transfer_out_active_type_flg,\r\n    transfer_out_employment_relation_type_flg,\r\n    SUM(LEAST(lvl_mngt_unit_out_trsf_flg + transfer_out_active_type_flg, 1)) AS perevody_minus\r\nFROM izmen_minus_deet\r\nWHERE active_type_nm IN ('Активная', 'Подрядчики')\r\nGROUP BY \r\n    calendar_dt,\r\n    mdm_employee_rk,\r\n    mngt_unit_rk,\r\n    mngt_unit_nm,\r\n    lvl,\r\n    parent_mngt_unit_rk,\r\n    parent_mngt_unit_nm,\r\n    parent_lvl,\r\n    active_type_nm,\r\n    employment_relation_type_desc,\r\n    type_flg,\r\n    lvl_mngt_unit_out_trsf_flg,\r\n    transfer_out_active_type_flg,\r\n    transfer_out_employment_relation_type_flg\r\nHAVING SUM(LEAST(lvl_mngt_unit_out_trsf_flg + transfer_out_active_type_flg, 1)) = 1\r\n\r\nUNION ALL\r\n\r\n-- Штатные сотрудники\r\nSELECT \r\n    calendar_dt,\r\n    mdm_employee_rk,\r\n    mngt_unit_rk,\r\n    mngt_unit_nm,\r\n    lvl,\r\n    parent_mngt_unit_rk,\r\n    parent_mngt_unit_nm,\r\n    parent_lvl,\r\n    active_type_nm,\r\n    employment_relation_type_desc,\r\n    'Штатные сотрудники' AS type_flg,\r\n    lvl_mngt_unit_out_trsf_flg,\r\n    transfer_out_active_type_flg,\r\n    transfer_out_employment_relation_type_flg,\r\n    SUM(LEAST(lvl_mngt_unit_out_trsf_flg + transfer_out_active_type_flg + transfer_out_employment_relation_type_flg, 1)) AS perevody_minus\r\nFROM izmen_minus_deet\r\nWHERE active_type_nm IN ('Активная', 'Подрядчики')\r\n  AND employment_relation_type_desc = 'Штатный сотрудник'\r\nGROUP BY \r\n    calendar_dt,\r\n    mdm_employee_rk,\r\n    mngt_unit_rk,\r\n    mngt_unit_nm,\r\n    lvl,\r\n    parent_mngt_unit_rk,\r\n    parent_mngt_unit_nm,\r\n    parent_lvl,\r\n    active_type_nm,\r\n    employment_relation_type_desc,\r\n    type_flg,\r\n    lvl_mngt_unit_out_trsf_flg,\r\n    transfer_out_active_type_flg,\r\n    transfer_out_employment_relation_type_flg\r\nHAVING SUM(LEAST(lvl_mngt_unit_out_trsf_flg + transfer_out_active_type_flg + transfer_out_employment_relation_type_flg, 1)) = 1\r\n\r\nUNION ALL\r\n\r\n-- ГПД сотрудники\r\nSELECT \r\n    calendar_dt,\r\n    mdm_employee_rk,\r\n    mngt_unit_rk,\r\n    mngt_unit_nm,\r\n    lvl,\r\n    parent_mngt_unit_rk,\r\n    parent_mngt_unit_nm,\r\n    parent_lvl,\r\n    active_type_nm,\r\n    employment_relation_type_desc,\r\n    'ГПД сотрудники' AS type_flg,\r\n    lvl_mngt_unit_out_trsf_flg,\r\n    transfer_out_active_type_flg,\r\n    transfer_out_employment_relation_type_flg,\r\n    SUM(LEAST(lvl_mngt_unit_out_trsf_flg + transfer_out_active_type_flg + transfer_out_employment_relation_type_flg, 1)) AS perevody_minus\r\nFROM izmen_minus_deet\r\nWHERE active_type_nm IN ('Активная', 'Подрядчики')\r\n  AND employment_relation_type_desc <> 'Штатный сотрудник'\r\nGROUP BY \r\n    calendar_dt,\r\n    mdm_employee_rk,\r\n    mngt_unit_rk,\r\n    mngt_unit_nm,\r\n    lvl,\r\n    parent_mngt_unit_rk,\r\n    parent_mngt_unit_nm,\r\n    parent_lvl,\r\n    active_type_nm,\r\n    employment_relation_type_desc,\r\n    type_flg,\r\n    lvl_mngt_unit_out_trsf_flg,\r\n    transfer_out_active_type_flg,\r\n    transfer_out_employment_relation_type_flg\r\nHAVING SUM(LEAST(lvl_mngt_unit_out_trsf_flg + transfer_out_active_type_flg + transfer_out_employment_relation_type_flg, 1)) = 1;"
    isEnabled: true
  - sid: 019f0496-d80e-718d-ba62-a0626ec38c1a
    title: perevody_minus

    title: union переводы +
    shebang: gp
    code: " drop table if exists union_perevody_plus ;\r\n create table union_perevody_plus   as\r\n\r\nselect  mngt_unit_rk, mngt_unit_nm ,lvl, 'Тип численности' as transfer_type\r\n, count ( mdm_employee_rk) filter (where transfer_to_active_type_flg_new = 1 and\r\n(month::date >=  GREATEST ((date_trunc('month', $form_multiselect_1::date - interval '11 months')), (start_date + interval '1 months'))  and month::date <= date_trunc('month', $form_multiselect_1::date)::date)) as plus\r\nfrom df\r\ngroup by 1,2,3,4\r\n\r\nunion all\r\n\r\nselect  mngt_unit_rk, mngt_unit_nm ,lvl, 'УС' as transfer_type\r\n,count ( mdm_employee_rk) filter (where lvl_mngt_unit_in_trsf_flg_new=1 and\r\n(month::date >=  GREATEST ((date_trunc('month', $form_multiselect_1::date - interval '11 months')), (start_date + interval '1 months'))  and month::date <= date_trunc('month', $form_multiselect_1::date)::date)) as plus\r\nfrom df\r\ngroup by 1,2,3,4\r\n\r\nunion all\r\n\r\nselect  mngt_unit_rk, mngt_unit_nm ,lvl, 'HQ|nonHQ' as transfer_type\r\n,count ( mdm_employee_rk) filter (where  transfer_to_hq_flg_new=1 and \r\n(month::date >=  GREATEST ((date_trunc('month', $form_multiselect_1::date - interval '11 months')), (start_date + interval '1 months'))  and month::date <= date_trunc('month', $form_multiselect_1::date)::date)) as plus\r\nfrom df\r\ngroup by 1,2,3,4\r\n\r\n;  select * from union_perevody_plus where mngt_unit_nm = 'Служба безопасности'\r\n"

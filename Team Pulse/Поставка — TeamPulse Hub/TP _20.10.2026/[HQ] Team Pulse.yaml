  - sid: 019c99cd-f543-7d36-a75f-926b51b42b1a
    title: fire_reason_a
    shebang: gp
    code: "drop table if exists fire_reason_a ;\r\ncreate table fire_reason_a   as\r\n\r\n\r\nSELECT \r\n    o.month,\r\n    o.mngt_unit_rk,\r\n    o.mngt_unit_nm,\r\n    o.lvl,\r\n    o.experience_group_nm,\r\n    o.fire_reason,\r\n    o.fire_initiative,\r\n    o.ottok,\r\n    e.employee_amt\r\nFROM \r\n    ottok_count o\r\nLEFT JOIN \r\n    employee_count e ON \r\n\r\n    o.month = e.month AND \r\n    o.mngt_unit_rk = e.mngt_unit_rk AND\r\n    --o.mngt_unit_nm = e.mngt_unit_nm AND \r\n    o.lvl = e.lvl AND\r\n    o.experience_group_nm = e.experience_group_nm\r\n\r\n    where  o.month::date <= date_trunc('month', $form_multiselect_1::date)::date\r\n\r\n; \r\nselect * from fire_reason_a  where mngt_unit_nm = 'Databases'\r\n"
    isEnabled: true

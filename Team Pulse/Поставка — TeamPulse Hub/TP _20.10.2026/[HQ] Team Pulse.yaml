  - sid: 019ab6da-be0c-7cd0-af1a-fc43269ccc86
    title: Untitled 49
    shebang: gp
    code: "drop table if exists lag_non_regrettable ;\r\ncreate table lag_non_regrettable  as\r\n\r\n\r\nWITH lag_fire_initiative  AS (\r\nselect * \r\n,lag(employee_amt) OVER (PARTITION BY mngt_unit_rk,mngt_unit_nm,lvl ORDER BY month ) as lag_employee_amt\r\nfrom non_regrettable \r\nwhere --mngt_unit_rk = '6f3c9f7ec085231c2bc341e528431a88' and\r\n month >='2023-12-01'\r\n)\r\nselect *   \r\n  ,date_trunc('year',month)::date as year\r\n\r\n, case when lag_employee_amt is null then employee_amt  else (lag_employee_amt+employee_amt) / (2*1.0) end as cpch\r\n\r\n,(case when (case when lag_employee_amt is null then employee_amt  else (lag_employee_amt+employee_amt) / (2*1.0) end)=0 then 0\r\n else (ottok /  ((case when lag_employee_amt is null then employee_amt  else (lag_employee_amt+employee_amt) / (2*1.0) end)*1.0))\r\n end) *100  as tek_month\r\n\r\nfrom lag_fire_initiative \r\n\r\nwhere month::date <= date_trunc('month', $form_multiselect_1::date)::date \r\nand month::date >=(date_trunc('year',$form_multiselect_1::date)  - interval '1 year')::date\r\n\r\n;\r\n\r\nselect * from lag_non_regrettable where  mngt_unit_rk = '6f3c9f7ec085231c2bc341e528431a88'  limit 10;"
    isEnabled: true
  - sid: 019ab6da-ace9-77b2-803e-94577db459bd
    title: Untitled 48
    shebang: gp
    code: "\r\ndrop table if exists non_regrettable ;\r\ncreate table non_regrettable  as\r\n\r\n\r\nWITH fire_initiative  AS (\r\n\r\nselect \r\nmngt_unit_rk\r\n, mngt_unit_nm\r\n, lvl\r\n, row_number() OVER (PARTITION BY mngt_unit_rk, mngt_unit_nm, lvl,year ORDER BY month ) as period_number\r\n ,extract(month from month ) as month_num\r\n, month as start_of_month_dt\r\n,year \r\n,ottok as fire_employee\r\n, cpch as total_avg_headcount_month\r\n, sum(ottok) OVER (PARTITION BY mngt_unit_rk, mngt_unit_nm, lvl, year   ORDER BY month)  as sum_fire\r\n, sum(tek_month) OVER (PARTITION BY mngt_unit_rk, mngt_unit_nm, lvl, year   ORDER BY month)  as tek_nakop -- накопительная сумма\r\n ,max(month) OVER (PARTITION BY mngt_unit_rk, mngt_unit_nm, lvl) as month_max\r\n\r\nfrom  lag_non_regrettable\r\norder by month \r\n)\r\n\r\nselect * \r\n ,max(tek_nakop) OVER (PARTITION BY mngt_unit_rk, mngt_unit_nm, lvl) as max_value_ytd_turnover\r\n ,'Месяц'::text as period_type\r\n ,tek_nakop as ytd_turnover\r\n  ,extract(month from month_max ) as end_date\r\n,extract(month from start_of_month_dt) as month_number\r\n , coalesce(  lag(tek_nakop) OVER (PARTITION BY mngt_unit_rk, mngt_unit_nm, lvl,year  ORDER BY start_of_month_dt),0) as metric_value_prev\r\n ,tek_nakop as metric_value\r\n , case when (max(tek_nakop) OVER (PARTITION BY mngt_unit_rk, mngt_unit_nm, lvl)) < 18 THEN 18 else\r\n (max(tek_nakop) OVER (PARTITION BY mngt_unit_rk, mngt_unit_nm, lvl)) end as max_value\r\n , 0::numeric as min_value\r\n, 101 - round(( (coalesce(  lag(tek_nakop) OVER (PARTITION BY mngt_unit_rk, mngt_unit_nm, lvl,year  ORDER BY start_of_month_dt),0)) \r\n/  (case when (max(tek_nakop) OVER (PARTITION BY mngt_unit_rk, mngt_unit_nm, lvl)) < 18 THEN 18 else\r\n (max(tek_nakop) OVER (PARTITION BY mngt_unit_rk, mngt_unit_nm, lvl)) end)) * 100) as grid_start\r\n\r\n,101 - round(( (tek_nakop  ) / (case when (max(tek_nakop) OVER (PARTITION BY mngt_unit_rk, mngt_unit_nm, lvl)) < 18 THEN 18 else\r\n (max(tek_nakop) OVER (PARTITION BY mngt_unit_rk, mngt_unit_nm, lvl)) end)) * 100) as grid_finish\r\n\r\n,5*period_number /(12*1.0)::numeric as plan_min\r\n,5 / (12*1.0) * (period_number - 1)::numeric as plan_min_prev\r\n\r\n-- , 101 - round(( (coalesce(  lag(tek_nakop) OVER (PARTITION BY mngt_unit_rk, mngt_unit_nm, lvl,year  ORDER BY start_of_month_dt),0)) / (case when (max(tek_nakop) OVER (PARTITION BY mngt_unit_rk, mngt_unit_nm, lvl)) < 18 THEN 18 else\r\n--  (max(tek_nakop) OVER (PARTITION BY mngt_unit_rk, mngt_unit_nm, lvl)) end)) * 100) as  grid_start\r\n\r\n-- ,101 - round((tek_nakop / (case when (max(tek_nakop) OVER (PARTITION BY mngt_unit_rk, mngt_unit_nm, lvl)) < 18 THEN 18 else\r\n--  (max(tek_nakop) OVER (PARTITION BY mngt_unit_rk, mngt_unit_nm, lvl)) end)) * 100) as grid_finish\r\n\r\n,101 - round(( (5 / (12*1.0) * (period_number - 1))/ (case when (max(tek_nakop) OVER (PARTITION BY mngt_unit_rk, mngt_unit_nm, lvl)) < 18 THEN 18 else\r\n (max(tek_nakop) OVER (PARTITION BY mngt_unit_rk, mngt_unit_nm, lvl)) end)) * 100)  as grid_min_start\r\n\r\n,101 - round(( (5*period_number /(12*1.0)) / (case when (max(tek_nakop) OVER (PARTITION BY mngt_unit_rk, mngt_unit_nm, lvl)) < 18 THEN 18 else\r\n (max(tek_nakop) OVER (PARTITION BY mngt_unit_rk, mngt_unit_nm, lvl)) end)) * 100)  as grid_min_finish\r\n\r\n,15/(12*1.0)*period_number as plan_max\r\n\r\n,15/(12*1.0)* (period_number - 1) as plan_max_prev\r\n\r\n, 101 - round(( (15/(12*1.0)* (period_number - 1))/ (case when (max(tek_nakop) OVER (PARTITION BY mngt_unit_rk, mngt_unit_nm, lvl)) < 18 THEN 18 else\r\n (max(tek_nakop) OVER (PARTITION BY mngt_unit_rk, mngt_unit_nm, lvl)) end)) * 100) as grid_max_start\r\n\r\n , 101 - round(( (15/(12*1.0)*period_number) / (case when (max(tek_nakop) OVER (PARTITION BY mngt_unit_rk, mngt_unit_nm, lvl)) < 18 THEN 18 else\r\n (max(tek_nakop) OVER (PARTITION BY mngt_unit_rk, mngt_unit_nm, lvl)) end) ) * 100)   as grid_max_finish\r\n\r\n\r\n,   lag(sum_fire) OVER (PARTITION BY mngt_unit_rk, mngt_unit_nm, lvl,year  ORDER BY start_of_month_dt) as sum_fire_prev\r\n\r\n, coalesce(  lag(total_avg_headcount_month) OVER (PARTITION BY mngt_unit_rk, mngt_unit_nm, lvl,year  ORDER BY start_of_month_dt) ,0) as total_avg_headcount_month_prev\r\n, total_avg_headcount_month as asd\r\n\r\n, max (total_avg_headcount_month )  OVER (PARTITION BY mngt_unit_rk, mngt_unit_nm, lvl) as max_total_avg\r\n, 1::numeric as grown_flg\r\n\r\nfrom fire_initiative \r\n\r\norder by  start_of_month_dt\r\n; \r\n\r\n\r\n\r\n\r\n\r\nselect * from non_regrettable    limit 100;"
    isEnabled: true

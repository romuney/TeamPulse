  - sid: 019f4b40-3258-7d24-9416-e97fdb02b089
    title: fire_reason_g
    shebang: gp
    code: "drop table if exists fire_reason_g ;\r\ncreate table fire_reason_g   as\r\n\r\n\r\nSELECT \r\n    o.month,\r\n    o.mngt_unit_rk,\r\n    o.mngt_unit_nm,\r\n    o.lvl,\r\n    o.experience_group_nm,\r\n    o.ottok,\r\n    e.employee_amt\r\nFROM \r\n    ottok_experience o\r\nLEFT JOIN \r\n    employee_count e ON \r\n\r\n    o.month = e.month AND \r\n    o.mngt_unit_rk = e.mngt_unit_rk AND\r\n    --o.mngt_unit_nm = e.mngt_unit_nm AND \r\n    o.lvl = e.lvl AND\r\n    o.experience_group_nm = e.experience_group_nm\r\n\r\n    where  o.month::date <= date_trunc('month', $form_multiselect_1::date)::date\r\n\r\n; \r\nselect * from fire_reason_g  where mngt_unit_nm = 'Databases'\r\n"
    isEnabled: true
  - sid: 019f4b40-3da5-7d72-994e-2d1630815057
    title: Untitled 65
    shebang: gp
    code: "\r\ndrop table if exists rience_group_fire_reason ;\r\ncreate table rience_group_fire_reason   as\r\n\r\nWITH lag_ottok_count AS (\r\n    select \r\n        month\r\n        ,mngt_unit_rk\r\n        ,mngt_unit_nm\r\n        ,lvl\r\n        ,experience_group_nm\r\n\r\n        ,ottok as ottok_amt\r\n        ,employee_amt\r\n        ,lag(employee_amt) OVER (PARTITION BY \r\n        mngt_unit_rk\r\n        ,mngt_unit_nm\r\n        ,lvl\r\n        ,experience_group_nm ORDER BY month ) as lag_employee_amt\r\n    from fire_reason_g\r\n)\r\n, dd AS (\r\n    select\r\n        month\r\n        ,mngt_unit_rk\r\n        ,mngt_unit_nm\r\n        ,lvl\r\n        ,experience_group_nm\r\n\r\n        ,ottok_amt\r\n        ,employee_amt\r\n        ,case \r\n            when lag_employee_amt is null \r\n            then employee_amt  \r\n            else (lag_employee_amt+employee_amt) / (2*1.0) \r\n        end as spch\r\n        ,case \r\n            when (case when lag_employee_amt is null then employee_amt  else (lag_employee_amt+employee_amt) / (2*1.0)  end)=0 \r\n            then 0\r\n            else (ottok_amt /  ((case when lag_employee_amt is null then employee_amt  else (lag_employee_amt+employee_amt) / (2*1.0)  end)*1.0))\r\n        end  as tekuchest\r\n    from lag_ottok_count\r\n)\r\n\r\n, tekuchest_ottok_count AS (\r\n    select * \r\n    from dd \r\n    where 1=1\r\n        and \r\n        (\r\n            (month >= MAKE_DATE(EXTRACT(YEAR FROM $form_multiselect_1::date)::INT - 1, 1, 1)\r\n            AND month < MAKE_DATE(EXTRACT(YEAR FROM $form_multiselect_1::date)::INT, 1, 1)\r\n            AND month + INTERVAL '1 year' <= $form_multiselect_1::date) \r\n            or \r\n            ( month>=   date_trunc('year',$form_multiselect_1::date) )\r\n        )\r\n)\r\n\r\n, tekuchest_ottok_count_year AS (\r\n    select\r\n        mngt_unit_rk\r\n        ,mngt_unit_nm\r\n        ,lvl\r\n        ,experience_group_nm\r\n        ,case\r\n        when experience_group_nm='Стаж менее 3 мес' then 1 \r\n        when experience_group_nm='Стаж от 3 до 6 мес' then 2\r\n        when experience_group_nm='Стаж от 6 мес до 1 года' then 3\r\n        when experience_group_nm='Стаж от 1 до 2 лет' then 4\r\n        when experience_group_nm='Стаж от 2 до 5 лет' then 5\r\n        when experience_group_nm='Стаж более 5 лет' then 6\r\n        end as num_experience\r\n        ,date_trunc('year',$form_multiselect_1::date )::date  as cur_year\r\n        ,(date_trunc('year',$form_multiselect_1::date)  - interval '1 year')::date as prev_year\r\n        ,coalesce( sum(ottok_amt) filter (where date_trunc('year',$form_multiselect_1::date) = date_trunc('year',month )) ,0) as ottok_cur_year_amt\r\n        ,coalesce( sum(ottok_amt) filter (where (date_trunc('year',$form_multiselect_1::date)  - interval '1 year')::date= date_trunc('year',month )) ,0) as ottok_prev_year_amt\r\n        \r\n        ,coalesce( sum(tekuchest) filter (where date_trunc('year',$form_multiselect_1::date ) = date_trunc('year',month )) ,0) as tekuchest_cur_year_amt\r\n        ,coalesce( sum(tekuchest) filter (where (date_trunc('year',$form_multiselect_1::date)  - interval '1 year')::date= date_trunc('year',month )) ,0) as tekuchest_prev_year_amt\r\n\r\n    from tekuchest_ottok_count \r\n\r\n    group by 1,2,3,4,5,6\r\n)\r\n\r\nselect \r\n    tekuchest_ottok_count_year.mngt_unit_rk\r\n    ,tekuchest_ottok_count_year.mngt_unit_nm\r\n    ,usr_cross_pub.cross_management_unit.new_management_unit_nm\r\n    ,tekuchest_ottok_count_year.lvl\r\n    ,tekuchest_ottok_count_year.experience_group_nm\r\n    ,tekuchest_ottok_count_year.num_experience\r\n    ,tekuchest_ottok_count_year.cur_year\r\n    ,tekuchest_ottok_count_year.prev_year\r\n    ,tekuchest_ottok_count_year.ottok_cur_year_amt\r\n    ,tekuchest_ottok_count_year.ottok_prev_year_amt\r\n    ,tekuchest_ottok_count_year.tekuchest_cur_year_amt\r\n    ,tekuchest_ottok_count_year.tekuchest_prev_year_amt\r\n\r\n --,row_number() OVER (PARTITION BY mngt_unit_rk,experience_group_nm ORDER BY GREATEST(ottok_cur_year_amt, ottok_prev_year_amt) DESC) as rn\r\n    , ROW_NUMBER() OVER (\r\n        PARTITION BY mngt_unit_rk, experience_group_nm\r\n        ORDER BY \r\n            CASE \r\n                WHEN ottok_cur_year_amt <> 0 THEN 0\r\n                ELSE 1\r\n            END,\r\n            GREATEST(ottok_cur_year_amt, 0) DESC,\r\n            ottok_prev_year_amt DESC\r\n    ) AS rn\r\nfrom tekuchest_ottok_count_year\r\nleft join usr_cross_pub.cross_management_unit\r\n    on  tekuchest_ottok_count_year.mngt_unit_rk = usr_cross_pub.cross_management_unit.management_unit_rk\r\n;\r\n\r\nselect * from rience_group_fire_reason where mngt_unit_nm = 'Бизнес линии'"
    isEnabled: true

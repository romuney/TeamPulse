  - sid: 01a0b00c-88c4-754a-9b79-cb218f0a74c9
    title: Untitled 81
    shebang: gp
    code: "DROP TABLE IF EXISTS experience_fire_initiative;\nCREATE TABLE experience_fire_initiative AS\n\nWITH lag_ottok_count_reason_group AS (\n    SELECT \n        --month,\n        mngt_unit_rk,\n        mngt_unit_nm,\n        lvl,\n        experience_group_nm,  -- ✅ Заменено\n        ottok ottok_amt,\n        employee_amt,\n        LAG(employee_amt) OVER (\n            PARTITION BY \n                mngt_unit_rk,\n                mngt_unit_nm,\n                lvl,\n                experience_group_nm  -- ✅ Заменено\n            ORDER BY month \n        ) AS lag_employee_amt\n    FROM fire_reason_a  -- Убедитесь, что в `initiative` есть `experience_group_nm`\n),\n\ntekuchest_ottok_count_reason_group AS (\n    SELECT\n        month,\n        mngt_unit_rk,\n        mngt_unit_nm,\n        lvl,\n        type_flg,\n        experience_group_nm,  -- ✅\n        ottok_amt,\n        employee_amt,\n        CASE \n            WHEN lag_employee_amt IS NULL THEN employee_amt  \n            ELSE (lag_employee_amt + employee_amt) / (2*1.0) \n        END AS spch,\n        CASE \n            WHEN (CASE \n                    WHEN lag_employee_amt IS NULL THEN employee_amt  \n                    ELSE (lag_employee_amt + employee_amt) / (2*1.0) \n                  END) = 0 THEN 0\n            ELSE ottok_amt / ((CASE \n                                 WHEN lag_employee_amt IS NULL THEN employee_amt  \n                                 ELSE (lag_employee_amt + employee_amt) / (2*1.0)\n                               END) * 1.0)\n        END AS tekuchest\n    FROM lag_ottok_count_reason_group \n),\n\nff AS (\n    SELECT * FROM tekuchest_ottok_count_reason_group \n    WHERE 1=1\n      AND (\n        -- Предыдущий год (частично)\n        (month >= MAKE_DATE(EXTRACT(YEAR FROM $form_multiselect_1::date)::INT - 1, 1, 1)\n         AND month < MAKE_DATE(EXTRACT(YEAR FROM $form_multiselect_1::date)::INT, 1, 1)\n         AND month + INTERVAL '1 year' <= $form_multiselect_1::date)\n        OR \n        -- Текущий год\n        (month >= DATE_TRUNC('year', $form_multiselect_1::date))\n      )\n)\n\n, tekuchest_ottok_count_year_reason_group AS (\n    SELECT \n        mngt_unit_rk,\n        mngt_unit_nm,\n        lvl,\n        experience_group_nm,  -- ✅\n        DATE_TRUNC('year', $form_multiselect_1::date)::DATE AS cur_year,\n        (DATE_TRUNC('year', $form_multiselect_1::date) - INTERVAL '1 year')::DATE AS prev_year,\n        COALESCE(SUM(ottok_amt) FILTER (\n            WHERE DATE_TRUNC('year', $form_multiselect_1::date) = DATE_TRUNC('year', month)\n        ), 0) AS ottok_cur_year_amt,\n        COALESCE(SUM(ottok_amt) FILTER (\n            WHERE (DATE_TRUNC('year', $form_multiselect_1::date) - INTERVAL '1 year') = DATE_TRUNC('year', month)\n        ), 0) AS ottok_prev_year_amt,\n        COALESCE(SUM(tekuchest) FILTER (\n            WHERE DATE_TRUNC('year', $form_multiselect_1::date) = DATE_TRUNC('year', month)\n        ), 0) AS tekuchest_cur_year_amt,\n        COALESCE(SUM(tekuchest) FILTER (\n            WHERE (DATE_TRUNC('year', $form_multiselect_1::date) - INTERVAL '1 year') = DATE_TRUNC('year', month)\n        ), 0) AS tekuchest_prev_year_amt\n    FROM ff\n    GROUP BY \n        1, 2, 3, 4, 5, 6  -- ✅ Включая experience_group_nm (5), cur_year (6), prev_year (7)\n)\n\n-- Финальный SELECT\nSELECT \n    tekuchest_ottok_count_year_reason_group.*,\n    CASE\n        WHEN tekuchest_ottok_count_year_reason_group.experience_group_nm = 'до 1 года' THEN 1 \n        WHEN tekuchest_ottok_count_year_reason_group.experience_group_nm = 'от 1 до 3 лет' THEN 2\n        WHEN tekuchest_ottok_count_year_reason_group.experience_group_nm = 'от 3 до 5 лет' THEN 3\n        WHEN tekuchest_ottok_count_year_reason_group.experience_group_nm = 'от 5 до 10 лет' THEN 4\n        WHEN tekuchest_ottok_count_year_reason_group.experience_group_nm = 'свыше 10 лет' THEN 5\n        ELSE 6\n    END AS num_experience,  -- ✅ Ранжирование по стажу\n    ROW_NUMBER() OVER (\n        PARTITION BY experience_group_nm, mngt_unit_rk, type_flg \n        ORDER BY ottok_cur_year_amt DESC\n    ) AS rn  -- ✅ Ранжирование внутри группы опыта\nFROM tekuchest_ottok_count_year_reason_group;\n\n-- Проверка\nSELECT * FROM experience_fire_initiative WHERE mngt_unit_nm = '1C HR Data';\n\n\n\n\nSELECT DISTINCT fire_initiative, COUNT(*) AS cnt, SUM(ottok) AS total_ottok\nFROM ottok_count\nGROUP BY 1\nORDER BY total_ottok DESC;"
    isEnabled: false
  - sid: 01a0b3c7-0012-76d6-8bb7-689b56c909d5
    title: Untitled 82
    shebang: gp
    code: "DROP TABLE IF EXISTS fire_reason_initiative_hq;\nCREATE TABLE fire_reason_initiative_hq AS\nSELECT \n    o.month,\n    o.mngt_unit_rk,\n    o.mngt_unit_nm,\n    o.lvl,\n    o.experience_group_nm,\n    SUM(o.ottok) AS ottok,\n    MAX(e.employee_amt) AS employee_amt   -- ✅ MAX, а не SUM: численность одна на группу стажа\nFROM ottok_count o\nLEFT JOIN employee_count e \n    ON o.month = e.month \n   AND o.mngt_unit_rk = e.mngt_unit_rk\n   AND o.lvl = e.lvl\n   AND o.experience_group_nm = e.experience_group_nm\nWHERE o.month::date <= date_trunc('month', $form_multiselect_1::date)::date\n  AND o.fire_initiative = 'Инициатива работника'   -- ❗ подставить точное значение из шага 2\nGROUP BY 1, 2, 3, 4, 5;\n\n\nDROP TABLE IF EXISTS rience_group_initiative_hq;\nCREATE TABLE rience_group_initiative_hq AS\nWITH lag_ottok_count AS (\n    SELECT \n        month, mngt_unit_rk, mngt_unit_nm, lvl, experience_group_nm,\n        ottok AS ottok_amt,\n        employee_amt,\n        LAG(employee_amt) OVER (\n            PARTITION BY mngt_unit_rk, mngt_unit_nm, lvl, experience_group_nm\n            ORDER BY month\n        ) AS lag_employee_amt\n    FROM fire_reason_initiative_hq\n),\ndd AS (\n    SELECT\n        month, mngt_unit_rk, mngt_unit_nm, lvl, experience_group_nm,\n        ottok_amt, employee_amt,\n        CASE WHEN lag_employee_amt IS NULL THEN employee_amt\n             ELSE (lag_employee_amt + employee_amt) / 2.0 END AS spch,\n        CASE \n            WHEN (CASE WHEN lag_employee_amt IS NULL THEN employee_amt\n                       ELSE (lag_employee_amt + employee_amt) / 2.0 END) = 0 THEN 0\n            ELSE ottok_amt / (CASE WHEN lag_employee_amt IS NULL THEN employee_amt\n                                   ELSE (lag_employee_amt + employee_amt) / 2.0 END)\n        END AS tekuchest\n    FROM lag_ottok_count\n),\ntekuchest_ottok_count AS (\n    SELECT * FROM dd\n    WHERE (\n        (month >= MAKE_DATE(EXTRACT(YEAR FROM $form_multiselect_1::date)::INT - 1, 1, 1)\n         AND month < MAKE_DATE(EXTRACT(YEAR FROM $form_multiselect_1::date)::INT, 1, 1)\n         AND month + INTERVAL '1 year' <= $form_multiselect_1::date)\n        OR (month >= date_trunc('year', $form_multiselect_1::date))\n    )\n)\nSELECT \n    mngt_unit_rk,\n    experience_group_nm,\n    date_trunc('year', $form_multiselect_1::date)::date AS cur_year,\n    (date_trunc('year', $form_multiselect_1::date) - interval '1 year')::date AS prev_year,\n    COALESCE(SUM(ottok_amt) FILTER (\n        WHERE date_trunc('year', $form_multiselect_1::date) = date_trunc('year', month)\n    ), 0) AS initiative_ottok_cur_year_amt,\n    COALESCE(SUM(ottok_amt) FILTER (\n        WHERE (date_trunc('year', $form_multiselect_1::date) - interval '1 year')::date = date_trunc('year', month)\n    ), 0) AS initiative_ottok_prev_year_amt,\n    COALESCE(SUM(tekuchest) FILTER (\n        WHERE date_trunc('year', $form_multiselect_1::date) = date_trunc('year', month)\n    ), 0) AS initiative_tekuchest_cur_year_amt,\n    COALESCE(SUM(tekuchest) FILTER (\n        WHERE (date_trunc('year', $form_multiselect_1::date) - interval '1 year')::date = date_trunc('year', month)\n    ), 0) AS initiative_tekuchest_prev_year_amt\nFROM tekuchest_ottok_count\nGROUP BY 1, 2;"
    isEnabled: true
  - sid: 01a0af82-38c4-75e9-997d-cf5a9fe7bc8b
    title: tekuchest_hq
    shebang: gp
    code: "DROP TABLE IF EXISTS experience_initiative_reason_unit_tekuchest_hq;\nCREATE TABLE experience_initiative_reason_unit_tekuchest_hq AS\n\nSELECT \n    r.*,\n    rgi.initiative_ottok_cur_year_amt         AS initiative_ottok_cur_year_amt,\n    rgi.initiative_ottok_prev_year_amt        AS initiative_ottok_prev_year_amt,\n    rgi.initiative_tekuchest_cur_year_amt     AS initiative_tekuchest_cur_year_amt,\n    rgi.initiative_tekuchest_prev_year_amt    AS initiative_tekuchest_prev_year_amt\nFROM usr_wrk.experience_group_fire_reason r\nLEFT JOIN rience_group_initiative_hq rgi\n    on  rgi.mngt_unit_rk        = r.mngt_unit_rk\n    and rgi.experience_group_nm = r.experience_group_nm       ;\n\n\n\ndrop table if exists usr_cross_data.experience_initiative_reason_unit_tekuchest_hq  ;\ncreate table  usr_cross_data.experience_initiative_reason_unit_tekuchest_hq   as\n\nselect \n    mngt_unit_rk\n    ,mngt_unit_nm\n    ,new_management_unit_nm\n    ,lvl\n    ,experience_group_nm\n    ,fire_reason\n    ,cur_year\n    ,prev_year\n    -- ,ottok_cur_year_amt\n    -- ,ottok_prev_year_amt\n    ,round (tekuchest_cur_year_amt, 6) as tekuchest_cur_year_amt\n    ,round (tekuchest_prev_year_amt, 6) as tekuchest_prev_year_amt\n    ,rn\n    -- ,initiative_ottok_cur_year_amt\n    -- ,initiative_ottok_prev_year_amt\n    ,round (initiative_tekuchest_cur_year_amt, 6) as initiative_tekuchest_cur_year_amt\n    ,round (initiative_tekuchest_prev_year_amt, 6) as initiative_tekuchest_prev_year_amt\n\nfrom experience_initiative_reason_unit_tekuchest_hq\n\nwhere\n    rn in (1,2,3)"
    isEnabled: true

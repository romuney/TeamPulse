  - sid: 019c9a8c-1cf0-7827-9d7b-0c00e6c9d5b9
    title: ottok_count_reason_group
    shebang: gp
    code: " drop table if exists ottok_count_reason_group ;\r\ncreate table ottok_count_reason_group  as\r\n\r\nSELECT \r\n        DATE_TRUNC('month', calendar_dt)::DATE AS month,\r\n        lvl2_mapped_management_unit_rk::TEXT AS mngt_unit_rk,\r\n        lvl2_mapped_management_unit_nm::TEXT AS mngt_unit_nm,\r\n        2::INT AS lvl,\r\n        COALESCE(fire_reason, 'n/a')::TEXT AS fire_reason,\r\n        COALESCE(fire_initiative, 'n/a')::TEXT AS fire_initiative,\r\n        COUNT(mdm_employee_rk) FILTER (WHERE fire_flg = 1) AS ottok\r\n    FROM \r\n        usr_cross_data.hr_executive_proteus\r\n    WHERE \r\n        lvl2_mapped_management_unit_rk IS NOT NULL\r\n        AND lvl2_mapped_management_unit_rk <> '-'\r\n        AND active_type_nm = 'Активная'\r\n        AND emp_specialization_oper_code = 'Hq'\r\n        AND calendar_dt::DATE >= DATE_TRUNC('month', $form_multiselect_1::date - INTERVAL '25 months')::DATE\r\n    GROUP BY \r\n        month, mngt_unit_rk, mngt_unit_nm, lvl, fire_reason, fire_initiative\r\nUNION ALL\r\nSELECT \r\n        DATE_TRUNC('month', calendar_dt)::DATE AS month,\r\n        lvl3_mapped_management_unit_rk::TEXT AS mngt_unit_rk,\r\n        lvl3_mapped_management_unit_nm::TEXT AS mngt_unit_nm,\r\n        3::INT AS lvl,\r\n        COALESCE(fire_reason, 'n/a')::TEXT AS fire_reason,\r\n        COALESCE(fire_initiative, 'n/a')::TEXT AS fire_initiative,\r\n        COUNT(mdm_employee_rk) FILTER (WHERE fire_flg = 1) AS ottok\r\n    FROM \r\n        usr_cross_data.hr_executive_proteus\r\n    WHERE \r\n        lvl3_mapped_management_unit_rk IS NOT NULL\r\n        AND lvl3_mapped_management_unit_rk <> '-'\r\n        AND active_type_nm = 'Активная'\r\n        AND emp_specialization_oper_code = 'Hq'\r\n        AND calendar_dt::DATE >= DATE_TRUNC('month', $form_multiselect_1::date - INTERVAL '25 months')::DATE\r\n    GROUP BY \r\n        month, mngt_unit_rk, mngt_unit_nm, lvl, fire_reason, fire_initiative\r\nUNION ALL\r\nSELECT \r\n        DATE_TRUNC('month', calendar_dt)::DATE AS month,\r\n        lvl4_mapped_management_unit_rk::TEXT AS mngt_unit_rk,\r\n        lvl4_mapped_management_unit_nm::TEXT AS mngt_unit_nm,\r\n        4::INT AS lvl,\r\n        COALESCE(fire_reason, 'n/a')::TEXT AS fire_reason,\r\n        COALESCE(fire_initiative, 'n/a')::TEXT AS fire_initiative,\r\n        COUNT(mdm_employee_rk) FILTER (WHERE fire_flg = 1) AS ottok\r\n    FROM \r\n        usr_cross_data.hr_executive_proteus\r\n    WHERE \r\n        lvl4_mapped_management_unit_rk IS NOT NULL\r\n        AND lvl4_mapped_management_unit_rk <> '-'\r\n        AND active_type_nm = 'Активная'\r\n        AND emp_specialization_oper_code = 'Hq'\r\n        AND calendar_dt::DATE >= DATE_TRUNC('month', $form_multiselect_1::date - INTERVAL '25 months')::DATE\r\n    GROUP BY \r\n        month, mngt_unit_rk, mngt_unit_nm, lvl, fire_reason, fire_initiative\r\nUNION ALL\r\nSELECT \r\n        DATE_TRUNC('month', calendar_dt)::DATE AS month,\r\n        lvl5_mapped_management_unit_rk::TEXT AS mngt_unit_rk,\r\n        lvl5_mapped_management_unit_nm::TEXT AS mngt_unit_nm,\r\n        5::INT AS lvl,\r\n        COALESCE(fire_reason, 'n/a')::TEXT AS fire_reason,\r\n        COALESCE(fire_initiative, 'n/a')::TEXT AS fire_initiative,\r\n        COUNT(mdm_employee_rk) FILTER (WHERE fire_flg = 1) AS ottok\r\n    FROM \r\n        usr_cross_data.hr_executive_proteus\r\n    WHERE \r\n        lvl5_mapped_management_unit_rk IS NOT NULL\r\n        AND lvl5_mapped_management_unit_rk <> '-'\r\n        AND active_type_nm = 'Активная'\r\n        AND emp_specialization_oper_code = 'Hq'\r\n        AND calendar_dt::DATE >= DATE_TRUNC('month', $form_multiselect_1::date - INTERVAL '25 months')::DATE\r\n    GROUP BY \r\n        month, mngt_unit_rk, mngt_unit_nm, lvl, fire_reason, fire_initiative\r\nUNION ALL\r\nSELECT \r\n        DATE_TRUNC('month', calendar_dt)::DATE AS month,\r\n        lvl6_mapped_management_unit_rk::TEXT AS mngt_unit_rk,\r\n        lvl6_mapped_management_unit_nm::TEXT AS mngt_unit_nm,\r\n        6::INT AS lvl,\r\n        COALESCE(fire_reason, 'n/a')::TEXT AS fire_reason,\r\n        COALESCE(fire_initiative, 'n/a')::TEXT AS fire_initiative,\r\n        COUNT(mdm_employee_rk) FILTER (WHERE fire_flg = 1) AS ottok\r\n    FROM \r\n        usr_cross_data.hr_executive_proteus\r\n    WHERE \r\n        lvl6_mapped_management_unit_rk IS NOT NULL\r\n        AND lvl6_mapped_management_unit_rk <> '-'\r\n        AND active_type_nm = 'Активная'\r\n        AND emp_specialization_oper_code = 'Hq'\r\n        AND calendar_dt::DATE >= DATE_TRUNC('month', $form_multiselect_1::date - INTERVAL '25 months')::DATE\r\n    GROUP BY \r\n        month, mngt_unit_rk, mngt_unit_nm, lvl, fire_reason, fire_initiative\r\nUNION ALL\r\nSELECT \r\n        DATE_TRUNC('month', calendar_dt)::DATE AS month,\r\n        lvl7_mapped_management_unit_rk::TEXT AS mngt_unit_rk,\r\n        lvl7_mapped_management_unit_nm::TEXT AS mngt_unit_nm,\r\n        7::INT AS lvl,\r\n        COALESCE(fire_reason, 'n/a')::TEXT AS fire_reason,\r\n        COALESCE(fire_initiative, 'n/a')::TEXT AS fire_initiative,\r\n        COUNT(mdm_employee_rk) FILTER (WHERE fire_flg = 1) AS ottok\r\n    FROM \r\n        usr_cross_data.hr_executive_proteus\r\n    WHERE \r\n        lvl7_mapped_management_unit_rk IS NOT NULL\r\n        AND lvl7_mapped_management_unit_rk <> '-'\r\n        AND active_type_nm = 'Активная'\r\n        AND emp_specialization_oper_code = 'Hq'\r\n        AND calendar_dt::DATE >= DATE_TRUNC('month', $form_multiselect_1::date - INTERVAL '25 months')::DATE\r\n    GROUP BY \r\n        month, mngt_unit_rk, mngt_unit_nm, lvl, fire_reason, fire_initiative\r\nUNION ALL\r\nSELECT \r\n        DATE_TRUNC('month', calendar_dt)::DATE AS month,\r\n        lvl8_mapped_management_unit_rk::TEXT AS mngt_unit_rk,\r\n        lvl8_mapped_management_unit_nm::TEXT AS mngt_unit_nm,\r\n        8::INT AS lvl,\r\n        COALESCE(fire_reason, 'n/a')::TEXT AS fire_reason,\r\n        COALESCE(fire_initiative, 'n/a')::TEXT AS fire_initiative,\r\n        COUNT(mdm_employee_rk) FILTER (WHERE fire_flg = 1) AS ottok\r\n    FROM \r\n        usr_cross_data.hr_executive_proteus\r\n    WHERE \r\n        lvl8_mapped_management_unit_rk IS NOT NULL\r\n        AND lvl8_mapped_management_unit_rk <> '-'\r\n        AND active_type_nm = 'Активная'\r\n        AND emp_specialization_oper_code = 'Hq'\r\n        AND calendar_dt::DATE >= DATE_TRUNC('month', $form_multiselect_1::date - INTERVAL '25 months')::DATE\r\n    GROUP BY \r\n        month, mngt_unit_rk, mngt_unit_nm, lvl, fire_reason, fire_initiative\r\nUNION ALL\r\nSELECT \r\n        DATE_TRUNC('month', calendar_dt)::DATE AS month,\r\n        lvl9_mapped_management_unit_rk::TEXT AS mngt_unit_rk,\r\n        lvl9_mapped_management_unit_nm::TEXT AS mngt_unit_nm,\r\n        9::INT AS lvl,\r\n        COALESCE(fire_reason, 'n/a')::TEXT AS fire_reason,\r\n        COALESCE(fire_initiative, 'n/a')::TEXT AS fire_initiative,\r\n        COUNT(mdm_employee_rk) FILTER (WHERE fire_flg = 1) AS ottok\r\n    FROM \r\n        usr_cross_data.hr_executive_proteus\r\n    WHERE \r\n        lvl9_mapped_management_unit_rk IS NOT NULL\r\n        AND lvl9_mapped_management_unit_rk <> '-'\r\n        AND active_type_nm = 'Активная'\r\n        AND emp_specialization_oper_code = 'Hq'\r\n        AND calendar_dt::DATE >= DATE_TRUNC('month', $form_multiselect_1::date - INTERVAL '25 months')::DATE\r\n    GROUP BY \r\n        month, mngt_unit_rk, mngt_unit_nm, lvl, fire_reason, fire_initiative\r\nUNION ALL\r\nSELECT \r\n        DATE_TRUNC('month', calendar_dt)::DATE AS month,\r\n        lvl10_mapped_management_unit_rk::TEXT AS mngt_unit_rk,\r\n        lvl10_mapped_management_unit_nm::TEXT AS mngt_unit_nm,\r\n        10::INT AS lvl,\r\n        COALESCE(fire_reason, 'n/a')::TEXT AS fire_reason,\r\n        COALESCE(fire_initiative, 'n/a')::TEXT AS fire_initiative,\r\n        COUNT(mdm_employee_rk) FILTER (WHERE fire_flg = 1) AS ottok\r\n    FROM \r\n        usr_cross_data.hr_executive_proteus\r\n    WHERE \r\n        lvl10_mapped_management_unit_rk IS NOT NULL\r\n        AND lvl10_mapped_management_unit_rk <> '-'\r\n        AND active_type_nm = 'Активная'\r\n        AND emp_specialization_oper_code = 'Hq'\r\n        AND calendar_dt::DATE >= DATE_TRUNC('month', $form_multiselect_1::date - INTERVAL '25 months')::DATE\r\n    GROUP BY \r\n        month, mngt_unit_rk, mngt_unit_nm, lvl, fire_reason, fire_initiative\r\nUNION ALL\r\nSELECT \r\n        DATE_TRUNC('month', calendar_dt)::DATE AS month,\r\n        lvl11_mapped_management_unit_rk::TEXT AS mngt_unit_rk,\r\n        lvl11_mapped_management_unit_nm::TEXT AS mngt_unit_nm,\r\n        11::INT AS lvl,\r\n        COALESCE(fire_reason, 'n/a')::TEXT AS fire_reason,\r\n        COALESCE(fire_initiative, 'n/a')::TEXT AS fire_initiative,\r\n        COUNT(mdm_employee_rk) FILTER (WHERE fire_flg = 1) AS ottok\r\n    FROM \r\n        usr_cross_data.hr_executive_proteus\r\n    WHERE \r\n        lvl11_mapped_management_unit_rk IS NOT NULL\r\n        AND lvl11_mapped_management_unit_rk <> '-'\r\n        AND active_type_nm = 'Активная'\r\n        AND emp_specialization_oper_code = 'Hq'\r\n        AND calendar_dt::DATE >= DATE_TRUNC('month', $form_multiselect_1::date - INTERVAL '25 months')::DATE\r\n    GROUP BY \r\n        month, mngt_unit_rk, mngt_unit_nm, lvl, fire_reason, fire_initiative"
    isEnabled: true
    color: "#7DD4F6"

    code: "drop table if exists lag_total ;\r\ncreate table lag_total  as\r\n\r\nWITH fire  AS (\r\n\r\nselect \r\nmngt_unit_rk\r\n,mngt_unit_nm\r\n,lvl\r\n,extract(month from month ) as month_num\r\n, month as start_of_month_dt\r\n-- , 16 as benchmark_max\r\n, ottok as fire_employee\r\n,employee_amt \r\n,it_amt\r\n-- ,case when \r\n-- sum(employee_amt ) OVER (PARTITION BY mngt_unit_rk,mngt_unit_nm,lvl ,date_trunc('year',month)::date) \r\n-- =\r\n-- sum(it_amt) OVER (PARTITION BY mngt_unit_rk,mngt_unit_nm,lvl ,date_trunc('year',month)::date) then 1 else 0 end as ddd\r\n\r\n,case when \r\nsum(employee_amt ) OVER (PARTITION BY mngt_unit_rk,mngt_unit_nm,lvl ) \r\n=\r\nsum(it_amt) OVER (PARTITION BY mngt_unit_rk,mngt_unit_nm,lvl ) then 1 else 0 end as ddd\r\n\r\n,lag(employee_amt) OVER (PARTITION BY mngt_unit_rk,mngt_unit_nm,lvl ORDER BY month ) as lag_employee_amt\r\n\r\n,date_trunc('year',month)::date as year\r\nfrom fire \r\n\r\n)\r\n,\r\nfire1  AS (\r\nselect fire.* \r\n, sum(fire_employee) OVER (PARTITION BY mngt_unit_rk, mngt_unit_nm, lvl, year   ORDER BY start_of_month_dt)  as sum_fire\r\n\r\n, (case when lag_employee_amt is null then employee_amt  else (lag_employee_amt+employee_amt) / (2*1.0) end)::numeric as total_avg_headcount_month\r\n\r\n,(case when (case when lag_employee_amt is null then employee_amt  else (lag_employee_amt+employee_amt) / (2*1.0)end)=0 then 0\r\n else (fire_employee /  ((case when lag_employee_amt is null then employee_amt  else (lag_employee_amt+employee_amt) / (2*1.0) end)*1.0))\r\n end) *100  as tek_month\r\n, row_number() OVER (PARTITION BY mngt_unit_rk, mngt_unit_nm, lvl,year ORDER BY start_of_month_dt ) as period_number\r\n\r\nfrom fire \r\n)\r\n\r\nselect  fire1.*\r\n,  coalesce(((lag(total_avg_headcount_month::numeric) OVER (PARTITION BY mngt_unit_rk,mngt_unit_nm,lvl ORDER BY start_of_month_dt))::numeric),0) as total_avg_headcount_month_prev\r\n\r\n--, coalesce( max (ddd)  over (partition by mngt_unit_rk, mngt_unit_nm, lvl,year),0) as fff\r\n\r\n, coalesce( max (ddd)  over (partition by mngt_unit_rk, mngt_unit_nm, lvl),0) as fff\r\n\r\nfrom fire1 \r\n\r\nwhere 1=1\r\n--  and mngt_unit_nm IN ('Департамент HR')\r\n-- -- and start_of_month_dt::date <= date_trunc('month', $form_multiselect_1::date)::date \r\n-- -- and start_of_month_dt::date >=(date_trunc('year',$form_multiselect_1::date)  - interval '1 year')::date\r\n;\r\nselect * from lag_total   where mngt_unit_nm IN ('Департамент HR')\r\n\r\n-- limit 100;"
    isEnabled: true

    code: "\r\ndrop table if exists usr_wrk.experience_group_fire_reason ;\r\ncreate table usr_wrk.experience_group_fire_reason   as\r\n\r\nWITH lag_ottok_count AS (\r\n    select \r\n        month\r\n        ,mngt_unit_rk\r\n        ,mngt_unit_nm\r\n        ,lvl\r\n        ,experience_group_nm\r\n        ,fire_reason\r\n        ,ottok as ottok_amt\r\n        ,employee_amt\r\n        ,lag(employee_amt) OVER (PARTITION BY \r\n            mngt_unit_rk\r\n            ,mngt_unit_nm\r\n            ,lvl\r\n            ,experience_group_nm,fire_reason ORDER BY month ) as lag_employee_amt\r\n    from fire_reason_a  \r\n)\r\n, dd AS (\r\n    select\r\n        month\r\n        ,mngt_unit_rk\r\n        ,mngt_unit_nm\r\n        ,lvl\r\n        ,experience_group_nm\r\n        ,fire_reason\r\n        ,ottok_amt\r\n        ,employee_amt\r\n        , case \r\n            when lag_employee_amt is null then employee_amt  else (lag_employee_amt+employee_amt) / (2*1.0)  \r\n        end as spch\r\n        ,case \r\n            when (case when lag_employee_amt is null then employee_amt  else (lag_employee_amt+employee_amt) / (2*1.0)  end)=0 then 0\r\n            else (ottok_amt /  ((case when lag_employee_amt is null then employee_amt  else (lag_employee_amt+employee_amt) / (2*1.0)  end)*1.0))\r\n        end  as tekuchest\r\n\r\n    from lag_ottok_count\r\n)\r\n\r\n, tekuchest_ottok_count AS (\r\nselect * from dd \r\n    where 1=1\r\nand \r\n(\r\n (month >= MAKE_DATE(EXTRACT(YEAR FROM $form_multiselect_1::date)::INT - 1, 1, 1)\r\n  AND month < MAKE_DATE(EXTRACT(YEAR FROM $form_multiselect_1::date)::INT, 1, 1)\r\n  AND month + INTERVAL '1 year' <= $form_multiselect_1::date) \r\n or \r\n ( month>=   date_trunc('year',$form_multiselect_1::date) )\r\n)\r\n)\r\n\r\n, tekuchest_ottok_count_year AS (\r\n select \r\nmngt_unit_rk\r\n,mngt_unit_nm\r\n,lvl\r\n,experience_group_nm\r\n,case\r\nwhen experience_group_nm='Стаж менее 3 мес' then 1 \r\nwhen experience_group_nm='Стаж от 3 до 6 мес' then 2\r\nwhen experience_group_nm='Стаж от 6 мес до 1 года' then 3\r\nwhen experience_group_nm='Стаж от 1 до 2 лет' then 4\r\nwhen experience_group_nm='Стаж от 2 до 5 лет' then 5\r\nwhen experience_group_nm='Стаж более 5 лет' then 6\r\nend as num_experience\r\n,fire_reason\r\n,date_trunc('year',$form_multiselect_1::date )::date  as cur_year\r\n,(date_trunc('year',$form_multiselect_1::date)  - interval '1 year')::date as prev_year\r\n,coalesce( sum(ottok_amt) filter (where date_trunc('year',$form_multiselect_1::date) = date_trunc('year',month )) ,0) as ottok_cur_year_amt\r\n,coalesce( sum(ottok_amt) filter (where (date_trunc('year',$form_multiselect_1::date)  - interval '1 year')::date= date_trunc('year',month )) ,0) as ottok_prev_year_amt\r\n,coalesce( sum(tekuchest) filter (where date_trunc('year',$form_multiselect_1::date ) = date_trunc('year',month )) ,0) as tekuchest_cur_year_amt\r\n,coalesce( sum(tekuchest) filter (where (date_trunc('year',$form_multiselect_1::date)  - interval '1 year')::date= date_trunc('year',month )) ,0) as tekuchest_prev_year_amt\r\n\r\nfrom tekuchest_ottok_count \r\n\r\ngroup by 1,2,3,4,5,6\r\n)\r\n\r\nselect \r\n    tekuchest_ottok_count_year.mngt_unit_rk\r\n    ,tekuchest_ottok_count_year.mngt_unit_nm\r\n    ,usr_cross_pub.cross_management_unit.new_management_unit_nm\r\n    ,tekuchest_ottok_count_year.lvl\r\n    ,tekuchest_ottok_count_year.experience_group_nm\r\n    ,tekuchest_ottok_count_year.num_experience\r\n    ,tekuchest_ottok_count_year.fire_reason\r\n    ,tekuchest_ottok_count_year.cur_year\r\n    ,tekuchest_ottok_count_year.prev_year\r\n    ,tekuchest_ottok_count_year.ottok_cur_year_amt\r\n    ,tekuchest_ottok_count_year.ottok_prev_year_amt\r\n    ,tekuchest_ottok_count_year.tekuchest_cur_year_amt\r\n    ,tekuchest_ottok_count_year.tekuchest_prev_year_amt\r\n\r\n --,row_number() OVER (PARTITION BY mngt_unit_rk,experience_group_nm ORDER BY GREATEST(ottok_cur_year_amt, ottok_prev_year_amt) DESC) as rn\r\n    , ROW_NUMBER() OVER (\r\n        PARTITION BY tekuchest_ottok_count_year.mngt_unit_rk, tekuchest_ottok_count_year.experience_group_nm\r\n        ORDER BY \r\n            CASE \r\n                WHEN tekuchest_ottok_count_year.ottok_cur_year_amt <> 0 THEN 0\r\n                ELSE 1\r\n            END,\r\n            GREATEST(tekuchest_ottok_count_year.ottok_cur_year_amt, 0) DESC,\r\n            tekuchest_ottok_count_year.ottok_prev_year_amt DESC\r\n    ) AS rn\r\n    ,rience_group_fire_reason.ottok_cur_year_amt        as experience_ottok_cur_year_amt \r\n    ,rience_group_fire_reason.ottok_prev_year_amt       as experience_ottok_prev_year_amt\r\n    ,rience_group_fire_reason.tekuchest_cur_year_amt\tas experience_tekuchest_cur_year_amt\r\n    ,rience_group_fire_reason.tekuchest_prev_year_amt   as  experience_tekuchest_prev_year_amt\r\n\r\n    ,unit_nm.ottok_cur_year_amt\t as unit_ottok_cur_year_amt\r\n    ,unit_nm.ottok_prev_year_amt as unit_ottok_prev_year_amt\t\r\n    ,unit_nm.tekuchest_cur_year_amt\t as unit_tekuchest_cur_year_amt\r\n    ,unit_nm.tekuchest_prev_year_amt as unit_tekuchest_prev_year_amt\r\n\r\nfrom tekuchest_ottok_count_year\r\nleft join usr_cross_pub.cross_management_unit\r\n    on  tekuchest_ottok_count_year.mngt_unit_rk = usr_cross_pub.cross_management_unit.management_unit_rk\r\nleft join rience_group_fire_reason\r\n    on  rience_group_fire_reason.mngt_unit_rk        = tekuchest_ottok_count_year.mngt_unit_rk\r\n    and rience_group_fire_reason.experience_group_nm = tekuchest_ottok_count_year.experience_group_nm\r\nleft join unit_nm \r\n    on tekuchest_ottok_count_year.mngt_unit_rk  =  unit_nm.mngt_unit_rk\r\n\r\n;\r\n\r\nselect * from usr_wrk.experience_group_fire_reason where mngt_unit_nm = 'Сервис линии'"
    isEnabled: true
  - sid: 019c99cd-f543-7d3d-a675-0d7da9929335
    title: experience_group_fire_reason
    shebang: python_condition
    code: "\r\n\r\nimport tinkoff as tf \r\n\r\n# код был добавлен автоматически: https://time.tbank.ru/tinkoff/pl/g9jfbuwk8bb8mrp84eck398seh\n\r\nimport proteus_py.database.clickhouse as ppy\n\nimport time\n\n\ndef gp_to_click_with_retry(*args, attempts=3, delays=(30, 60), **kwargs):\n    \"\"\"Обёртка над gp_to_click с retry: до 3 попыток, пауза 30 сек, затем 60 сек.\"\"\"\n    last_exc = None\n    for attempt in range(1, attempts + 1):\n        try:\n            ppy.gp_to_click(*args, **kwargs)\n            return\n        except Exception as e:\n            last_exc = e\n            if attempt < attempts:\n                delay = delays[attempt - 1] if attempt - 1 < len(delays) else delays[-1]\n                print(f\"Попытка {attempt} не удалась: {e}. Повтор через {delay} сек...\")\n                time.sleep(delay)\n    raise last_exc\n\r\ngp_to_click_with_retry('usr_wrk.experience_group_fire_reason', 'prod_proteus.experience_group_fire_reason')\n\r\n\r\n\r\n#\r\n# from proteus_py.database.clickhouse import gp_to_click\r\n\r\n# gp_to_click('usr_wrk.experience_group_fire_reason', 'prod_proteus.experience_group_fire_reason',\r\n# gp_service = 'gp',\r\n# upload_mode = 'replace')"
    isEnabled: true
    color: "#FDC454"

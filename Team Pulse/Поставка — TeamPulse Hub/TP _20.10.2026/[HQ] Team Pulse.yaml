      import tinkoff as tf
      import proteus_py.database.clickhouse as ppy
      import time


      def gp_to_click_with_retry(*args, attempts=3, **kwargs):
          """Обёртка над gp_to_click с retry: до 3 попыток, пауза 30 сек, затем 60 сек."""
          last_exc = None
          delay_default = 30
          for attempt in range(1, attempts + 1):
              try:
                  ppy.gp_to_click(*args, **kwargs)
                  return
              except Exception as e:
                  last_exc = e
                  if attempt < attempts:
                      delay = delay_default * 2 ** (attempt - 1)
                      print(f"Попытка {attempt} не удалась: {e}. Повтор через {delay} сек...")
                      time.sleep(delay)
          raise last_exc

      gp_to_click_with_retry('usr_wrk.atributy_ottoka_year', 'prod_proteus.atributy_ottoka_year')
      gp_to_click_with_retry('usr_wrk.seniority_ottoka_year', 'prod_proteus.seniority_ottoka_year')

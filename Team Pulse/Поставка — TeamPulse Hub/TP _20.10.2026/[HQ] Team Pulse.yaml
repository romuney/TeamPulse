    code: "drop table if exists total_set_hq1 ;\r\ncreate table total_set_hq1   as\r\n\r\nWITH fi  AS (\r\nselect \r\nlag_total.*\r\n--, case when (date_trunc('year',$form_multiselect_1::date)) = year  and fff=1 then 14 else 16 end as benchmark_max_pre\r\n, case when  fff=1 then 14 else 16 end as benchmark_max_pre\r\n--,max(case when (date_trunc('year',$form_multiselect_1::date)) = year  and fff=1 then 14 else 16 end)  filter (where date_trunc('year',$form_multiselect_1::date) = year)  over (partition by mngt_unit_rk, mngt_unit_nm, lvl) as benchmark_max\r\n,max(case when  fff=1 then 12 else 15 end)    over (partition by mngt_unit_rk, mngt_unit_nm, lvl) as benchmark_max\r\n, sum(tek_month) OVER (PARTITION BY mngt_unit_rk, mngt_unit_nm, lvl, year   ORDER BY start_of_month_dt)  as metric_value\r\n,max(start_of_month_dt) OVER (PARTITION BY mngt_unit_rk, mngt_unit_nm, lvl) as month_max\r\n\r\nfrom lag_total \r\n\r\nwhere 1=1\r\n--and mngt_unit_nm IN ('Департамент HR')\r\nand start_of_month_dt::date <= date_trunc('month', $form_multiselect_1::date)::date \r\nand start_of_month_dt::date >=(date_trunc('year',$form_multiselect_1::date)  - interval '1 year')::date\r\n\r\norder by start_of_month_dt\r\n)\r\n\r\nselect fi.*\r\n , coalesce(  lag(metric_value) OVER (PARTITION BY mngt_unit_rk, mngt_unit_nm, lvl,year  ORDER BY start_of_month_dt),0) as metric_value_prev\r\n\r\n, case when (max(metric_value) OVER (PARTITION BY mngt_unit_rk, mngt_unit_nm, lvl)) < 18 THEN 18 else\r\n (max(metric_value) OVER (PARTITION BY mngt_unit_rk, mngt_unit_nm, lvl)) end as max_value_ytd_turnover\r\n\r\n ,CASE \r\n  WHEN  (case when (max(metric_value) OVER (PARTITION BY mngt_unit_rk, mngt_unit_nm, lvl)) < 18 THEN 18 else\r\n (max(metric_value) OVER (PARTITION BY mngt_unit_rk, mngt_unit_nm, lvl)) end) < 18 THEN 18\r\n  ELSE (case when (max(metric_value) OVER (PARTITION BY mngt_unit_rk, mngt_unit_nm, lvl)) < 18 THEN 18 else\r\n (max(metric_value) OVER (PARTITION BY mngt_unit_rk, mngt_unit_nm, lvl)) end) \r\nEND as max_value\r\n\r\n, 0::numeric  as min_value\r\n\r\n, 101 - round((metric_value / (CASE \r\n  WHEN  (case when (max(metric_value) OVER (PARTITION BY mngt_unit_rk, mngt_unit_nm, lvl)) < 18 THEN 18 else\r\n (max(metric_value) OVER (PARTITION BY mngt_unit_rk, mngt_unit_nm, lvl)) end) < 18 THEN 18\r\n  ELSE (case when (max(metric_value) OVER (PARTITION BY mngt_unit_rk, mngt_unit_nm, lvl)) < 18 THEN 18 else\r\n (max(metric_value) OVER (PARTITION BY mngt_unit_rk, mngt_unit_nm, lvl)) end) \r\nEND)*1.0) * 100) as grid_finish\r\n\r\n,101 - round(( (coalesce(  lag(metric_value) OVER (PARTITION BY mngt_unit_rk, mngt_unit_nm, lvl,year  ORDER BY start_of_month_dt),0)) / ( (CASE \r\n  WHEN  (case when (max(metric_value) OVER (PARTITION BY mngt_unit_rk, mngt_unit_nm, lvl)) < 18 THEN 18 else\r\n (max(metric_value) OVER (PARTITION BY mngt_unit_rk, mngt_unit_nm, lvl)) end) < 18 THEN 18\r\n  ELSE (case when (max(metric_value) OVER (PARTITION BY mngt_unit_rk, mngt_unit_nm, lvl)) < 18 THEN 18 else\r\n (max(metric_value) OVER (PARTITION BY mngt_unit_rk, mngt_unit_nm, lvl)) end) \r\nEND)*1.0)   ) * 100) as grid_start\r\n\r\n, 0 / (12*1.0) * (period_number - 1) as plan_min_prev\r\n\r\n,101 - round(( (0 / (12*1.0) * (period_number - 1)) / ( (CASE \r\n  WHEN  (case when (max(metric_value) OVER (PARTITION BY mngt_unit_rk, mngt_unit_nm, lvl)) < 18 THEN 18 else\r\n (max(metric_value) OVER (PARTITION BY mngt_unit_rk, mngt_unit_nm, lvl)) end) < 18 THEN 18\r\n  ELSE (case when (max(metric_value) OVER (PARTITION BY mngt_unit_rk, mngt_unit_nm, lvl)) < 18 THEN 18 else\r\n (max(metric_value) OVER (PARTITION BY mngt_unit_rk, mngt_unit_nm, lvl)) end) \r\nEND)*1.0) ) * 100) as grid_min_start\r\n\r\n,101 - round(( (0*period_number / ( 12*1.0)) / ( (CASE \r\n  WHEN  (case when (max(metric_value) OVER (PARTITION BY mngt_unit_rk, mngt_unit_nm, lvl)) < 18 THEN 18 else\r\n (max(metric_value) OVER (PARTITION BY mngt_unit_rk, mngt_unit_nm, lvl)) end) < 18 THEN 18\r\n  ELSE (case when (max(metric_value) OVER (PARTITION BY mngt_unit_rk, mngt_unit_nm, lvl)) < 18 THEN 18 else\r\n (max(metric_value) OVER (PARTITION BY mngt_unit_rk, mngt_unit_nm, lvl)) end) \r\nEND) *1.0)) * 100) as grid_min_finish\r\n\r\n, 0*period_number / ( 12*1.0) as plan_min\r\n\r\n\r\n,benchmark_max / ((12*1.0))  * (period_number) as plan_max\r\n,benchmark_max / ( (12*1.0))  * (period_number - 1) as plan_max_prev\r\n\r\n,101 - round(( (benchmark_max / ((12*1.0))  * (period_number))/ (CASE \r\n  WHEN  (case when (max(metric_value) OVER (PARTITION BY mngt_unit_rk, mngt_unit_nm, lvl)) < 18 THEN 18 else\r\n (max(metric_value) OVER (PARTITION BY mngt_unit_rk, mngt_unit_nm, lvl)) end) < 18 THEN 18\r\n  ELSE (case when (max(metric_value) OVER (PARTITION BY mngt_unit_rk, mngt_unit_nm, lvl)) < 18 THEN 18 else\r\n (max(metric_value) OVER (PARTITION BY mngt_unit_rk, mngt_unit_nm, lvl)) end) \r\nEND)*1.0) * 100) as grid_max_finish\r\n\r\n,(lag(sum_fire::numeric) OVER (PARTITION BY mngt_unit_rk,mngt_unit_nm,lvl ORDER BY start_of_month_dt)) as sum_fire_prev\r\n\r\n,101 - round(( (benchmark_max / ( (12*1.0))  * (period_number - 1)) / ((CASE \r\n  WHEN  (case when (max(metric_value) OVER (PARTITION BY mngt_unit_rk, mngt_unit_nm, lvl)) < 18 THEN 18 else\r\n (max(metric_value) OVER (PARTITION BY mngt_unit_rk, mngt_unit_nm, lvl)) end) < 18 THEN 18\r\n  ELSE (case when (max(metric_value) OVER (PARTITION BY mngt_unit_rk, mngt_unit_nm, lvl)) < 18 THEN 18 else\r\n (max(metric_value) OVER (PARTITION BY mngt_unit_rk, mngt_unit_nm, lvl)) end) \r\nEND)*1.0)     ) * 100)  as grid_max_start\r\n\r\n, 1 as grown_flg\r\n\r\n,max(total_avg_headcount_month) over (PARTITION BY mngt_unit_rk, mngt_unit_nm, lvl) as  max_total_avg\r\n\r\n ,extract(month from month_max ) as end_date\r\n\r\n--\r\n\r\nfrom fi\r\n"
    isEnabled: true

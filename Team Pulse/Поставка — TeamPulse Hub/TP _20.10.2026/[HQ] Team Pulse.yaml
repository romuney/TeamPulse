  - sid: 01a01e67-ed45-7400-a368-962a2d58f5e8
    title: Untitled 76
    shebang: gp
    code: "drop table if exists team_structure;\r\ncreate table team_structure as\r\n\r\nselect ldm.* \r\n,usr_cross_pub.cross_management_unit.new_management_unit_nm\r\nfrom \r\n        ldm\r\n\r\n         left join usr_cross_pub.cross_management_unit\r\n\r\non   ldm.mngt_unit_rk = usr_cross_pub.cross_management_unit.management_unit_rk\r\n\r\n\r\n           WHERE   month = (\r\n        -- Выбираем месяц из параметра, если данные есть; иначе — максимальный месяц\r\n        SELECT COALESCE(\r\n            (\r\n                -- Пытаемся получить данные за указанный в форме месяц\r\n                SELECT month\r\n                FROM ldm\r\n                WHERE month = DATE_TRUNC('month', $form_multiselect_1::DATE)\r\n                LIMIT 1\r\n            ),\r\n            (\r\n                -- Если нет — берём последний доступный месяц\r\n                SELECT MAX(month)\r\n                FROM ldm\r\n            )\r\n        )\r\n    )"
    isEnabled: true

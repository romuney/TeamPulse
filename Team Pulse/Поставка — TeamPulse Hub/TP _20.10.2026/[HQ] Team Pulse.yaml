  - sid: 019c99cd-f543-7d81-86bd-7e774d500582
    title: gp_to_click
    shebang: python
    code: |-
      from proteus_py.database.clickhouse import gp_to_click

      import time


      def gp_to_click_with_retry(*args, attempts=3, delays=(30, 60), **kwargs):
          """Обёртка над gp_to_click с retry: до 3 попыток, пауза 30 сек, затем 60 сек."""
          last_exc = None
          for attempt in range(1, attempts + 1):
              try:
                  gp_to_click(*args, **kwargs)
                  return
              except Exception as e:
                  last_exc = e
                  if attempt < attempts:
                      delay = delays[attempt - 1] if attempt - 1 < len(delays) else delays[-1]
                      print(f"Попытка {attempt} не удалась: {e}. Повтор через {delay} сек...")
                      time.sleep(delay)
          raise last_exc

      gp_to_click_with_retry  ('usr_wrk.general_atributy_nayma', 'prod_proteus.atributy_nayma', gp_service = 'gp', upload_mode = 'replace') ;
      gp_to_click_with_retry  ('usr_wrk.general_last_day_ottok_naym', 'prod_proteus.last_day_ottok_naym', gp_service = 'gp', upload_mode = 'replace') ;
      gp_to_click_with_retry  ('usr_wrk.general_dinamika_aktivnoy_chislennosti_new', 'prod_proteus.dinamika_aktivnoy_chislennosti_new', gp_service = 'gp', upload_mode = 'replace') ;
      gp_to_click_with_retry  ('usr_wrk.general_waterfall_chislennosti_new', 'prod_proteus.waterfall_chislennosti_new', gp_service = 'gp', upload_mode = 'replace') ;
      gp_to_click_with_retry  ('usr_wrk.general_waterfall_perevody', 'prod_proteus.waterfall_perevody', gp_service = 'gp', upload_mode = 'replace') ;
      gp_to_click_with_retry  ('usr_wrk.general_izmeneniye_po_podrazdeleniyam', 'prod_proteus.izmeneniye_po_podrazdeleniyam', gp_service = 'gp', upload_mode = 'replace') ;
      gp_to_click_with_retry  ('usr_wrk.general_izmeneniya_po_spetsializatsiyam', 'prod_proteus.izmeneniya_po_spetsializatsiyam', gp_service = 'gp', upload_mode = 'replace') ;
      gp_to_click_with_retry  ('usr_wrk.general_atributy_ottoka_year', 'prod_proteus.atributy_ottoka_year', gp_service = 'gp', upload_mode = 'replace') ;
      gp_to_click_with_retry  ('usr_wrk.general_seniority_ottoka_year', 'prod_proteus.seniority_ottoka_year', gp_service = 'gp', upload_mode = 'replace') ;
      gp_to_click_with_retry  ('usr_wrk.general_stream_ottoka_year', 'prod_proteus.stream_ottoka_year', gp_service = 'gp', upload_mode = 'replace') ;
      gp_to_click_with_retry  ('usr_wrk.general_grade_ottoka_year', 'prod_proteus.grade_ottoka_year', gp_service = 'gp', upload_mode = 'replace') ;
      gp_to_click_with_retry  ('usr_wrk.general_experience_group_fire_reason', 'prod_proteus.experience_group_fire_reason', gp_service = 'gp', upload_mode = 'replace') ;
      gp_to_click_with_retry  ('usr_wrk.general_experience_fire_reason_group', 'prod_proteus.experience_fire_reason_group', gp_service = 'gp', upload_mode = 'replace') ;
      gp_to_click_with_retry  ('usr_wrk.general_fire_initiative_spch', 'prod_proteus.fire_initiative_spch', gp_service = 'gp', upload_mode = 'replace') ;

      gp_to_click_with_retry  ('usr_wrk.general_regrettable_set_hq', 'prod_proteus.hq_regrettable_set', gp_service = 'gp', upload_mode = 'replace') ;
      gp_to_click_with_retry  ('usr_wrk.general_non_regrettable_set_hq', 'prod_proteus.hq_non_regrettable_set', gp_service = 'gp', upload_mode = 'replace') ;

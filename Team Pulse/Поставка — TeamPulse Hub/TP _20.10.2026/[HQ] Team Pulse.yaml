  - sid: 019c99cd-f543-7c7c-bdff-34f30cb0136e
    title: Handlebars waterfall
    shebang: gp
    code: " drop table if exists usr_wrk.waterfall_chislennosti_new ;\r\n create table usr_wrk.waterfall_chislennosti_new   as\r\n--Handlebars Движение персонала\r\nWITH pre_date AS (\r\n    SELECT\r\n        mngt_unit_rk,\r\n        lvl,\r\n        mngt_unit_nm,\r\n        new_management_unit_nm,\r\n        MAX(month) AS end_date,\r\n        MIN(month) AS start_date\r\n    FROM dinamika_aktivnoy_chislennosti\r\n    \r\n    where 1=1\r\n    and month::date >=  date_trunc('month', $form_multiselect_1::date - interval '11 months')::date\r\nand month::date <= date_trunc('month', $form_multiselect_1::date)::date\r\n    GROUP BY mngt_unit_rk, lvl, mngt_unit_nm, new_management_unit_nm\r\n)\r\n\r\nSELECT\r\n    pd.mngt_unit_rk\r\n    ,pd.lvl\r\n    ,pd.new_management_unit_nm\r\n    ,pd.mngt_unit_nm\r\n    ,pd.start_date\r\n    ,pd.end_date\r\n    ,SUM(CASE WHEN d.month = pd.start_date THEN d.employee_amt ELSE 0 END) AS cnt_start_employee\r\n    ,SUM(CASE WHEN d.month = pd.end_date THEN d.employee_amt ELSE 0 END) AS cnt_end_employee\r\n    ,sum (d.ottok_amt) filter (where d.month::date >=  GREATEST ((date_trunc('month', $form_multiselect_1::date - interval '10 months')), (pd.start_date + interval '1 months'))  and d.month::date <= date_trunc('month', $form_multiselect_1::date)::date) as fire\r\n    ,sum (d.naym_amt) filter (where d.month::date >=  GREATEST ((date_trunc('month', $form_multiselect_1::date - interval '10 months')), (pd.start_date + interval '1 months'))  and d.month::date <= date_trunc('month', $form_multiselect_1::date)::date)  as hire\r\n    ,sum (d.perevody_minus) filter (where d.month::date >=  GREATEST ((date_trunc('month', $form_multiselect_1::date - interval '10 months')), (pd.start_date + interval '1 months'))  and d.month::date <= date_trunc('month', $form_multiselect_1::date)::date)  as transfer_out\r\n    ,sum (d.perevody_plus) filter (where d.month::date >=  GREATEST ((date_trunc('month', $form_multiselect_1::date - interval '10 months')), (pd.start_date + interval '1 months'))  and d.month::date <= date_trunc('month', $form_multiselect_1::date)::date)   as transfer_in\r\n    ,SUM(CASE WHEN d.month = pd.start_date THEN d.employee_amt ELSE 0 END)  + \r\n    sum (d.naym_amt) filter (where d.month::date >=  GREATEST ((date_trunc('month', $form_multiselect_1::date - interval '10 months')), (pd.start_date + interval '1 months'))  and d.month::date <= date_trunc('month', $form_multiselect_1::date)::date) +\r\n    sum (d.perevody_plus) filter (where d.month::date >=  GREATEST ((date_trunc('month', $form_multiselect_1::date - interval '10 months')), (pd.start_date + interval '1 months'))  and d.month::date <= date_trunc('month', $form_multiselect_1::date)::date)\r\n    as max_size\r\n\r\nFROM pre_date pd\r\nLEFT JOIN dinamika_aktivnoy_chislennosti d \r\n     ON pd.mngt_unit_rk = d.mngt_unit_rk\r\n    AND pd.lvl = d.lvl\r\n    AND pd.mngt_unit_nm = d.mngt_unit_nm\r\n   \r\n   \r\n    \r\nGROUP BY pd.mngt_unit_rk, pd.lvl, pd.mngt_unit_nm, pd.start_date, pd.end_date ,pd.new_management_unit_nm\r\n\r\ndistributed by (mngt_unit_rk)\r\n;\r\n\r\nselect * from usr_wrk.waterfall_chislennosti_new --where mngt_unit_nm = 'Databases' "
    isEnabled: true

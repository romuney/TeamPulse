    code: "--------------------------------------------------\r\ndrop table if exists usr_wrk.new_general_atributy_nayma;\r\ncreate table usr_wrk.new_general_atributy_nayma  as\r\n\r\n\r\nselect * from usr_wrk.new_atributy_ottoka_year\r\nwhere mngt_unit_rk <> 'ccb024088065af4df3337021924784ec'\r\nunion all\r\nselect * from  usr_wrk.new_it_atributy_ottoka_year\r\nunion all\r\nselect * from  usr_wrk.new_iskl_atributy_ottoka_year\r\n;\r\n\r\n\r\ndrop table if exists usr_wrk.general_atributy_nayma;\r\ncreate table usr_wrk.general_atributy_nayma  as\r\nselect * from usr_wrk.atributy_nayma \r\nwhere mngt_unit_rk <> 'ccb024088065af4df3337021924784ec'\r\nunion all\r\nselect * from  usr_wrk.it_atributy_nayma\r\nunion all\r\nselect * from  usr_wrk.iskl_atributy_nayma\r\n;\r\n-- prod_proteus.atributy_nayma\r\n----------------------------------------------------\r\ndrop table if exists usr_wrk.general_last_day_ottok_naym  ;\r\ncreate table usr_wrk.general_last_day_ottok_naym  as\r\n\r\nselect * from usr_wrk.last_day_ottok_naym\r\nwhere mngt_unit_rk <> 'ccb024088065af4df3337021924784ec'\r\nunion all\r\nselect * from  usr_wrk.it_last_day_ottok_naym \r\nunion all\r\nselect * from usr_wrk.iskl_last_day_ottok_naym\r\n;\r\n-- prod_proteus.last_day_ottok_naym\r\n----------------------------------------------------\r\ndrop table if exists  usr_wrk.general_dinamika_aktivnoy_chislennosti_new ;\r\ncreate table usr_wrk.general_dinamika_aktivnoy_chislennosti_new  as\r\n\r\nselect * from usr_wrk.dinamika_aktivnoy_chislennosti_new\r\nwhere mngt_unit_rk <> 'ccb024088065af4df3337021924784ec'\r\nunion all\r\nselect * from  usr_wrk.it_dinamika_aktivnoy_chislennosti_new\r\nunion all\r\nselect * from usr_wrk.iskl_dinamika_aktivnoy_chislennosti_new\r\n;\r\n-- prod_proteus.dinamika_aktivnoy_chislennosti_new\r\n----------------------------------------------------\r\ndrop table if exists usr_wrk.general_waterfall_chislennosti_new  ;\r\ncreate table usr_wrk.general_waterfall_chislennosti_new  as\r\n\r\nselect * from usr_wrk.waterfall_chislennosti_new\r\nwhere mngt_unit_rk <> 'ccb024088065af4df3337021924784ec'\r\nunion all\r\nselect * from  usr_wrk.it_waterfall_chislennosti_new \r\nunion all\r\nselect * from usr_wrk.iskl_waterfall_chislennosti_new\r\n;\r\n-- prod_proteus.waterfall_chislennosti_new\r\n----------------------------------------------------\r\ndrop table if exists  usr_wrk.general_waterfall_perevody ;\r\ncreate table usr_wrk.general_waterfall_perevody  as\r\n\r\nselect * from usr_wrk.waterfall_perevody\r\nwhere mngt_unit_rk <> 'ccb024088065af4df3337021924784ec'\r\nunion all\r\nselect * from  usr_wrk.it_waterfall_perevody\r\nunion all\r\nselect * from usr_wrk.iskl_waterfall_perevody\r\n;\r\n--prod_proteus.waterfall_perevody\r\n----------------------------------------------------\r\ndrop table if exists usr_wrk.general_izmeneniye_po_podrazdeleniyam  ;\r\ncreate table usr_wrk.general_izmeneniye_po_podrazdeleniyam  as\r\n\r\nselect * from usr_wrk.izmeneniye_po_podrazdeleniyam\r\nwhere mngt_unit_rk <> 'ccb024088065af4df3337021924784ec'\r\nunion all\r\nselect * from  usr_wrk.it_izmeneniye_po_podrazdeleniyam\r\nunion all\r\nselect * from usr_wrk.iskl_izmeneniye_po_podrazdeleniyam\r\n;\r\n-- prod_proteus.izmeneniye_po_podrazdeleniyam\r\n----------------------------------------------------\r\ndrop table if exists usr_wrk.general_izmeneniya_po_spetsializatsiyam  ;\r\ncreate table usr_wrk.general_izmeneniya_po_spetsializatsiyam  as\r\n\r\nselect * from usr_wrk.izmeneniya_po_spetsializatsiyam\r\nwhere mngt_unit_rk <> 'ccb024088065af4df3337021924784ec'\r\nunion all\r\nselect * from  usr_wrk.it_izmeneniya_po_spetsializatsiyam\r\nunion all\r\nselect * from usr_wrk.iskl_izmeneniya_po_spetsializatsiyam\r\n;\r\n--prod_proteus.izmeneniya_po_spetsializatsiyam\r\n----------------------------------------------------\r\ndrop table if exists usr_wrk.general_atributy_ottoka_year  ;\r\ncreate table usr_wrk.general_atributy_ottoka_year  as\r\n\r\nselect * from usr_wrk.atributy_ottoka_year\r\nwhere mngt_unit_rk <> 'ccb024088065af4df3337021924784ec'\r\nunion all\r\nselect * from  usr_wrk.it_atributy_ottoka_year\r\nunion all\r\nselect * from usr_wrk.iskl_atributy_ottoka_year\r\n;\r\n--prod_proteus.atributy_ottoka_year\r\n----------------------------------------------------\r\ndrop table if exists usr_wrk.general_seniority_ottoka_year  ;\r\ncreate table usr_wrk.general_seniority_ottoka_year  as\r\n\r\nselect * from usr_wrk.seniority_ottoka_year\r\nwhere mngt_unit_rk <> 'ccb024088065af4df3337021924784ec'\r\nunion all\r\nselect * from  usr_wrk.it_seniority_ottoka_year\r\nunion all\r\nselect * from usr_wrk.iskl_seniority_ottoka_year\r\n;\r\n--prod_proteus.seniority_ottoka_year\r\n----------------------------------------------------\r\ndrop table if exists usr_wrk.general_stream_ottoka_year  ;\r\ncreate table  usr_wrk.general_stream_ottoka_year as\r\n\r\nselect * from usr_wrk.stream_ottoka_year\r\nwhere mngt_unit_rk <> 'ccb024088065af4df3337021924784ec'\r\nunion all\r\nselect * from usr_wrk.it_stream_ottoka_year\r\nunion all\r\nselect * from usr_wrk.iskl_stream_ottoka_year\r\n;\r\n--prod_proteus.stream_ottoka_year\r\n----------------------------------------------------\r\ndrop table if exists usr_wrk.general_grade_ottoka_year  ;\r\ncreate table usr_wrk.general_grade_ottoka_year  as\r\n\r\nselect * from usr_wrk.grade_ottoka_year\r\nwhere mngt_unit_rk <> 'ccb024088065af4df3337021924784ec'\r\nunion all\r\nselect * from  usr_wrk.it_grade_ottoka_year\r\nunion all\r\nselect * from usr_wrk.iskl_grade_ottoka_year\r\n;\r\n--prod_proteus.grade_ottoka_year\r\n----------------------------------------------------\r\ndrop table if exists  usr_wrk.general_experience_group_fire_reason ;\r\ncreate table usr_wrk.general_experience_group_fire_reason  as\r\n\r\nselect * from usr_wrk.experience_group_fire_reason\r\nwhere mngt_unit_rk <> 'ccb024088065af4df3337021924784ec'\r\nunion all\r\nselect * from  usr_wrk.it_experience_group_fire_reason\r\nunion all\r\nselect * from usr_wrk.iskl_experience_group_fire_reason\r\n;\r\n-- prod_proteus.experience_group_fire_reason\r\n----------------------------------------------------\r\ndrop table if exists  usr_wrk.general_experience_fire_reason_group ;\r\ncreate table usr_wrk.general_experience_fire_reason_group  as\r\n\r\nselect * from usr_wrk.experience_fire_reason_group\r\nwhere mngt_unit_rk <> 'ccb024088065af4df3337021924784ec'\r\nunion all\r\nselect * from  usr_wrk.it_experience_fire_reason_group\r\nunion all\r\nselect * from usr_wrk.iskl_experience_fire_reason_group\r\n;\r\n--prod_proteus.experience_fire_reason_group\r\n---------------------------------------------------- \r\ndrop table if exists usr_wrk.general_fire_initiative_spch ;\r\ncreate table usr_wrk.general_fire_initiative_spch  as\r\n\r\nselect \r\n    month, year, new_management_unit_nm, mngt_unit_rk, mngt_unit_nm,\r\n    lvl, rn, rn_year, last_month_this_year, month_text,\r\n    tekuchest_all, tekuchest_initsiativa_rabotnika, tekuchest_initsiativa_rabotodatelya,\r\n    nakop_tekuchest_all, nakop_tekuchest_initsiativa_rabotnika, nakop_tekuchest_initsiativa_rabotodatelya\r\nfrom usr_wrk.fire_initiative_spch\r\nwhere mngt_unit_rk <> 'ccb024088065af4df3337021924784ec'\r\nunion all\r\nselect * from  usr_cross_data.it_fire_initiative_spch\r\nunion all\r\nselect * from  usr_cross_data.iskl_fire_initiative_spch \r\n;\r\n--prod_proteus.fire_initiative_spch\r\n--------------------------------------------------------------------------\r\n--------------------------------------------------------------------------\r\ndrop table if exists usr_wrk.general_regrettable_set_hq ;\r\ncreate table usr_wrk.general_regrettable_set_hq  as\r\n\r\nselect * from usr_wrk.regrettable_set_hq \r\nwhere mngt_unit_rk <> 'ccb024088065af4df3337021924784ec'\r\nunion all\r\nselect * from  usr_wrk.it_regrettable_set_hq \r\nunion all\r\nselect * from  usr_wrk.iskl_regrettable_set_hq\r\n;\r\n----------------------------------------------------------------------------\r\n\r\ndrop table if exists usr_wrk.general_non_regrettable_set_hq ;\r\ncreate table usr_wrk.general_non_regrettable_set_hq  as\r\n\r\nselect *  from  usr_wrk.non_regrettable_set_hq \r\nwhere mngt_unit_rk <> 'ccb024088065af4df3337021924784ec'\r\nunion all\r\nselect * from  usr_wrk.it_non_regrettable_set_hq\r\nunion all\r\nselect * from  usr_wrk.iskl_non_regrettable_set_hq\r\n;\r\n------------------------------------------------------------------------------\r\ndrop table if exists usr_wrk.general_total_set_hq ;\r\ncreate table usr_wrk.general_total_set_hq  as\r\n\r\nselect *  from  usr_wrk.total_set_hq\r\nwhere mngt_unit_rk <> 'ccb024088065af4df3337021924784ec'\r\nunion all\r\nselect * from  usr_wrk.it_total_set_hq\r\nunion all\r\nselect * from  usr_wrk.iskl_non_total_set_hq\r\n;\r\n\r\n\r\n"

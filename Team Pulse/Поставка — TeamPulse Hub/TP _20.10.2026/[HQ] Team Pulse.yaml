    title: atributy_ottoka_year
    shebang: gp
    code: "drop table if exists usr_wrk.atributy_ottoka_year ;\r\ncreate table usr_wrk.atributy_ottoka_year  as\r\n\r\nselect\r\n\r\natributy_ottoka.mngt_unit_rk\r\n,atributy_ottoka.mngt_unit_nm\r\n,usr_cross_pub.cross_management_unit.new_management_unit_nm\r\n,atributy_ottoka.lvl\r\n,employment_relation_type_desc\r\n,type_company\r\n,fire_initiative\r\n,date_trunc('year',$form_multiselect_1::date)::date  as cur_year\r\n,(date_trunc('year',$form_multiselect_1::date)  - interval '1 year')::date as prev_year\r\n,coalesce( sum(employee_amt) filter (where date_trunc('year',$form_multiselect_1::date) = date_trunc('year',month )) ,0) as ottok_cur_year_amt\r\n,coalesce( sum(employee_amt) filter (where (date_trunc('year',$form_multiselect_1::date)  - interval '1 year')::date= date_trunc('year',month )) ,0) as ottok_prev_year_amt\r\n\r\nfrom atributy_ottoka\r\n\r\nleft join usr_cross_pub.cross_management_unit\r\n\r\non   atributy_ottoka.mngt_unit_rk = usr_cross_pub.cross_management_unit.management_unit_rk\r\n\r\nwhere 1=1\r\nand active_type_nm = 'Активная' and emp_specialization_oper_code = 'Hq'  \r\nand \r\n(\r\n (month >= MAKE_DATE(EXTRACT(YEAR FROM $form_multiselect_1::date)::INT - 1, 1, 1)\r\n  AND month < MAKE_DATE(EXTRACT(YEAR FROM $form_multiselect_1::date)::INT, 1, 1)\r\n  AND month + INTERVAL '1 year' <= $form_multiselect_1::date) \r\n or \r\n ( month>=   date_trunc('year',$form_multiselect_1::date) )\r\n)\r\ngroup by 1,2,3,4,5,6,7,8\r\n\r\n;\r\n\r\nselect * from usr_wrk.atributy_ottoka_year limit 100;"
    isEnabled: true
    color: "#FDC454"
  - sid: 019f5b47-218e-79c6-83ed-630c6b3af21d
    title: Untitled 71
    shebang: gp
    code: "drop table if exists ddff ;\r\ncreate table ddff  as\r\n\r\nwith ss as (\r\nselect month,mngt_unit_rk, mngt_unit_nm, type_company , sum (employee_amt) as employee_amt\r\nfrom atributy_ottoka \r\nwhere active_type_nm ='Активная' and emp_specialization_oper_code ='Hq'\r\ngroup by 1,2,3,4\r\n) \r\n, scelet as (\r\nselect distinct mngt_unit_rk, mngt_unit_nm, type_company from atributy_ottoka \r\n)\r\n\r\n, ff as (\r\nselect * \r\n,coalesce ( lag(employee_amt) OVER (PARTITION BY \r\nmngt_unit_rk,mngt_unit_nm,type_company\r\n ORDER BY month) ,0) as lag_employee_amt\r\nfrom ss\r\n) \r\nselect scelet.* \r\n,coalesce ( ff.employee_amt , 0)  as employee_amt\r\n,coalesce (mm.employee_amt, 0)  as lag_employee_amt\r\nfrom scelet \r\nleft join ff\r\non scelet.mngt_unit_rk = ff.mngt_unit_rk\r\nand scelet.type_company = ff.type_company\r\nand ff.month =date_trunc('month', current_date)\r\n\r\nleft join ff mm\r\non scelet.mngt_unit_rk = mm.mngt_unit_rk\r\nand scelet.type_company = mm.type_company\r\nand mm.month =date_trunc('month', current_date) - interval '1 month'\r\n\r\n--where month = date_trunc('month', current_date)\r\n;\r\nselect * from ddff"
    isEnabled: true
  - sid: 019f4c19-aa48-7985-9d4e-d94da077c2e4
    title: Untitled 70
    shebang: gp
    code: "drop table if exists usr_wrk.new_atributy_ottoka_year ;\r\ncreate table usr_wrk.new_atributy_ottoka_year  as\r\n\r\nwith dd  as (\r\nselect \r\nmngt_unit_rk\t\r\n,mngt_unit_nm\t\r\n,new_management_unit_nm\t\r\n,lvl\t\r\n,type_company\t\r\n,cur_year\t\r\n,prev_year\t\r\n,sum(ottok_cur_year_amt\t)  as ottok_cur_year_amt\r\n,sum(ottok_prev_year_amt )  as ottok_prev_year_amt\r\n\r\nfrom usr_wrk.atributy_ottoka_year\r\n\r\ngroup by 1,2,3,4,5,6,7\r\n)\r\n, jj as (\r\nselect dd.*  \r\n\r\n ,sum(ottok_cur_year_amt) OVER (PARTITION BY dd.mngt_unit_rk\t\r\n,dd.mngt_unit_nm\t\r\n,dd.new_management_unit_nm\t\r\n,dd.lvl\t\r\n,dd.cur_year\t\r\n,dd.prev_year) as sum_ottok_cur_year_amt\r\n\r\n ,sum(dd.ottok_prev_year_amt) OVER (PARTITION BY dd.mngt_unit_rk\t\r\n,dd.mngt_unit_nm\t\r\n,dd.new_management_unit_nm\t\r\n,dd.lvl\t\r\n,dd.cur_year\t\r\n,dd.prev_year) as sum_ottok_prev_year_amt\r\n, ddff.employee_amt\r\n,ddff.lag_employee_amt\r\n\r\nfrom dd \r\nleft join ddff\r\non dd.mngt_unit_rk = ddff.mngt_unit_rk\r\nand  dd.type_company =  ddff.type_company\r\n)\r\n\r\nselect \r\nmngt_unit_rk\r\n,mngt_unit_nm\r\n,new_management_unit_nm\r\n,lvl\r\n,type_company\r\n,cur_year\r\n,prev_year\r\n,coalesce ( ottok_cur_year_amt,0) as ottok_cur_year_amt\r\n,coalesce (ottok_prev_year_amt,0) as ottok_prev_year_amt\r\n,coalesce (sum_ottok_cur_year_amt,0) as sum_ottok_cur_year_amt\r\n,coalesce (sum_ottok_prev_year_amt,0) as sum_ottok_prev_year_amt\r\n,coalesce (employee_amt,0) as  employee_amt\r\n,coalesce (lag_employee_amt,0) as lag_employee_amt\r\n\r\nfrom jj\r\n;\r\n\r\nselect * from usr_wrk.new_atributy_ottoka_year \r\n\r\n\r\n\r\n\r\n\r\n"
    isEnabled: true
  - sid: 019c99cd-f543-7d0f-8c0f-5e9a3112ae6e

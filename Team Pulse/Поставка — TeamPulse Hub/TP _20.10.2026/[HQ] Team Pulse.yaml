    code: "drop table if exists initiativ_group ;\r\ncreate table initiativ_group   as\r\n\r\n\r\nSELECT \r\n    o.month,\r\n    o.mngt_unit_rk,\r\n    o.mngt_unit_nm,\r\n    o.lvl,\r\n    o.fire_initiative,\r\n    o.ottok,\r\n    e.employee_amt\r\nFROM \r\n    ottok_initiativ  o\r\nLEFT JOIN \r\n    employee_count_reason_group e ON \r\n\r\n    o.month = e.month AND \r\n    o.mngt_unit_rk = e.mngt_unit_rk AND\r\n    --o.mngt_unit_nm = e.mngt_unit_nm AND \r\n    o.lvl = e.lvl \r\n    \r\n\r\n    where  o.month::date <= date_trunc('month', $form_multiselect_1::date)::date\r\n    ;\r\n\r\n    select * from initiativ_group  where   mngt_unit_nm = 'Бизнес линии'\r\n"

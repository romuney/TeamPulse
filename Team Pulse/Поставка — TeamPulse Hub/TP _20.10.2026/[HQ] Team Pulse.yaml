    shebang: python
    code: "import tinkoff as tf \r\n\r\n# код был добавлен автоматически: https://time.tbank.ru/tinkoff/pl/g9jfbuwk8bb8mrp84eck398seh\n\r\nimport proteus_py.database.clickhouse as ppy\n\nimport time\n\n\ndef gp_to_click_with_retry(*args, attempts=3, delays=(30, 60), **kwargs):\n    \"\"\"Обёртка над gp_to_click с retry: до 3 попыток, пауза 30 сек, затем 60 сек.\"\"\"\n    last_exc = None\n    for attempt in range(1, attempts + 1):\n        try:\n            ppy.gp_to_click(*args, **kwargs)\n            return\n        except Exception as e:\n            last_exc = e\n            if attempt < attempts:\n                delay = delays[attempt - 1] if attempt - 1 < len(delays) else delays[-1]\n                print(f\"Попытка {attempt} не удалась: {e}. Повтор через {delay} сек...\")\n                time.sleep(delay)\n    raise last_exc\n\r\ngp_to_click_with_retry('usr_wrk.experience_fire_reason_group', 'prod_proteus.experience_fire_reason_group')\n\r\n\r\n\r\n#\r\n# from proteus_py.database.clickhouse import gp_to_click\r\n\r\n# gp_to_click('usr_wrk.experience_fire_reason_group', 'prod_proteus.experience_fire_reason_group',\r\n# gp_service = 'gp',\r\n# upload_mode = 'replace')"
    isEnabled: true

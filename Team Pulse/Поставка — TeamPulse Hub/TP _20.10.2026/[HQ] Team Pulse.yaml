  - sid: 019fff21-ae8e-7b08-9b7a-23db5f1bcb5c
    title: Таблицы по использованию AI продуктов
    shebang: python
    code: |-
      import proteus_py.database.clickhouse as ppy
      import time


      def gp_to_click_with_retry(*args, attempts=3, delays=(30, 60), **kwargs):
          """Обёртка над gp_to_click с retry: до 3 попыток, пауза 30 сек, затем 60 сек."""
          last_exc = None
          for attempt in range(1, attempts + 1):
              try:
                  ppy.gp_to_click(*args, **kwargs)
                  return
              except Exception as e:
                  last_exc = e
                  if attempt < attempts:
                      delay = delays[attempt - 1] if attempt - 1 < len(delays) else delays[-1]
                      print(f"Попытка {attempt} не удалась: {e}. Повтор через {delay} сек...")
                      time.sleep(delay)
          raise last_exc

      gp_to_click_with_retry(
          'ai_bi_all_copilots_usage_digest_monthly'
      , 'prod_proteus.ai_digest_monthly')
      gp_to_click_with_retry(
          'usr_mlpa.ai_bi_all_copilots_usage_digest_weekly'
      , 'prod_proteus.ai_digest_weekly')
    isEnabled: true
    color: "#FDC454"

    code: "drop table if exists fire_initiative ;\r\ncreate table fire_initiative   as\r\n\r\nSELECT \r\n        DATE_TRUNC('month', calendar_dt)::DATE AS month,\r\n        lvl2_mapped_management_unit_rk::TEXT AS mngt_unit_rk,\r\n        lvl2_mapped_management_unit_nm::TEXT AS mngt_unit_nm,\r\n        2::INT AS lvl,\r\n        COUNT(mdm_employee_rk) FILTER (WHERE fire_flg = 1) AS ottok,\r\n        COUNT(mdm_employee_rk) FILTER (WHERE fire_flg = 1 AND fire_initiative = 'Прочее') AS procheye_ottok,\r\n        COUNT(mdm_employee_rk) FILTER (WHERE fire_flg = 1 AND fire_initiative = 'Инициатива работника') AS initsiativa_rabotnika_ottok,\r\n        COUNT(mdm_employee_rk) FILTER (WHERE fire_flg = 1 AND fire_initiative = 'Инициатива работодателя') AS initsiativa_rabotodatelya_ottok,\r\n        COUNT(mdm_employee_rk) FILTER (\r\n            WHERE last_day_of_month_flg = 1 \r\n              AND fire_flg = 0\r\n        ) AS employee_amt\r\n    FROM \r\n        usr_cross_data.hr_executive_proteus\r\n    WHERE \r\n        lvl2_mapped_management_unit_rk IS NOT NULL\r\n        AND lvl2_mapped_management_unit_rk <> '-'\r\n        AND active_type_nm = 'Активная'\r\n        AND emp_specialization_oper_code = 'Hq'\r\n        AND calendar_dt::DATE >= DATE_TRUNC('month', $form_multiselect_1::date - INTERVAL '25 months')::DATE\r\n    GROUP BY \r\n        month, mngt_unit_rk, mngt_unit_nm, lvl\r\nUNION ALL\r\nSELECT \r\n        DATE_TRUNC('month', calendar_dt)::DATE AS month,\r\n        lvl3_mapped_management_unit_rk::TEXT AS mngt_unit_rk,\r\n        lvl3_mapped_management_unit_nm::TEXT AS mngt_unit_nm,\r\n        3::INT AS lvl,\r\n        COUNT(mdm_employee_rk) FILTER (WHERE fire_flg = 1) AS ottok,\r\n        COUNT(mdm_employee_rk) FILTER (WHERE fire_flg = 1 AND fire_initiative = 'Прочее') AS procheye_ottok,\r\n        COUNT(mdm_employee_rk) FILTER (WHERE fire_flg = 1 AND fire_initiative = 'Инициатива работника') AS initsiativa_rabotnika_ottok,\r\n        COUNT(mdm_employee_rk) FILTER (WHERE fire_flg = 1 AND fire_initiative = 'Инициатива работодателя') AS initsiativa_rabotodatelya_ottok,\r\n        COUNT(mdm_employee_rk) FILTER (\r\n            WHERE last_day_of_month_flg = 1 \r\n              AND fire_flg = 0\r\n        ) AS employee_amt\r\n    FROM \r\n        usr_cross_data.hr_executive_proteus\r\n    WHERE \r\n        lvl3_mapped_management_unit_rk IS NOT NULL\r\n        AND lvl3_mapped_management_unit_rk <> '-'\r\n        AND active_type_nm = 'Активная'\r\n        AND emp_specialization_oper_code = 'Hq'\r\n        AND calendar_dt::DATE >= DATE_TRUNC('month', $form_multiselect_1::date - INTERVAL '25 months')::DATE\r\n    GROUP BY \r\n        month, mngt_unit_rk, mngt_unit_nm, lvl\r\nUNION ALL\r\nSELECT \r\n        DATE_TRUNC('month', calendar_dt)::DATE AS month,\r\n        lvl4_mapped_management_unit_rk::TEXT AS mngt_unit_rk,\r\n        lvl4_mapped_management_unit_nm::TEXT AS mngt_unit_nm,\r\n        4::INT AS lvl,\r\n        COUNT(mdm_employee_rk) FILTER (WHERE fire_flg = 1) AS ottok,\r\n        COUNT(mdm_employee_rk) FILTER (WHERE fire_flg = 1 AND fire_initiative = 'Прочее') AS procheye_ottok,\r\n        COUNT(mdm_employee_rk) FILTER (WHERE fire_flg = 1 AND fire_initiative = 'Инициатива работника') AS initsiativa_rabotnika_ottok,\r\n        COUNT(mdm_employee_rk) FILTER (WHERE fire_flg = 1 AND fire_initiative = 'Инициатива работодателя') AS initsiativa_rabotodatelya_ottok,\r\n        COUNT(mdm_employee_rk) FILTER (\r\n            WHERE last_day_of_month_flg = 1 \r\n              AND fire_flg = 0\r\n        ) AS employee_amt\r\n    FROM \r\n        usr_cross_data.hr_executive_proteus\r\n    WHERE \r\n        lvl4_mapped_management_unit_rk IS NOT NULL\r\n        AND lvl4_mapped_management_unit_rk <> '-'\r\n        AND active_type_nm = 'Активная'\r\n        AND emp_specialization_oper_code = 'Hq'\r\n        AND calendar_dt::DATE >= DATE_TRUNC('month', $form_multiselect_1::date - INTERVAL '25 months')::DATE\r\n    GROUP BY \r\n        month, mngt_unit_rk, mngt_unit_nm, lvl\r\nUNION ALL\r\nSELECT \r\n        DATE_TRUNC('month', calendar_dt)::DATE AS month,\r\n        lvl5_mapped_management_unit_rk::TEXT AS mngt_unit_rk,\r\n        lvl5_mapped_management_unit_nm::TEXT AS mngt_unit_nm,\r\n        5::INT AS lvl,\r\n        COUNT(mdm_employee_rk) FILTER (WHERE fire_flg = 1) AS ottok,\r\n        COUNT(mdm_employee_rk) FILTER (WHERE fire_flg = 1 AND fire_initiative = 'Прочее') AS procheye_ottok,\r\n        COUNT(mdm_employee_rk) FILTER (WHERE fire_flg = 1 AND fire_initiative = 'Инициатива работника') AS initsiativa_rabotnika_ottok,\r\n        COUNT(mdm_employee_rk) FILTER (WHERE fire_flg = 1 AND fire_initiative = 'Инициатива работодателя') AS initsiativa_rabotodatelya_ottok,\r\n        COUNT(mdm_employee_rk) FILTER (\r\n            WHERE last_day_of_month_flg = 1 \r\n              AND fire_flg = 0\r\n        ) AS employee_amt\r\n    FROM \r\n        usr_cross_data.hr_executive_proteus\r\n    WHERE \r\n        lvl5_mapped_management_unit_rk IS NOT NULL\r\n        AND lvl5_mapped_management_unit_rk <> '-'\r\n        AND active_type_nm = 'Активная'\r\n        AND emp_specialization_oper_code = 'Hq'\r\n        AND calendar_dt::DATE >= DATE_TRUNC('month', $form_multiselect_1::date - INTERVAL '25 months')::DATE\r\n    GROUP BY \r\n        month, mngt_unit_rk, mngt_unit_nm, lvl\r\nUNION ALL\r\nSELECT \r\n        DATE_TRUNC('month', calendar_dt)::DATE AS month,\r\n        lvl6_mapped_management_unit_rk::TEXT AS mngt_unit_rk,\r\n        lvl6_mapped_management_unit_nm::TEXT AS mngt_unit_nm,\r\n        6::INT AS lvl,\r\n        COUNT(mdm_employee_rk) FILTER (WHERE fire_flg = 1) AS ottok,\r\n        COUNT(mdm_employee_rk) FILTER (WHERE fire_flg = 1 AND fire_initiative = 'Прочее') AS procheye_ottok,\r\n        COUNT(mdm_employee_rk) FILTER (WHERE fire_flg = 1 AND fire_initiative = 'Инициатива работника') AS initsiativa_rabotnika_ottok,\r\n        COUNT(mdm_employee_rk) FILTER (WHERE fire_flg = 1 AND fire_initiative = 'Инициат
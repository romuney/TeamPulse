  - sid: 019c99fe-47e1-7e94-bf87-470b0871499c
    title: perevody_plus_deet
    shebang: gp
    code: "\r\n drop table if exists perevody_plus_deet ;\r\n create table perevody_plus_deet   as\r\n\r\nSELECT \r\n        mdm_employee_rk,\r\n        calendar_dt::DATE,\r\n        lvl2_mapped_management_unit_rk::TEXT AS mngt_unit_rk,\r\n        lvl2_mapped_management_unit_nm::TEXT AS mngt_unit_nm,\r\n        2::INT AS lvl,\r\n        lvl1_mapped_management_unit_rk::TEXT AS parent_mngt_unit_rk,\r\n        lvl1_mapped_management_unit_nm::TEXT AS parent_mngt_unit_nm,\r\n        1::INT AS parent_lvl,\r\n        -- Атрибуты с защитой от NULL\r\n        COALESCE(active_type_nm, 'n/a')::TEXT AS active_type_nm,\r\n        COALESCE(emp_specialization_oper_code, 'n/a')::TEXT AS emp_specialization_oper_code,\r\n        COALESCE(emp_specialization_it_code, 'n/a')::TEXT AS emp_specialization_it_code,\r\n        COALESCE(employee_specialization_desc, 'n/a')::TEXT AS employee_specialization_desc,\r\n        COALESCE(employee_stream_desc, 'n/a')::TEXT AS employee_stream_desc,\r\n        COALESCE(employment_relation_type_desc, 'n/a')::TEXT AS employment_relation_type_desc,\r\n        -- Флаги (числовые, не требуют COALESCE, но обработаем lvl_x_mngt_unit_in_trsf_flg)\r\n        COALESCE(NULLIF(lvl2_mngt_unit_in_trsf_flg::TEXT, '-')::NUMERIC, 0) AS lvl_mngt_unit_in_trsf_flg,\r\n        transfer_to_active_type_flg,\r\n        transfer_to_hq_flg,\r\n        transfer_to_it_flg,\r\n        transfer_to_specialization_flg,\r\n        transfer_to_stream_flg,\r\n        transfer_to_employment_relation_type_flg,\r\n        -- Суммарный флаг: 1, если был хотя бы один перевод\r\n        LEAST(\r\n            COALESCE(NULLIF(lvl2_mngt_unit_in_trsf_flg::TEXT, '-')::NUMERIC, 0) +\r\n            transfer_to_active_type_flg +\r\n            transfer_to_hq_flg +\r\n            transfer_to_it_flg +\r\n            transfer_to_specialization_flg +\r\n            transfer_to_stream_flg +\r\n            transfer_to_employment_relation_type_flg,\r\n            1\r\n        ) AS flg\r\n    FROM \r\n      
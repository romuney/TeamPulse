  - sid: 019c99cd-f543-7cb3-b98f-7cf49c01082c
    title: waterfall_perevody
    shebang: gp
    code: " drop table if exists usr_wrk.waterfall_perevody;\r\n create table usr_wrk.waterfall_perevody   as\r\n\r\nwith ruba as (\r\nselect distinct  mngt_unit_rk, mngt_unit_nm ,lvl, transfer_type\r\nfrom union_perevody_plus \r\nunion \r\nselect distinct  mngt_unit_rk, mngt_unit_nm ,lvl, transfer_type\r\nfrom union_perevody_minus \r\n)\r\n\r\nselect  ruba.mngt_unit_rk, ruba.mngt_unit_nm ,usr_cross_pub.cross_management_unit.new_management_unit_nm, ruba.lvl, ruba.transfer_type\r\n, coalesce ( union_perevody_plus.plus) as fire --plus\r\n, coalesce ( union_perevody_minus.minus) as hire -- minus\r\nfrom ruba\r\nleft join union_perevody_plus \r\non ruba.mngt_unit_rk = union_perevody_plus.mngt_unit_rk\r\n--and ruba.mngt_unit_nm = union_perevody_plus.mngt_unit_nm\r\nand ruba.lvl = union_perevody_plus.lvl\r\nand ruba.transfer_type = union_perevody_plus.transfer_type\r\n\r\nleft join union_perevody_minus\r\non ruba.mngt_unit_rk = union_perevody_minus.mngt_unit_rk\r\n--and ruba.mngt_unit_nm = union_perevody_minus.mngt_unit_nm\r\nand ruba.lvl = union_perevody_minus.lvl\r\nand ruba.transfer_type = union_perevody_minus.transfer_type\r\n\r\nleft join usr_cross_pub.cross_management_unit\r\n\r\non   ruba.mngt_unit_rk = usr_cross_pub.cross_management_unit.management_unit_rk\r\n\r\n;\r\nselect * from  usr_wrk.waterfall_perevody where 1=1\r\nand  mngt_unit_nm = 'Служба безопасности'\r\n limit 10;\r\n\r\n"
    isEnabled: true

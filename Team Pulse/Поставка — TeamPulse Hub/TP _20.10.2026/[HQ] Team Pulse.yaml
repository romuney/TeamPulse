    code: "\r\ndrop table if exists usr_wrk.experience_fire_reason_group ;\r\ncreate table usr_wrk.experience_fire_reason_group   as\r\n\r\nWITH lag_ottok_count_reason_group  AS (\r\n    select \r\n        month\r\n        ,mngt_unit_rk\r\n        ,mngt_unit_nm\r\n        ,lvl\r\n        ,fire_reason\r\n        ,fire_initiative\r\n        ,ottok as ottok_amt\r\n        ,employee_amt\r\n        ,lag(employee_amt) OVER (PARTITION BY \r\n            mngt_unit_rk, mngt_unit_nm\r\n            ,lvl, fire_reason, fire_initiative ORDER BY month ) as lag_employee_amt\r\n    from fire_reason_a_reason_group\r\n)\r\n, dd AS (\r\n    select\r\n        month\r\n        ,mngt_unit_rk\r\n        ,mngt_unit_nm\r\n        ,lvl\r\n        ,fire_reason\r\n        ,fire_initiative\r\n        ,ottok_amt\r\n        ,employee_amt\r\n        , case \r\n            when lag_employee_amt is null \r\n            then employee_amt  else (lag_employee_amt+employee_amt) / (2*1.0)  \r\n        end as spch\r\n        , case \r\n            when (case when lag_employee_amt is null then employee_amt  else (lag_employee_amt+employee_amt) / (2*1.0)  end)=0 then 0\r\n            else (ottok_amt /  ((case when lag_employee_amt is null then employee_amt  else (lag_employee_amt+employee_amt) / (2*1.0)  end)*1.0))\r\n        end  as tekuchest\r\n\r\n    from lag_ottok_count_reason_group \r\n)\r\n\r\n, tekuchest_ottok_count_reason_group as (\r\n    select * \r\n    from dd\r\n    where 1=1\r\n        and \r\n        (\r\n            (month >= MAKE_DATE(EXTRACT(YEAR FROM $form_multiselect_1::date)::INT - 1, 1, 1)\r\n            AND month < MAKE_DATE(EXTRACT(YEAR FROM $form_multiselect_1::date)::INT, 1, 1)\r\n            AND month + INTERVAL '1 year' <= $form_multiselect_1::date) \r\n            or \r\n            ( month>=   date_trunc('year',$form_multiselect_1::date) )\r\n        )\r\n)\r\n\r\n, tekuchest_ottok_count_year_reason_group  AS (\r\n    select \r\n        mngt_unit_rk\r\n        ,mngt_unit_nm\r\n        ,lvl\r\n        ,fire_reason\r\n        ,fire_initiative\r\n        ,date_trunc('year',$form_multiselect_1::date )::date  as cur_year\r\n        ,(date_trunc('year',$form_multiselect_1::date)  - interval '1 year')::date as prev_year\r\n        ,coalesce( sum(ottok_amt) filter (where date_trunc('year',$form_multiselect_1::date ) = date_trunc('year',month )) ,0) as ottok_cur_year_amt\r\n        ,coalesce( sum(ottok_amt) filter (where (date_trunc('year',$form_multiselect_1::date)  - interval '1 year')::date= date_trunc('year',month )) ,0) as ottok_prev_year_amt\r\n        ,coalesce( sum(tekuchest) filter (where date_trunc('year',$form_multiselect_1::date ) = date_trunc('year',month )) ,0) as tekuchest_cur_year_amt\r\n        ,coalesce( sum(tekuchest) filter (where (date_trunc('year',$form_multiselect_1::date)  - interval '1 year')::date= date_trunc('year',month )) ,0) as tekuchest_prev_year_amt\r\n    from tekuchest_ottok_count_reason_group  \r\n\r\n    group by 1,2,3,4,5\r\n)\r\n\r\n\r\nselect \r\n    tekuchest_ottok_count_year_reason_group.mngt_unit_rk\r\n    ,tekuchest_ottok_count_year_reason_group.mngt_unit_nm\r\n    ,usr_cross_pub.cross_management_unit.new_management_unit_nm\r\n    ,tekuchest_ottok_count_year_reason_group.lvl\r\n    ,tekuchest_ottok_count_year_reason_group.fire_reason\r\n    ,tekuchest_ottok_count_year_reason_group.fire_initiative\r\n    ,tekuchest_ottok_count_year_reason_group.cur_year\r\n    ,tekuchest_ottok_count_year_reason_group.prev_year\r\n    ,tekuchest_ottok_count_year_reason_group.ottok_cur_year_amt\r\n    ,tekuchest_ottok_count_year_reason_group.ottok_prev_year_amt\r\n    ,tekuchest_ottok_count_year_reason_group.tekuchest_cur_year_amt\r\n    ,tekuchest_ottok_count_year_reason_group.tekuchest_prev_year_amt\r\n\r\n    ,rience_fire_reason_group.ottok_cur_year_amt\t as  initiative_ottok_cur_year_amt\r\n    ,rience_fire_reason_group.ottok_prev_year_amt\t as  initiative_ottok_prev_year_amt\r\n    ,rience_fire_reason_group.tekuchest_cur_year_amt\tas  initiative_tekuchest_cur_year_amt\r\n    ,rience_fire_reason_group.tekuchest_prev_year_amt   as  initiative_tekuchest_prev_year_amt\r\n\r\n    ,unit_nm.ottok_cur_year_amt\t as unit_ottok_cur_year_amt\r\n    ,unit_nm.ottok_prev_year_amt as unit_ottok_prev_year_amt\t\r\n    ,unit_nm.tekuchest_cur_year_amt\t as unit_tekuchest_cur_year_amt\r\n    ,unit_nm.tekuchest_prev_year_amt as unit_tekuchest_prev_year_amt\r\n\r\n    ,case\r\n        when tekuchest_ottok_count_year_reason_group.fire_initiative='Инициатива работодателя' then 1 \r\n        when tekuchest_ottok_count_year_reason_group.fire_initiative='Инициатива работника' then 2\r\n        when tekuchest_ottok_count_year_reason_group.fire_initiative='Прочее' then 3\r\n    end as num_experience\r\n    ,row_number() OVER (PARTITION BY tekuchest_ottok_count_year_reason_group.fire_initiative\r\n    ,tekuchest_ottok_count_year_reason_group.mngt_unit_rk ORDER BY tekuchest_ottok_count_year_reason_group.tekuchest_cur_year_amt DESC) as rn\r\n\r\nfrom tekuchest_ottok_count_year_reason_group\r\n  \r\nleft join usr_cross_pub.cross_management_unit\r\n    on   tekuchest_ottok_count_year_reason_group.mngt_unit_rk = usr_cross_pub.cross_management_unit.management_unit_rk\r\nleft join rience_fire_reason_group\r\n    on rience_fire_reason_group.mngt_unit_rk      =tekuchest_ottok_count_year_reason_group.mngt_unit_rk\r\n    and rience_fire_reason_group.fire_initiative  =tekuchest_ottok_count_year_reason_group.fire_initiative\r\n\r\nleft join unit_nm \r\n    on tekuchest_ottok_count_year_reason_group.mngt_unit_rk  =  unit_nm.mngt_unit_rk\r\n\r\n;\r\n\r\nselect * from usr_wrk.experience_fire_reason_group where mngt_unit_nm = 'Отдел дизайна диджитал-рекламы'"

    shebang: gp
    code: "drop table if exists usr_wrk.seniority_ottoka_year ;\r\ncreate table usr_wrk.seniority_ottoka_year  as\r\n\r\nwith  pre_ottok as (\r\nselect month,mngt_unit_rk,mngt_unit_nm,lvl,seniority\r\n,sum(ottok_amt) as ottok_amt\r\n,sum(employee_amt) as employee_amt\r\n\r\nfrom last_day_ottok_naym_all \r\nwhere 1=1 \r\n--and mngt_unit_nm = 'Бизнес линии'\r\nand active_type_nm = 'Активная' and emp_specialization_oper_code = 'Hq'  \r\nand  month::date <= date_trunc('month', $form_multiselect_1::date)::date\r\ngroup by 1,2,3,4,5\r\n)\r\n, pre_lag_ottok as (\r\nselect \r\nmonth,mngt_unit_rk,mngt_unit_nm,lvl,seniority,ottok_amt\r\n,employee_amt\r\n,lag(employee_amt) OVER (PARTITION BY mngt_unit_rk,mngt_unit_nm,lvl,seniority  ORDER BY month ) as lag_employee_amt\r\n\r\nfrom pre_ottok  \r\n)\r\n, pre_spch_ottok as (\r\nselect \r\nmonth\r\n,mngt_unit_rk\r\n,mngt_unit_nm\r\n,lvl\r\n,seniority\r\n,ottok_amt\r\n,employee_amt\r\n,lag_employee_amt\r\n, case when lag_employee_amt is null then employee_amt  else (lag_employee_amt+employee_amt) / 2 end as spch\r\n ,case when (case when lag_employee_amt is null then employee_amt  else (lag_employee_amt+employee_amt) / 2 end)=0 then 0\r\n else (ottok_amt /  ((case when lag_employee_amt is null then employee_amt  else (lag_employee_amt+employee_amt) / 2 end)*1.0))\r\n end  as tekuchest\r\n\r\n\r\n from pre_lag_ottok\r\n)\r\n\r\nselect \r\npre_spch_ottok.mngt_unit_rk\r\n,pre_spch_ottok.mngt_unit_nm\r\n,usr_cross_pub.cross_management_unit.new_management_unit_nm\r\n,pre_spch_ottok.lvl\r\n,seniority\r\n,date_trunc('year',$form_multiselect_1::date )::date  as cur_year\r\n,(date_trunc('year',$form_multiselect_1::date)  - interval '1 year')::date as prev_year\r\n,coalesce( sum(ottok_amt) filter (where date_trunc('year',$form_multiselect_1::date) = date_trunc('year',month )) ,0) as ottok_cur_year_amt\r\n,coalesce( sum(ottok_amt) filter (where (date_trunc('year',$form_multiselect_1::date)  - interval '1 year')::date= date_trunc('year',month )) ,0) as ottok_prev_year_amt\r\n,coalesce( sum(tekuchest) filter (where date_trunc('year',$form_multiselect_1::date) = date_trunc('year',month )) ,0) as tekuchest_cur_year_amt\r\n,coalesce( sum(tekuchest) filter (where (date_trunc('year',$form_multiselect_1::date)  - interval '1 year')::date= date_trunc('year',month )) ,0) as tekuchest_prev_year_amt\r\n\r\nfrom pre_spch_ottok\r\n\r\nleft join usr_cross_pub.cross_management_unit\r\n\r\non   pre_spch_ottok.mngt_unit_rk = usr_cross_pub.cross_management_unit.management_unit_rk\r\n\r\ngroup by 1,2,3,4,5\r\n\r\n;\r\n\r\nselect * from usr_wrk.seniority_ottoka_year\r\nwhere mngt_unit_nm = 'Бизнес линии'"
    isEnabled: true
